      bar.innerHTML = `<span class="hb-icon">Done</span><span>The war is decided. Scores are on screen.</span>`;
      return;
    }

    const pi = UI.actingIndex();
    const p = G.players[pi];
    const isReaction = G.phase === 'reaction';
    const id = G.selected;
    let tip;

    if (AI.isAI(pi)) {
      tip = `<b>${esc(p.name)}</b> is thinking. Watch the map — the chronicle on the right records every move.`;
    } else if (UI.mode === 'march') {
      tip = `Dashed borders are legal destinations. <b>Any territory touching this one can be attacked</b>; you can move hosts <b>anywhere across your own connected territory</b> in one action, and attack any enemy touching the region you set out from.`;
    } else if (!id) {
      tip = isReaction
        ? `Another warlord holds the Turn. You get <b>one</b> action in response — reinforce, raise a host, or build. Click one of your territories.`
        : `Your Turn: act as often as your Tribute allows. Click one of your territories to begin.`;
    } else {
      const rs = G.regions[id];
      const mine = rs.owner === pi;
      if (!mine) {
        tip = rs.owner === null
          ? `<b>${esc(REGIONS[id].name)}</b> is unclaimed — march a host in and it is yours for free.`
          : `<b>${esc(REGIONS[id].name)}</b> belongs to ${esc(G.players[rs.owner].name)}. Select one of <em>your</em> territories that touches it, then March / Attack.`;
      } else if (rs.unrest > 0) {
        tip = `<b>${esc(REGIONS[id].name)}</b> is restive — freshly conquered ground produces no Income and cannot be built on until you hold it through one of your Turns.`;
      } else if (Rules.hostCount(rs) <= 1) {
        tip = `Only one host here, and a host must always stay behind. <b>Raise more</b> before you can march out of it.`;
      } else if (Rules.canBuild(pi, id).ok && rs.holding === 0) {
        tip = `<b>Build a Holding</b> here: it raises this region's income every Round, and at tier 2 or better it adds a defence die.`;
      } else {
        tip = `<b>March / Attack</b> to move these hosts, or <b>Raise</b> more. Hover any number in the panel to see what it means.`;
      }
    }

    /* End Turn also lives in the region popup, which means reaching it costs a
       tap on one of your own regions first. When there is nothing left to
       spend, the hint bar stops being advice and becomes the control — no new
       chrome, and the line already said "no actions left". */
    const spent = !AI.isAI(pi) && G.phase !== 'gameover' && UI.mode !== 'march'
      && (isReaction ? G.reactionActionTaken : Rules.actionsLeft(pi) === 0);

    bar.innerHTML = `<span class="hb-icon">${isReaction ? 'Reaction' : 'Hint'}</span>`
      + `<span>${spent ? (isReaction
            ? 'Your Reaction is spent.'
            : 'Nothing left to spend this Turn.') : tip}</span>`
      + (spent ? `<button class="hb-end" id="hb-end" type="button">`
            + Icons.svg('endturn', 16, 'currentColor')
            + `<span>${isReaction ? 'End Reaction' : 'End Turn'}</span></button>` : '');

    if (spent) {
      const b = $('#hb-end');
      let committed = false;
      b.addEventListener('click', () => {
        if (committed) return;      /* rule 1f: one tap, one turn ended */
        committed = true;
        UI.endTurn();
      });
    }
  },

  /* ================= first-run tutorial ================= */

  TUTORIAL: [
    { t: 'You are a warlord, not a god',
      b: `A patron god backs you but never touches the board. You take territory, develop it, and climb toward
          becoming a legend. <b>Highest score at the end of Round ${ROUND_LIMIT} wins.</b>` },
    { t: 'Tribute is your only money',
      b: `Your full territorial income arrives <b>at the start of your own Turn</b>, once per Round. Each Reaction
          adds a flat +${REACTION_TRICKLE}. It never caps, so hoarding is a real option.
          <ul><li>Every region pays a little; a <b>Holding</b> pays much more</li>
          <li>You feed <b>${UPKEEP_FREE} hosts free, plus 1 more for every region you hold</b>. Each host past that costs 1 Tribute a Round</li>
          <li>Armies you cannot pay <b>desert</b></li></ul>` },
    { t: 'Holdings are the engine',
      b: `Building a Holding on a region does three things: <b>raises its income</b> every Round,
          and at tier 2 or better it <b>adds a defence die</b>.
          Cost depends on the region — Farmland is cheaper, and so is Ilthara. Hover the Build button to see the sum.` },
    { t: 'Renown, and how you climb it',
      b: `XP comes from almost everything you do — taking ground, raising Holdings, completing a Domain,
          holding a Shrine, and battle. <b>You earn XP for losing hosts too</b>, so falling behind still levels you up.
          Every level offers a choice of three permanent Boons.` },
    { t: 'Where your army comes from',
      b: `Regions decide what you can field. <b>Siege only from a Mine. Phalanx and Wardens only from a Forge.
          Zealots only from a Shrine.</b> Losing your only Forge deletes a whole strategy, so fight for the ground
          that makes the army you want. You can raise off-type anywhere at double cost.` },
    { t: 'Turns and Reactions',
      b: `On <b>your Turn</b> you act as often as your Tribute allows. While someone else holds the Turn, you get
          <b>one Reaction action</b> in response. Attacking rolls up to 3 dice against the defender's 2 —
          but <b>ties go to the defender</b>, so parity is not as good as it looks.` }
  ],

  openTutorial(step) {
    step = step || 0;
    const s = UI.TUTORIAL[step];
    const dots = UI.TUTORIAL.map((_, i) =>
      `<span class="tut-dot ${i === step ? 'on' : ''}"></span>`).join('');
    UI.modal(`
      <div class="eyebrow">How this works · ${step + 1} of ${UI.TUTORIAL.length}</div>
      <h2>${esc(s.t)}</h2>
      <div class="tut-step">${dots}</div>
      <div class="tut-body">${s.b}</div>
      <div class="modal-actions">
        <button class="ghost" id="tut-skip">Skip</button>
        ${step > 0 ? `<button class="ghost" id="tut-back">Back</button>` : ''}
        <button class="primary" id="tut-next">${step === UI.TUTORIAL.length - 1 ? 'Take command' : 'Next'}</button>
      </div>`);
    const done = () => {
      try { localStorage.setItem('apotheosis-tutorial-seen', '1'); } catch (e) {}
      UI.closeModal(); UI.render();
    };
    $('#tut-skip').addEventListener('click', done);
    const back = $('#tut-back'); if (back) back.addEventListener('click', () => UI.openTutorial(step - 1));
    $('#tut-next').addEventListener('click', () =>
      step === UI.TUTORIAL.length - 1 ? done() : UI.openTutorial(step + 1));
  },

  maybeTutorial() {
    let seen = false;
    try { seen = localStorage.getItem('apotheosis-tutorial-seen') === '1'; } catch (e) {}
    if (!seen) UI.openTutorial(0);
  },

  /* ================= turn flow ================= */

  spendAction(alsoEnd) {
    if (G.phase === 'turn') Rules.spendAction();
    if (G.phase === 'reaction') {
      G.reactionActionTaken = true;
      UI.mode = 'idle';
      if (alsoEnd !== false) { UI.endTurn(); return; }
    }
    UI.mode = 'idle';
    UI.render();
  },

  /* Raise, Build, Monument and a peaceful March each open their own dialog
     OVER the region strip; committing used to close straight to the bare
     board, so taking a second action on the same region meant tapping it
     again. This reopens that region's strip afterward — but only when it is
     still this player's action to take. A Reaction's single action, or the
     last action of a Turn, can hand play to someone else inside
     spendAction() itself (privacy screen, AI turn, Reaction queue moving
     on), and reopening a strip for a player no longer acting would show
     stale, wrong-owner controls over whatever comes next. */
  afterRegionAction(id) {
    const pi = UI.actingIndex();
    UI.spendAction();
    if (!id || !G.regions[id]) return;      // Monument has no region of its own
    if (G.phase === 'gameover') return;
    if (UI.actingIndex() !== pi) return;
    if (G.regions[id].owner !== pi) return;
    G.selected = id;
    UI.openRegion(id);
  },

  endTurn() {
    UI.mode = 'idle';
    const before = UI.actingIndex();
    if (G.phase === 'reaction') Rules.endReaction(); else Rules.endTurn();
    if (G.phase === 'gameover') { UI.render(); return; }
    const after = UI.actingIndex();
    if (UI.privacy && after !== before && !AI.isAI(after)) UI.showPass(after);
    else UI.render();
  },

  showPass(pi) {
    const p = G.players[pi];
    const isReaction = G.phase === 'reaction';
    $('#pass-card').innerHTML = `
      <div class="dot" style="background:${p.colour.hex}"></div>
      <div class="eyebrow">${isReaction ? 'Reaction' : 'Turn'} · Round ${G.round}</div>
      <h2>${esc(p.name)}</h2>
      <p style="color:var(--ink-mid)">${
        isReaction
          ? `React to ${esc(Rules.turnPlayer().name)}'s Turn. You have one action.`
          : `The Turn is yours. Act as often as your Tribute allows.`
      }</p>
      <button class="primary big" id="pass-go">Take command</button>`;
    $('#pass-layer').classList.remove('hidden');
    $('#pass-go').addEventListener('click', () => {
      $('#pass-layer').classList.add('hidden');
      UI.render();
    });
  },

  confirmSurrender(pi) {
    UI.modal(`
      <div class="eyebrow">Surrender</div>
      <h2>Yield the field?</h2>
      <p>Your regions pass to the rivals who border them, and your banked Tribute is
      divided evenly among everyone still fighting. Your placement locks in where you stand now.</p>
      <div class="modal-actions">
        <button class="ghost" data-close>Keep fighting</button>
        <button class="danger" id="do-surrender">Surrender</button>
      </div>`);
    $('#do-surrender').addEventListener('click', () => {
      UI.closeModal();
      Rules.surrender(pi);
      if (G.phase !== 'gameover') UI.endTurn(); else UI.render();
    });
  },

  /* ================= modals ================= */

  modal(html, kind) {
    const m = $('#modal');
    m.className = kind || '';
    m.innerHTML = html;
    $('#modal-layer').classList.remove('hidden');
    $('#modal').querySelectorAll('[data-close]').forEach(b =>
      b.addEventListener('click', () => { UI.closeModal(); UI.render(); }));
  },
  closeModal() { $('#modal-layer').classList.add('hidden'); $('#modal').innerHTML = ''; },

  /* ---- send hosts (march or assault) ---- */

  openSend(from, to) {
    const pi = UI.actingIndex();
    const src = G.regions[from];
    const dest = G.regions[to];
    const hostile = dest.owner !== null && dest.owner !== pi;
    const pool = { ...src.hosts };
    const chosen = {};
    const path = UI.marchTargets(from)[to] || [];
    const champHere = Rules.championAt(pi, from);
    /* The Champion rides with the army — or travels alone. It used to have
       its own march range of 1 while hosts fortify any distance across your
       own land, so on most moves the option was greyed out and the piece
       got left behind; that "out of range" state is gone; a Champion always
       goes wherever it's sent, hosts or no hosts. */
    let sendChampion = false;

    const maxSpare = Rules.hostCount(src) - 1;

    const setAll = frac => {
      for (const k in chosen) delete chosen[k];
      let want = Math.max(1, Math.round(maxSpare * frac));
      // spend the best troops first when committing everything, cheapest when probing
      const order = Object.keys(pool).filter(u => pool[u] > 0)
        .sort((a, b) => frac >= 1 ? UNITS[b].cost - UNITS[a].cost : UNITS[a].cost - UNITS[b].cost);
      for (const u of order) {
        const take = Math.min(pool[u], want);
        if (take > 0) { chosen[u] = take; want -= take; }
        if (want <= 0) break;
      }
    };

    const draw = () => {
      const total = Object.values(chosen).reduce((a, b) => a + b, 0);
      const left = Rules.hostCount(src) - total;
      const rows = Object.keys(pool).filter(u => pool[u] > 0).map(u => {
        const v = chosen[u] || 0;
        const cap = Math.min(pool[u], v + Math.max(0, left - 1));
        return `
        <div class="slider-row">
          <div class="nm">${esc(UNITS[u].name)}
            <small>${esc(UNITS[u].rule)}</small></div>
          <input type="range" min="0" max="${pool[u]}" value="${v}" data-slider="${u}"
                 aria-label="${esc(UNITS[u].name)} committed">
          <div class="ct"><b>${v}</b> / ${pool[u]}${v > cap ? '' : ''}</div>
        </div>`;
      }).join('');

      /* A champion-only ASSAULT is deliberately not offered: combat only
         ever risks the Champion once its escort is exhausted (afterExchange
         checks stackSize(c.force) === 0 to mean "the escort just died"), so
         a force that starts empty reads as pre-wiped-out before a single die
         is thrown, whatever the roll says — that's a combat-engine gap, not
         a UI one, and worth its own careful pass rather than a rushed patch
         here. A champion-only MARCH has no such dependency and is fine. */
      const fc = (hostile && total > 0) ? UI.forecast(pi, from, to, chosen, sendChampion) : null;

      UI.modal(`
        <div class="eyebrow">${hostile ? 'Assault' : 'March'}</div>
        <h2>${esc(REGIONS[from].name)} → ${esc(REGIONS[to].name)}</h2>
        <p>${hostile
            ? `Defended by <b style="color:${G.players[dest.owner].colour.hex}">${esc(G.players[dest.owner].name)}</b>
               with ${Rules.hostCount(dest)} host(s): ${esc(UI.composition(dest.hosts))}.`
            : `Unopposed. At least one host must remain behind.`}</p>
        ${fc ? UI.forecastPanel(fc, total, Rules.hostCount(dest)) : ''}
        ${champHere ? `<label class="check champ-check">
            <input type="checkbox" id="send-champ" ${sendChampion ? 'checked' : ''}>
            <span>Send your <b>Champion</b>${total < 1 && !hostile ? ' alone' : ''}.
              It fights here, and dies for good if this force is destroyed.</span>
          </label>` : ''}
        <div class="quick-row">
          <button class="ghost small" data-frac="1">All spare (${maxSpare})</button>
          <button class="ghost small" data-frac="0.5">Half</button>
          <button class="ghost small" data-frac="0">One</button>
          <button class="ghost small" data-frac="-1">Clear</button>
        </div>
        <div class="stepper-list">${rows || '<p>No hosts available.</p>'}</div>
        <div class="tally"><span>Committed <b>${total}</b></span><span>Remaining here <b>${left}</b></span></div>
        <div class="modal-actions">
          <button class="ghost" data-close>Cancel</button>
          <button class="primary" id="send-go"
            ${(total < 1 && !(sendChampion && !hostile)) || (total > 0 && left < 1) ? 'disabled' : ''}>
            ${hostile ? 'Attack' : 'March'}
          </button>
        </div>`);

      $('#modal').querySelectorAll('[data-slider]').forEach(el => {
        const commit = () => {
          const u = el.dataset.slider;
          let want = +el.value;
          const others = Object.keys(chosen).reduce((a, k) => a + (k === u ? 0 : chosen[k]), 0);
          want = Math.min(want, maxSpare - others);          // always leave a garrison
          if (want > 0) chosen[u] = want; else delete chosen[u];
          draw();
        };
        el.addEventListener('input', commit);
        el.addEventListener('change', commit);
      });
      $('#modal').querySelectorAll('[data-frac]').forEach(b => b.addEventListener('click', () => {
        const f = +b.dataset.frac;
        if (f < 0) { for (const k in chosen) delete chosen[k]; }
        else if (f === 0) setAll(1 / Math.max(1, maxSpare));
        else setAll(f);
        draw();
      }));
      const champBox = $('#send-champ');
      if (champBox) champBox.addEventListener('change', () => { sendChampion = champBox.checked; draw(); });

      $('#send-go').addEventListener('click', () => {
        UI.closeModal();
        if (hostile) {
          Combat.begin(pi, from, to, chosen, { champion: sendChampion });
          UI.spendAction(false);
          UI.openCombat();
        } else {
          const r = Rules.march(pi, from, to, chosen, { champion: sendChampion });
          if (!r.ok) { UI.notice('Cannot march', r.why); return; }
          UI.afterRegionAction(from);
        }
      });
    };
    draw();
  },

  /* ---- raise hosts ---- */

  /* Raising is a batch order on sliders: you see how many of each unit you
     already hold here, how many you are adding, and the running total against
     your treasury — so you can't accidentally over- or under-spend. */
  /* ---- raising hosts: a strip, not a dialog ----

     Kinds on the left, amount on the right, both on the board rather than over
     it. The full-screen version of this covered the region you were raising in.

     One Raise action still buys several kinds — the controls navigate the
     roster, they do not narrow the rule. Cost colour is what you scan for:
     verdigris on-type, blood at the off-type double, dim when a Holding is
     missing and the unit cannot be raised there at all.

     Built ONCE; only text nodes and classes are written afterwards. Bind
     `input` OR `change`, never both — both fire on release, and rebuilding
     under a moving finger is what stopped the old slider reaching its top. */
  openRaise(regionId) {
    const pi = UI.actingIndex();
    const p = G.players[pi];
    const rs = G.regions[regionId];
    const order = {};
    let committed = false;

    /* Affordability is the amount slider's cap, NOT a disabled flag: it moves
       as you spend on other kinds. The old dialog greyed out whatever you
       could not afford when it opened and never re-enabled it. */
    const meta = Rules.availableUnits(pi).map(u => {
      const rc = Rules.raiseCost(pi, regionId, u);
      // only the first Levy in a Turn is ever free — price every one after
      // that at the steady rate so the slider cannot promise more than the
      // treasury actually covers
      const steadyCost = rc.freeUsed ? Rules.raiseCost(pi, regionId, u, true).cost : rc.cost;
      return { u: u, name: UNITS[u].name, rule: UNITS[u].rule, cost: rc.cost, steadyCost,
               onType: rc.onType, hard: !!rc.needsHolding, freeUsed: rc.freeUsed,
               why: rc.needsHolding ? 'Off-type raising needs a Holding here.' : '',
               have: Rules.countUnit(rs, u) };
    });

    // the first Levy in a batch is free under the right Boon; every one
    // after it costs the steady rate — so cost is priced per-kind, not as a
    // flat count * cost
    const kindCost = (m, n) => {
      if (n <= 0) return 0;
      return m.freeUsed ? (n - 1) * m.steadyCost : n * m.cost;
    };
    const totalCost  = () => meta.reduce((a, m) => a + kindCost(m, order[m.u] || 0), 0);
    const totalHosts = () => meta.reduce((a, m) => a + (order[m.u] || 0), 0);
    let sel = Math.max(0, meta.findIndex(m => !m.hard));

    const chips = meta.map((m, i) =>
      '<button class="rk" type="button" data-i="' + i + '"'
      + (m.hard ? ' data-hard="1"' : '')
      + ' aria-label="' + esc(m.name) + ', ' + m.cost + ' Tribute'
      + (m.hard ? ', unavailable here' : m.onType ? ', raised here' : ', off-type double cost') + '">'
      + '<span class="rk-ico">' + UI.troopChip(m.u, p.colour.hex) + '</span>'
      + '<span class="rk-cost ' + (m.hard ? 'blocked' : m.onType ? 'on' : 'off') + '">'
      + m.cost + '</span>'
      + '<span class="rk-n" data-ct="' + m.u + '"></span>'
      + '</button>').join('');

    UI.pv.open({
      kind: 'raise', ctx: regionId, variant: 'strip', aria: 'Raise hosts',
      body:
        '<div class="st-top">'
      + '  <span class="st-where">Raise · ' + esc(REGIONS[regionId].name)
      + '    <em class="rz-tally"></em></span>'
      + '</div>'
      + '<div class="rz">'
      + '  <div class="rz-kinds">' + chips + '</div>'
      + '  <div class="rz-amt">'
      + '    <div class="rz-note"></div>'
      + '    <div class="rz-slide">'
      + '      <input type="range" class="r2-count" min="0" max="1" step="1" value="0"'
      + '             aria-label="How many to raise">'
      + '      <div class="rz-ticks" aria-hidden="true"></div>'
      + '    </div>'
      + '    <div class="rz-n"><b class="r2-amt-n">0</b></div>'
      + '  </div>'
      + '</div>'
      + '<div class="st-foot">'
      + '  <button class="st-x" type="button" aria-label="Cancel">×</button>'
      + '  <span class="st-read"><b class="rz-name"></b><i class="rz-rule"></i></span>'
      + '  <button class="st-ok" type="button" aria-label="Confirm">✓</button>'
      + '</div>',
      wire: card => {
        const count = card.querySelector('.r2-count');
        const ticks = card.querySelector('.rz-ticks');
        const amtN  = card.querySelector('.r2-amt-n');
        const nameEl = card.querySelector('.rz-name');
        const ruleEl = card.querySelector('.rz-rule');
        const noteEl = card.querySelector('.rz-note');
        const tally  = card.querySelector('.rz-tally');
        const ok     = card.querySelector('.st-ok');
        const kinds  = [...card.querySelectorAll('.rk')];

        /* RISK's slider tells you where the next stop is; a bare native
           range does not. One tick per unit up to 20, coarser above that so
           it never turns to a smear — always including the top tick, so the
           true ceiling is never one un-marked notch past the last visible
           one. Position math mirrors how a range input actually lays out
           its thumb: centred from half a thumb-width in to half a
           thumb-width from the end, never flush with the track's edges. */
        const THUMB = 26;
        const paintTicks = (max, want) => {
          if (!ticks) return;
          if (max <= 0) { ticks.innerHTML = ''; return; }
          const step = max > 20 ? Math.ceil(max / 20) : 1;
          const marks = [];
          for (let v = 0; v <= max; v += step) marks.push(v);
          if (marks[marks.length - 1] !== max) marks.push(max);
          ticks.innerHTML = marks.map(v => {
            const frac = v / max;
            const cls = (v <= want ? 'on' : '') + (v === 0 || v === max ? ' end' : '');
            return '<i class="' + cls + '" style="left:calc(' + (THUMB / 2) + 'px + '
              + frac + ' * (100% - ' + THUMB + 'px))"></i>';
          }).join('');
        };

        /* The true max count of this kind the treasury covers, computed FROM
           ZERO against the budget left after every other kind's commitment —
           NOT added on top of what's already committed here, which is what
           let the slider run away to 20 on every drag: each tick raised
           `want`, and `want` fed straight back into its own ceiling. */
        // no ceiling beyond the treasury: a cheap enough host with enough
        // Tribute behind it can legitimately clear 20 in one action
        const capFor = i => {
          const m = meta[i];
          if (m.hard) return 0;
          const want = order[m.u] || 0;
          const others = totalCost() - kindCost(m, want);
          const budget = Math.max(0, p.tribute - others);
          if (!m.freeUsed) return Math.floor(budget / Math.max(1, m.cost));
          return 1 + Math.floor(budget / Math.max(1, m.steadyCost));
        };

        const sync = () => {
          const spent = totalCost();
          const m = meta[sel];

          kinds.forEach((el, i) => {
            el.classList.toggle('on', i === sel);
            el.classList.toggle('is-hard', meta[i].hard);
            const n = order[meta[i].u] || 0;
            const ct = el.querySelector('[data-ct]');
            ct.textContent = n ? n : '';
            ct.classList.toggle('has', n > 0);
          });

          nameEl.textContent = m.name;
          ruleEl.textContent = m.hard ? m.why : m.rule;
          ruleEl.classList.toggle('blocked', m.hard);
          noteEl.textContent = m.hard ? 'blocked'
            : m.freeUsed ? 'first free, then ' + m.steadyCost + 't'
            : m.cost + 't each' + (m.onType ? '' : ' · double');
          noteEl.className = 'rz-note ' + (m.hard ? 'blocked' : m.onType ? 'on' : 'off');

          const cap = capFor(sel);
          if (+count.max !== cap) count.max = cap;
          const want = Math.min(order[m.u] || 0, cap);
          if (+count.value !== want) count.value = want;
          count.disabled = cap === 0;
          amtN.textContent = want ? '+' + want : '0';
          amtN.classList.toggle('has', want > 0);
          paintTicks(cap, want);

          tally.textContent = spent
            ? spent + 't · ' + totalHosts() + ' host' + (totalHosts() === 1 ? '' : 's')
            : p.tribute + 't in hand';
          tally.classList.toggle('spending', spent > 0);
          ok.classList.toggle('is-off', spent === 0);
        };

        const select = i => { sel = Math.max(0, Math.min(meta.length - 1, i)); sync(); };
        kinds.forEach(el => el.addEventListener('click', () => select(+el.dataset.i)));

        count.addEventListener('input', () => {
          const m = meta[sel];
          if (m.hard) { count.value = 0; return; }
          const v = Math.max(0, Math.min(capFor(sel), +count.value));
          if (v > 0) order[m.u] = v; else delete order[m.u];
          if (+count.value !== v) count.value = v;
          sync();
        });

        card.querySelector('.st-x').addEventListener('click', UI.pv.close);

        ok.addEventListener('click', () => {
          if (totalCost() === 0) { UI.fx.refuse(ok, 'Choose a host and a number first.'); return; }
          if (committed) return;                  /* one tap, one action */
          committed = true;
          for (const u in order) {
            for (let i = 0; i < order[u]; i++) Rules.raiseHost(pi, regionId, u);
          }
          UI.pv.close();
          UI.afterRegionAction(regionId);
        });

        sync();
      }
    });
  },

  /* ---- monuments: Tribute into legend ---- */

  openMonument(pi) {
    const p = G.players[pi];
    let amount = Math.min(p.tribute, Math.max(MONUMENT_MIN, Math.floor(p.tribute / 2)));
    const draw = () => {
      const xp = Rules.monumentXP(amount);
      const nextAt = p.level < MAX_LEVEL ? XP_THRESHOLDS[p.level] : null;
      const after = p.xp + xp;
      const levels = (() => { let l = p.level; while (l < MAX_LEVEL && after >= XP_THRESHOLDS[l]) l++; return l - p.level; })();
      UI.modal(`
        <div class="eyebrow">Monuments</div>
        <h2>Carve your deeds in stone</h2>
        <p>Tribute buys soldiers, walls — or legend. Spend it here and it becomes Renown XP
           at ${MONUMENT_RATE} Tribute per point. <b>Once per Round.</b></p>
        <div class="slider-row" style="grid-template-columns:7rem 1fr 6rem">
          <div class="nm">Tribute<small>have ${p.tribute}</small></div>
          <input type="range" min="${MONUMENT_MIN}" max="${p.tribute}" value="${amount}"
                 data-mon aria-label="Tribute to spend">
          <div class="ct"><b>${amount}</b><span class="rn-sub">→ ${xp} XP</span></div>
        </div>
        <div class="tally">
          <span>XP after <b>${after}</b>${nextAt ? ` / ${nextAt}` : ''}</span>
          <span>Levels gained <b>${levels}</b></span>
          <span>Tribute after <b>${p.tribute - amount}</b></span>
        </div>
        <div class="modal-actions">
          <button class="ghost" data-close>Cancel</button>
          <button class="primary" id="mon-go">Raise for ${amount}t</button>
        </div>`);
      const el = $('#modal').querySelector('[data-mon]');
      const commit = () => { amount = +el.value; draw(); };
      el.addEventListener('input', commit);
      el.addEventListener('change', commit);
      $('#mon-go').addEventListener('click', () => {
        Rules.raiseMonument(pi, amount);
        UI.closeModal();
        UI.afterRegionAction(G.selected);
      });
    };
    draw();
  },

  /* ---- combat ---- */

  openCombat() {
    const c = G.pendingCombat;
    if (!c) return;
    // if the attacker has losses to assign, that modal owns the screen first
    if (UI.handleCasualties()) return;

    const r = c.lastRoll;
    const atkName = G.players[c.attacker].name;
    const defName = c.defender === null ? 'the unclaimed' : G.players[c.defender].name;
    const forceLeft = Object.values(c.force).reduce((a, b) => a + b, 0);
    const defLeft = Rules.hostCount(G.regions[c.target]);

    const dieRow = (label, raw, adj, pairs, isAtk) => {
      const cells = raw.map((v, i) => {
        const shown = adj[i];
        const cls = ['die'];
        if (shown !== v) cls.push('boosted');
        if (pairs[i]) cls.push(pairs[i].attackerWins === isAtk ? 'win' : 'lose');
        return `<div class="${cls.join(' ')}">${shown}</div>`;
      }).join('');
      return `<div class="dice-row"><span class="dice-label">${label}</span>${cells}</div>`;
    };

    const body = r ? `
      ${dieRow('Attack', r.atk, r.atkAdj, r.pairs, true)}
      <div class="notes">${esc(r.ap.notes.join(' · ') || 'no modifiers')}</div>
      ${dieRow('Defence', r.def, r.defAdj, r.pairs, false)}
      <div class="notes">${esc(r.dp.notes.join(' · ') || 'no modifiers')}</div>
      <div class="tally">
        <span>Attacker lost <b>${r.atkLoss}</b></span>
        <span>Defender lost <b>${r.defLoss}</b></span>
      </div>` : `<p>Ties go to the defender. Composition bends the odds before the dice land.</p>`;

    /* Live order of battle: both sides' actual pieces with counts, updating
       as hosts fall, so you can watch the fight rather than read totals. */
    const sideList = (hosts, colour, cls) => {
      const ks = Object.keys(hosts || {}).filter(u => hosts[u] > 0);
      return `<div class="ob-side ${cls}">` + (ks.length
        ? ks.map(u => `<span class="ob-unit">${UI.troopChip(u, colour)}<b>${hosts[u]}</b> ${esc(UNITS[u].name)}</span>`).join('')
        : '<span class="ob-unit">—</span>') + `</div>`;
    };
    const atkColour = G.players[c.attacker].colour.hex;
    const defColour = c.defender === null ? '#8b8b96' : G.players[c.defender].colour.hex;
    const orderOfBattle = `
      <div class="ob">
        ${sideList(c.force, atkColour, 'atk')}
        <span class="ob-vs">vs</span>
        ${sideList(G.regions[c.target].hosts, defColour, 'def')}
      </div>`;

    const watching = AI.isAI(c.attacker);
    let actions;
    if (c.finished) {
      actions = `<button class="primary" id="c-done">${
        watching ? 'Continue' : (c.captured ? 'Claim the ground' : 'Fall back')}</button>`;
    } else if (watching) {
      actions = `<span class="notes">${esc(atkName)} presses the attack…</span>`;
    } else {
      actions = `<button class="ghost" id="c-withdraw">Withdraw</button>
                 <button class="primary" id="c-roll">${r ? 'Press the attack' : 'Loose the dice'}</button>`;
    }

    UI.modal(`
      <div class="eyebrow">Assault on ${esc(REGIONS[c.target].name)}</div>
      <h2>${esc(atkName)} vs ${esc(defName)}</h2>
      ${orderOfBattle}
      ${body}
      <div class="modal-actions">${actions}</div>`, 'combat');

    const on = (s, f) => { const b = $(s); if (b) b.addEventListener('click', f); };
    on('#c-roll', () => { Combat.exchange(); UI.openCombat(); });
    on('#c-withdraw', () => { Combat.withdraw(); UI.openCombat(); });
    on('#c-done', () => { Combat.dismiss(); UI.closeModal(); UI.afterAction(); });
  },

  /* The attacker allocates their own losses. Defender losses resolve
     cheapest-first so hotseat combat doesn't turn into a relay race. */
  handleCasualties() {
    let job;
    while ((job = Combat.currentCasualtyJob())) {
      if (job.side === 'attacker' && job.player === UI.actingIndex() && !AI.isAI(job.player)) {
        UI.openCasualty(job);
        return true;                     // a modal is now owning the screen
      }
      const order = Object.keys(job.pool).filter(u => job.pool[u] > 0)
        .sort((a, b) => UNITS[a].cost - UNITS[b].cost);
      const auto = {}; let left = job.losses;
      for (const u of order) {
        const take = Math.min(left, job.pool[u]);
        if (take > 0) { auto[u] = take; left -= take; }
        if (left <= 0) break;
      }
      Combat.applyCasualties(auto);
    }
    return false;
  },

  openCasualty(job) {
    const chosen = {};
    const draw = () => {
      const total = Object.values(chosen).reduce((a, b) => a + b, 0);
      const rows = Object.keys(job.pool).filter(u => job.pool[u] > 0).map(u => `
        <div class="stepper">
          <div class="nm">${esc(UNITS[u].name)}<small>${esc(UNITS[u].flavour)}</small></div>
          <button data-dec="${u}" ${!chosen[u] ? 'disabled' : ''}>−</button>
          <div class="ct">${chosen[u] || 0} / ${job.pool[u]}</div>
          <button data-inc="${u}" ${(chosen[u] || 0) >= job.pool[u] || total >= job.losses ? 'disabled' : ''}>+</button>
        </div>`).join('');
      UI.modal(`
        <div class="eyebrow">Casualties</div>
        <h2>${job.losses} host${job.losses === 1 ? '' : 's'} must fall</h2>
        <p>You choose who dies. Cheap bodies buy time; veterans win the next fight.</p>
        <div class="stepper-list">${rows}</div>
        <div class="tally"><span>Assigned <b>${total}</b> of <b>${job.losses}</b></span></div>
        <div class="modal-actions">
          <button class="primary" id="cas-go" ${total !== job.losses ? 'disabled' : ''}>Confirm</button>
        </div>`);
      $('#modal').querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
        const u = b.dataset.inc; chosen[u] = (chosen[u] || 0) + 1; draw();
      }));
      $('#modal').querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
        const u = b.dataset.dec; chosen[u] = Math.max(0, (chosen[u] || 0) - 1);
        if (!chosen[u]) delete chosen[u]; draw();
      }));
      $('#cas-go').addEventListener('click', () => {
        Combat.applyCasualties(chosen);
        UI.openCombat();
      });
    };
    draw();
  },

  afterAction() {
    if (G.phase === 'reaction' && G.reactionActionTaken) { UI.endTurn(); return; }
    UI.render();
  },

  /* Which units this ground can field on-type, named plainly so the player
     never has to infer that Siege means "find a Mine". */
  raisableAt(id) {
    const pi = UI.actingIndex();
    const type = REGIONS[id].type;
    return Rules.availableUnits(pi)
      .filter(u => UNITS[u].raisedAt.includes('*') || UNITS[u].raisedAt.includes(type))
      .map(u => UNITS[u].name);
  },

  composition(hosts) {
    const k = Object.keys(hosts || {}).filter(u => hosts[u] > 0);
    return k.length ? k.map(u => `${hosts[u]}× ${UNITS[u].name}`).join(', ') : 'nothing';
  },

  /* Pre-battle forecast. Builds the real attack and defence profiles against
     a hypothetical force, then Monte-Carlos the exchange so the player sees
     the odds before committing — the thing RISK on mobile gets right. */
  forecast(pi, from, to, stack, withChampion) {
    const probe = {
      attacker: pi, defender: G.regions[to].owner, from, target: to,
      force: { ...stack }, championLeads: !!withChampion && Rules.championAt(pi, from)
    };
    const ap = Combat.attackProfile(probe);
    const dp = Combat.defenceProfile(probe);

    let winPairs = 0, total = 0;
    const TRIALS = 4000;
    for (let t = 0; t < TRIALS; t++) {
      const a = Array.from({ length: ap.dice }, () => 1 + Math.floor(Math.random() * 6)).sort((x, y) => y - x);
      const d = Array.from({ length: dp.dice }, () => 1 + Math.floor(Math.random() * 6)).sort((x, y) => y - x);
      if (a.length) a[0] += ap.bonus;
      if (d.length) d[0] += dp.bonus;
      const n = Math.min(a.length, d.length);
      for (let i = 0; i < n; i++) { total++; if (a[i] > d[i]) winPairs++; }
    }
    const perPair = total ? winPairs / total : 0;
    const pairs = Math.min(ap.dice, dp.dice);
    return {
      ap, dp, pairs,
      perPair: Math.round(perPair * 100),
      expectedKills: +(perPair * pairs).toFixed(2),
      expectedLosses: +((1 - perPair) * pairs).toFixed(2)
    };
  },

  forecastPanel(f, attackers, defenders) {
    const edge = f.perPair >= 58 ? 'good' : f.perPair >= 45 ? 'even' : 'bad';
    const verdict = { good: 'Favourable', even: 'Close', bad: 'Against you' }[edge];
    return `<div class="forecast ${edge}">
      <div class="fc-head"><span>${verdict}</span><b>${f.perPair}%</b><span>per die pairing</span></div>
      <div class="fc-grid">
        <div><span class="fc-k">You roll</span><span class="fc-v">${f.ap.dice}D${f.ap.bonus ? ` +${f.ap.bonus}` : ''}</span>
          <span class="fc-n">${esc(f.ap.notes.join(' · ') || 'no modifiers')}</span></div>
        <div><span class="fc-k">They roll</span><span class="fc-v">${f.dp.dice}D${f.dp.bonus ? ` +${f.dp.bonus}` : ''}</span>
          <span class="fc-n">${esc(f.dp.notes.join(' · ') || 'no modifiers')}</span></div>
        <div><span class="fc-k">Per exchange</span><span class="fc-v">≈${f.expectedKills} kills</span>
          <span class="fc-n">≈${f.expectedLosses} of yours lost</span></div>
        <div><span class="fc-k">Forces</span><span class="fc-v">${attackers} v ${defenders}</span>
          <span class="fc-n">ties go to the defender</span></div>
      </div></div>`;
  },

  /* ---- boons ---- */

  openBoon() {
    const pb = G.pendingBoon;
    const p = G.players[pb.player];
    const unlock = TIER_UNLOCKS[p.level];
    const card = (b, kind) => `<button class="boon-card ${kind}" data-boon="${b.id}">
      <b>${esc(b.name)}</b><span>${esc(b.text)}</span></button>`;

    UI.modal(`
      <div class="eyebrow">Renown ${p.level} · ${esc(tierFor(p.level))}</div>
      <h2>Strengthen your realm, or your Champion</h2>
      <p>${esc(p.name)} — you may take <b>one</b>. A Blessing improves your empire and armies
         forever; a Perk makes your Champion deadlier. You cannot have both, so every level is
         a choice about what kind of warlord you are.</p>
      ${unlock ? `<div class="tier-unlock">Renown ${p.level} also grants: <b>${esc(unlock.text)}</b></div>` : ''}
      <div class="choice-cols">
        <div class="choice-col">
          <div class="choice-head bless">Blessings of ${esc(Rules.patronOf(p).name)}</div>
          ${pb.blessings.length ? pb.blessings.map(b => card(b, 'bless')).join('')
            : '<p class="sel-note">Every Blessing already taken.</p>'}
        </div>
        <div class="choice-col">
          <div class="choice-head perk">Champion Perks</div>
          ${pb.perks.length ? pb.perks.map(b => card(b, 'perk')).join('')
            : `<p class="sel-note">${p.championDead ? 'Your Champion is dead. There are no Perks left to take.' : 'Every Perk already taken.'}</p>`}
        </div>
      </div>`);
    $('#modal').querySelectorAll('[data-boon]').forEach(b => b.addEventListener('click', () => {
      Rules.takeBoon(b.dataset.boon);
      UI.closeModal();
      UI.checkOverlays(true);
    }));
  },

  /* ---- notices, reference, game over ---- */

  notice(title, text) {
    UI.modal(`<h2>${esc(title)}</h2><p>${esc(text)}</p>
      <div class="modal-actions"><button class="primary" data-close>Understood</button></div>`);
  },

  openGameOver() {
    const rows = [...G.finalScores].sort((a, b) => b.total - a.total).map(s => {
      const p = G.players[s.player];
      return `<tr class="${s.player === G.winner ? 'win' : ''}">
        <td><span class="dot" style="display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:${p.colour.hex};margin-right:.5rem"></span>${esc(p.name)}${p.surrendered ? ' <span style="color:var(--ink-dim)">(surrendered)</span>' : ''}</td>
        <td class="n">${s.domains}</td><td class="n">${s.holdings}</td>
        <td class="n">${s.level}</td><td class="n">${s.thrones}</td>
        <td class="n"><b>${s.total}</b></td></tr>`;
    }).join('');
    UI.modal(`
      <div class="eyebrow">The war is decided</div>
      <h2>${esc(G.players[G.winner].name)} prevails</h2>
      <table class="score-table">
        <thead><tr><th>Warlord</th><th>Domains</th><th>Holdings</th><th>Renown</th><th>Thrones</th><th>Total</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="modal-actions"><button class="primary" id="again">Play again</button></div>`);
    $('#again').addEventListener('click', () => location.reload());
  },

  /* ================= overlay dispatch ================= */

  /* Single authority for what should be on screen. This runs after every
     render and is deliberately self-healing: a pending combat that lost its
     modal gets it back rather than deadlocking the board.

     The bug this fixes: a level-up during a battle opened the Blessing modal
     over the combat modal. Taking the Blessing closed everything, but
     pendingCombat survived — and since clickRegion refuses to act while a
     combat is pending, every territory went dead while End Turn kept working. */
  checkOverlays(force) {
    if (G.phase === 'gameover') { UI.openGameOver(); return; }

    // a level-up interrupts, and we come back to the battle on the next pass
    if (G.pendingBoon && !AI.isAI(G.pendingBoon.player)) { UI.openBoon(); return; }

    const c = G.pendingCombat;
    if (c) {
      const humanDrives = !AI.isAI(c.attacker) || AI.shouldWatch(c);
      if (humanDrives) {
        if (!UI.modalOpen()) UI.openCombat();       // restore a modal that got clobbered
      } else if (c.finished) {
        Combat.dismiss();                           // nobody is watching this one
      }
    }
    if (force) UI.render();
    AI.kick();
  },

  modalOpen() {
    const layer = $('#modal-layer');
    return layer && !layer.classList.contains('hidden');
  }
};

;
/* ===== js/feedback.js ===== */
/* ============================================================
   APOTHEOSIS — feedback layer

   The gap this closes: you tapped, the state changed, the screen redrew, and
   nothing told you what happened. A capture, a level-up, a Champion's death and
   a build you could not afford all landed with exactly the same silence.

   Three surfaces, all of them driven off things the engine already produces:

     1. ANNOUNCEMENTS — the chronicle is already a structured event stream
        ({text, kind, player, seq}). This diffs it against a watermark and
        surfaces what is worth interrupting for. No engine coupling: state.js
        numbers its own events and knows nothing about any of this.

     2. REFUSALS — a disabled button on a phone is a dead end. There is no
        hover, so the `title` explaining why never appears. Action buttons are
        now aria-disabled rather than disabled, so a tap still lands and can
        answer the question it was asked.

     3. DELTAS — Tribute, Renown and Score flag their own change, so the cost
        of what you just did is legible where the number lives.

   Motion here is deliberately small: a 180ms entry, a 160ms exit, nothing on
   the board itself, nothing looping. The global prefers-reduced-motion rule in
   style.css kills all of it, and every card's resting state is the visible one
   so nothing depends on an animation having run.
   ============================================================ */

(function () {

  /* ---- icons ----------------------------------------------------------
     Filled silhouettes on a 24 box, matching the board's visual language
     rather than introducing a stroked line-icon set that would read as
     borrowed from a different product. */
  /* Rendered at 92/42/24/18px and looked at, per rule 1b, which caught three
     failures that reasoning about the path data had not:
       - `torn` was a banner with a jagged hem. Against `banner` it was
         IDENTICAL at every size — the two most opposed events in the game,
         ground taken and ground lost, separated only by colour. The cloth now
         sits at the FOOT of the staff: struck colours. Silhouette mass moves
         from top-right to bottom-right, which survives 18px.
       - `laurel` served both Domain and Blessing. It read as a pair of leaves,
         said neither, and was the same glyph in the same colour for both.
       - `obelisk` was a thin sliver, near-invisible at 18px and confusable
         with `blade`. It is a broad stepped plinth now. */
  const ICONS = {
    banner:  'M6 3h2v18H6z M8 4h11l-3 4 3 4H8z',
    struck:  'M6 3h2v18H6z M8 12h11l-3 4 3 4H8z',
    crown:   'M2.8 8.4l4.1 3.1L12 4.2l5.1 7.3 4.1-3.1-1.9 10.4H4.7z M4.9 20h14.2v1.8H4.9z',
    star:    'M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z',
    keep:    'M5 21V10h14v11z M5 10V5.6h2.6v2.1h3.1V5.6h2.6v2.1h3.1V5.6H19V10z',
    plinth:  'M9.2 3.2h5.6l1.5 12.4H7.7z M6.2 16.4h11.6v2.4H6.2z M4.4 19.6h15.2v2.6H4.4z',
    shield:  'M12 2.2l8 2.9v5.6c0 5.1-3.3 8.8-8 11.1-4.7-2.3-8-6-8-11.1V5.1z',
    coin:    'M12 2.6A9.4 9.4 0 1012 21.4 9.4 9.4 0 0012 2.6zm0 3.6a5.8 5.8 0 110 11.6 5.8 5.8 0 010-11.6z',
    blade:   'M12 1.4l1.7 3.2v9.1h-3.4V4.6z M7.4 13.7h9.2v2.1H7.4z M11.1 15.8h1.8v5.1h-1.8z M12 22.6a1.4 1.4 0 100-2.8 1.4 1.4 0 000 2.8z',
    /* a complete set of ground, filled — reads at any size, unlike a wreath */
    quarters:'M3.2 3.2h8v8h-8z M12.8 3.2h8v8h-8z M3.2 12.8h8v8h-8z M12.8 12.8h8v8h-8z',
    chalice: 'M5.8 2.8h12.4v3.4a6.2 6.2 0 01-5.2 6.1V18h3.8v3.2H7.2V18H11v-5.7a6.2 6.2 0 01-5.2-6.1z',
    warn:    'M12 2.6l10.2 17.8H1.8z M11 9.2h2v6.2h-2z M11 16.6h2v2.1h-2z'
  };

  /* ---- what each event kind is worth ---------------------------------
     weight  loud   — always announced, even on a rival's turn. These are the
                      things you must not miss.
             normal — announced when a human did it. An AI raising a Holding
                      every turn is noise; you raising one is confirmation.
             skip   — the chronicle keeps it, the screen does not.
     tone    picks the colour and therefore the read: gain, loss, renown,
             coin (economy) or neutral. */
  const KINDS = {
    capture:      { weight: 'loud', tone: 'gain',   icon: 'banner',   label: 'Ground taken' },
    fallen:       { weight: 'loud', tone: 'loss',   icon: 'struck',   label: 'Ground lost' },
    championfall: { weight: 'loud', tone: 'loss',   icon: 'crown',    label: 'Champion falls' },

    victory:      { weight: 'loud', tone: 'renown', icon: 'star',     label: 'The war ends' },
    surrender:    { weight: 'loud', tone: 'loss',   icon: 'struck',   label: 'Surrender' },

    /* Movement and the Undying save. Shares the crown with championfall, which
       is fine: they differ in colour, weight and label, and they are never
       adjacent the way capture and fallen are. */
    champion:   { weight: 'normal', tone: 'neutral', icon: 'crown',   label: 'Champion' },

    repulse:    { weight: 'normal', tone: 'loss',    icon: 'shield',  label: 'Assault broken' },
    withdraw:   { weight: 'normal', tone: 'neutral', icon: 'blade',   label: 'Withdrawn' },
    siege:      { weight: 'normal', tone: 'gain',    icon: 'blade',   label: 'Siege' },
    warden:     { weight: 'normal', tone: 'loss',    icon: 'shield',  label: 'Warden falls' },
    build:      { weight: 'normal', tone: 'gain',    icon: 'keep',    label: 'Holding raised' },
    monument:   { weight: 'normal', tone: 'renown',  icon: 'plinth',  label: 'Monument' },
    boon:       { weight: 'normal', tone: 'renown',  icon: 'chalice', label: 'Blessing' },
    perk:       { weight: 'normal', tone: 'renown',  icon: 'blade',   label: 'Champion Perk' },
    desert:     { weight: 'normal', tone: 'loss',    icon: 'coin',    label: 'Desertion' },
    spoils:     { weight: 'normal', tone: 'coin',    icon: 'coin',    label: 'Spoils' },
    turn:       { weight: 'normal', tone: 'coin',    icon: 'coin',    label: 'Your Turn' },

    raise:      { weight: 'normal', tone: 'gain',    icon: 'blade',   label: 'Host raised' },

    march:      { weight: 'skip' },
    /* The combat dialog opens on the same tick and says all of this louder. */
    attack:     { weight: 'skip' },
    round:      { weight: 'skip' },
    upkeep:     { weight: 'skip' },

    info:       { weight: 'skip' }
  };

  const HOLD = { loud: 5200, normal: 3600, refusal: 3600 };

  /* Two on a phone, three on desktop. Three 45px cards plus gaps is ~150px of a
     418px map — enough of the board covered that the announcements start
     competing with the thing they are announcing. */
  const cap = () => (UI.phone && UI.phone()) ? 2 : 3;

  UI.fx = {

    seen: 0,
    host: null,
    live: [],

    /* ---- announcements ---- */

    mount() {
      if (UI.fx.host && document.body.contains(UI.fx.host)) return;
      const pane = document.getElementById('map-pane');
      if (!pane) return;
      const host = document.createElement('div');
      host.id = 'announce';
      host.setAttribute('aria-live', 'polite');
      pane.appendChild(host);
      UI.fx.host = host;
      /* Prime the watermark. Without this the opening "Round 1 begins" and
         the first income line fire as announcements over an empty board. */
      UI.fx.seen = (typeof G !== 'undefined' && G) ? G.logSeq : 0;
    },

    /* Called at the end of every render. Cheap — it compares one integer
       until there is genuinely something new. */
    pump() {
      if (typeof G === 'undefined' || !G) return;
      UI.fx.mount();
      if (!UI.fx.host) return;

      /* A new match resets the engine's counter; the watermark has to follow
         it back down or nothing is ever announced again. */
      if (UI.fx.seen > G.logSeq) UI.fx.seen = 0;

      /* A dialog owns the screen while it is open. Announcements wait behind
         it rather than being buried under the scrim and expiring unseen. */
      if (UI.modalOpen && UI.modalOpen()) return;
      if (!document.getElementById('pass-layer').classList.contains('hidden')) return;

      const fresh = [];
      for (const e of G.log) {
        if (e.seq === undefined || e.seq <= UI.fx.seen) break;
        fresh.push(e);
      }
      if (!fresh.length) return;
      UI.fx.seen = G.logSeq;
      fresh.reverse();                                   // oldest first

      const worth = fresh.filter(e => {
        const k = KINDS[e.kind];
        if (!k || k.weight === 'skip') return false;
        if (k.weight === 'loud') return true;
        /* normal-weight events only speak up for a seat a person is playing,
           so watching three AI turns is not three screens of confirmations */
        return e.player !== null && e.player !== undefined && !AI.isAI(e.player);
      });
      if (!worth.length) return;

      /* When several land at once — a combat dialog closing can flush a
         capture, a Domain and a level in one go — keep the loud ones. */
      let show = worth;
      if (show.length > cap()) {
        const loud = show.filter(e => KINDS[e.kind].weight === 'loud');
        show = (loud.length ? loud : show).slice(-cap());
      }
      show.forEach(e => UI.fx.card(KINDS[e.kind], e.text, e.player));
    },

    card(kind, text, player) {
      const host = UI.fx.host;
      if (!host) return;

      const colour = (player !== null && player !== undefined && G.players[player])
        ? G.players[player].colour.hex : 'transparent';

      const el = document.createElement('div');
      el.className = `fx-card fx-${kind.tone} fx-${kind.weight}`;
      el.setAttribute('role', 'status');
      el.innerHTML =
        `<span class="fx-bar" style="background:${colour}"></span>` +
        `<svg class="fx-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[kind.icon]}" fill-rule="evenodd"/></svg>` +
        `<span class="fx-txt"><span class="fx-eyebrow">${esc(kind.label)}</span>` +
        `<span class="fx-body">${esc(text)}</span></span>`;

      el.addEventListener('click', () => UI.fx.drop(el));
      UI.fx.push(el, HOLD[kind.weight] || HOLD.normal);
    },

    /* Single place where a card enters and where capacity is enforced. */
    push(el, hold) {
      UI.fx.host.appendChild(el);
      UI.fx.live.push({ el, timer: setTimeout(() => UI.fx.drop(el), hold) });
      /* Evicted immediately, not on the exit transition: a card being shoved
         out by a newer one is not a dismissal, and deferring its removal is
         what let 87 orphan nodes pile up over a full match — `live` stayed at
         its cap the whole time while the DOM grew without limit. */
      while (UI.fx.live.length > cap()) UI.fx.drop(UI.fx.live[0].el, true);
      UI.fx.sweep();
    },

    drop(el, now) {
      const i = UI.fx.live.findIndex(r => r.el === el);
      if (i < 0) { if (el.parentNode) el.parentNode.removeChild(el); return; }
      clearTimeout(UI.fx.live[i].timer);
      UI.fx.live.splice(i, 1);
      if (now) { if (el.parentNode) el.parentNode.removeChild(el); return; }
      el.classList.add('out');
      /* Removed on a timer rather than on transitionend: under
         prefers-reduced-motion the transition never fires, and a card waiting
         for an event that cannot arrive would sit there forever. */
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 180);
    },

    /* Anything in the host that nothing is tracking is by definition orphaned —
       a fading card whose removal timer was outrun by the next burst. */
    sweep() {
      const host = UI.fx.host;
      if (!host || host.children.length <= cap() * 2) return;
      [...host.children].forEach(el => {
        if (!UI.fx.live.some(r => r.el === el)) host.removeChild(el);
      });
    },

    clear() {
      [...UI.fx.live].forEach(r => UI.fx.drop(r.el, true));
      if (UI.fx.host) UI.fx.host.innerHTML = '';
    },

    /* ---- refusals ----
       Deliberately does NOT re-render: a render replaces the button and the
       nudge would be destroyed mid-play, which is the same class of bug as
       rebuilding a dialog under a dragging finger. */
    refuse(el, why) {
      if (el) {
        el.classList.remove('refused');
        void el.offsetWidth;                 // restart the animation
        el.classList.add('refused');
        setTimeout(() => el.classList.remove('refused'), 320);
      }
      const dup = UI.fx.live.find(r => r.el.dataset.why === why);
      if (dup) { clearTimeout(dup.timer); dup.timer = setTimeout(() => UI.fx.drop(dup.el), HOLD.refusal); return; }

      const host = UI.fx.host;
      if (!host) return;
      const card = document.createElement('div');
      card.className = 'fx-card fx-refusal fx-normal';
      card.dataset.why = why;
      card.setAttribute('role', 'status');
      card.innerHTML =
        `<span class="fx-bar"></span>` +
        `<svg class="fx-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS.warn}" fill-rule="evenodd"/></svg>` +
        `<span class="fx-txt"><span class="fx-eyebrow">Not yet</span>` +
        `<span class="fx-body">${esc(why)}</span></span>`;
      card.addEventListener('click', () => UI.fx.drop(card));
      UI.fx.push(card, HOLD.refusal);
    },

    /* ---- stat deltas ----
       Emitted only on the render that detects the change, and animated once to
       an invisible resting state. No timers, no forced re-render: a chip that
       needed the screen repainted to clear itself would fight the coalesced
       render loop for no gain. */
    stat: {},

    delta(key, value) {
      const prev = UI.fx.stat[key];
      UI.fx.stat[key] = value;
      if (prev === undefined || prev === value) return '';
      /* Only the seat a person is actually playing gets deltas. Otherwise the
         panel flickers with numbers belonging to an AI mid-turn. */
      if (AI.isAI(UI.actingIndex())) return '';
      const d = value - prev;
      return `<i class="fx-delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${Math.abs(d)}</i>`;
    },

    /* Called when a match starts. Stats are keyed by seat, so a fresh game
       reusing seat 0 would otherwise diff the new warlord's opening treasury
       against the last one's closing balance. */
    reset() {
      UI.fx.clear();
      UI.fx.stat = {};
      UI.fx.seen = (typeof G !== 'undefined' && G) ? G.logSeq : 0;
    }
  };

})();

/* ===== js/main.js ===== */
/* ============================================================
   APOTHEOSIS — bootstrap and setup screen
   ============================================================ */

(function () {
  let count = 4;
  const NAMES = ['Crimson', 'Azure', 'Jade', 'Violet'];
  const PATRON_IDS = Object.keys(PATRONS);
  const PERSONALITY_IDS = Object.keys(AI.PERSONALITIES);

  /* Default: you against three AI, one of each temperament. */
  const seats = [
    { type: 'human', patron: 'vashtar', ai: 'warmonger' },
    { type: 'ai',    patron: 'ilthara', ai: 'magnate' },
    { type: 'ai',    patron: 'vashtar', ai: 'warmonger' },
    { type: 'ai',    patron: 'vashtar', ai: 'opportunist' }
  ];

  /* Renamed one tier over, not just retimed: players reported the old
     Normal (750ms) as fast and the old Slow (1300ms) as what they'd actually
     call normal, so those two keep their timings and swap labels. A new,
     genuinely slow tier — 2x the old Slow — takes the Slow name. speedIdx
     stays at the middle index, so the default game speed is now what used
     to be Slow. */
  const SPEEDS = [
    { name: 'Slow',   ms: 2600 },
    { name: 'Normal', ms: 1300 },
    { name: 'Fast',   ms: 750 }
  ];
  let speedIdx = 1;

  function drawSeats() {
    $('#patron-picks').innerHTML = seats.slice(0, count).map((s, i) => {
      const col = PLAYER_COLOURS[i];
      const chooser = s.type === 'ai'
        ? `<span class="patron-seg">
             ${PERSONALITY_IDS.map(k => {
               const P = AI.PERSONALITIES[k];
               return `<button class="patron-opt ${s.ai === k ? 'on' : ''}" data-seat="${i}" data-personality="${k}">
                 ${P.name} <small>${P.blurb}</small></button>`;
             }).join('')}
           </span>`
        : `<span class="patron-seg">
             ${PATRON_IDS.map(pid => {
               const pt = PATRONS[pid];
               return `<button class="patron-opt ${s.patron === pid ? 'on' : ''}" data-seat="${i}" data-patron="${pid}">
                 ${pt.name} <em class="patron-domain">${pt.domain}</em><small>${pt.plays}</small></button>`;
             }).join('')}
           </span>`;

      return `<div class="pick">
        <span class="swatch" style="background:${col.hex}"></span>
        <span class="pick-name">${NAMES[i]}
          <small>${s.type === 'ai' ? PATRONS[s.patron].name : 'you'}</small></span>
        <span class="seg seat-type">
          <button data-seat="${i}" data-type="human" class="${s.type === 'human' ? 'on' : ''}">Human</button>
          <button data-seat="${i}" data-type="ai" class="${s.type === 'ai' ? 'on' : ''}">AI</button>
        </span>
        ${chooser}
      </div>`;
    }).join('');

    document.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => {
      const s = seats[+b.dataset.seat];
      s.type = b.dataset.type;
      if (s.type === 'ai') s.patron = AI.PERSONALITIES[s.ai].patron;
      drawSeats();
    }));
    document.querySelectorAll('[data-personality]').forEach(b => b.addEventListener('click', () => {
      const s = seats[+b.dataset.seat];
      s.ai = b.dataset.personality;
      s.patron = AI.PERSONALITIES[s.ai].patron;
      drawSeats();
    }));
    document.querySelectorAll('[data-patron]').forEach(b => b.addEventListener('click', () => {
      seats[+b.dataset.seat].patron = b.dataset.patron;
      drawSeats();
    }));

    const humans = seats.slice(0, count).filter(s => s.type === 'human').length;
    $('#privacy').closest('.check').style.display = humans > 1 ? '' : 'none';
  }

  document.querySelectorAll('#player-count button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#player-count button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      count = +b.dataset.n;
      drawSeats();
    });
  });

  /* The map picker. Built from the MAPS registry (js/maps.js) rather than
     hardcoded here, so a third map only ever needs adding to that registry. */
  function drawMapChoice() {
    const sel = $('#map-choice');
    sel.innerHTML = Object.keys(MAPS).map(id =>
      `<option value="${id}" ${id === ACTIVE_MAP ? 'selected' : ''}>${MAPS[id].name}</option>`).join('');
    $('#map-blurb').textContent = MAPS[sel.value].blurb;
  }
  $('#map-choice').addEventListener('change', () => {
    $('#map-blurb').textContent = MAPS[$('#map-choice').value].blurb;
  });
  drawMapChoice();

  $('#setup-howto').addEventListener('click', () => UI.openMenu());

  document.querySelectorAll('#assault-limit button').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#assault-limit button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      SETTINGS.assaultLimit = +b.dataset.lim;
    });
  });

  $('#start').addEventListener('click', () => {
    UI.privacy = $('#privacy').checked;
    SETTINGS.skipReactions = $('#skip-reactions').checked;
    AI.seats = {};
    AI.delay = SPEEDS[speedIdx].ms;
    seats.slice(0, count).forEach((s, i) => { if (s.type === 'ai') AI.seats[i] = s.ai; });

    activateMap($('#map-choice').value);
    Rules.newGame(seats.slice(0, count).map((s, i) => ({ name: NAMES[i], patron: s.patron })));

    $('#setup').classList.add('hidden');
    $('#game').classList.remove('hidden');
    UI.fx.reset();
    /* Speed used to be its own button in the top bar. The bar is now one
       nowrap row with no spare width, so the control moved into the
       how-to-play sheet and the state moved onto UI, which is what draws it. */
    UI.speedCtl = {
      name()  { return SPEEDS[speedIdx].name; },
      cycle() {
        speedIdx = (speedIdx + 1) % SPEEDS.length;
        AI.delay = SPEEDS[speedIdx].ms;
        return SPEEDS[speedIdx].name;
      }
    };
    UI.render();
    if ($('#show-tutorial').checked) UI.openTutorial(0);
  });

  drawSeats();
})();

</script>
