<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apotheosis — prototype</title>
<style>
/* ============================================================
   APOTHEOSIS — prototype styles
   Palette carried over from the design document:
   temple-shadow indigo ground, warm ash ink, bronze + verdigris.
   ============================================================ */

:root {
  /* Type scale — a fixed ladder so panels, dialogs and labels stop each
     inventing their own sizes. */
  --t-micro: .66rem;   /* mono labels, eyebrows */
  --t-small: .78rem;   /* secondary text, rules */
  --t-body:  .88rem;   /* default reading size */
  --t-lead:  1.02rem;  /* emphasised body */
  --t-h3:    1.2rem;
  --t-h2:    1.55rem;
  --t-h1:    2.1rem;

  --ground:      #12141c;
  --surface:     #1a1d27;
  --surface-2:   #222634;
  --surface-3:   #2b3040;
  --line:        #2f3444;
  --line-soft:   #262a38;

  --ink:         #e7e4dc;
  --ink-mid:     #a3a2b0;
  --ink-dim:     #74737f;

  --bronze:      #c98f47;
  --bronze-dim:  #8c6330;
  --verdigris:   #67a89a;
  --verd-dim:    #3d6a61;
  --blood:       #b0534f;

  --neutral-fill: #343948;

  --f-display: "Sitka Display", "Sitka Heading", Constantia, "Palatino Linotype", Georgia, serif;
  --f-body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --f-mono: Consolas, "SF Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  overflow: hidden;
}

button { font-family: inherit; font-size: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--verdigris); outline-offset: 2px; }

.hidden { display: none !important; }
.screen { height: 100%; }

.eyebrow {
  font-family: var(--f-mono); font-size: .7rem; letter-spacing: .22em;
  text-transform: uppercase; color: var(--verdigris);
}

/* ---------------- buttons ---------------- */

.primary, .ghost, .danger {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  padding: .5rem .9rem;
  border-radius: 2px;
  transition: background .12s, border-color .12s;
}
.primary { border-color: var(--bronze-dim); background: color-mix(in srgb, var(--bronze) 18%, var(--surface-2)); }
.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--bronze) 30%, var(--surface-2)); }
.ghost:hover:not(:disabled) { background: var(--surface-3); border-color: var(--verd-dim); }
.danger { border-color: var(--blood); color: #e8b6b4; }
.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--blood) 25%, var(--surface-2)); }
.primary:disabled, .ghost:disabled, .danger:disabled { opacity: .38; cursor: not-allowed; }
.small { padding: .32rem .6rem; font-size: .8rem; }
.big { padding: .8rem 1.4rem; font-size: 1.05rem; width: 100%; margin-top: 1.4rem; }

/* ---------------- setup ---------------- */

#setup {
  display: grid; place-items: center; padding: 2rem 1rem; overflow-y: auto;
  background:
    radial-gradient(120% 80% at 50% -10%, color-mix(in srgb, var(--bronze) 13%, transparent), transparent 60%),
    var(--ground);
}
.setup-card {
  width: min(46rem, 100%);
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 2.4rem 2.2rem 2.2rem;
}
.setup-card h1 {
  font-family: var(--f-display); font-size: clamp(2.6rem, 7vw, 4.2rem);
  letter-spacing: .05em; margin: .5rem 0 .6rem; font-weight: 600; line-height: 1;
}
.setup-blurb { color: var(--ink-mid); margin: 0 0 2rem; max-width: 34rem; font-family: var(--f-display); font-size: 1.05rem; }
.setup-row { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.6rem; }
.setup-label {
  font-family: var(--f-mono); font-size: .7rem; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-dim); width: 6rem;
}
.seg { display: flex; border: 1px solid var(--line); }
.seg button { background: var(--surface-2); color: var(--ink-mid); border: none; padding: .45rem 1rem; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: none; }
.seg button.on { background: color-mix(in srgb, var(--bronze) 24%, var(--surface-2)); color: var(--ink); }

.pick {
  display: grid; grid-template-columns: 1.5rem 9rem 1fr; gap: 1rem;
  align-items: center; padding: .75rem 0; border-top: 1px solid var(--line-soft);
}
.swatch { width: 1.05rem; height: 1.05rem; border-radius: 50%; }
.pick-name { font-weight: 650; }
.patron-seg { display: flex; gap: .5rem; flex-wrap: wrap; }
.patron-opt {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-mid);
  padding: .4rem .7rem; border-radius: 2px; text-align: left; line-height: 1.25;
}
.patron-opt.on { border-color: var(--bronze); background: color-mix(in srgb, var(--bronze) 16%, var(--surface-2)); color: var(--ink); }
.patron-opt small { display: block; font-size: .72rem; color: var(--ink-dim); }
.patron-opt.on small { color: var(--ink-mid); }

.check { display: flex; align-items: center; gap: .6rem; margin-top: 1.6rem; color: var(--ink-mid); font-size: .9rem; }
.check input { accent-color: var(--bronze); width: 1rem; height: 1rem; }

/* ---------------- top bar ---------------- */

#game { display: grid; grid-template-rows: auto 1fr; height: 100%; }

#topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .55rem 1rem; border-bottom: 1px solid var(--line); background: var(--surface);
}
.tb-left { display: flex; align-items: baseline; gap: 1rem; }
.tb-title { font-family: var(--f-display); font-size: 1.1rem; letter-spacing: .14em; }
.tb-round { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.tb-players { display: flex; gap: .4rem; flex-wrap: wrap; }
.tb-p {
  display: flex; align-items: center; gap: .45rem;
  border: 1px solid var(--line); background: var(--surface-2);
  padding: .25rem .6rem; border-radius: 2px; font-size: .8rem;
}
.tb-p.active { border-color: var(--bronze); background: color-mix(in srgb, var(--bronze) 14%, var(--surface-2)); }
.tb-p.out { opacity: .4; text-decoration: line-through; }
.tb-p .dot { width: .6rem; height: .6rem; border-radius: 50%; }
.tb-p .st { font-family: var(--f-mono); color: var(--ink-dim); font-size: .74rem; }
.ai-tag {
  font-family: var(--f-mono); font-size: .6rem; letter-spacing: .1em; text-transform: uppercase;
  border: 1px solid var(--verd-dim); color: var(--verdigris);
  padding: .04rem .3rem; border-radius: 2px;
}
.tb-right { display: flex; gap: .4rem; }
.seat-type button { padding: .38rem .7rem; font-size: .82rem; }
.pick { grid-template-columns: 1.5rem 7.5rem auto 1fr; }
.pick-name small { display: block; font-size: .72rem; color: var(--ink-dim); font-weight: 400; }
.pick .patron-seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .4rem; }

/* ---------------- board ---------------- */

#board { display: grid; grid-template-columns: 1fr 22rem; min-height: 0; }
#map-pane { display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0; }
#map-wrap { min-height: 0; padding: .6rem; display: grid; place-items: center; }
#map { width: 100%; height: 100%; max-height: 100%; }

#phase-strip {
  border-top: 1px solid var(--line); background: var(--surface);
  padding: .55rem 1rem; display: flex; align-items: center; gap: 1rem;
  font-size: .88rem; min-height: 3rem;
}
.phase-tag {
  font-family: var(--f-mono); font-size: .68rem; letter-spacing: .16em;
  text-transform: uppercase; padding: .22rem .55rem; border: 1px solid var(--bronze-dim);
  color: var(--bronze); border-radius: 2px; white-space: nowrap;
}
.phase-tag.reaction { border-color: var(--verd-dim); color: var(--verdigris); }
.phase-hint { color: var(--ink-mid); }
.domains { margin-left: auto; display: flex; gap: .85rem; flex-wrap: wrap; }
.dm {
  display: inline-flex; align-items: center; gap: .35rem;
  font-family: var(--f-mono); font-size: .66rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-dim);
}
.dm i { width: .55rem; height: .55rem; border-radius: 1px; display: inline-block; opacity: .75; }
.dm.done { color: var(--ink-mid); }
.dm em { font-style: normal; }

/* ---------------- map graphics ---------------- */

.region { cursor: pointer; }
.region .fill { stroke: #0d0f16; stroke-width: 1.6; transition: fill .18s, opacity .18s; }
.region:hover .fill { filter: brightness(1.22) saturate(1.1); }
.region .rim { pointer-events: none; transition: stroke-opacity .15s; }
.region:hover .rim { stroke-opacity: .95; }

/* Selection and legal targets are glows rather than dashed outlines — a
   dashed stroke disappeared against the busier territory art. */
.region.selected .fill { stroke: var(--bronze); stroke-width: 2.6; filter: url(#selGlow); }
.region.selected .rim  { stroke-opacity: 1; }
.region.target .fill   { stroke: var(--verdigris); stroke-width: 2.2; filter: url(#tgtGlow); }
.region.dim            { opacity: .28; }
.region.dim .fill      { filter: saturate(.3); }
.region .grain         { pointer-events: none; mix-blend-mode: overlay; }

/* Whose ground it is, and whether you can act on it, without recolouring
   the fill — the rim carries ownership, these carry state. */
.region.mine .rim      { stroke-opacity: .7; }
.region.actionable .rim{ stroke-opacity: .9; stroke-width: 3; }
.region.foe .rim       { stroke-dasharray: none; }
.region.open .fill     { stroke: #2a3040; stroke-width: 1.4; }
.region.restive .fill  { stroke: var(--blood); stroke-opacity: .8; stroke-width: 2; }
.domain-edge { pointer-events: none; }

.region-name {
  font-family: var(--f-display); font-size: 13.5px; font-weight: 600;
  letter-spacing: .02em;
  fill: #f4f1ea; paint-order: stroke; stroke: rgba(5,6,10,.92); stroke-width: 3.4px;
  pointer-events: none; text-anchor: middle;
}
.glyph { pointer-events: none; }
.troop { pointer-events: auto; cursor: help; }
.troop-n {
  font-family: var(--f-mono); font-size: 12px; font-weight: 700; fill: #f4f1ea;
  text-anchor: middle; paint-order: stroke; stroke: rgba(6,8,13,.9); stroke-width: 2.6px;
}
.def-flag { pointer-events: none; }
.def-n { font-family: var(--f-mono); font-size: 9.5px; font-weight: 700; fill: var(--verdigris); text-anchor: middle; }
.host-badge { pointer-events: none; }
.host-badge rect { fill: rgba(8,10,16,.86); stroke: rgba(240,236,226,.35); stroke-width: 1; }
.host-badge text { font-family: var(--f-mono); font-size: 11px; font-weight: 700; fill: #f2efe8; text-anchor: middle; }
.holding-mark { pointer-events: auto; cursor: help; }
.champion-mark { pointer-events: auto; cursor: help; }
.domain-label {
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .18em;
  text-transform: uppercase; fill: rgba(231,228,220,.34); pointer-events: none; text-anchor: middle;
}

/* ---------------- sidebar ---------------- */

#side {
  border-left: 1px solid var(--line); background: var(--surface);
  display: grid; grid-template-rows: auto auto auto auto 1fr; min-height: 0; overflow: hidden;
}
.panel { padding: .8rem .9rem; border-bottom: 1px solid var(--line-soft); min-width: 0; }
.panel h3 {
  font-family: var(--f-mono); font-size: var(--t-micro); letter-spacing: .18em;
  text-transform: uppercase; color: var(--ink-dim); margin: 0 0 .65rem;
  padding-bottom: .35rem; border-bottom: 1px solid var(--line-soft);
}

.you-head { display: flex; align-items: center; gap: .55rem; margin-bottom: .6rem; }
.you-head .dot { width: .8rem; height: .8rem; border-radius: 50%; }
.you-name { font-weight: 700; }
.you-patron { font-size: .8rem; color: var(--ink-mid); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-bottom: .6rem; }
.stat { background: var(--surface-2); border: 1px solid var(--line-soft); padding: .4rem .5rem; }
.stat .k { font-family: var(--f-mono); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.stat .v { font-family: var(--f-mono); font-size: 1.15rem; font-variant-numeric: tabular-nums; color: var(--ink); }
.stat .v small { font-size: .68rem; color: var(--ink-dim); }

.xpbar { height: 5px; background: var(--surface-3); margin-bottom: .5rem; }
.xpbar span { display: block; height: 100%; background: var(--bronze); }
.boonlist { display: flex; flex-wrap: wrap; gap: .3rem; }
.boon-chip {
  font-size: .72rem; border: 1px solid var(--verd-dim); color: var(--verdigris);
  padding: .12rem .42rem; border-radius: 2px;
}

.sel-title { font-family: var(--f-display); font-size: 1.15rem; margin: 0 0 .15rem; }
.sel-sub { font-size: .8rem; color: var(--ink-mid); margin: 0 0 .5rem; }
.sel-note { font-size: .78rem; color: var(--ink-dim); margin: .35rem 0 0; }
.raise-here { display: flex; gap: .5rem; margin-top: .4rem; font-size: .78rem; align-items: baseline; }
.rh-k {
  font-family: var(--f-mono); font-size: .6rem; letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-dim); white-space: nowrap; min-width: 5.4rem;
}
.rh-v { color: var(--ink-mid); line-height: 1.35; }
.champ-check { margin: .2rem 0 .6rem; align-items: flex-start; }
.champ-check.disabled { opacity: .5; }
.champ-check b { color: var(--bronze); }
.hostlist { display: flex; flex-direction: column; gap: .22rem; margin: .5rem 0 0; }
.hostrow { display: flex; justify-content: space-between; font-size: .82rem; }
.hostrow .n { font-family: var(--f-mono); color: var(--bronze); }

.actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
.actions-grid .wide { grid-column: 1 / -1; }
.hintline { font-size: .78rem; color: var(--ink-dim); margin-top: .5rem; }

.log { overflow-y: auto; }
.log-entry {
  font-size: .8rem; line-height: 1.45; padding: .28rem 0;
  border-bottom: 1px solid var(--line-soft); color: var(--ink-mid);
  display: grid; grid-template-columns: .35rem 1fr; gap: .5rem; align-items: start;
}
.log-entry .bar { width: 3px; height: 100%; min-height: .9rem; background: transparent; border-radius: 2px; }
.log-entry.k-round, .log-entry.k-victory { color: var(--bronze); font-weight: 650; }
.log-entry.k-level, .log-entry.k-boon, .log-entry.k-apotheosis { color: var(--verdigris); }
.log-entry.k-capture, .log-entry.k-fallen, .log-entry.k-champion { color: #e0b0ad; }

/* ---------------- modals ---------------- */

#modal-layer, #pass-layer {
  position: fixed; inset: 0; background: rgba(8,10,16,.78);
  display: grid; place-items: center; padding: 1.5rem; z-index: 40;
  backdrop-filter: blur(2px);
}
#modal, #pass-card {
  width: min(38rem, 100%); max-height: 88vh; overflow-y: auto;
  background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 22%);
  border: 1px solid var(--line);
  border-top: 2px solid var(--bronze-dim);
  border-radius: 3px;
  padding: 1.5rem 1.7rem 1.6rem;
  box-shadow: 0 24px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4);
}
#modal .eyebrow, #pass-card .eyebrow { margin-bottom: .35rem; }
#modal h2, #pass-card h2 { letter-spacing: .01em; }
#modal > p:first-of-type { font-size: var(--t-body); }
#modal hr {
  border: none; border-top: 1px solid var(--line-soft); margin: 1.1rem 0;
}
#modal h2, #pass-card h2 {
  font-family: var(--f-display); font-size: var(--t-h2); margin: .2rem 0 .55rem;
  font-weight: 600; line-height: 1.2;
}
#modal p { color: var(--ink-mid); margin: 0 0 .9rem; }
.modal-actions {
  display: flex; gap: .6rem; justify-content: flex-end; flex-wrap: wrap;
  margin-top: 1.4rem; padding-top: 1.1rem; border-top: 1px solid var(--line-soft);
}
.modal-actions .primary { min-width: 8rem; justify-content: center; }

/* unit steppers */
.stepper-list { display: flex; flex-direction: column; gap: .4rem; margin: .8rem 0; }
.stepper {
  display: grid; grid-template-columns: 1fr auto auto auto; gap: .6rem; align-items: center;
  background: var(--surface-2); border: 1px solid var(--line-soft); padding: .45rem .6rem;
}
.stepper .nm { font-weight: 620; }
.stepper .nm small { display: block; font-size: .72rem; color: var(--ink-dim); font-weight: 400; }
.stepper .ct { font-family: var(--f-mono); font-size: 1rem; min-width: 3.2rem; text-align: center; color: var(--bronze); }
.stepper button { width: 1.9rem; height: 1.9rem; padding: 0; background: var(--surface-3); border: 1px solid var(--line); color: var(--ink); }
.stepper button:disabled { opacity: .3; }

/* tooltips — a single floating element positioned in JS.
   The old ::after bubbles were clipped by the sidebar's overflow, which made
   the troop-key descriptions unreadable. */
[data-tip] { cursor: help; }
#tip {
  position: fixed; z-index: 999; max-width: 20rem;
  background: var(--surface-3); color: var(--ink);
  border: 1px solid var(--bronze-dim); border-radius: 3px;
  padding: .55rem .7rem; font-family: var(--f-body); font-size: .8rem;
  line-height: 1.45; letter-spacing: 0; text-transform: none; font-weight: 400;
  box-shadow: 0 8px 24px rgba(0,0,0,.6); pointer-events: none;
  opacity: 0; transition: opacity .1s;
}
#tip.on { opacity: 1; }
#tip b { color: var(--bronze); }

/* hint bar */
#hintbar {
  border-top: 1px solid var(--line); background: var(--surface-2);
  padding: .5rem 1rem; display: flex; align-items: center; gap: .75rem;
  font-size: .84rem; color: var(--ink-mid); min-height: 2.5rem;
}
#hintbar .hb-icon {
  font-family: var(--f-mono); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--verdigris); border: 1px solid var(--verd-dim); padding: .16rem .45rem;
  border-radius: 2px; white-space: nowrap;
}
#hintbar b { color: var(--ink); font-weight: 620; }
#hintbar .hb-dismiss { margin-left: auto; }

/* tutorial */
.tut-step { display: flex; gap: .5rem; align-items: center; margin-bottom: .9rem; }
.tut-dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--surface-3); }
.tut-dot.on { background: var(--bronze); }
.tut-body { color: var(--ink-mid); line-height: 1.6; }
.tut-body b { color: var(--ink); }
.tut-body ul { margin: .6rem 0 0; padding-left: 1.1rem; }
.tut-body li { margin-bottom: .35rem; }

/* sliders */
.slider-row {
  display: grid; grid-template-columns: 11rem 1fr 4.5rem; gap: .8rem; align-items: center;
  background: var(--surface-2); border: 1px solid var(--line-soft); padding: .5rem .7rem;
}
.slider-row .nm { font-weight: 620; font-size: .9rem; }
.slider-row .nm small { display: block; font-size: .71rem; color: var(--ink-dim); font-weight: 400; line-height: 1.3; }
.slider-row .ct { font-family: var(--f-mono); font-size: .85rem; text-align: right; color: var(--ink-dim); }
.slider-row .ct b { color: var(--bronze); font-size: 1.05rem; }
.slider-row input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
  background: var(--surface-3); border-radius: 2px; outline: none;
}
.slider-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 1.05rem; height: 1.05rem;
  border-radius: 50%; background: var(--bronze); cursor: pointer; border: 2px solid var(--ground);
}
.slider-row input[type=range]::-moz-range-thumb {
  width: 1.05rem; height: 1.05rem; border-radius: 50%; background: var(--bronze);
  cursor: pointer; border: 2px solid var(--ground);
}
.quick-row { display: flex; gap: .4rem; flex-wrap: wrap; margin: .9rem 0 .2rem; }

/* cost breakdown */
.costcalc {
  font-family: var(--f-mono); font-size: .78rem; color: var(--ink-dim);
  background: var(--surface-2); border: 1px solid var(--line-soft);
  padding: .5rem .7rem; margin: .6rem 0;
}
.costcalc b { color: var(--bronze); }
.costcalc .minus { color: var(--verdigris); }

/* dice */
.dice-row { display: flex; align-items: center; gap: .8rem; margin: .5rem 0; flex-wrap: wrap; }
.dice-label { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); width: 5rem; }
.die {
  width: 2.1rem; height: 2.1rem; display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface-2);
  font-family: var(--f-mono); font-size: 1.05rem; font-weight: 700;
}
.die.win { border-color: var(--verdigris); color: var(--verdigris); }
.die.lose { border-color: var(--blood); color: #e0a09d; opacity: .75; }
.die.boosted { border-color: var(--bronze); color: var(--bronze); }
.notes { font-size: .78rem; color: var(--ink-dim); margin-top: .3rem; }
.tally { display: flex; gap: 1.4rem; margin-top: 1rem; font-size: .88rem; }
.tally b { font-family: var(--f-mono); color: var(--bronze); }

/* build preview */
.build-preview { border: 1px solid var(--line-soft); background: var(--surface-2); padding: .5rem .6rem; margin-top: .4rem; }
.bp-head { font-family: var(--f-mono); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--verdigris); margin-bottom: .35rem; }
.bp-row { display: grid; grid-template-columns: 1fr auto; gap: .2rem .5rem; font-size: .78rem; color: var(--ink-mid); align-items: baseline; }
.bp-row b { font-family: var(--f-mono); color: var(--bronze); font-weight: 600; }
.bp-row em { grid-column: 1 / -1; font-style: normal; font-size: .7rem; color: var(--ink-dim); margin-bottom: .25rem; }

/* forecast */
.forecast { border: 1px solid var(--line); background: var(--surface-2); padding: .75rem .85rem; margin: .9rem 0; }
.forecast.good { border-left: 3px solid var(--verdigris); }
.forecast.even { border-left: 3px solid var(--bronze); }
.forecast.bad  { border-left: 3px solid var(--blood); }
.fc-head {
  display: flex; align-items: baseline; gap: .55rem; margin-bottom: .6rem;
  font-family: var(--f-mono); font-size: .68rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-dim);
}
.fc-head b { font-size: 1.5rem; letter-spacing: 0; color: var(--ink); }
.forecast.good .fc-head b { color: var(--verdigris); }
.forecast.bad .fc-head b { color: #e0a09d; }
.fc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .55rem .9rem; }
.fc-grid > div { display: flex; flex-direction: column; gap: .1rem; }
.fc-k { font-family: var(--f-mono); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.fc-v { font-family: var(--f-mono); font-size: .95rem; color: var(--bronze); }
.fc-n { font-size: .72rem; color: var(--ink-dim); line-height: 1.3; }

/* level-up choice */
.choice-cols { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; margin: 1rem 0; }
.choice-col { display: flex; flex-direction: column; gap: .5rem; }
.choice-head {
  font-family: var(--f-mono); font-size: .62rem; letter-spacing: .16em;
  text-transform: uppercase; padding-bottom: .3rem; border-bottom: 1px solid var(--line);
}
.choice-head.bless { color: var(--bronze); }
.choice-head.perk { color: var(--verdigris); }
.boon-card.bless:hover { border-color: var(--bronze); }
.boon-card.perk:hover { border-color: var(--verdigris); }
.tier-unlock {
  border: 1px dashed var(--verd-dim); background: color-mix(in srgb, var(--verdigris) 8%, transparent);
  padding: .5rem .7rem; font-size: .85rem; color: var(--ink-mid); margin-bottom: .3rem;
}
.tier-unlock b { color: var(--verdigris); }
@media (max-width: 34rem) { .choice-cols { grid-template-columns: 1fr; } }

/* boon cards */
.boon-grid { display: grid; gap: .55rem; margin: 1rem 0; }
.boon-card {
  text-align: left; border: 1px solid var(--line); background: var(--surface-2);
  padding: .75rem .85rem; color: var(--ink); border-radius: 2px;
}
.boon-card:hover { border-color: var(--verdigris); background: var(--surface-3); }
.boon-card b { display: block; margin-bottom: .2rem; }
.boon-card span { color: var(--ink-mid); font-size: .87rem; }

/* toll clock */
.clock {
  font-family: var(--f-mono); font-size: 2.6rem; text-align: center;
  color: var(--bronze); font-variant-numeric: tabular-nums; margin: .6rem 0;
}
.clock.urgent { color: var(--blood); }

/* pass screen */
#pass-card { text-align: center; width: min(28rem, 100%); }
#pass-card .dot { width: 2.4rem; height: 2.4rem; border-radius: 50%; margin: 0 auto 1rem; }

/* scoreboard */
.score-table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: .9rem; }
.score-table th, .score-table td { padding: .5rem .6rem; text-align: left; border-bottom: 1px solid var(--line-soft); }
.score-table th { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.score-table td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.score-table tr.win td { color: var(--bronze); font-weight: 650; }

/* reference */
.ref-grid { display: grid; gap: .5rem; margin-top: .8rem; }
.ref-item { border-left: 2px solid var(--verd-dim); padding: .1rem 0 .1rem .7rem; }
.ref-item b { display: block; }
.ref-item span { font-size: .86rem; color: var(--ink-mid); }
.ref-item i { font-style: normal; font-family: var(--f-mono); font-size: .78rem; color: var(--bronze); }

@media (max-width: 1100px) {
  #board { grid-template-columns: 1fr 18rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* troop key */
.key-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.6rem, 1fr)); gap: .25rem .5rem; }
.key-item { display: flex; align-items: center; gap: .35rem; font-size: .76rem; color: var(--ink-mid); cursor: help; }
.key-item.foreign { opacity: .58; }
.key-svg { flex: 0 0 auto; }
.key-nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.key-ct { font-family: var(--f-mono); font-size: .68rem; color: var(--bronze); }
.key-item.foreign .key-ct { color: var(--ink-dim); }

/* raise dialog */
.raise-row { grid-template-columns: 13rem 1fr 4.2rem; }
.raise-row.blocked { opacity: .45; }
.rn-title { display: flex; align-items: center; gap: .3rem; }
.rn-have { font-style: normal; font-size: .68rem; color: var(--ink-dim); margin-left: auto; }
.rn-sub { display: block; font-family: var(--f-mono); font-size: .66rem; color: var(--ink-dim); }
.troop-chip { vertical-align: -2px; }

/* combat: compact, off to the side, with live orders of battle */
#modal.combat { width: min(30rem, 100%); margin-left: auto; margin-right: 2rem; }
.ob { display: grid; grid-template-columns: 1fr auto 1fr; gap: .6rem; align-items: start; margin: .7rem 0; }
.ob-side { display: flex; flex-direction: column; gap: .3rem; }
.ob-side.def { align-items: flex-end; }
.ob-name { font-family: var(--f-mono); font-size: .62rem; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-dim); }
.ob-unit { display: flex; align-items: center; gap: .3rem; font-size: .78rem; color: var(--ink-mid); }
.ob-side.def .ob-unit { flex-direction: row-reverse; }
.ob-unit b { font-family: var(--f-mono); color: var(--ink); }
.ob-vs { font-family: var(--f-display); color: var(--ink-dim); align-self: center; }
.ob-total { font-family: var(--f-mono); font-size: 1.3rem; color: var(--bronze); }

/* claimed Blessings and Champion Perks — a running record you can re-read
   later in the match, which is when you have forgotten what you took */
.owned { margin-top: .6rem; border-top: 1px solid var(--line-soft); padding-top: .5rem; }
.owned-h {
  font-family: var(--f-mono); font-size: .6rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-dim); margin-bottom: .35rem;
}
.boon-chip.perk { border-color: var(--bronze-dim); color: var(--bronze); }
.champion-mark, .holding-hit { cursor: help; }

/* ---------------- typography pass ---------------- */

.sel-title { font-family: var(--f-display); font-size: var(--t-h3); letter-spacing: .01em; }
.sel-sub   { font-size: var(--t-small); }
.sel-note  { font-size: var(--t-small); line-height: 1.5; }
.hintline  { font-size: var(--t-small); line-height: 1.5; }
.you-name  { font-size: var(--t-lead); letter-spacing: .01em; }
.you-patron{ font-size: var(--t-small); line-height: 1.5; }
.stat .k   { font-size: var(--t-micro); }
.stat .v   { font-size: 1.22rem; }
.log-entry { font-size: var(--t-small); }
#hintbar   { font-size: var(--t-body); }
.boon-chip { font-size: var(--t-small); padding: .16rem .48rem; }
.key-item  { font-size: var(--t-small); }
.slider-row .nm { font-size: var(--t-body); }
.slider-row .nm small { font-size: var(--t-small); }

/* numbers that sit in columns should line up */
.stat .v, .ct, .tally b, .score-table td.n, .tb-p .st { font-variant-numeric: tabular-nums; }


/* ---------------- map layers that the renderer emits ----------------
   These were being drawn with no stylesheet rule at all. The worst was
   .relief: the terrain motifs are authored in bone white and were only
   knocked back to 11% opacity inside tools/map-preview.js — so the exported
   preview looked right while the actual game drew them at FULL white. Every
   preview shared during development was therefore prettier than the board.
   Styling now lives here, where both the game and the preview read it. */
.relief      { opacity: .11; pointer-events: none; }
.carve       { pointer-events: none; }
.unrest-mark { pointer-events: auto; cursor: help; }
.world-light { pointer-events: none; }
.land-tex { pointer-events: none; }
.region-content { pointer-events: none; }
.region-content .troop,
.region-content .holding-mark,
.region-content .champion-mark,
.region-content .unrest-mark,
.region-content .def-flag { pointer-events: auto; }

/* ============================================================
   PHONE LAYOUT

   Below 900px the side-by-side board/sidebar grid cannot work: at 375px the
   sidebar sat at x316-586, entirely off the right edge, taking the stats,
   the action buttons and End Turn with it. The map fills the screen instead
   and the panels become a bottom sheet.
   ============================================================ */

/* the grab handle exists only on phones — declared BEFORE the media query so
   the query wins. Declared after, it silently overrode it on source order and
   the handle never appeared. */
#sheet-handle { display: none; }

@media (max-width: 900px) {
  html, body { overflow: hidden; }
  #sheet-handle { display: flex; }

  #board {
    grid-template-columns: 1fr;      /* one column, never two */
    grid-template-rows: 1fr;
    position: relative;
  }

  #map-pane { grid-row: 1; min-height: 0; }
  #map-wrap { padding: .3rem; }

  /* the sheet: docked to the bottom, slides up when there is something to
     act on, and never covers more than half the board */
  #side {
    position: absolute; left: 0; right: 0; bottom: 0;
    width: auto; max-height: 58vh;
    grid-template-rows: auto auto auto auto 1fr;
    border-left: none;
    border-top: 1px solid var(--bronze-dim);
    border-radius: 12px 12px 0 0;
    box-shadow: 0 -14px 34px rgba(0,0,0,.6);
    transform: translateY(calc(100% - 3.1rem));
    transition: transform .22s ease;
    overflow: hidden;
    z-index: 20;
  }
  #side.open { transform: translateY(0); overflow-y: auto; }

  /* the grab handle is always visible, and is what you tap to open or close */
  #sheet-handle {
    display: flex; align-items: center; gap: .6rem;
    padding: .55rem .9rem; cursor: pointer;
    background: var(--surface-2); border-bottom: 1px solid var(--line-soft);
    font-family: var(--f-mono); font-size: var(--t-micro);
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-mid);
    position: sticky; top: 0; z-index: 2;
  }
  #sheet-handle .grip {
    width: 2.2rem; height: .25rem; border-radius: 2px;
    background: var(--ink-dim); flex: 0 0 auto;
  }
  #sheet-handle .lbl { flex: 1; }
  #sheet-handle .chev { color: var(--bronze); transition: transform .22s; }
  #side.open #sheet-handle .chev { transform: rotate(180deg); }

  /* the map keeps a strip of clear space so the collapsed sheet never sits
     on top of the southern territories */
  #map-pane { padding-bottom: 3.1rem; }

  #phase-strip { padding: .4rem .6rem; gap: .5rem; font-size: var(--t-small); }
  #phase-strip .domains { display: none; }   /* legend is desktop-only */
  #hintbar { padding: .4rem .6rem; font-size: var(--t-small); }

  #topbar { padding: .4rem .6rem; flex-wrap: wrap; gap: .4rem; }
  .tb-title { font-size: .95rem; }
  .tb-round { font-size: .66rem; }
  .tb-p { font-size: .72rem; padding: .2rem .4rem; }
  .tb-right .ghost { padding: .3rem .5rem; font-size: .72rem; }

  /* thumb-sized controls */
  .actions-grid { grid-template-columns: 1fr 1fr; gap: .4rem; }
  /* Explicit px, not rem: the root font here is 15px, so 2.85rem computed to
     42.75px and quietly landed under the 44px touch minimum. Touch targets are
     a physical measurement — state them physically. */
  #actions button { min-height: 46px; }
  .slider-row input[type=range] { height: 8px; }
  .slider-row input[type=range]::-webkit-slider-thumb { width: 1.6rem; height: 1.6rem; }
  .slider-row input[type=range]::-moz-range-thumb { width: 1.6rem; height: 1.6rem; }

  /* dialogs use the full screen rather than a centred card */
  #modal-layer, #pass-layer { padding: 0; align-items: flex-end; }
  #modal, #pass-card {
    width: 100%; max-width: none; max-height: 92vh;
    border-radius: 12px 12px 0 0; padding: 1.1rem 1rem 1.3rem;
  }
  #modal.combat { margin: 0; width: 100%; }
  .modal-actions { position: sticky; bottom: 0; background: var(--surface);
                   padding-bottom: .2rem; }
  .modal-actions button { flex: 1; min-height: 3rem; }
  .slider-row { grid-template-columns: 8.5rem 1fr 3.4rem; }
  .raise-row  { grid-template-columns: 8.5rem 1fr 3.4rem; }
  .key-grid { grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); }
}

/* Touch has no hover, and the tooltips carry the rules. On a touch device
   they become tap targets instead. */
@media (hover: none) {
  [data-tip] { cursor: pointer; }
  #tip { max-width: min(20rem, calc(100vw - 1.5rem)); }
}

/* ---- phone: give the board its screen back ----
   Chrome was 269px of 812 (33%) before the map got a pixel: a top bar that
   wrapped onto four rows, plus a phase strip and a hint bar saying overlapping
   things. Target is ~11%. */

@media (max-width: 900px) {
  #topbar {
    flex-wrap: nowrap;             /* one row, never four */
    gap: .5rem;
    padding: .3rem .5rem;
    min-height: 0;
  }
  .tb-title { display: none; }     /* you know what game you are in */
  .tb-left  { gap: .4rem; flex: 0 0 auto; }
  .tb-round { font-size: .62rem; letter-spacing: .06em; white-space: nowrap; }

  .tb-players { flex: 1 1 auto; flex-wrap: nowrap; gap: .25rem; justify-content: center; }
  .tb-p {
    padding: .15rem .35rem; gap: .25rem; font-size: .7rem;
    border-radius: 10px;
  }
  .tb-p .dot { width: .5rem; height: .5rem; }
  .tb-p .st  { font-size: .72rem; color: var(--ink); font-weight: 700; }
  .tb-p .ai-tag { display: none; }

  .tb-right { flex: 0 0 auto; gap: .25rem; }
  .tb-right .ghost {
    padding: .28rem .4rem; font-size: 0;      /* label hidden, icon remains */
    min-width: 2rem; line-height: 1;
  }
  .tb-right .ghost::after { font-size: .85rem; }
  #btn-speed::after { content: '»'; }
  #btn-help::after  { content: '?'; }
  #btn-rules::after { content: '☰'; }

  /* The phase strip repeated what the hint bar and the sheet handle already
     say, for 45px. The hint bar is the more useful of the two. */
  #phase-strip { display: none; }
  #hintbar { padding: .35rem .6rem; line-height: 1.35; }

  /* The sheet holds only what you act on. The troop key and the chronicle are
     reference and history — both still reachable from the ☰ button — and
     together they were 182px of forced scrolling. */
  #side #troopkey, #side #log { display: none; }
  #side { grid-template-rows: auto auto auto auto; max-height: 56vh; }

  /* a tighter stat block: this alone was 181px */
  #you { padding: .5rem .7rem; }
  #you .stats { gap: .35rem; margin-bottom: .35rem; }
  #you .stat { padding: .25rem .4rem; }
  #you .stat .v { font-size: 1rem; }
  #you .you-head { margin-bottom: .3rem; }
  #you .you-patron { display: none; }        /* shown on tap via the tooltip */
  #you .owned { margin-top: .4rem; padding-top: .35rem; }
  #selection, #actions { padding: .5rem .7rem; }
  .panel h3 { margin-bottom: .4rem; padding-bottom: .25rem; }
}

</style>
</head>
<body>

<!-- ============ setup ============ -->
<div id="setup" class="screen">
  <div class="setup-card">
    <div class="eyebrow">Prototype · v0.1</div>
    <h1>APOTHEOSIS</h1>
    <p class="setup-blurb">Four warlords, one contested world. Take ground, develop it, and become
      someone worth telling stories about.</p>

    <div class="setup-row">
      <label class="setup-label">Warlords</label>
      <div class="seg" id="player-count">
        <button data-n="2">2</button>
        <button data-n="3">3</button>
        <button data-n="4" class="on">4</button>
      </div>
    </div>

    <div id="patron-picks"></div>

    <div class="setup-row" style="margin-top:1.6rem">
      <label class="setup-label">Assaults</label>
      <div class="seg" id="assault-limit">
        <button data-lim="0" class="on">Unlimited</button>
        <button data-lim="3">3 / Round</button>
        <button data-lim="2">2 / Round</button>
      </div>
      <span style="font-size:.8rem;color:var(--ink-dim)">Unlimited is the default — you are still
        limited by needing hosts to garrison what you leave and what you take.</span>
    </div>

    <label class="check">
      <input type="checkbox" id="privacy">
      <span>Hotseat privacy screens between human players</span>
    </label>
    <label class="check">
      <input type="checkbox" id="show-tutorial" checked>
      <span>Show the how-it-works walkthrough</span>
    </label>

    <button id="start" class="primary big">Begin the war</button>
  </div>
</div>

<!-- ============ game ============ -->
<div id="game" class="screen hidden">

  <header id="topbar">
    <div class="tb-left">
      <span class="tb-title">APOTHEOSIS</span>
      <span id="tb-round" class="tb-round"></span>
    </div>
    <div id="tb-players" class="tb-players"></div>
    <div class="tb-right">
      <button id="btn-speed" class="ghost small">Speed: Normal</button>
      <button id="btn-help" class="ghost small">How to play</button>
      <button id="btn-rules" class="ghost small">Reference</button>
    </div>
  </header>

  <main id="board">
    <section id="map-pane">
      <div id="map-wrap"><svg id="map" viewBox="0 0 1340 960" preserveAspectRatio="xMidYMid meet"></svg></div>
      <div id="phase-strip"></div>
      <div id="hintbar"></div>
    </section>

    <aside id="side">
      <div id="sheet-handle">
        <span class="grip"></span>
        <span class="lbl">Your turn</span>
        <span class="chev">▲</span>
      </div>
      <div id="you" class="panel"></div>
      <div id="selection" class="panel"></div>
      <div id="actions" class="panel"></div>
      <div id="troopkey" class="panel"></div>
      <div id="log" class="panel log"></div>
    </aside>
  </main>
</div>

<!-- ============ overlays ============ -->
<div id="modal-layer" class="hidden"><div id="modal"></div></div>
<div id="pass-layer" class="hidden"><div id="pass-card"></div></div>

<script>
/* ===== js/data.js ===== */
/* ============================================================
   APOTHEOSIS — static game data
   Map, region types, units, patrons, boons, progression curves.
   Plain script (no modules) so index.html opens from file://
   ============================================================ */

/* ---------- deterministic PRNG so the map is always the same ---------- */

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- region types ---------- */

const REGION_TYPES = {
  farmland: {
    name: 'Farmland', income: 1, glyph: 'farmland',
    note: 'Holdings cost 2 less here.',
    raises: ['outrider']
  },
  mine: {
    name: 'Mine', income: 2, glyph: 'mine',
    note: 'The only source of Siege.',
    raises: ['siege']
  },
  forge: {
    name: 'Forge', income: 1, glyph: 'forge',
    note: 'Raises heavy infantry.',
    raises: ['phalanx', 'warden']
  },
  port: {
    name: 'Port', income: 1, glyph: 'port',
    note: 'March to any other Port on the map.',
    raises: ['outrider']
  },
  shrine: {
    name: 'Shrine', income: 2, glyph: 'shrine',
    note: 'No Holdings. Pays 3 XP every Turn you hold it.',
    raises: ['zealot'], noHolding: true
  },
  waste: {
    name: 'Waste', income: 0, glyph: 'waste',
    note: 'Produces nothing. Cheap to cross.',
    raises: [], noHolding: true
  },
  throne: {
    name: 'Throne', income: 3, glyph: 'throne',
    note: 'Counts as a tier-1 Holding. Lose it and you are Fallen.',
    raises: []
  }
};

/* ---------- units ----------
   `raisedAt` lists region types where the unit is on-type. Off-type
   raising is allowed anywhere you control, at double cost — the
   escape hatch so nobody can lock a whole strategy off the board.    */

const UNITS = {
  levy: {
    id: 'levy', name: 'Levy', cost: 2, raisedAt: ['*'],
    get rule() { return LEVY_RULES[LEVY_MODE]; },
    flavour: 'Farmhands with spears. Individually worthless.'
  },
  zealot: {
    id: 'zealot', name: 'Zealots', cost: 3, raisedAt: ['shrine'],
    rule: 'Add +1 to your highest die per 3 Renown levels.',
    flavour: 'They believe. That turns out to matter.'
  },
  /* SHIELDWALL — candidate reworks, NOT yet implemented. Parked deliberately
     until the fixed-combat numbers were in; see the notes below before
     picking one.
       a) Only works while the Phalanx is supporting other hosts — a lone
          Phalanx absorbs nothing, so it is a formation unit rather than an
          invincible single piece. Closest to the bug's original intent.
       b) Grants +1 to the defender's highest die instead of negating a
          casualty. Weaker and smoother, but returns Phalanx to being a dice
          modifier, which is the thing that measured as near-inert.
     Current behaviour: absorbs exactly one casualty per battle. */
  phalanx: {
    id: 'phalanx', name: 'Phalanx', cost: 5, raisedAt: ['forge'],
    rule: 'Shieldwall — absorbs the first casualty your side would take in a battle.',
    flavour: 'A wall that eats cavalry.'
  },
  outrider: {
    id: 'outrider', name: 'Outriders', cost: 4, raisedAt: ['port', 'farmland'],
    rule: 'Marches two regions. Poor in a straight fight.',
    flavour: 'Fast, light, and gone before you answer.'
  },

/* ---------- Voronoi by half-plane clipping ----------
   Each cell starts as the whole map and is clipped by the perpendicular
   bisector against every other seed. n is 22, so the O(n^2) cost is
   irrelevant and the result is exact. */

function clipToBisector(poly, a, b) {
  const nx = b.x - a.x, ny = b.y - a.y;
  const c = (b.x * b.x + b.y * b.y - a.x * a.x - a.y * a.y) / 2;
  const side = p => nx * p.x + ny * p.y - c;          // <= 0 means closer to a
  const out = [];
  for (let i = 0; i < poly.length; i++) {
    const P = poly[i], Q = poly[(i + 1) % poly.length];
    const dp = side(P), dq = side(Q);
    if (dp <= 0) out.push(P);
    if ((dp <= 0) !== (dq <= 0)) {
      const t = dp / (dp - dq);
      out.push({ x: P.x + (Q.x - P.x) * t, y: P.y + (Q.y - P.y) * t });
    }

  for (let i = 0; i < pts.length; i++) {
    const prev = pts[(i - 1 + pts.length) % pts.length];
    const cur = pts[i];
    const next = pts[(i + 1) % pts.length];
    out.push({ x: cur.x + (prev.x - cur.x) * amount, y: cur.y + (prev.y - cur.y) * amount });
    out.push({ x: cur.x + (next.x - cur.x) * amount, y: cur.y + (next.y - cur.y) * amount });

   Smoothing each cell on its own is not an option: neighbours share borders,
   and two independently-smoothed copies of the same edge drift apart and
   leave gaps.

   So each shared border is generated ONCE, keyed on its two endpoints, and
   both neighbouring cells reuse the identical curve — one of them walking it
   backwards. The wobble comes from recursive midpoint displacement seeded
   from that same key, so it is deterministic: the map is identical on every
   load, and the two sides of a border can never disagree.                 */

/* ---------- the continent outline ----------

   as a grid of tiles no matter how much the interior borders wobbled: the
   outer boundary was four dead-straight lines. This builds an irregular
   closed coastline instead, and the renderer clips the whole landmass to it.

   shape — so this changes only what you see, never what connects to what. */

/* Convex hull of the seeds, so the coastline can be built around the
   territories that actually sit on the rim. */
function convexHull(points) {
  const p = points.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lower = [];
  for (const q of p) {
    while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], q) <= 0) lower.pop();
    lower.push(q);
  }
  const upper = [];
  for (let i = p.length - 1; i >= 0; i--) {
    const q = p[i];
    while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], q) <= 0) upper.pop();
    upper.push(q);
  }
  upper.pop(); lower.pop();
  return lower.concat(upper);

    return { ok: true, cost: free ? 0 : cp.cost, parts: cp.parts, free };
  },

  buildHolding(pi, regionId) {
    const check = Rules.canBuild(pi, regionId);
    if (!check.ok) return check;
    const p = G.players[pi];
    const rs = G.regions[regionId];
    if (check.free) p.masonUsed = true; else p.tribute -= check.cost;
    rs.holding += 1;
    Rules.log(`${p.name} raises a tier-${rs.holding} Holding at ${REGIONS[regionId].name}.`, 'build', pi);
    Rules.awardXP(pi, XP_AWARDS.holding[rs.holding - 1], `Holding at ${REGIONS[regionId].name}`);
    return { ok: true };
  },

  /* ---------------- movement ---------------- */

  marchRange(pi, unitId) {
    const p = G.players[pi];
    const bonus = Rules.marchBonusFor(pi);
    if (unitId === 'outrider') return (Rules.hasBoon(p, 'swiftruin') ? 3 : 2) + bonus;
    if (unitId === 'stormrider') return 2 + bonus;
    return 1 + bonus;
  },

  /* Regions reachable from `from` for a given stack, with the path taken.

     You may cross your own territory and unclaimed ground, as far as the
     slowest unit in the stack allows, plus Port-to-Port by sea. Enemy ground
     cannot be crossed at all — to get past a rival's territory you must take
     it. (An earlier build let you pay a toll for passage; it was shelved
     because the conditions were so narrow the mechanic never actually fired
     in play.) */
  reachable(pi, from, stack) {
    const ranges = Object.keys(stack).map(u => Rules.marchRange(pi, u));
    const range = ranges.length ? Math.min(...ranges) : 1;
    const out = {};

    /* Repositioning inside your own territory is unlimited in DISTANCE but
       allowed only ONCE per turn, exactly like fortifying in RISK. Letting it
       happen freely meant a player could raise Siege at their one Mine and
       then teleport it anywhere, which made specialist ground pointless. */
    const canFortify = G.phase !== 'turn' || !G.fortifyUsed;
    const ownReach = new Set([from]);
    const queue = canFortify ? [[from, []]] : [];
    while (queue.length) {
      const [at, path] = queue.shift();
      for (const n of REGIONS[at].neighbours) {
        if (ownReach.has(n)) continue;
        if (G.regions[n].owner !== pi) continue;
        const p2 = path.concat([n]);
        ownReach.add(n);
        out[n] = p2;
        queue.push([n, p2]);
      }
    }

    /* Beyond your border you advance only as far as the slowest unit in the
       stack allows — which is what keeps Outriders worth their cost. */
    const step = (at, depth, path) => {
      for (const n of REGIONS[at].neighbours) {
        if (ownReach.has(n)) continue;
        const owner = G.regions[n].owner;
        // your own ground is reached only via the fortify pass above, so a
        // spent fortify genuinely locks repositioning for the rest of the turn
        if (owner === pi) continue;
        const p2 = path.concat([n]);
        if (!out[n] || out[n].length > p2.length) out[n] = p2;
        if (owner === null && depth + 1 < range) step(n, depth + 1, p2);
      }
    };
    for (const own of ownReach) step(own, 0, out[own] || []);

    delete out[from];
    return out;
  },

  moveStack(from, to, stack) {
    const a = G.regions[from], b = G.regions[to];
    for (const u in stack) {
      a.hosts[u] -= stack[u];
      if (a.hosts[u] <= 0) delete a.hosts[u];
      b.hosts[u] = (b.hosts[u] || 0) + stack[u];
    }
  },

  march(pi, from, to, stack, opts) {
    const p = G.players[pi];
    if (G.regions[from].owner !== pi) return { ok: false, why: 'Not your region.' };
    const remaining = Rules.hostCount(G.regions[from]) -
      Object.values(stack).reduce((a, b) => a + b, 0);
    if (remaining < 1) return { ok: false, why: 'You must leave at least one host behind.' };

    const paths = Rules.reachable(pi, from, stack);
    const path = paths[to];
    if (!path) return { ok: false, why: 'Out of march range.' };

    const dest = G.regions[to];
    if (dest.owner !== null && dest.owner !== pi) {
      return { ok: false, why: 'That is an enemy region — attack it instead.' };
    }
    if (dest.owner === pi && G.phase === 'turn') G.fortifyUsed = true;
    Rules.moveStack(from, to, stack);
    if (dest.owner === null) Rules.captureRegion(pi, to);
    /* The Champion only moves when you say so, and only as far as it can
       march — it is a piece you command, not a flag that drifts along behind
       whichever stack happened to leave. */
    if (opts && opts.champion && Rules.championAt(pi, from)) {
      if (path.length <= Rules.championMarchRange(pi)) {
        p.championAt = to;
        Rules.log(`${p.name}'s Champion rides to ${REGIONS[to].name}.`, 'champion', pi);
      }
    }
    Rules.log(`${p.name} marches to ${REGIONS[to].name}.`, 'march', pi);
    return { ok: true };
  },

  /* ---------------- capture, fall, surrender ---------------- */

  captureRegion(pi, regionId) {
    const rs = G.regions[regionId];
    const prev = rs.owner;
    const def = REGIONS[regionId];
    rs.owner = pi;
    const p = G.players[pi];

    if (Rules.hasBoon(p, 'reave')) p.tribute += 2;

    /* Unrest — the brake on runaway conquest. Ground taken off a rival pays
       no Tribute and cannot be developed until you have held it through one
       of your own Turns. Taking five regions in a Round now costs you a Round
       of their income, so a blitz has to be worth more than it earns. */
    if (prev !== null && prev !== pi) rs.unrest = 1;

    Rules.awardXP(pi, prev === null ? XP_AWARDS.captureFree : XP_AWARDS.captureFoe,
      `${REGIONS[regionId].name} taken`);

    if (def.type === 'throne' && prev !== null && prev !== pi) {
      Rules.awardXP(pi, XP_AWARDS.throne, `the Throne of ${REGIONS[regionId].name}`);
      const victim = G.players[prev];
      victim.fallen = true;
      Rules.log(`${victim.name} is Fallen — ${REGIONS[regionId].name} has changed hands.`, 'fallen', prev);
    }

    // domain completion
    for (const dk in DOMAINS) {
      if (REGION_DEFS.some(d => d.id === regionId && d.domain === dk) &&
          Rules.domainComplete(pi, dk)) {
        Rules.awardXP(pi, XP_AWARDS.domain, `the Domain of ${DOMAINS[dk].name}`);
        Rules.log(`${p.name} completes the Domain of ${DOMAINS[dk].name}.`, 'domain', pi);
      }
    }
    if (prev !== null) Rules.checkFallenState(prev);
  },

  /* Fallen = your Throne is gone. You keep your regions, income, Renown and
     Boons, and taking any Throne on the map restores you. Losing your LAST
     region is different: there is no way back from nothing, so rather than
     leave a player who cannot act, the surrender resolves automatically and
     the spoils are divided as normal. */
  checkFallenState(pi) {
    const p = G.players[pi];
    if (p.surrendered) return;
    p.fallen = !THRONES.some(t => G.regions[t].owner === pi);
    if (Rules.regionsOf(pi).length === 0 && Rules.totalHosts(pi) === 0) {
      Rules.log(`${p.name} holds nothing and no longer fields a host.`, 'fallen', pi);
      Rules.surrender(pi);
    }
  },

  canSurrender(pi) {
    const p = G.players[pi];
    if (p.surrendered) return false;
    if (G.round < 3) return false;
    return p.fallen || Rules.regionsOf(pi).length <= 2;
  },

  surrender(pi) {
    const p = G.players[pi];
    p.surrendered = true;
    const active = G.players.filter(q => !q.surrendered);
    Rules.log(`${p.name} surrenders.`, 'surrender', pi);

    // regions pass to bordering active players — most adjacent hosts wins
    for (const id of Rules.regionsOf(pi)) {
      const scores = {};
      for (const n of REGIONS[id].neighbours) {
        const o = G.regions[n].owner;
        if (o !== null && o !== pi && !G.players[o].surrendered) {
          scores[o] = (scores[o] || 0) + Rules.hostCount(G.regions[n]);
        }
      }
      const claimants = Object.keys(scores);
      if (claimants.length) {
        const winner = +claimants.sort((a, b) => scores[b] - scores[a])[0];
        G.regions[id].owner = winner;
        G.regions[id].hosts = {};
        Rules.log(`${REGIONS[id].name} passes to ${G.players[winner].name}.`, 'spoils', winner);
      } else {
        G.regions[id].owner = null;
        G.regions[id].hosts = {};
      }
    }

    // banked Tribute splits evenly among the survivors
    if (active.length && p.tribute > 0) {
      const share = Math.floor(p.tribute / active.length);
      if (share > 0) {
        active.forEach(q => { q.tribute += share; });
        Rules.log(`${p.tribute} banked Tribute is divided — ${share} each.`, 'spoils');
      }
    }
    p.tribute = 0;
    Rules.checkVictory();
  },

  /* ---------------- scoring ---------------- */

  scoreFor(pi) {
    const p = G.players[pi];
    if (p.surrendered) return { total: 0, domains: 0, holdings: 0, level: 0, thrones: 0 };
    const domains = Rules.completeDomains(pi).length;
    const holdings = Rules.regionsOf(pi)
      .reduce((a, id) => a + (G.regions[id].holding > 0 ? 1 : 0), 0);
    const thrones = Rules.rivalThronesHeld(pi);
    const total = domains * VP.domain + holdings * VP.holding +
                  p.level * VP.renownLevel + thrones * VP.rivalThrone;
    return { total, domains, holdings, level: p.level, thrones };
  },

  checkVictory() {
    const active = G.players.filter(p => !p.surrendered);
    if (active.length === 1) {
      G.phase = 'gameover';
      G.winner = active[0].index;
      G.finalScores = G.players.map((p, i) => ({ player: i, ...Rules.scoreFor(i) }));
      Rules.log(`${active[0].name} stands alone.`, 'victory', active[0].index);
      return true;
    }
    if (G.round > ROUND_LIMIT) {
      G.phase = 'gameover';
      G.finalScores = G.players.map((p, i) => ({ player: i, ...Rules.scoreFor(i) }));
      const best = [...G.finalScores].sort((a, b) => b.total - a.total)[0];
      G.winner = best.player;
      Rules.log(`The Round limit is reached. ${G.players[best.player].name} scores ${best.total}.`, 'victory', best.player);
      return true;
    }
    return false;
  },

  /* ---------------- turn flow ---------------- */

  endTurn() {
    // ground held through one of your own Turns is pacified
    for (const id of Rules.regionsOf(G.turnIndex)) {
      if (G.regions[id].unrest > 0) G.regions[id].unrest -= 1;
    }

    // shrines pay every holder at the close of each Turn
    for (const q of G.players) {
      if (q.surrendered) continue;
      let tithe = 0;
      for (const id of Rules.regionsOf(q.index)) {
        const t = REGIONS[id].type;
        if (t === 'shrine') Rules.awardXP(q.index, XP_AWARDS.shrineTurn, `the shrine at ${REGIONS[id].name}`);
        if (Rules.hasBoon(q, 'tithe') && (t === 'shrine' || t === 'throne')) tithe += 2;
      }
      if (tithe) Rules.awardXP(q.index, tithe, 'Tithe');
    }

    G.reactionQueue = G.players
      .map((q, i) => i)
      .filter(i => i !== G.turnIndex && !G.players[i].surrendered);
    G.reactionIndex = 0;
    G.reactionActionTaken = false;

    if (G.reactionQueue.length === 0) return Rules.nextTurn();
    G.phase = 'reaction';
    Rules.grantReactionTrickle();
  },

  endReaction() {
    G.reactionIndex += 1;
    G.reactionActionTaken = false;
    if (G.reactionIndex >= G.reactionQueue.length) Rules.nextTurn();
  },

  nextTurn() {
    G.phase = 'turn';
    let guard = 0;
    do {
      G.turnIndex += 1;
      if (G.turnIndex >= G.players.length) {
        G.turnIndex = 0;
        G.round += 1;
        G.players.forEach(p => { p.firstAttackDone = false; p.masonUsed = false; });
        Rules.log(`— Round ${G.round} —`, 'round');
        if (Rules.checkVictory()) return;
      }
      guard++;
    } while (G.players[G.turnIndex].surrendered && guard < 20);

    Rules.turnPlayer().firstAttackDone = false;
    Rules.turnPlayer().assaults = 0;           // your allowance refreshes on your Turn
    Rules.turnPlayer().freeLevyUsed = false;
    Rules.turnPlayer().monumentUsed = false;
    G.actionsUsed = 0;
    G.fortifyUsed = false;
    const inc = Rules.grantRoundIncome(G.turnIndex);
    Rules.log(`${Rules.turnPlayer().name} takes the Turn — ${inc} Tribute collected.`, 'turn', G.turnIndex);
    Rules.checkVictory();
  },

  /* ---------------- log ---------------- */

  log(text, kind = 'info', player = null) {
    G.log.unshift({ text, kind, player, round: G.round });
    if (G.log.length > 140) G.log.pop();
  }
};

/* ===== js/combat.js ===== */
/* ============================================================
   APOTHEOSIS — combat
   Attacker 3 dice, defender 2, ties to the defender.
   Composition bends the odds; the losing player picks the dead.
   ============================================================ */

function d6() { return 1 + Math.floor(Math.random() * 6); }

function stackSize(s) { return Object.values(s || {}).reduce((a, b) => a + b, 0); }

const Combat = {

  /* ---------------- setup ---------------- */

  begin(pi, from, target, stack, opts) {
    const defender = G.regions[target].owner;
    G.players[pi].assaults += 1;
    // lift the committed force out of the source region for the duration
    for (const u in stack) {
      G.regions[from].hosts[u] -= stack[u];
      if (G.regions[from].hosts[u] <= 0) delete G.regions[from].hosts[u];
    }
    G.pendingCombat = {
      attacker: pi,
      defender,
      from, target,
      force: { ...stack },
      championLeads: !!(opts && opts.champion) && Rules.championAt(pi, from),
      attackerHadWarden: (stack.warden || 0) > 0,
      defenderHadWarden: Rules.countUnit(G.regions[target], 'warden') > 0,
      lastRoll: null,
      atkLost: 0, defLost: 0,
      queue: [],
      finished: false,
      captured: false
    };
    Rules.log(
      `${G.players[pi].name} attacks ${REGIONS[target].name} with ` +
      `${stackSize(stack)} host${stackSize(stack) === 1 ? '' : 's'}.`,
      'attack', pi
    );
    return G.pendingCombat;
  },

  /* ---------------- dice ---------------- */

  diceContributors(stack) {
    let n = 0;
    for (const u in stack) if (u !== 'siege') n += stack[u];
    return n;
  },

  attackProfile(c) {
    const p = G.players[c.attacker];
    const f = c.force;
    const notes = [];

    let dice = Math.min(3, Combat.diceContributors(f));
    if (LEVY_MODE === 'dice') {
      const lb = Math.floor((f.levy || 0) / 3);
      if (lb) { dice += lb; notes.push(`+${lb} Levy mass`); }
    }

    let bonus = 0;
    if (LEVY_MODE === 'bonus') {
      const lb = Math.min(2, Math.floor((f.levy || 0) / 4));
      if (lb) { bonus += lb; notes.push(`+${lb} Levy mass`); }
    }
    if (f.zealot) {
      let z = Math.floor(p.level / 3);
      if (Rules.hasBoon(p, 'fury')) z *= 2;
      if (z) { bonus += z; notes.push(`+${z} Zealots`); }
    }
    if (c.championLeads) {
      const ch = Rules.championBonus(c.attacker);
      if (ch) { bonus += ch; notes.push(`+${ch} Champion`); }
      if (Rules.hasPerk(p, 'vanguard')) { dice += 1; notes.push('+1 Vanguard'); }
    }
    return { dice: Math.max(1, dice), bonus: Math.min(bonus, MAX_DIE_BONUS), notes };
  },

  defenceProfile(c) {
    const rs = G.regions[c.target];
    const p = c.defender === null ? null : G.players[c.defender];
    const notes = [];

    let dice = Math.min(2, Combat.diceContributors(rs.hosts));
    if (Rules.countUnit(rs, 'phalanx') > 0) notes.push('Shieldwall');
    if (Rules.countUnit(rs, 'gatewarden') > 0) notes.push('Gatewardens hold');

    /* A developed Holding is a wall, not just an income line. Siege exists
       precisely to answer that — bring one and the walls stop counting. */
    if (rs.holding >= 2) {
      const atk = G.players[c.attacker];
      if (c.force.siege) notes.push('Holding breached by Siege');
      else if (Rules.hasBoon(atk, 'stormseye')) notes.push('Holding ignored by Siegebreaker');
      else { dice += 1; notes.push(`+1 tier-${rs.holding} Holding`); }
    }

    if (p && Rules.hasBoon(p, 'fortified') && rs.holding >= 2) { dice += 1; notes.push('+1 Fortified'); }
    if (c.force.thunderguard) notes.push('Sundered by Thunderguard');

    let bonus = 0;
    if (LEVY_MODE === 'bonus') {
      const lb = Math.min(2, Math.floor(Rules.countUnit(rs, 'levy') / 4));
      if (lb) { bonus += lb; notes.push(`+${lb} Levy mass`); }
    }
    if (p) {
      if (Rules.countUnit(rs, 'zealot') > 0) {
        let z = Math.floor(p.level / 3);
        if (Rules.hasBoon(p, 'fury')) z *= 2;
        if (z) { bonus += z; notes.push(`+${z} Zealots`); }
      }
      if (Rules.championAt(c.defender, c.target)) {
        const ch = Rules.championBonus(c.defender);
        if (ch) { bonus += ch; notes.push(`+${ch} Champion`); }
        if (Rules.hasPerk(p, 'bulwark')) { dice += 1; notes.push('+1 Bulwark'); }
      }
    }
    return { dice: Math.max(1, dice), bonus: Math.min(bonus, MAX_DIE_BONUS), notes };
  },

  /* ---------------- one exchange ---------------- */

  exchange() {
    const c = G.pendingCombat;
    if (!c || c.finished || c.queue.length) return;

    const ap = Combat.attackProfile(c);
    const dp = Combat.defenceProfile(c);

    const atk = Array.from({ length: ap.dice }, d6).sort((a, b) => b - a);
    const def = Array.from({ length: dp.dice }, d6).sort((a, b) => b - a);

    // the flat bonus applies to the single highest die on each side
    const atkAdj = atk.slice(); if (atkAdj.length) atkAdj[0] += ap.bonus;
    const defAdj = def.slice(); if (defAdj.length) defAdj[0] += dp.bonus;

    const pairs = [];
    let atkLoss = 0, defLoss = 0;
    for (let i = 0; i < Math.min(atkAdj.length, defAdj.length); i++) {
      const win = atkAdj[i] > defAdj[i];        // ties go to the defender
      pairs.push({ a: atkAdj[i], d: defAdj[i], attackerWins: win });
      if (win) defLoss++; else atkLoss++;
    }

    const p = G.players[c.attacker];
    // Storm's Eye spares one casualty per battle, not per exchange — per
    // exchange it could cancel the only loss and the fight never ended.
    if (c.championLeads && Rules.hasPerk(p, 'relentless') && atkLoss > 0 && !c.relentlessUsed) {
      atkLoss -= 1;
      c.relentlessUsed = true;
    }

    /* Every exchange must cost somebody something. Without this an unlucky
       combination of modifiers produces a scoreless round and the battle
       loops forever with no way for either side to resolve it. */
    /* Casualty effects. These replace the old dice modifiers, which were
       nearly inert: combat only compares min(attacker, defender) dice, so a
       bonus die past the defender's count was simply discarded. Adding and
       negating CASUALTIES always lands. */
    const drs = G.regions[c.target];
    const sundered = !!c.force.thunderguard;          // ignores walls and shieldwalls alike

    // Warpath: the first attack of a Round bites deeper
    if (Rules.hasBoon(p, 'warpath') && !p.firstAttackDone && !c.warpathUsed) {
      c.warpathUsed = true;
      if (defLoss > 0 || atkLoss === 0) { defLoss += 1; ap.notes.push('Warpath'); }
    }

    // Shock: Stormriders hit harder the moment they arrive
    if (c.force.stormrider && !c.shockUsed) {
      c.shockUsed = true;
      if (defLoss > 0 || atkLoss === 0) defLoss += 1;
    }

    /* Shieldwall absorbs ONE casualty per BATTLE, not per exchange.
       Per exchange it made a lone Phalanx invulnerable: a defender rolling a
       single die produces exactly one pair, so every hit the attacker landed
       was negated and the wall could never be broken. */
    if (!sundered && Rules.countUnit(drs, 'phalanx') > 0 && defLoss > 0 && !c.defShieldUsed) {
      defLoss -= 1;
      c.defShieldUsed = true;
      dp.notes.push('Shieldwall absorbs a hit');
    }
    if ((c.force.phalanx || 0) > 0 && atkLoss > 0 && !c.atkShieldUsed) {
      atkLoss -= 1;
      c.atkShieldUsed = true;
      ap.notes.push('Shieldwall absorbs a hit');
    }

    /* NEVER invent a casualty for a side that won its pairs. This line used to
       fire whenever Shieldwall zeroed the defender's loss, handing the hit to
       the ATTACKER instead — so rolling 7 against 6 cost you a unit and the
       defender nothing. It now only guards the degenerate case where no dice
       were compared at all. */
    if (atkLoss === 0 && defLoss === 0 && pairs.length === 0) atkLoss = 1;

    p.firstAttackDone = true;
    c.lastRoll = { atk, def, atkAdj, defAdj, pairs, ap, dp, atkLoss, defLoss };

    // Siege guts the Holding on any exchange the attacker wins
    // Gatewardens forbid the razing entirely
    if (defLoss > 0 && c.force.siege && Rules.countUnit(G.regions[c.target], 'gatewarden') === 0) {
      const rs = G.regions[c.target];
      const floorTier = (c.defender !== null && Rules.hasBoon(G.players[c.defender], 'unbroken')) ||
                        REGIONS[c.target].type === 'throne' ? 1 : 0;
      if (rs.holding > floorTier) {
        rs.holding -= 1;
        Rules.log(`Siege reduces the Holding at ${REGIONS[c.target].name} to tier ${rs.holding}.`, 'siege', c.attacker);
      }
    }

    // queue casualty allocations — attacker first, then defender
    atkLoss = Math.min(atkLoss, stackSize(c.force));
    defLoss = Math.min(defLoss, Rules.hostCount(G.regions[c.target]));
    if (atkLoss > 0) c.queue.push({ side: 'attacker', player: c.attacker, losses: atkLoss });
    if (defLoss > 0) c.queue.push({ side: 'defender', player: c.defender, losses: defLoss });

    Combat.pumpQueue();
  },

  /* auto-resolve any allocation with no real choice in it */
  pumpQueue() {
    const c = G.pendingCombat;
    while (c.queue.length) {
      const job = c.queue[0];
      const pool = job.side === 'attacker' ? c.force : G.regions[c.target].hosts;
      const types = Object.keys(pool).filter(u => pool[u] > 0);
      if (types.length === 0) { c.queue.shift(); continue; }
      if (types.length === 1 || job.losses >= stackSize(pool)) {
        const auto = {};
        let left = job.losses;
        for (const t of types) {
          const take = Math.min(left, pool[t]);
          if (take > 0) { auto[t] = take; left -= take; }
          if (left <= 0) break;
        }
        Combat.applyCasualties(auto);
        continue;
      }
      return;   // needs a decision from a human
    }
    Combat.afterExchange();
  },

  currentCasualtyJob() {
    const c = G.pendingCombat;
    if (!c || !c.queue.length) return null;
    const job = c.queue[0];
    return {
      ...job,
      pool: job.side === 'attacker' ? c.force : G.regions[c.target].hosts
    };
  },

  applyCasualties(assignment) {
    const c = G.pendingCombat;
    const job = c.queue.shift();
    const pool = job.side === 'attacker' ? c.force : G.regions[c.target].hosts;
    let removed = 0;
    for (const u in assignment) {
      const n = Math.min(assignment[u], pool[u] || 0);
      pool[u] -= n;
      if (pool[u] <= 0) delete pool[u];
      removed += n;
    }
    if (job.side === 'attacker') {
      c.atkLost += removed;
      Rules.awardXP(c.attacker, removed * XP_AWARDS.hostLost, 'hosts lost');
      if (c.defender !== null) Rules.awardXP(c.defender, removed * XP_AWARDS.hostDestroyed, 'hosts destroyed');
    } else {
      c.defLost += removed;
      Rules.awardXP(c.attacker, removed * XP_AWARDS.hostDestroyed, 'hosts destroyed');
      if (c.defender !== null) Rules.awardXP(c.defender, removed * XP_AWARDS.hostLost, 'hosts lost');
    }

  /* ---------------- resolution ---------------- */

  afterExchange() {

    if (!c || c.queue.length) return;

    const defLeft = Rules.hostCount(G.regions[c.target]);
    const atkLeft = stackSize(c.force);

    if (defLeft === 0 && atkLeft > 0) {
      Combat.captureAndFinish();
    } else if (atkLeft === 0) {
      Rules.log(`${G.players[c.attacker].name}'s assault on ${REGIONS[c.target].name} is broken.`, 'repulse', c.attacker);
      /* The Champion is the last thing standing, and a Warden buys its life.
         The attack path used to skip the Warden check entirely, so a Champion

       in its place and buys the escape; without one, the Champion is gone for
       the rest of the match. */

    const c = G.pendingCombat;
    if (!c || c.finished) return;
    Rules.log(`${G.players[c.attacker].name} withdraws from ${REGIONS[c.target].name}.`, 'withdraw', c.attacker);

  settle() {

    c.force = {};
