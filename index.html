<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Apotheosis — prototype</title>
<style>
/* ============================================================
   APOTHEOSIS — prototype styles
   Palette carried over from the design document:
   temple-shadow indigo ground, warm ash ink, bronze + verdigris.
   ============================================================ */

:root {
  /* Type scale — a fixed ladder so panels, dialogs and labels stop each
     inventing their own sizes. */
  --t-micro: .66rem;   /* mono labels, eyebrows */
  --t-small: .78rem;   /* secondary text, rules */
  --t-body:  .88rem;   /* default reading size */
  --t-lead:  1.02rem;  /* emphasised body */
  --t-h3:    1.2rem;
  --t-h2:    1.55rem;
  --t-h1:    2.1rem;

  --ground:      #12141c;
  --surface:     #1a1d27;
  --surface-2:   #222634;
  --surface-3:   #2b3040;
  --line:        #2f3444;
  --line-soft:   #262a38;

  --ink:         #e7e4dc;
  --ink-mid:     #a3a2b0;
  --ink-dim:     #74737f;

  --bronze:      #c98f47;
  --bronze-dim:  #8c6330;
  --verdigris:   #67a89a;
  --verd-dim:    #3d6a61;
  --blood:       #b0534f;

  --neutral-fill: #343948;

  --f-display: "Sitka Display", "Sitka Heading", Constantia, "Palatino Linotype", Georgia, serif;
  --f-body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --f-mono: Consolas, "SF Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0; padding: 0; height: 100%;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  overflow: hidden;
  /* iOS Safari 16+ honours this and stops the rubber-band bounce outright. */
  overscroll-behavior: none;
  /* touch-action is what actually covers older iOS, and it is the RIGHT tool
     for this — the compositor can act on it immediately, with no round trip
     through JS. A document-level touchmove listener calling preventDefault()
     was tried first and pulled back out: forcing the browser to wait on the
     main thread before every scroll decision is a well-known source of input
     lag on iOS, and on a board this filter-heavy it showed up as a visible
     stall and, under load, a blank frame. Scrollable containers below
     override this back to pan-y/pan-x; the map overrides it back to none on
     purpose, since it drives its own gestures through Pointer Events. */
  touch-action: none;
  /* Chrome/Safari draw a translucent grey box over whatever you tapped unless
     told not to — the tapped element's own bounding box, flashed on for a few
     hundred ms. On an SVG territory that reads as a shaded rectangle stamped
     over the region, stacked on top of the game's own .selected glow. Every
     tap target here already has its own feedback; the browser's default adds
     noise on top of it rather than replacing it. */
  -webkit-tap-highlight-color: transparent;
}

button { font-family: inherit; font-size: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--verdigris); outline-offset: 2px; }

.hidden { display: none !important; }
.screen { height: 100%; }

.eyebrow {
  font-family: var(--f-mono); font-size: .7rem; letter-spacing: .22em;
  text-transform: uppercase; color: var(--verdigris);
}

/* ---------------- buttons ---------------- */

.primary, .ghost, .danger {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  padding: .5rem .9rem;
  border-radius: 2px;
  transition: background .12s, border-color .12s;
}
.primary { border-color: var(--bronze-dim); background: color-mix(in srgb, var(--bronze) 18%, var(--surface-2)); }
.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--bronze) 30%, var(--surface-2)); }
.ghost:hover:not(:disabled) { background: var(--surface-3); border-color: var(--verd-dim); }
.danger { border-color: var(--blood); color: #e8b6b4; }
.danger:hover:not(:disabled) { background: color-mix(in srgb, var(--blood) 25%, var(--surface-2)); }
.primary:disabled, .ghost:disabled, .danger:disabled { opacity: .38; cursor: not-allowed; }
.small { padding: .32rem .6rem; font-size: .8rem; }
.big { padding: .8rem 1.4rem; font-size: 1.05rem; width: 100%; margin-top: 1.4rem; }

/* ---------------- setup ---------------- */

#setup {
  display: grid; place-items: center; padding: 2rem 1rem; overflow-y: auto;
  touch-action: pan-y;
  background:
    radial-gradient(120% 80% at 50% -10%, color-mix(in srgb, var(--bronze) 13%, transparent), transparent 60%),
    var(--ground);
}
.setup-card {
  width: min(46rem, 100%);
  background: var(--surface);
  border: 1px solid var(--line);
  padding: 2.4rem 2.2rem 2.2rem;
}
.setup-card h1 {
  font-family: var(--f-display); font-size: clamp(2.6rem, 7vw, 4.2rem);
  letter-spacing: .05em; margin: .5rem 0 .6rem; font-weight: 600; line-height: 1;
}
.setup-blurb { color: var(--ink-mid); margin: 0 0 1.1rem; max-width: 34rem; font-family: var(--f-display); font-size: 1.05rem; }
#setup-howto { display: inline-block; margin: 0 0 1.8rem; font-size: .85rem; }
.setup-row { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 1.6rem; }
.setup-label {
  font-family: var(--f-mono); font-size: .7rem; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-dim); width: 6rem;
}
.seg { display: flex; border: 1px solid var(--line); }
.seg button { background: var(--surface-2); color: var(--ink-mid); border: none; padding: .45rem 1rem; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: none; }
.seg button.on { background: color-mix(in srgb, var(--bronze) 24%, var(--surface-2)); color: var(--ink); }

.map-select {
  background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
  padding: .45rem 1rem; border-radius: 2px; font-family: inherit; font-size: inherit;
}

.pick {
  display: grid; grid-template-columns: 1.5rem 9rem 1fr; gap: 1rem;
  align-items: center; padding: .75rem 0; border-top: 1px solid var(--line-soft);
}
.swatch { width: 1.05rem; height: 1.05rem; border-radius: 50%; }
.pick-name { font-weight: 650; }
.patron-seg { display: flex; gap: .5rem; flex-wrap: wrap; }
.patron-opt {
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-mid);
  padding: .4rem .7rem; border-radius: 2px; text-align: left; line-height: 1.25;
}
.patron-opt.on { border-color: var(--bronze); background: color-mix(in srgb, var(--bronze) 16%, var(--surface-2)); color: var(--ink); }
/* the domain tag stays visible at every width — it's one short line and is
   the only clue a phone player gets before tapping through to How to play,
   now that .patron-opt small (the full strategy sentence) hides there */
.patron-domain {
  display: block; font-style: normal; font-family: var(--f-mono); font-size: .68rem;
  letter-spacing: .04em; color: var(--bronze); margin-top: .1rem;
}
.patron-opt.on .patron-domain { color: var(--bronze); }
.patron-opt small { display: block; font-size: .72rem; color: var(--ink-dim); }
.patron-opt.on small { color: var(--ink-mid); }

.check { display: flex; align-items: center; gap: .6rem; margin-top: 1.6rem; color: var(--ink-mid); font-size: .9rem; }
.check input { accent-color: var(--bronze); width: 1rem; height: 1rem; }

/* identical to the inline style it replaced — a class so the phone rule below
   can give it its own line without touching a style="" attribute */
.setup-note { font-size: .8rem; color: var(--ink-dim); }

/* ---------------- setup screen: phone ----------------

   Never adapted for a narrow screen before — every other @media block in
   this file is in-game UI. Measured on a real 375x812 page before touching
   anything: .setup-card was 1597px tall, 785px over the viewport, and 1049 of
   those 1597 — two thirds of the whole screen — was #patron-picks alone.

   The cause was .pick's own grid: swatch + name + the Human/AI toggle + the
   patron/personality picker all forced onto ONE row (1.5rem, 7.5rem, auto,
   1fr). On a 375px phone that starved the picker column to ~146px — barely
   over the 9rem a single option needs — so every patron and AI personality
   option stacked one per row with its full description, and did that FOUR
   TIMES, once per warlord. Stacking the row so the picker gets the full card
   width fixes the actual cause; the padding trims below are secondary. */
@media (max-width: 900px) {
  #setup { padding: .8rem .7rem; }
  .setup-card { padding: 1.1rem .9rem 1rem; }
  .setup-card h1 { font-size: clamp(1.9rem, 10vw, 2.5rem); margin: .3rem 0 .35rem; }
  .setup-blurb { margin: 0 0 1.05rem; font-size: .88rem; }

  .setup-row {
    flex-wrap: wrap; row-gap: .5rem; margin-bottom: 1rem;
  }
  .setup-note { flex: 1 1 100%; }   /* its own line, full width, wraps cleanly */

  /* the pick row: header line (swatch, name, Human/AI) then the picker gets
     the whole width on the line below, instead of a starved 4th column */
  .pick {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: .35rem .55rem; padding: .5rem 0;
  }
  .pick-name { flex: 1 1 auto; min-width: 0; font-size: .92rem; }
  .seat-type { flex: 0 0 auto; }
  .patron-seg { flex: 1 1 100%; margin-top: .15rem; }
  .pick .patron-seg { grid-template-columns: repeat(auto-fit, minmax(6.4rem, 1fr)); gap: .35rem; }
  /* Explicit px: hiding the blurb below leaves one line of text, and padding
     alone measured 33.1px tall — under the 44px minimum, caught only by
     querying the real page. min-height, not just padding, is what enforces it
     regardless of how the text itself sets the button's natural height. */
  .patron-opt { padding: .5rem .55rem; font-size: .86rem; min-height: 44px; display: flex; align-items: center; }
  /* The strategy blurb is a full sentence and was the dominant cost — three
     lines per option, repeated for 2-3 options across 4 warlords. The name
     alone is enough to pick between defaults on a screen this size; the full
     text is one tap away in a warlord's own chip menu and in How to play,
     so nothing is actually lost, just deferred past first setup. */
  .patron-opt small { display: none; }

  /* explicit px, not rem — the root font here is 15px, so rem maths on a
     touch target silently undershoots the 44px minimum (rule from CLAUDE.md,
     paid for once already: 2.85rem computed to 42.75px and shipped). */
  .seg.seat-type button, #player-count button, #assault-limit button, #setup-howto, #map-choice {
    min-height: 44px;
  }
  #setup-howto { margin: 0 0 1rem; font-size: .8rem; }
  .check { min-height: 44px; margin-top: .3rem; }
  #start.big { min-height: 50px; width: 100%; margin-top: .3rem; }
}

/* ---------------- top bar ---------------- */

/* Three rows now: bar, the 3px Renown rule, board. Stated explicitly — when
   #xp-strip was added against a two-row template it became an implicit third
   row sized 1fr, which handed 457px of an 812px phone to a 3px element and
   left the map with 38% of the screen. */
#game { display: grid; grid-template-rows: auto auto 1fr; height: 100%; }

#topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding: .55rem 1rem; border-bottom: 1px solid var(--line); background: var(--surface);
}
.tb-left { display: flex; align-items: baseline; gap: 1rem; }
.tb-title { font-family: var(--f-display); font-size: 1.1rem; letter-spacing: .14em; }
.tb-round { font-family: var(--f-mono); font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.tb-players { display: flex; gap: .4rem; flex-wrap: wrap; }
.tb-p {
  display: flex; align-items: center; gap: .45rem;
  border: 1px solid var(--line); background: var(--surface-2);
  padding: .25rem .6rem; border-radius: 2px; font-size: .8rem;
}
.tb-p.active { border-color: var(--bronze); background: color-mix(in srgb, var(--bronze) 14%, var(--surface-2)); }
.tb-p.out { opacity: .4; text-decoration: line-through; }
.tb-p .dot { width: .6rem; height: .6rem; border-radius: 50%; }
.tb-p .st { font-family: var(--f-mono); color: var(--ink-dim); font-size: .74rem; }
.ai-tag {
  font-family: var(--f-mono); font-size: .6rem; letter-spacing: .1em; text-transform: uppercase;
  border: 1px solid var(--verd-dim); color: var(--verdigris);
  padding: .04rem .3rem; border-radius: 2px;
}
.tb-right { display: flex; gap: .4rem; }
.seat-type button { padding: .38rem .7rem; font-size: .82rem; }
.pick { grid-template-columns: 1.5rem 7.5rem auto 1fr; }
.pick-name small { display: block; font-size: .72rem; color: var(--ink-dim); font-weight: 400; }
.pick .patron-seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .4rem; }

/* ---------------- board ---------------- */

/* One column. The 22rem sidebar it used to reserve no longer exists. */
#board { display: grid; grid-template-columns: 1fr; min-height: 0; }
/* position: relative so the announcement layer can sit over the board without
   escaping into the sidebar on desktop. */
#map-pane { display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0; position: relative; }
#map-wrap { min-height: 0; padding: .6rem; display: grid; place-items: center; }
#map { width: 100%; height: 100%; max-height: 100%; }

.phase-tag {
  font-family: var(--f-mono); font-size: .68rem; letter-spacing: .16em;
  text-transform: uppercase; padding: .22rem .55rem; border: 1px solid var(--bronze-dim);
  color: var(--bronze); border-radius: 2px; white-space: nowrap;
}
.phase-tag.reaction { border-color: var(--verd-dim); color: var(--verdigris); }
.phase-hint { color: var(--ink-mid); }
.domains { margin-left: auto; display: flex; gap: .85rem; flex-wrap: wrap; }
.dm {
  display: inline-flex; align-items: center; gap: .35rem;
  font-family: var(--f-mono); font-size: .66rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-dim);
}
.dm i { width: .55rem; height: .55rem; border-radius: 1px; display: inline-block; opacity: .75; }
.dm.done { color: var(--ink-mid); }
.dm em { font-style: normal; }

/* ---------------- map graphics ---------------- */

.region { cursor: pointer; }
.region .fill { stroke: #0d0f16; stroke-width: 1.6; transition: fill .18s, opacity .18s; }
.region:hover .fill { filter: brightness(1.22) saturate(1.1); }
.region .rim { pointer-events: none; transition: stroke-opacity .15s; }
.region:hover .rim { stroke-opacity: .95; }

/* Selection and legal targets are glows rather than dashed outlines — a
   dashed stroke disappeared against the busier territory art. */
.region.selected .fill { stroke: var(--bronze); stroke-width: 2.6; filter: url(#selGlow); }
.region.selected .rim  { stroke-opacity: 1; }
.region.target .fill   { stroke: var(--verdigris); stroke-width: 2.2; filter: url(#tgtGlow); }
.region.dim            { opacity: .28; }
.region.dim .fill      { filter: saturate(.3); }
.region .grain         { pointer-events: none; mix-blend-mode: overlay; }

/* Whose ground it is, and whether you can act on it, without recolouring
   the fill — the rim carries ownership, these carry state. */
.region.mine .rim      { stroke-opacity: .7; }
.region.actionable .rim{ stroke-opacity: .9; stroke-width: 3; }
.region.foe .rim       { stroke-dasharray: none; }
.region.open .fill     { stroke: #2a3040; stroke-width: 1.4; }
.region.restive .fill  { stroke: var(--blood); stroke-opacity: .8; stroke-width: 2; }
.domain-edge { pointer-events: none; }

.region-name {
  font-family: var(--f-display); font-size: 13.5px; font-weight: 600;
  letter-spacing: .02em;
  fill: #f4f1ea; paint-order: stroke; stroke: rgba(5,6,10,.92); stroke-width: 3.4px;
  pointer-events: none; text-anchor: middle;
}
.glyph { pointer-events: none; }
.troop { pointer-events: auto; cursor: help; }
.troop-n {
  font-family: var(--f-mono); font-size: 12px; font-weight: 700; fill: #f4f1ea;
  text-anchor: middle; paint-order: stroke; stroke: rgba(6,8,13,.9); stroke-width: 2.6px;
}
.def-flag { pointer-events: none; }
.def-n { font-family: var(--f-mono); font-size: 9.5px; font-weight: 700; fill: var(--verdigris); text-anchor: middle; }
.host-badge { pointer-events: none; }
.host-badge rect { fill: rgba(8,10,16,.86); stroke: rgba(240,236,226,.35); stroke-width: 1; }
.host-badge text { font-family: var(--f-mono); font-size: 11px; font-weight: 700; fill: #f2efe8; text-anchor: middle; }
.holding-mark { pointer-events: auto; cursor: help; }
.champion-mark { pointer-events: auto; cursor: help; }
.domain-label {
  font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .18em;
  text-transform: uppercase; fill: rgba(231,228,220,.34); pointer-events: none; text-anchor: middle;
}
.you-head { display: flex; align-items: center; gap: .55rem; margin-bottom: .6rem; }
.you-head .dot { width: .8rem; height: .8rem; border-radius: 50%; }
.you-name { font-weight: 700; }
.you-patron { font-size: .8rem; color: var(--ink-mid); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-bottom: .6rem; }
.stat { background: var(--surface-2); border: 1px solid var(--line-soft); padding: .4rem .5rem; }
.stat .k { font-family: var(--f-mono); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.stat .v { font-family: var(--f-mono); font-size: 1.15rem; font-variant-numeric: tabular-nums; color: var(--ink); }
.stat .v small { font-size: .68rem; color: var(--ink-dim); }

.xpbar { height: 5px; background: var(--surface-3); margin-bottom: .5rem; }
.xpbar span { display: block; height: 100%; background: var(--bronze); }
.boonlist { display: flex; flex-wrap: wrap; gap: .3rem; }
.boon-chip {
  font-size: .72rem; border: 1px solid var(--verd-dim); color: var(--verdigris);
  padding: .12rem .42rem; border-radius: 2px;
}

.sel-title { font-family: var(--f-display); font-size: 1.15rem; margin: 0 0 .15rem; }
.sel-sub { font-size: .8rem; color: var(--ink-mid); margin: 0 0 .5rem; }
.sel-note { font-size: .78rem; color: var(--ink-dim); margin: .35rem 0 0; }
.raise-here { display: flex; gap: .5rem; margin-top: .4rem; font-size: .78rem; align-items: baseline; }
.rh-k {
  font-family: var(--f-mono); font-size: .6rem; letter-spacing: .13em; text-transform: uppercase;
  color: var(--ink-dim); white-space: nowrap; min-width: 5.4rem;
}
.rh-v { color: var(--ink-mid); line-height: 1.35; }
.champ-check { margin: .2rem 0 .6rem; align-items: flex-start; }
.champ-check.disabled { opacity: .5; }
.champ-check b { color: var(--bronze); }
.hostlist { display: flex; flex-direction: column; gap: .22rem; margin: .5rem 0 0; }
.hostrow { display: flex; justify-content: space-between; font-size: .82rem; }
.hostrow .n { font-family: var(--f-mono); color: var(--bronze); }

.actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .4rem; }
.actions-grid .wide { grid-column: 1 / -1; }
.hintline { font-size: .78rem; color: var(--ink-dim); margin-top: .5rem; }

.log { overflow-y: auto; touch-action: pan-y; }
.log-entry {
  font-size: .8rem; line-height: 1.45; padding: .28rem 0;
  border-bottom: 1px solid var(--line-soft); color: var(--ink-mid);
  display: grid; grid-template-columns: .35rem 1fr; gap: .5rem; align-items: start;
}
.log-entry .bar { width: 3px; height: 100%; min-height: .9rem; background: transparent; border-radius: 2px; }
.log-entry.k-round, .log-entry.k-victory { color: var(--bronze); font-weight: 650; }
.log-entry.k-level, .log-entry.k-boon, .log-entry.k-apotheosis { color: var(--verdigris); }
.log-entry.k-capture, .log-entry.k-fallen, .log-entry.k-champion,
.log-entry.k-championfall { color: #e0b0ad; }

/* ---------------- modals ---------------- */

#modal-layer, #pass-layer {
  position: fixed; inset: 0; background: rgba(8,10,16,.78);
  display: grid; place-items: center; padding: 1.5rem; z-index: 40;
  backdrop-filter: blur(2px);
}
#modal, #pass-card {
  width: min(38rem, 100%); max-height: 88vh; overflow-y: auto;
  touch-action: pan-y;
  background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 22%);
  border: 1px solid var(--line);
  border-top: 2px solid var(--bronze-dim);
  border-radius: 3px;
  padding: 1.5rem 1.7rem 1.6rem;
  box-shadow: 0 24px 60px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.4);
}
#modal .eyebrow, #pass-card .eyebrow { margin-bottom: .35rem; }
#modal h2, #pass-card h2 { letter-spacing: .01em; }
#modal > p:first-of-type { font-size: var(--t-body); }
#modal hr {
  border: none; border-top: 1px solid var(--line-soft); margin: 1.1rem 0;
}
#modal h2, #pass-card h2 {
  font-family: var(--f-display); font-size: var(--t-h2); margin: .2rem 0 .55rem;
  font-weight: 600; line-height: 1.2;
}
#modal p { color: var(--ink-mid); margin: 0 0 .9rem; }
.modal-actions {
  display: flex; gap: .6rem; justify-content: flex-end; flex-wrap: wrap;
  margin-top: 1.4rem; padding-top: 1.1rem; border-top: 1px solid var(--line-soft);
}
.modal-actions .primary { min-width: 8rem; justify-content: center; }

/* unit steppers */
.stepper-list { display: flex; flex-direction: column; gap: .4rem; margin: .8rem 0; }
.stepper {
  display: grid; grid-template-columns: 1fr auto auto auto; gap: .6rem; align-items: center;
  background: var(--surface-2); border: 1px solid var(--line-soft); padding: .45rem .6rem;
}
.stepper .nm { font-weight: 620; }
.stepper .nm small { display: block; font-size: .72rem; color: var(--ink-dim); font-weight: 400; }
.stepper .ct { font-family: var(--f-mono); font-size: 1rem; min-width: 3.2rem; text-align: center; color: var(--bronze); }
.stepper button { width: 1.9rem; height: 1.9rem; padding: 0; background: var(--surface-3); border: 1px solid var(--line); color: var(--ink); }
.stepper button:disabled { opacity: .3; }

/* tooltips — a single floating element positioned in JS.
   The old ::after bubbles were clipped by the sidebar's overflow, which made
   the troop-key descriptions unreadable. */
[data-tip] { cursor: help; }
#tip {
  position: fixed; z-index: 999; max-width: 20rem;
  background: var(--surface-3); color: var(--ink);
  border: 1px solid var(--bronze-dim); border-radius: 3px;
  padding: .55rem .7rem; font-family: var(--f-body); font-size: .8rem;
  line-height: 1.45; letter-spacing: 0; text-transform: none; font-weight: 400;
  box-shadow: 0 8px 24px rgba(0,0,0,.6); pointer-events: none;
  opacity: 0; transition: opacity .1s;
}
#tip.on { opacity: 1; }
#tip b { color: var(--bronze); }

/* hint bar */
#hintbar {
  border-top: 1px solid var(--line); background: var(--surface-2);
  padding: .5rem 1rem; display: flex; align-items: center; gap: .75rem;
  font-size: .84rem; color: var(--ink-mid); min-height: 2.5rem;
}
#hintbar .hb-icon {
  font-family: var(--f-mono); font-size: .62rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--verdigris); border: 1px solid var(--verd-dim); padding: .16rem .45rem;
  border-radius: 2px; white-space: nowrap;
}
#hintbar b { color: var(--ink); font-weight: 620; }
#hintbar .hb-dismiss { margin-left: auto; }

/* tutorial */
.tut-step { display: flex; gap: .5rem; align-items: center; margin-bottom: .9rem; }
.tut-dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--surface-3); }
.tut-dot.on { background: var(--bronze); }
.tut-body { color: var(--ink-mid); line-height: 1.6; }
.tut-body b { color: var(--ink); }
.tut-body ul { margin: .6rem 0 0; padding-left: 1.1rem; }
.tut-body li { margin-bottom: .35rem; }

/* sliders */
.slider-row {
  display: grid; grid-template-columns: 11rem 1fr 4.5rem; gap: .8rem; align-items: center;
  background: var(--surface-2); border: 1px solid var(--line-soft); padding: .5rem .7rem;
}
.slider-row .nm { font-weight: 620; font-size: .9rem; }
.slider-row .nm small { display: block; font-size: .71rem; color: var(--ink-dim); font-weight: 400; line-height: 1.3; }
.slider-row .ct { font-family: var(--f-mono); font-size: .85rem; text-align: right; color: var(--ink-dim); }
.slider-row .ct b { color: var(--bronze); font-size: 1.05rem; }
.slider-row input[type=range] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 4px;
  background: var(--surface-3); border-radius: 2px; outline: none;
}
.slider-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 1.05rem; height: 1.05rem;
  border-radius: 50%; background: var(--bronze); cursor: pointer; border: 2px solid var(--ground);
}
.slider-row input[type=range]::-moz-range-thumb {
  width: 1.05rem; height: 1.05rem; border-radius: 50%; background: var(--bronze);
  cursor: pointer; border: 2px solid var(--ground);
}
.quick-row { display: flex; gap: .4rem; flex-wrap: wrap; margin: .9rem 0 .2rem; }

/* cost breakdown */
.costcalc {
  font-family: var(--f-mono); font-size: .78rem; color: var(--ink-dim);
  background: var(--surface-2); border: 1px solid var(--line-soft);
  padding: .5rem .7rem; margin: .6rem 0;
}
.costcalc b { color: var(--bronze); }
.costcalc .minus { color: var(--verdigris); }

/* dice */
.dice-row { display: flex; align-items: center; gap: .8rem; margin: .5rem 0; flex-wrap: wrap; }
.dice-label { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); width: 5rem; }
.die {
  width: 2.1rem; height: 2.1rem; display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface-2);
  font-family: var(--f-mono); font-size: 1.05rem; font-weight: 700;
}
.die.win { border-color: var(--verdigris); color: var(--verdigris); }
.die.lose { border-color: var(--blood); color: #e0a09d; opacity: .75; }
.die.boosted { border-color: var(--bronze); color: var(--bronze); }
.notes { font-size: .78rem; color: var(--ink-dim); margin-top: .3rem; }
.tally { display: flex; gap: 1.4rem; margin-top: 1rem; font-size: .88rem; }
.tally b { font-family: var(--f-mono); color: var(--bronze); }

/* build preview */
.build-preview { border: 1px solid var(--line-soft); background: var(--surface-2); padding: .5rem .6rem; margin-top: .4rem; }
.bp-head { font-family: var(--f-mono); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--verdigris); margin-bottom: .35rem; }
.bp-row { display: grid; grid-template-columns: 1fr auto; gap: .2rem .5rem; font-size: .78rem; color: var(--ink-mid); align-items: baseline; }
.bp-row b { font-family: var(--f-mono); color: var(--bronze); font-weight: 600; }
.bp-row em { grid-column: 1 / -1; font-style: normal; font-size: .7rem; color: var(--ink-dim); margin-bottom: .25rem; }

/* forecast */
.forecast { border: 1px solid var(--line); background: var(--surface-2); padding: .75rem .85rem; margin: .9rem 0; }
.forecast.good { border-left: 3px solid var(--verdigris); }
.forecast.even { border-left: 3px solid var(--bronze); }
.forecast.bad  { border-left: 3px solid var(--blood); }
.fc-head {
  display: flex; align-items: baseline; gap: .55rem; margin-bottom: .6rem;
  font-family: var(--f-mono); font-size: .68rem; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-dim);
}
.fc-head b { font-size: 1.5rem; letter-spacing: 0; color: var(--ink); }
.forecast.good .fc-head b { color: var(--verdigris); }
.forecast.bad .fc-head b { color: #e0a09d; }
.fc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .55rem .9rem; }
.fc-grid > div { display: flex; flex-direction: column; gap: .1rem; }
.fc-k { font-family: var(--f-mono); font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
.fc-v { font-family: var(--f-mono); font-size: .95rem; color: var(--bronze); }
.fc-n { font-size: .72rem; color: var(--ink-dim); line-height: 1.3; }

/* level-up choice */
.choice-cols { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; margin: 1rem 0; }
.choice-col { display: flex; flex-direction: column; gap: .5rem; }
.choice-head {
  font-family: var(--f-mono); font-size: .62rem; letter-spacing: .16em;
  text-transform: uppercase; padding-bottom: .3rem; border-bottom: 1px solid var(--line);
}
.choice-head.bless { color: var(--bronze); }
.choice-head.perk { color: var(--verdigris); }
.boon-card.bless:hover { border-color: var(--bronze); }
.boon-card.perk:hover { border-color: var(--verdigris); }
.tier-unlock {
  border: 1px dashed var(--verd-dim); background: color-mix(in srgb, var(--verdigris) 8%, transparent);
  padding: .5rem .7rem; font-size: .85rem; color: var(--ink-mid); margin-bottom: .3rem;
}
.tier-unlock b { color: var(--verdigris); }
@media (max-width: 34rem) { .choice-cols { grid-template-columns: 1fr; } }

/* boon cards */
.boon-grid { display: grid; gap: .55rem; margin: 1rem 0; }
.boon-card {
  text-align: left; border: 1px solid var(--line); background: var(--surface-2);
  padding: .75rem .85rem; color: var(--ink); border-radius: 2px;
}
.boon-card:hover { border-color: var(--verdigris); background: var(--surface-3); }
.boon-card b { display: block; margin-bottom: .2rem; }
.boon-card span { color: var(--ink-mid); font-size: .87rem; }

/* toll clock */
.clock {
  font-family: var(--f-mono); font-size: 2.6rem; text-align: center;
  color: var(--bronze); font-variant-numeric: tabular-nums; margin: .6rem 0;
}
.clock.urgent { color: var(--blood); }

/* pass screen */
#pass-card { text-align: center; width: min(28rem, 100%); }
#pass-card .dot { width: 2.4rem; height: 2.4rem; border-radius: 50%; margin: 0 auto 1rem; }

/* scoreboard */
.score-table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: .9rem; }
.score-table th, .score-table td { padding: .5rem .6rem; text-align: left; border-bottom: 1px solid var(--line-soft); }
.score-table th { font-family: var(--f-mono); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.score-table td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.score-table tr.win td { color: var(--bronze); font-weight: 650; }

/* reference */
.ref-grid { display: grid; gap: .5rem; margin-top: .8rem; }
.ref-item { border-left: 2px solid var(--verd-dim); padding: .1rem 0 .1rem .7rem; }
.ref-item b { display: block; }
.ref-item span { font-size: .86rem; color: var(--ink-mid); }
.ref-item i { font-style: normal; font-family: var(--f-mono); font-size: .78rem; color: var(--bronze); }

@media (max-width: 1100px) {
  #board { grid-template-columns: 1fr 18rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* troop key */
.key-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.6rem, 1fr)); gap: .25rem .5rem; }
.key-item { display: flex; align-items: center; gap: .35rem; font-size: .76rem; color: var(--ink-mid); cursor: help; }
.key-item.foreign { opacity: .58; }
.key-svg { flex: 0 0 auto; }
.key-nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.key-ct { font-family: var(--f-mono); font-size: .68rem; color: var(--bronze); }
.key-item.foreign .key-ct { color: var(--ink-dim); }

/* raise dialog */
.raise-row { grid-template-columns: 13rem 1fr 4.2rem; }
.raise-row.blocked { opacity: .45; }
.rn-title { display: flex; align-items: center; gap: .3rem; }
.rn-have { font-style: normal; font-size: .68rem; color: var(--ink-dim); margin-left: auto; }
.rn-sub { display: block; font-family: var(--f-mono); font-size: .66rem; color: var(--ink-dim); }
.troop-chip { vertical-align: -2px; }

/* combat: compact, off to the side, with live orders of battle */
#modal.combat { width: min(30rem, 100%); margin-left: auto; margin-right: 2rem; }
.ob { display: grid; grid-template-columns: 1fr auto 1fr; gap: .6rem; align-items: start; margin: .7rem 0; }
.ob-side { display: flex; flex-direction: column; gap: .3rem; }
.ob-side.def { align-items: flex-end; }
.ob-name { font-family: var(--f-mono); font-size: .62rem; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-dim); }
.ob-unit { display: flex; align-items: center; gap: .3rem; font-size: .78rem; color: var(--ink-mid); }
.ob-side.def .ob-unit { flex-direction: row-reverse; }
.ob-unit b { font-family: var(--f-mono); color: var(--ink); }
.ob-vs { font-family: var(--f-display); color: var(--ink-dim); align-self: center; }
.ob-total { font-family: var(--f-mono); font-size: 1.3rem; color: var(--bronze); }

/* claimed Blessings and Champion Perks — a running record you can re-read
   later in the match, which is when you have forgotten what you took */
.owned { margin-top: .6rem; border-top: 1px solid var(--line-soft); padding-top: .5rem; }
.owned-h {
  font-family: var(--f-mono); font-size: .6rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-dim); margin-bottom: .35rem;
}
.boon-chip.perk { border-color: var(--bronze-dim); color: var(--bronze); }
.champion-mark, .holding-hit { cursor: help; }

/* ---------------- typography pass ---------------- */

.sel-title { font-family: var(--f-display); font-size: var(--t-h3); letter-spacing: .01em; }
.sel-sub   { font-size: var(--t-small); }
.sel-note  { font-size: var(--t-small); line-height: 1.5; }
.hintline  { font-size: var(--t-small); line-height: 1.5; }
.you-name  { font-size: var(--t-lead); letter-spacing: .01em; }
.you-patron{ font-size: var(--t-small); line-height: 1.5; }
.stat .k   { font-size: var(--t-micro); }
.stat .v   { font-size: 1.22rem; }
.log-entry { font-size: var(--t-small); }
#hintbar   { font-size: var(--t-body); }
.boon-chip { font-size: var(--t-small); padding: .16rem .48rem; }
.key-item  { font-size: var(--t-small); }
.slider-row .nm { font-size: var(--t-body); }
.slider-row .nm small { font-size: var(--t-small); }

/* numbers that sit in columns should line up */
.stat .v, .ct, .tally b, .score-table td.n, .tb-p .st { font-variant-numeric: tabular-nums; }


/* ---------------- map layers that the renderer emits ----------------
   These were being drawn with no stylesheet rule at all. The worst was
   .relief: the terrain motifs are authored in bone white and were only
   knocked back to 11% opacity inside tools/map-preview.js — so the exported
   preview looked right while the actual game drew them at FULL white. Every
   preview shared during development was therefore prettier than the board.
   Styling now lives here, where both the game and the preview read it. */
.relief      { opacity: .11; pointer-events: none; }
.carve       { pointer-events: none; }
.unrest-mark { pointer-events: auto; cursor: help; }
.world-light { pointer-events: none; }
.land-tex, .sea-tex { pointer-events: none; }
.region-content { pointer-events: none; }
.region-content .troop,
.region-content .holding-mark,
.region-content .champion-mark,
.region-content .unrest-mark,
.region-content .def-flag { pointer-events: auto; }
@media (max-width: 900px) {
  html, body { overflow: hidden; }
  #board {
    grid-template-columns: 1fr;      /* one column, never two */
    grid-template-rows: 1fr;
    position: relative;
  }

  #map-pane { grid-row: 1; min-height: 0; }
  #map-wrap { padding: .3rem; }
  /* the map keeps a strip of clear space so the collapsed sheet never sits
     on top of the southern territories */
  #map-pane { padding-bottom: 3.1rem; }   /* legend is desktop-only */
  #hintbar { padding: .4rem .6rem; font-size: var(--t-small); }

  #topbar { padding: .4rem .6rem; flex-wrap: wrap; gap: .4rem; }
  .tb-title { font-size: .95rem; }
  .tb-round { font-size: .66rem; }
  .tb-p { font-size: .72rem; padding: .2rem .4rem; }
  .tb-right .ghost { padding: .3rem .5rem; font-size: .72rem; }

  /* thumb-sized controls */
  .actions-grid { grid-template-columns: 1fr 1fr; gap: .4rem; }
  /* Explicit px, not rem: the root font here is 15px, so 2.85rem computed to
     42.75px and quietly landed under the 44px touch minimum. Touch targets are
     a physical measurement — state them physically. */
  #actions button { min-height: 46px; }
  .slider-row input[type=range] { height: 8px; }
  .slider-row input[type=range]::-webkit-slider-thumb { width: 1.6rem; height: 1.6rem; }
  .slider-row input[type=range]::-moz-range-thumb { width: 1.6rem; height: 1.6rem; }

  /* dialogs use the full screen rather than a centred card */
  #modal-layer, #pass-layer { padding: 0; align-items: flex-end; }
  #modal, #pass-card {
    width: 100%; max-width: none; max-height: 92vh;
    border-radius: 12px 12px 0 0; padding: 1.1rem 1rem 1.3rem;
  }
  #modal.combat { margin: 0; width: 100%; }
  .modal-actions { position: sticky; bottom: 0; background: var(--surface);
                   padding-bottom: .2rem; }
  .modal-actions button { flex: 1; min-height: 3rem; }
  .slider-row { grid-template-columns: 8.5rem 1fr 3.4rem; }
  .raise-row  { grid-template-columns: 8.5rem 1fr 3.4rem; }
  .key-grid { grid-template-columns: repeat(auto-fit, minmax(7.5rem, 1fr)); }
}

/* Touch has no hover, and the tooltips carry the rules. On a touch device
   they become tap targets instead. */
@media (hover: none) {
  [data-tip] { cursor: pointer; }
  #tip { max-width: min(20rem, calc(100vw - 1.5rem)); }
}

/* ---- phone: give the board its screen back ----
   Chrome was 269px of 812 (33%) before the map got a pixel: a top bar that
   wrapped onto four rows, plus a phase strip and a hint bar saying overlapping
   things. Target is ~11%. */

@media (max-width: 900px) {
  #topbar {
    flex-wrap: nowrap;             /* one row, never four */
    gap: .5rem;
    padding: .3rem .5rem;
    min-height: 0;
  }
  .tb-title { display: none; }     /* you know what game you are in */
  .tb-left  { gap: .4rem; flex: 0 0 auto; }
  .tb-round { font-size: .62rem; letter-spacing: .06em; white-space: nowrap; }

  .tb-players { flex: 1 1 auto; flex-wrap: nowrap; gap: .25rem; justify-content: center; }
  .tb-p {
    padding: .15rem .35rem; gap: .25rem; font-size: .7rem;
    border-radius: 10px;
  }
  .tb-p .dot { width: .5rem; height: .5rem; }
  .tb-p .st  { font-size: .72rem; color: var(--ink); font-weight: 700; }
  .tb-p .ai-tag { display: none; }

  .tb-right { flex: 0 0 auto; gap: .25rem; }
  .tb-right .ghost {
    padding: .28rem .4rem; font-size: 0;      /* label hidden, icon remains */
    min-width: 2rem; line-height: 1;
  }
  .tb-right .ghost::after { font-size: .85rem; }  #hintbar { padding: .35rem .6rem; line-height: 1.35; }
  /* a tighter stat block: this alone was 181px */
  #you { padding: .5rem .7rem; }
  #you .stats { gap: .35rem; margin-bottom: .35rem; }
  #you .stat { padding: .25rem .4rem; }
  #you .stat .v { font-size: 1rem; }
  #you .you-head { margin-bottom: .3rem; }
  #you .you-patron { display: none; }        /* shown on tap via the tooltip */
  #you .owned { margin-top: .4rem; padding-top: .35rem; }
  #selection, #actions { padding: .5rem .7rem; }}

/* ---- phone: the panel is furniture, not a drawer ----
   It used to slide up on select and down on action, which meant the board was
   either covered or the controls were hidden. It is now permanently docked,
   sized as a share of the screen, and scrolls internally — so the map sits
   above it at a stable size and never jumps. */

@media (max-width: 900px) {
  #board { grid-template-rows: 1fr; }
  #map-pane { padding-bottom: 0; }
  /* three numbers per player, colour-coded to the panel's stat tiles */
  .tb-p .n { font-family: var(--f-mono); font-size: .68rem; font-weight: 700; line-height: 1; }
  .tb-p .n.lv { color: var(--ink); }
  .tb-p .n.tr { color: var(--bronze); }
  .tb-p .n.vp { color: var(--verdigris); }
  .tb-p { gap: .2rem; padding: .15rem .3rem; }
  .tb-players { gap: .2rem; }
  .tb-right .ghost { min-width: 1.8rem; padding: .28rem .3rem; }
}

/* ============================================================
   FEEDBACK LAYER  (js/feedback.js)

   Announcements, refusals and stat deltas. Everything here is short, small and
   non-blocking; the global prefers-reduced-motion rule above kills every
   animation in this block, so each element's RESTING state is its visible one
   and nothing depends on a keyframe having run.
   ============================================================ */

#announce {
  position: absolute; left: 0; right: 0; top: 0;
  display: flex; flex-direction: column; align-items: center; gap: .4rem;
  padding: .55rem .6rem 0;
  pointer-events: none;                 /* the board underneath stays tappable */
  z-index: 25;                          /* under #modal-layer (40) by design */
}

.fx-card {
  pointer-events: auto;
  position: relative;                   /* the actor's colour bar hangs off this */
  width: min(26rem, 100%);
  min-height: 44px;                     /* it is tap-to-dismiss, so it is a target */
  display: grid; grid-template-columns: 18px 1fr;
  align-items: center; gap: .6rem;
  padding: .45rem .75rem .45rem .8rem;
  background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 78%);
  border: 1px solid var(--line);
  border-radius: 3px;
  box-shadow: 0 10px 26px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.045);
  overflow: hidden; cursor: pointer;
  animation: fx-in .18s cubic-bezier(.2,.7,.3,1) both;
}
.fx-card.out { opacity: 0; transform: translateY(-4px); transition: opacity .16s, transform .16s; }

/* The actor's colour, same convention as the chronicle. Absolute rather than a
   grid cell: a stretched grid item fills the CONTENT box, so inside a padded
   card it stopped 8px short at each end and read as a floating stub. */
.fx-bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.fx-ico { width: 18px; height: 18px; fill: currentColor; }
.fx-txt { display: flex; flex-direction: column; gap: .05rem; min-width: 0; }
.fx-eyebrow {
  font-family: var(--f-mono); font-size: var(--t-micro); letter-spacing: .16em;
  text-transform: uppercase; line-height: 1.1;
}
.fx-body { font-size: var(--t-small); color: var(--ink); line-height: 1.35; }

/* Tone drives the icon and eyebrow only. The surface stays constant so a run
   of announcements reads as one system rather than a traffic light. */
.fx-gain    { color: var(--bronze); }
.fx-loss    { color: #d98d89; }
.fx-renown  { color: var(--verdigris); }
.fx-coin    { color: var(--bronze-dim); }
.fx-neutral { color: var(--ink-mid); }
.fx-refusal { color: var(--ink-mid); }
.fx-refusal .fx-ico { color: var(--blood); }
.fx-refusal .fx-bar { background: var(--blood); }

/* Loud events earn a lit top edge — the one visual difference between "you
   built a Holding" and "your Champion is dead". */
.fx-loud { border-top-color: currentColor; box-shadow: 0 12px 30px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06); }
.fx-loud .fx-body { font-size: var(--t-body); }

@keyframes fx-in {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: none; }
}

/* ---- refused action ----
   The button is aria-disabled rather than disabled, so the tap still lands and
   the nudge marks WHICH control said no while the card says why. */
.ghost.is-off, .primary.is-off, .danger.is-off {
  opacity: .42; cursor: pointer;
}
.ghost.is-off:hover, .primary.is-off:hover, .danger.is-off:hover {
  background: var(--surface-2); border-color: var(--line);
}
.refused { animation: fx-nudge .3s ease; border-color: var(--blood) !important; }
@keyframes fx-nudge {
  0%, 100% { transform: none; }
  22%      { transform: translateX(-4px); }
  48%      { transform: translateX(4px); }
  74%      { transform: translateX(-2px); }
}

/* ---- stat delta ----
   Ends invisible via fill-mode, so it clears itself without asking the
   coalesced render loop for a repaint it does not otherwise need. */
.fx-delta {
  font-style: normal; font-family: var(--f-mono); font-size: .64rem;
  font-weight: 700; margin-left: .3rem; vertical-align: .14em;
  animation: fx-delta 2.4s ease-out both;
}
.fx-delta.up   { color: var(--verdigris); }
.fx-delta.down { color: #d98d89; }
@keyframes fx-delta {
  0%   { opacity: 0; transform: translateY(3px); }
  10%  { opacity: 1; transform: none; }
  76%  { opacity: 1; }
  100% { opacity: 0; }
}

/* ---- phone: announce where the player is actually looking ----
   Measured at 375x812: announcements were landing at y33-39 while the action
   buttons sat at y533-757. On a phone the panel is docked at the bottom and
   deliberately ordered actions-first, so both thumb and eye live in the lower
   third — and the feedback was 500px away at the top of the map. It was being
   missed entirely, which is the whole point of the feature.

   Anchored to the FOOT of the map instead, directly above the panel. Flex
   direction stays `column` so the newest card (appended last) sits closest to
   the panel, nearest the eye. Desktop keeps the top position: there the map is
   large, the sidebar is off to the right, and the bottom of the board is no
   nearer the controls than the top. */
@media (max-width: 900px) {
  #announce {
    top: auto; bottom: 0;
    padding: 0 .45rem .4rem;
    gap: .3rem;
  }
  .fx-card { width: 100%; }
}

/* ---- phone: most-used first ----
   In source order the panel runs stats → selection → actions → key →
   chronicle, which put the action buttons 721px down a 309px panel. On a
   phone the order is inverted to match how often you touch each one. */

@media (max-width: 900px) {  #actions      { order: 1; }   /* what you just tapped */
  #you          { order: 3; }   /* reference */
  #log          { order: 5; }}

/* ============================================================
   POPOVER PRIMITIVE

   Five overlays replace the docked panel: the region action popup, the region
   info bubble, the player menu, the chronicle and the how-to-play sheet. Built
   ad hoc that is five surfaces that drift apart. This is the one definition
   all of them consume; only the PRESENTATION differs, via a modifier.

   Elevation is stated here rather than implied. The --surface tokens existed
   but nothing said what a "raised" thing looks like, so every panel picked its
   own border and no shadow, which is most of why the interface read as flat.

     level 1  --surface    resting surface, hairline border, no lift
     level 2  --surface-2  raised: headers, chips, the popover itself
     level 3  --surface-3  interactive: pressed, focused, hovered

   Motion matches feedback.js exactly — 180ms in, 160ms out, no loop — because
   that timing is already approved and shipping. Nothing new is introduced, and
   the global prefers-reduced-motion rule kills all of it.
   ============================================================ */

:root {
  --elev-1: 0 1px 0 rgba(0,0,0,.25);
  --elev-2: 0 6px 18px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.3);
  --elev-3: 0 18px 44px rgba(0,0,0,.62), 0 0 0 1px rgba(0,0,0,.4);
  --pv-radius: 12px;
}

/* ---- the layer: catches the dismiss tap ---- */
.pv-layer {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(8,10,16,.55);
  backdrop-filter: blur(1.5px);
  display: flex;
  animation: pv-fade .18s ease both;
}
.pv-layer.is-closing { animation: pv-fade .16s ease reverse both; }
.pv-layer[hidden] { display: none; }

/* ---- the surface ---- */
.pv {
  background: linear-gradient(180deg, var(--surface-2) 0%, var(--surface) 30%);
  border: 1px solid var(--line);
  border-top: 2px solid var(--bronze-dim);
  border-radius: var(--pv-radius);
  box-shadow: var(--elev-3);
  display: flex; flex-direction: column;
  max-height: 82vh; min-width: 0;
  overflow: hidden;
}

/* ---- header: what this popover is about ---- */
.pv-head {
  display: flex; align-items: center; gap: .5rem;
  padding: .6rem .8rem;
  background: var(--surface-2);
  border-bottom: 1px solid var(--line-soft);
  font-family: var(--f-mono); font-size: var(--t-micro);
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--verdigris);
  flex: 0 0 auto;
}
.pv-head .pv-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pv-head .pv-sub   { color: var(--ink-dim); }
.pv-close {
  flex: 0 0 auto; background: none; border: none; color: var(--ink-mid);
  width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; line-height: 1; cursor: pointer; border-radius: 4px;
}
.pv-close:hover { background: var(--surface-3); color: var(--ink); }

.pv-body { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; padding: .8rem; touch-action: pan-y; }
.pv-body.flush { padding: 0; }

/* ---- presentation A: bottom sheet (the action popup on phone) ---- */
.pv--sheet { margin-top: auto; width: 100%; border-radius: var(--pv-radius) var(--pv-radius) 0 0; border-bottom: none; }
.pv-layer:has(.pv--sheet) { align-items: flex-end; }
.pv--sheet { animation: pv-rise .18s cubic-bezier(.2,.8,.3,1) both; }

/* ---- presentation B: anchored bubble (region info, near the region) ---- */
.pv--anchor { position: absolute; width: min(17rem, calc(100vw - 1.6rem)); animation: pv-pop .18s cubic-bezier(.2,.8,.3,1) both; }
.pv--anchor .pv-body { padding: .6rem .7rem; }

/* ---- presentation C: dropdown from the top bar ---- */
.pv--drop { position: absolute; top: 0; right: .4rem; width: min(22rem, calc(100vw - .8rem)); max-height: 76vh; animation: pv-drop .18s cubic-bezier(.2,.8,.3,1) both; }
/* ---- a labelled reference row: "Income  3 (+2 Holding)" ---- */
.pv-row { display: flex; align-items: baseline; gap: .6rem; padding: .3rem 0; font-size: var(--t-small); }
.pv-row + .pv-row { border-top: 1px solid var(--line-soft); }
.pv-row .k { flex: 0 0 6.2rem; font-family: var(--f-mono); font-size: var(--t-micro);
             letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); }
.pv-row .v { flex: 1 1 auto; color: var(--ink); min-width: 0; }

@keyframes pv-fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes pv-rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
@keyframes pv-pop  { from { opacity: 0; transform: scale(.97) } to { opacity: 1; transform: none } }
@keyframes pv-drop { from { opacity: 0; transform: translateY(-8px) } to { opacity: 1; transform: none } }

/* On a phone every popover becomes a bottom sheet: an anchored bubble at
   375px has nowhere to sit that is not on top of the thing it describes. */
@media (max-width: 900px) {
  .pv--anchor, .pv--drop {
    position: static; margin-top: auto; width: 100%;
    max-height: 62vh; border-radius: var(--pv-radius) var(--pv-radius) 0 0;
    animation: pv-rise .18s cubic-bezier(.2,.8,.3,1) both;
  }
  .pv-layer { align-items: flex-end; }
}


/* ============================================================
   TOP BAR CHROME — the panel's job, moved up

   The bar is one nowrap row and stays one nowrap row. Everything added here
   is either inside the existing 33px or below it as a 3px rule.
   ============================================================ */

/* Renown progress for whoever holds the turn. A rule, not a row: the bar has
   no height to give, and mid-turn what you read is "how close", not "412/600".
   The exact number is one tap away inside the player chip. */
#xp-strip {
  height: 3px; background: var(--line-soft); flex: 0 0 auto;
  position: relative; overflow: hidden;
}
#xp-fill {
  display: block; height: 100%; width: 0;
  background: var(--bronze); transition: width .3s ease;
}

/* Icon buttons: chronicle and how-to-play. 34px is under the 44px touch
   minimum on purpose — these are top-bar chrome, not primary controls, and
   the bar is 33px tall. The tap area is widened below on coarse pointers. */
.tb-icon {
  flex: 0 0 auto; background: none; border: none; padding: 0;
  width: 34px; height: 30px; border-radius: 4px; cursor: pointer;
  color: var(--ink-mid);
  display: flex; align-items: center; justify-content: center;
}
.tb-icon:hover { background: var(--surface-3); color: var(--ink); }
.tb-icon:focus-visible { outline: 2px solid var(--bronze); outline-offset: -2px; }

/* The player chips became buttons. Reset the UA styling without disturbing
   the layout the old divs had. */
/* The chips became buttons. Reset only what the UA imposes — the border is
   load-bearing, it is how the acting player is marked, and `border: none`
   here silently erased that indicator. */
.tb-p {
  font: inherit; color: inherit; cursor: pointer;
  -webkit-appearance: none; appearance: none; text-align: left;
}
.tb-p:focus-visible { outline: 2px solid var(--bronze); outline-offset: 1px; }

/* Hint bar doubles as the End Turn control once there is nothing left to
   spend. End Turn also lives in the region popup; this is the shortcut, so
   that ending a turn is not gated behind first tapping one of your regions. */
.hb-end {
  margin-left: auto; flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: .35rem;
  min-height: 34px; padding: .2rem .7rem;
  background: var(--bronze); color: #17120a; border: none; border-radius: 4px;
  font-family: var(--f-body); font-size: var(--t-small); font-weight: 640;
  cursor: pointer;
}
.hb-end:hover { background: #dba055; }
.hb-end:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ---- popover content pieces ---- */

/* the reference half of the region sheet, under the action grid */
.pv-info { padding: .6rem .8rem .2rem; border-top: 1px solid var(--line-soft); }

.pv-note { font-size: var(--t-small); color: var(--ink-mid); margin: .5rem 0 .2rem; line-height: 1.45; }
.pv-note.blood { color: #e0a09d; }

.pv-sec {
  font-family: var(--f-mono); font-size: var(--t-micro); letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-dim);
  margin: 1.1rem 0 .4rem; padding-top: .7rem; border-top: 1px solid var(--line-soft);
}
.pv-body > .pv-sec:first-child { margin-top: .2rem; padding-top: 0; border-top: none; }

.pv-foot {
  display: flex; gap: .6rem; justify-content: flex-end; flex-wrap: wrap;
  margin-top: 1.1rem; padding-top: .9rem; border-top: 1px solid var(--line-soft);
}
.pv-foot button { min-height: 44px; padding: .5rem 1.1rem; }
.pv-foot .primary { flex: 1 1 auto; justify-content: center; }
.pv-foot.top {
  margin: 0 0 .6rem; padding: 0 0 .8rem; justify-content: flex-start;
  border-top: none; border-bottom: 1px solid var(--line-soft);
}
.pv-foot.top button { min-height: 40px; }

/* actions-left counter in the region sheet header */
.pv-budget { font-family: var(--f-mono); color: var(--bronze); }
.pv-budget.spent { color: var(--blood); }
/* the popover's own copy of the domain legend, which used to be desktop-only
   in the phase strip; here it wraps instead of pushing right */
.pv .domains { margin-left: 0; gap: .5rem .85rem; margin-top: .2rem; }

/* ---- how-to-play: hosts get their silhouette beside the name ---- */
.ref-item.has-ico {
  display: grid; grid-template-columns: 22px 1fr; column-gap: .5rem;
  align-items: start;
}
.ref-item.has-ico b, .ref-item.has-ico span { grid-column: 2; }
.ref-ico { grid-column: 1; grid-row: 1 / span 2; margin-top: .1rem; }
.ref-only {
  font-style: normal; font-family: var(--f-mono); font-size: .68rem;
  color: var(--verdigris); letter-spacing: .06em;
}

/* A coarse pointer gets a bigger target than a mouse does, without changing
   the bar's height — the padding grows into the row, not past it. */
@media (hover: none) {
  .tb-icon { width: 40px; }
}


/* ============================================================
   TOUCH TARGETS — measured on the running page, not assumed

   The player chips became buttons when the "you" panel moved inside them, and
   measured 14.7px tall: they inherited the old div's padding, which never had
   to be tappable. The bar goes to 44px on a phone and every control in it
   fills that height. Chrome cost is 4px; the panel that went away was 38vh.

   Stated in px, not rem. The root font is 15px and 2.85rem silently computed
   to 42.75px last time this was done in rem.
   ============================================================ */

.pv-close { width: 44px; height: 44px; }

@media (max-width: 900px) {
  /* No vertical padding: the 44px children set the height. Left as .3rem it
     stacked on top of them and the bar measured 54px. */
  #topbar { min-height: 44px; padding: 0 .5rem; }

  /* The visible chip stays small; the BUTTON is 44px tall and centred on it,
     so the target is full height without the bar looking taller than it is. */
  .tb-p { min-height: 44px; }

  .tb-icon { width: 44px; height: 44px; }

  /* the hint bar's End Turn shortcut is a primary control */
  .hb-end { min-height: 44px; }
}


/* ============================================================
   CAMERA — pinch, drag, wheel

   Custom gestures, so the browser must not claim them: touch-action none on
   the map only, never on the page.
   ============================================================ */

#map-wrap {
  touch-action: none; cursor: grab;
  /* A fast two-finger touch can otherwise trigger iOS's long-press callout
     (copy/share menu) or a text-selection highlight mid-gesture — another
     system UI competing for the same touch, and another source of the delay
     scaling with how "confident" the gesture looks. Both are pure liability
     on a map with no text to select and no content to share. */
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
#map-wrap:active { cursor: grabbing; }

#cam-ctl {
  position: absolute; right: .5rem; bottom: .5rem; z-index: 5;
  display: flex; flex-direction: column; gap: .3rem;
}
#cam-ctl button {
  width: 44px; height: 44px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--line); border-radius: 6px;
  color: var(--ink-mid); font-family: var(--f-mono); font-size: 1.1rem; line-height: 1;
  box-shadow: var(--elev-2); cursor: pointer;
}
#cam-ctl button:hover { background: var(--surface-3); color: var(--ink); }
#cam-ctl button[hidden] { display: none; }


/* ---- Holding income, stamped on the piece ----
   The number was always derivable and never shown: reading a board meant
   knowing the tier table AND whether the Domain was complete. Verdigris when
   a Domain or a Boon has raised it above the flat tier value, so the doubling
   is visible on the board the moment it happens. */
.hold-inc {
  font-family: var(--f-mono); font-size: 11px; font-weight: 700;
  text-anchor: middle; fill: var(--bronze);
  paint-order: stroke; stroke: rgba(6,8,13,.92); stroke-width: 2.6px;
}
.hold-inc.boosted { fill: var(--verdigris); }
.hold-inc.restive { fill: var(--ink-dim); }
.as-icons {
  display: grid; grid-template-columns: repeat(6, 1fr);
  gap: 2px; margin-bottom: .3rem;
}
.as-ico {
  min-height: 44px; padding: 0; border: none; border-radius: 6px;
  background: none; color: var(--ink-mid); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background .12s, color .12s;
}
.as-ico:hover  { background: var(--surface-3); color: var(--ink); }
.as-ico.on     { background: var(--surface-3); color: var(--bronze); }
.as-ico.is-off { color: var(--ink-dim); }
.as-ico.is-off.on { color: var(--blood); }
.as-ico:focus-visible { outline: 2px solid var(--bronze); outline-offset: -2px; }

/* the rail */
.as-range {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 44px; margin: 0; background: none; cursor: pointer;
  display: block;
}
.as-range::-webkit-slider-runnable-track {
  height: 6px; border-radius: 3px;
  background: linear-gradient(90deg, var(--bronze-dim), var(--verd-dim));
}
.as-range::-moz-range-track {
  height: 6px; border-radius: 3px;
  background: linear-gradient(90deg, var(--bronze-dim), var(--verd-dim));
}
.as-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bronze); border: 3px solid var(--ground);
  box-shadow: var(--elev-2); margin-top: -11px;
}
.as-range::-moz-range-thumb {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bronze); border: 3px solid var(--ground);
  box-shadow: var(--elev-2);
}
.as-range:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }.r2-count {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 44px; margin: 0; background: none; cursor: pointer;
}
.r2-count::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--surface-3); }
.r2-count::-moz-range-track { height: 6px; border-radius: 3px; background: var(--surface-3); }
.r2-count::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 28px; height: 28px; border-radius: 50%; margin-top: -11px;
  background: var(--bronze); border: 3px solid var(--ground); box-shadow: var(--elev-2);
}
.r2-count::-moz-range-thumb {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bronze); border: 3px solid var(--ground); box-shadow: var(--elev-2);
}
.r2-count:disabled { opacity: .4; cursor: not-allowed; }
.r2-count:disabled::-webkit-slider-thumb { background: var(--ink-dim); }
.r2-count:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }
.ref-raises {
  font-family: var(--f-mono); font-size: var(--t-micro); letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-dim); display: inline;
}
.ref-none { color: var(--ink-dim); font-style: italic; }


/* ============================================================
   THE STRIP — controls that float over the board

   The sheet this replaces was 383px of an 812px screen: half the map, with a
   dead board behind it. The strip sits over the board and does NOT block it —
   the layer stops taking pointer events, so tapping another territory switches
   to it instead of dismissing first. That is the point of the whole pattern.
   ============================================================ */

.pv-layer.is-strip {
  background: none; backdrop-filter: none;
  pointer-events: none;                 /* the map underneath stays live */
  align-items: flex-end;
}
.pv--strip {
  pointer-events: auto;                 /* ...but the strip itself is tappable */
  width: 100%; margin-top: auto;
  max-height: none;
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--surface) 92%, transparent),
    color-mix(in srgb, var(--ground)  96%, transparent));
  border: none; border-top: 1px solid var(--bronze-dim);
  border-radius: 14px 14px 0 0;
  box-shadow: 0 -10px 30px rgba(0,0,0,.5);
  padding: .45rem .55rem .55rem;
  animation: pv-rise .18s cubic-bezier(.2,.8,.3,1) both;
}

/* line 1: where you are, and the info toggle */
.st-top { display: flex; align-items: center; gap: .5rem; padding: 0 .15rem .3rem; }
.st-where {
  flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--f-mono); font-size: var(--t-micro); letter-spacing: .1em;
  text-transform: uppercase; color: var(--verdigris);
}
.st-where em { font-style: normal; color: var(--bronze); margin-left: .5rem; }
.st-where em.spent { color: var(--blood); }
.st-where em.spending { color: var(--bronze); }
.st-i {
  flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-mid);
  font-family: var(--f-display); font-size: .9rem; line-height: 1; cursor: pointer;
}
.st-i.on { border-color: var(--verd-dim); color: var(--verdigris); }

/* line 2: the action icons */
.st-icons { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.st-icons .as-ico {
  min-height: 38px; padding: 0; border: none; border-radius: 6px;
  background: none; color: var(--ink-mid); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.st-icons .as-ico:hover { background: var(--surface-3); color: var(--ink); }
.st-icons .as-ico.on { background: var(--surface-3); color: var(--bronze); }
.st-icons .as-ico.is-off { color: var(--ink-dim); }
.st-icons .as-ico.is-off.on { color: var(--blood); }

/* line 3: cancel, readout, confirm — RISK's shape */
.st-foot { display: flex; align-items: center; gap: .55rem; margin-top: .25rem; }
.st-x, .st-ok {
  flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%;
  border: 2px solid; font-size: 1.35rem; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.st-x  { border-color: var(--blood); color: #e8b6b4;
         background: color-mix(in srgb, var(--blood) 18%, var(--surface-2)); }
.st-ok { border-color: var(--verd-dim); color: #bfe4db;
         background: color-mix(in srgb, var(--verdigris) 20%, var(--surface-2)); }
.st-ok.is-off { border-color: var(--line); color: var(--ink-dim); background: var(--surface-2); }
.st-x:focus-visible, .st-ok:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.st-read { flex: 1 1 auto; min-width: 0; }
/* Named for what they are, not for where they sit: the sweep in rule 1 checks
   emitted classes against the stylesheet, and a descendant selector makes a
   class it styles look unstyled. */
.as-name, .rz-name {
  display: block; font-family: var(--f-display); font-size: var(--t-lead);
  color: var(--ink); line-height: 1.15;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.as-why, .rz-rule {
  display: block; font-style: normal; font-size: var(--t-micro);
  color: var(--ink-mid); line-height: 1.3; margin-top: .1rem;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.as-why.blocked, .rz-rule.blocked { color: #e0a09d; }

/* the running total in the strip header */
.rz-tally { font-style: normal; }

/* every icon Icons.svg emits */
.icn { flex: 0 0 auto; }

/* the "i" panel, folded away until asked for */
.st-info {
  margin-top: .5rem; padding-top: .45rem; border-top: 1px solid var(--line-soft);
  max-height: 34vh; overflow-y: auto; touch-action: pan-y;
}
.st-info[hidden] { display: none; }

/* ---- raise: kinds on the left, amount on the right ---- */
.rz { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; align-items: center; }

.rz-kinds {
  display: flex; gap: 3px; overflow-x: auto; overflow-y: hidden;
  -webkit-overflow-scrolling: touch; padding-bottom: 2px;
  touch-action: pan-x;
  scrollbar-width: none;
}
.rz-kinds::-webkit-scrollbar { display: none; }
.rk {
  flex: 0 0 auto; position: relative;
  width: 44px; min-height: 46px; padding: .2rem 0 0;
  display: flex; flex-direction: column; align-items: center; gap: .1rem;
  background: var(--surface-2); border: 1px solid transparent; border-radius: 6px;
  color: var(--ink); cursor: pointer;
}
.rk.on { border-color: var(--bronze); background: color-mix(in srgb, var(--bronze) 14%, var(--surface-2)); }
.rk.is-hard { opacity: .45; }
.rk-ico { display: flex; align-items: center; justify-content: center; height: 20px; }
.rk-cost { font-family: var(--f-mono); font-size: .62rem; font-weight: 700; line-height: 1; }
.rk-cost.on      { color: var(--verdigris); }
.rk-cost.off     { color: var(--blood); }
.rk-cost.blocked { color: var(--ink-dim); }
.rk-n {
  position: absolute; top: -5px; right: -4px; min-width: 16px; height: 16px;
  border-radius: 8px; background: var(--bronze); color: #17120a;
  font-family: var(--f-mono); font-size: .6rem; font-weight: 700; line-height: 16px;
  text-align: center; opacity: 0; transition: opacity .12s;
}
.rk-n.has { opacity: 1; }

.rz-amt { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto;
          column-gap: .5rem; align-items: center; }
.rz-note {
  grid-column: 1 / -1;
  font-family: var(--f-mono); font-size: .6rem; letter-spacing: .08em;
  text-transform: uppercase; color: var(--ink-dim); line-height: 1;
}
.rz-note.on      { color: var(--verdigris); }
.rz-note.off     { color: var(--blood); }
.rz-note.blocked { color: var(--ink-dim); }
.rz-n { text-align: right; }
.r2-amt-n { font-family: var(--f-mono); font-size: var(--t-h3); font-weight: 700; color: var(--ink-dim); }
.r2-amt-n.has { color: var(--bronze); }

/* the amount rail — kept, per preference, over a value carousel: one drag
   reaches 20 Levy where a carousel would be a long scrub */
.rz-slide { position: relative; }
.r2-count {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 44px; margin: 0; background: none; cursor: pointer;
}
/* RISK-style stops: a tick per unit under the rail so a drag has somewhere
   to aim for, rather than a bare track with no sense of scale. Sits just
   under the 6px track, clear of the 44px touch box above it. */
.rz-ticks { position: relative; height: 8px; margin-top: -16px; pointer-events: none; }
.rz-ticks i {
  position: absolute; top: 0; width: 2px; height: 5px; border-radius: 1px;
  background: var(--surface-3); transform: translateX(-1px);
}
.rz-ticks i.on   { background: var(--bronze); }
.rz-ticks i.end  { height: 8px; background: var(--ink-dim); }
.rz-ticks i.end.on { background: var(--bronze); }
.r2-count::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--surface-3); }
.r2-count::-moz-range-track { height: 6px; border-radius: 3px; background: var(--surface-3); }
.r2-count::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 26px; height: 26px; border-radius: 50%; margin-top: -10px;
  background: var(--bronze); border: 3px solid var(--ground); box-shadow: var(--elev-2);
}
.r2-count::-moz-range-thumb {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--bronze); border: 3px solid var(--ground); box-shadow: var(--elev-2);
}
.r2-count:disabled { opacity: .4; cursor: not-allowed; }
.r2-count:disabled::-webkit-slider-thumb { background: var(--ink-dim); }
.r2-count:focus-visible { outline: 2px solid var(--bronze); outline-offset: 2px; }

/* the action rail inside the strip */
.pv--strip .as-range {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 40px; margin: 0; background: none; cursor: pointer; display: block;
}
.pv--strip .as-range::-webkit-slider-runnable-track {
  height: 5px; border-radius: 3px;
  background: linear-gradient(90deg, var(--bronze-dim), var(--verd-dim));
}
.pv--strip .as-range::-moz-range-track {
  height: 5px; border-radius: 3px;
  background: linear-gradient(90deg, var(--bronze-dim), var(--verd-dim));
}
.pv--strip .as-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 24px; height: 24px; border-radius: 50%; margin-top: -9.5px;
  background: var(--bronze); border: 3px solid var(--ground); box-shadow: var(--elev-2);
}
.pv--strip .as-range::-moz-range-thumb {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--bronze); border: 3px solid var(--ground); box-shadow: var(--elev-2);
}

/* ============================================================
   GESTURE PERFORMANCE

   The board carries three full-map feTurbulence layers under
   mix-blend-mode:overlay. Procedural per-pixel noise on a non-cacheable
   compositing path: the browser keeps the result only while the paint is
   static, and every viewBox write throws it away and recomputes the lot.
   That was the second-long lag behind a pinch.

   Two defences. While fingers are down the camera writes a CSS transform
   instead of the viewBox, so the compositor reuses the raster it already has
   and nothing repaints. And the noise is dropped whenever the board is not at
   rest, so the single commit paint on release is cheap too.
   ============================================================ */

#map-wrap { overflow: hidden; }        /* the transformed board is clipped */

/* The board is promoted to its own compositor layer ONCE, here, rather than at
   the start of every gesture. Doing it per-gesture meant the browser had to
   rasterise the whole 1340x960 board into a fresh texture before the first
   frame of a pinch could move — a stall at the start of the gesture and then
   perfect smoothness after, which is exactly how it felt.

   Nothing is hidden mid-gesture any more either. Suppressing the texture
   layers when a gesture began forced a full repaint at the worst possible
   moment, and bought nothing: the transform reuses the existing raster, so
   those layers cost nothing while the fingers are down. */
#map {
  will-change: transform;
  transform-origin: 0 0;
}

/* is-zoomed texture-hiding removed: it saved ~1-2ms on the commit paint and
   cost real texture for as long as a player stayed zoomed in — most of real
   play, not the rare case it assumed. renderMap()'s static/dynamic split
   made the commit paint cheap by a much larger margin without that cost. */

</style>
</head>
