  },

  preferredUnits(pi, id) {
    const P = AI.personality(pi);
    const avail = Rules.availableUnits(pi);
    return P.units.filter(u => avail.includes(u)).concat(['levy']);
  },

  /* ================= turns ================= */

  turnStep() {
    const pi = UI.actingIndex();
    const p = G.players[pi];

    if (AI.shouldSurrender(pi)) { Rules.surrender(pi); if (G.phase !== 'gameover') UI.endTurn(); return; }

    const isReaction = G.phase === 'reaction';
    if (isReaction && G.reactionActionTaken) { UI.endTurn(); return; }

    if (!isReaction && Rules.actionsLeft(pi) <= 0) { UI.endTurn(); return; }

    const act = AI.bestAction(pi);
    if (!act) { UI.endTurn(); return; }

    if (act.kind === 'build') Rules.buildHolding(pi, act.id);
    else if (act.kind === 'monument') Rules.raiseMonument(pi, act.amount);
    else if (act.kind === 'raise') Rules.raiseHost(pi, act.id, act.unit);
    else if (act.kind === 'move') {
      if (!Object.keys(act.stack).length) { UI.endTurn(); return; }
      /* Bring the Champion when the fight is worth it and losing it is
         unlikely — it dies for good, so the AI only commits it to attacks it
         expects to win, and always to the defence of its own Throne. */
      const bringChampion = AI.wantsChampion(pi, act);
      if (act.hostile) {
        if (!isReaction) Rules.spendAction();
        Combat.begin(pi, act.src, act.to, act.stack, { champion: bringChampion });
        if (AI.shouldWatch(G.pendingCombat)) UI.openCombat();
        return;                                  // combat drives the next steps
      }
      Rules.march(pi, act.src, act.to, act.stack, { champion: bringChampion });
    }

    if (!isReaction && act.kind !== 'move') Rules.spendAction();
    else if (!isReaction && act.kind === 'move') Rules.spendAction();

    if (isReaction) { G.reactionActionTaken = true; UI.endTurn(); return; }
    if (Rules.actionsLeft(pi) <= 0) UI.endTurn();
  },

  /* Committing the Champion is the one irreversible decision in the game, so
     the bar is deliberately high. Early simulations had the aggressive
     temperaments losing their Champion in 85% of matches — they were pouring
     Perks into a piece they then threw away, which is exactly the trap a new
     player falls into. */
  wantsChampion(pi, act) {
    const p = G.players[pi];
    if (p.championDead || !Rules.championAt(pi, act.src)) return false;
    const P = AI.personality(pi);
    const perkStake = p.perks.length;                    // more invested, more cautious

    if (!act.hostile) {
      // ride along only into safe ground you already own or are simply claiming
      return AI.threatTo(pi, act.to) === 0;
    }
    const force = Object.values(act.stack).reduce((a, b) => a + b, 0);
    const def = AI.defenceOf(act.to, act.stack);
    const bar = (2.4 + perkStake * 0.25) / Math.max(0.8, P.championWeight);
    return def > 0 && force >= def * bar;
  },

  shouldSurrender(pi) {
    if (!Rules.canSurrender(pi)) return false;
    const p = G.players[pi];
    return p.fallen && Rules.regionsOf(pi).length <= 1 && Rules.totalHosts(pi) <= 2;
  },

  /* ================= combat ================= */

  combatStep() {
    const c = G.pendingCombat;
    AI.autoCasualties();
    if (!G.pendingCombat) return;

    if (c.finished) {
      if (AI.shouldWatch(c)) { UI.openCombat(); return; }   // wait for the human to dismiss
      Combat.dismiss();
      const p = G.players[UI.actingIndex()];
      if (G.phase === 'reaction') { G.reactionActionTaken = true; UI.endTurn(); }
      else if ((p._acted || 0) >= 7) { p._acted = 0; UI.endTurn(); }
      return;
    }

    const P = AI.personality(c.attacker);
    const mine = stackSize(c.force);
    const theirs = Rules.hostCount(G.regions[c.target]);

    // press on while the odds hold; a Warmonger holds on longer than a Magnate
    if (mine > 0 && theirs > 0 && mine < theirs * (0.75 * P.risk) && mine < 4) {
      Combat.withdraw();
    } else {
      Combat.exchange();
      AI.autoCasualties();
    }
    if (AI.shouldWatch(c)) UI.openCombat();
  },

  autoCasualties() {
    let job;
    while ((job = Combat.currentCasualtyJob())) {
      const order = Object.keys(job.pool).filter(u => job.pool[u] > 0)
        .sort((a, b) => UNITS[a].cost - UNITS[b].cost);
      const give = {}; let left = job.losses;
      for (const u of order) {
        const take = Math.min(left, job.pool[u]);
        if (take > 0) { give[u] = take; left -= take; }
        if (left <= 0) break;
      }
      Combat.applyCasualties(give);
    }
  },

  /* ================= blessings ================= */

  /* The level-up fork. Aggressive temperaments invest in the Champion,
     builders in their empire — but nobody feeds a dead Champion. */
  chooseBoon() {
    const pb = G.pendingBoon;
    const p = G.players[pb.player];
    const P = AI.personality(pb.player);
    const rank = (list, prefs) => list.map(b => ({
      b, s: prefs.indexOf(b.id) >= 0 ? prefs.length - prefs.indexOf(b.id) : 0
    })).sort((x, y) => y.s - x.s)[0];

    const bestBless = pb.blessings.length ? rank(pb.blessings, P.boons) : null;
    const bestPerk = (!p.championDead && pb.perks.length) ? rank(pb.perks, P.perks || []) : null;

    let pick;
    if (!bestPerk) pick = bestBless && bestBless.b;
    else if (!bestBless) pick = bestPerk.b;
    else {
      // championWeight above 1 means this temperament would rather build the hero
      const perkScore = (bestPerk.s + 1) * P.championWeight;
      const blessScore = bestBless.s + 1;
      pick = perkScore > blessScore ? bestPerk.b : bestBless.b;
    }
    Rules.takeBoon((pick || pb.blessings[0] || pb.perks[0]).id);
  }

      </filter>
      <!-- One light source for the entire landmass. Lighting each territory
           separately made every cell look individually lit, like tiles;
           a single gradient across the whole continent gives the map one
           coherent sun and reads as terrain. -->
      <linearGradient id="worldLight" x1="0%" y1="0%" x2="72%" y2="100%">
        <stop offset="0%"   stop-color="#ffffff" stop-opacity=".16"/>
        <stop offset="42%"  stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity=".34"/>
      </linearGradient>
      <filter id="shelfBlur" x="-15%" y="-15%" width="130%" height="130%">
        <feGaussianBlur stdDeviation="3.5"/>
      </filter>
      <filter id="tgtGlow" x="-25%" y="-25%" width="150%" height="150%">
        <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#67a89a" flood-opacity=".8"/>
      </filter>

      <!-- Texture. Fractal noise rendered once into a tile and repeated as a
           pattern: land gets a coarse stone grain, sea a slower swell. Both
           sit at low opacity so they add tooth without muddying the colour. -->
      <filter id="grainStone" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="5" seed="7" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
        <feComponentTransfer><feFuncA type="linear" slope="1.5" intercept="-.12"/></feComponentTransfer>
      </filter>
      <!-- Land texture proper: fractal noise driven through diffuse lighting
           so it produces real highlights and shadow rather than flat speckle.
           This is what makes the ground look like ground. -->
      <filter id="landRelief" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="5"
                      seed="11" result="bump"/>
        <feDiffuseLighting in="bump" lighting-color="#fdf6e6" surfaceScale="3.2"
                           diffuseConstant="1" result="lit">
          <feDistantLight azimuth="308" elevation="52"/>
        </feDiffuseLighting>
      </filter>
      <filter id="grainFibre" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.014 0.24" numOctaves="3" seed="41" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
      <filter id="grainSwell" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.022 0.05" numOctaves="3" seed="19" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
      <pattern id="landGrain" width="220" height="220" patternUnits="userSpaceOnUse">
        <rect width="220" height="220" filter="url(#grainStone)" opacity=".30"/>
      </pattern>
      <pattern id="landFibre" width="${MAP_W}" height="${MAP_H}" patternUnits="userSpaceOnUse">
        <rect width="${MAP_W}" height="${MAP_H}" filter="url(#grainFibre)" opacity=".13"/>
      </pattern>
      <pattern id="seaGrain" width="${MAP_W}" height="${MAP_H}" patternUnits="userSpaceOnUse">
        <rect width="${MAP_W}" height="${MAP_H}" filter="url(#grainSwell)" opacity=".09"/>
      </pattern>
    </defs>`;
  },


  /* ---------------- terrain relief ----------------

     Scattered motifs drawn inside each territory so the land reads as
     terrain rather than a coloured shape: peaks in a Mine, furrows in
     Farmland, swell off a Port, cracks across a Waste. Positions are found
     by rejection sampling inside the territory outline, seeded from the
     region id, so they are identical on every load and never wander outside
     their own borders. Generated once and cached — the terrain never
     changes, only who owns it. */

  _relief: {},
  _deferred: false,   /* a render arrived mid-gesture; see renderMap() */

  pointInPolygon(pt, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a.y > pt.y) !== (b.y > pt.y) &&
          pt.x < ((b.x - a.x) * (pt.y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
    }
    return inside;
  },

  reliefMotif(type, r) {
    const a = (0.7 + r() * 0.6);                    // per-motif size jitter
    switch (type) {
      case 'mine':                                   // rock peaks
        return `<path d="M${-7 * a},${4 * a} L${-1.5 * a},${-5 * a} L${1 * a},${-1 * a}
                         L${3 * a},${-3.5 * a} L${7 * a},${4 * a} Z"/>`;
      case 'forge':                                  // slag heaps and a spark
        return `<path d="M${-6 * a},${3 * a} Q0,${-4 * a} ${6 * a},${3 * a} Z"/>`;
      case 'farmland':                               // ploughed furrows
        return `<path d="M${-7 * a},0 Q0,${-3 * a} ${7 * a},0" fill="none" stroke-width="1.5"/>
                <path d="M${-7 * a},${3.5 * a} Q0,${0.5 * a} ${7 * a},${3.5 * a}" fill="none" stroke-width="1.5"/>`;
      case 'port':                                   // swell
        return `<path d="M${-7 * a},0 q${3.5 * a},${-3 * a} ${7 * a},0 t${7 * a},0"
                      fill="none" stroke-width="1.6"/>`;
      case 'shrine':                                 // standing stones
        return `<rect x="${-5 * a}" y="${-4 * a}" width="${2 * a}" height="${8 * a}" rx="${0.6 * a}"/>
                <rect x="${-1 * a}" y="${-5.5 * a}" width="${2 * a}" height="${9.5 * a}" rx="${0.6 * a}"/>
                <rect x="${3 * a}" y="${-4 * a}" width="${2 * a}" height="${8 * a}" rx="${0.6 * a}"/>`;
      case 'waste':                                  // fissures
        return `<path d="M${-6 * a},${-4 * a} L${-2 * a},${0} L${-4 * a},${4 * a}"
                      fill="none" stroke-width="1.4"/>
                <path d="M${2 * a},${-4.5 * a} L${5 * a},${0.5 * a} L${2.5 * a},${4 * a}"
                      fill="none" stroke-width="1.4"/>`;
      case 'throne':                                 // city blocks
        return `<rect x="${-6 * a}" y="${-2 * a}" width="${4 * a}" height="${4 * a}"/>
                <rect x="${-0.5 * a}" y="${-4 * a}" width="${3 * a}" height="${6 * a}"/>
                <rect x="${4 * a}" y="${-1.5 * a}" width="${3 * a}" height="${3.5 * a}"/>`;
      default:
        return '';
    }
  },

  layerRelief(id) {
    if (MapView._relief[id] !== undefined) return MapView._relief[id];

    const R = REGIONS[id];
    const poly = R.poly;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of poly) {
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }

    const rand = mulberry32(hash32('relief:' + id));
    const want = { mine: 7, forge: 6, farmland: 7, port: 6, shrine: 4, waste: 7, throne: 5 }[R.type] || 0;
    const marks = [];
    let guard = 0;

    while (marks.length < want && guard++ < 400) {
      const pt = { x: minX + rand() * (maxX - minX), y: minY + rand() * (maxY - minY) };
      if (!MapView.pointInPolygon(pt, poly)) continue;
      // keep clear of the label and the piece rows in the middle of the cell
      if (Math.abs(pt.x - R.centre.x) < 62 && Math.abs(pt.y - R.centre.y) < 46) continue;
      if (marks.some(m => Math.hypot(m.x - pt.x, m.y - pt.y) < 42)) continue;
      marks.push(pt);
    }

    const body = marks.map(m => {
      const rot = (rand() * 16 - 8).toFixed(1);
      return `<g transform="translate(${m.x.toFixed(1)},${m.y.toFixed(1)}) rotate(${rot})">`
        + MapView.reliefMotif(R.type, rand) + `</g>`;
    }).join('');

    const out = body
      ? `<g class="relief" fill="#f2efe8" stroke="#f2efe8" stroke-linecap="round"
           stroke-linejoin="round" clip-path="url(#clip_${id})">${body}</g>`
      : '';
    MapView._relief[id] = out;
    return out;
  },

  /* ---------------- layers ----------------
     Each returns a string; renderMap stacks them in paint order. A new visual
     element is now a new small function rather than another twenty lines in
     the middle of an existing one. */

  /* The territory outline, as an SVG path. Borders are fractal curves shared
     between neighbours (see map.js), not straight polygon edges. */
  path(id) {
    return REGIONS[id].d;
  },

  layerSea() {
    return `<rect x="0" y="0" width="${MAP_W}" height="${MAP_H}" fill="url(#sea)"/>`
         + `<rect class="sea-tex" x="0" y="0" width="${MAP_W}" height="${MAP_H}" fill="url(#seaGrain)"/>`;
  },

  /* The camera's viewBox is sized to match the pane's own aspect ratio at
     every zoom level, so no zoom level ever letterboxes. That is correct once
     the viewBox is small enough to fit inside the board (roughly k >= 2.7 —
     the "fill" zoom); below that, matching the pane's (tall, narrow) aspect
     forces the viewBox TALLER than the board's own 960 units of content — up
     to 1646 extra units at k=1. Nothing has ever been painted out there, so
     that band read as raw transparency, which the game's own dark ground
     colour behind the SVG turns into a near-black gap. It affects the entire
     zoomed-OUT half of the range, tapering to zero exactly at fill zoom —
     which is why it showed up specifically "zooming back out."

     Fixed by painting UNDER everything, generously past any plausible
     viewBox extent on any device aspect, in the sea gradient's own outermost
     tone — so what over-scrolls into that band reads as more sea, not a
     hole in the world. */
  layerVoid() {
    return `<rect x="-2400" y="-3400" width="${MAP_W + 4800}" height="${MAP_H + 6800}"
              fill="#1e4b6b" pointer-events="none"/>`;
  },

  /* The whole continent as one silhouette so it casts a single shadow.
     Shadowing each territory separately made the board read as scattered
     tiles rather than land. */
  /* A pale shelf where the land meets the sea — the halo sits under the
     territories so only the sliver outside each coastline shows. */
  /* Shallows read off the COASTLINE now, not off every cell — hanging a
     halo on each territory outlined the internal borders too and made the
     whole thing look like tiles floating side by side. */
  /* Bathymetry. Concentric bands stroked along the coastline itself, so the
     water shelves away from the land in the land's own shape rather than in
     a circle. Shallow and bright at the shore, deep and cold further out. */
  layerShelf() {
    const bands = [
      { w: 210, c: '#245878', o: .45 },
      { w: 156, c: '#2a6288', o: .50 },
      { w: 110, c: '#316d95', o: .55 },
      { w: 72,  c: '#3a7ba5', o: .60 },
      { w: 42,  c: '#478db8', o: .66 },
      { w: 18,  c: '#59a3cc', o: .72 }
    ];
    return `<g filter="url(#shelfBlur)" pointer-events="none">`
      + bands.map(b => `<use href="#coastline" fill="none" stroke="${b.c}"
          stroke-opacity="${b.o}" stroke-width="${b.w}"/>`).join('')
      + `</g>`;
  },

  /* Drawn last so it falls across every territory equally. Clipped to the
     union of the land, so the sea keeps its own gradient. */
  layerWorldLight() {
    return `<rect class="world-light" x="0" y="0" width="${MAP_W}" height="${MAP_H}"
      fill="url(#worldLight)"/>`;
  },

  /* The dark bed the continent sits on, and the source of its single drop
     shadow. It MUST be clipped to the coastline: these are the raw Voronoi
     cells, which tile the entire canvas, so unclipped this laid a black sheet
     over the whole sea. Sampling the rendered pixels showed #0d0d16 — the
     landmass fill — everywhere the water should have been. */
  layerLandmass() {
    return `<g filter="url(#landShadow)" clip-path="url(#clip_coast)">`
      + Object.keys(REGIONS).map(id => `<use href="#tp_${id}" fill="#0e1017"/>`).join('')
      + `</g>`;
  },

  /* Domain frontiers. Each domain's territories are stroked heavily here,
     underneath the fills — the fills then cover the inner half of every
     stroke, so interior borders vanish and only the domain's outer edge
     survives. One pass, no edge topology to compute. */
  layerFrontiers() {
    let out = '';
    for (const dk in DOMAINS) {
      const cells = REGION_DEFS.filter(d => d.domain === dk)
        .map(d => `<use href="#tp_${d.id}"/>`).join('');
      out += `<g class="domain-edge" fill="none" stroke="${DOMAINS[dk].tint}"
        stroke-opacity=".38" stroke-width="7" stroke-linejoin="round">${cells}</g>`;
    }
    return out;
  },

  /* The Holding, with what it actually pays stapled to it. Reading a board
     used to mean knowing the tier table by heart AND remembering whether the
     Domain was complete; the number was always derivable and never shown. */
  partHolding(rs, c, id) {
    if (rs.holding < 1) return '';
    const owner = rs.owner;
    const pays = owner === null ? 0 : Rules.holdingIncome(owner, id);
    const restive = rs.unrest > 0;
    const base = HOLDING_INCOME[rs.holding - 1];
    const boosted = pays > base;

    const tip = '<b>Holding, tier ' + rs.holding + '</b><br>'
      + (restive
          ? 'Restive — pays nothing until you hold it through a Turn.'
          : 'Pays <b>+' + pays + '</b> Tribute each Round'
            + (boosted ? ' (tier ' + rs.holding + ' is ' + base
                 + ', doubled or raised by a Domain or a Boon)' : ''))
      + (rs.holding >= 2 ? '<br>Adds a defence die unless the attacker brings Siege' : '')
      + (rs.holding < 3 ? '<br>Upgradeable to tier ' + (rs.holding + 1) + '.' : '<br>Fully developed.');

    const label = restive ? '+0' : '+' + pays;
    const cls = 'hold-inc' + (restive ? ' restive' : boosted ? ' boosted' : '');

    return `<g class="holding-mark" data-tip="${tip.replace(/"/g, '&quot;')}"
      transform="translate(${c.x + 30},${c.y - 14})">
      <rect x="-13" y="-20" width="26" height="40" fill="transparent"/>
      ${MapView.holdingShape(rs.holding)}
      <text class="${cls}" x="0" y="19">${label}</text></g>`;
  },

  partUnrest(rs, c) {
    if (!(rs.unrest > 0)) return '';
    const tip = '<b>Restive</b><br>Freshly conquered. Produces no Income and cannot be developed '
      + 'until you have held it through one of your own Turns.';
    return `<g class="unrest-mark" data-tip="${tip}" transform="translate(${c.x - 22},${c.y + 12})">
      <circle r="7" fill="rgba(10,12,18,.85)" stroke="#b0534f" stroke-width="1.4"/>
      <path d="M0,-3.6 V1.2 M0,3 V4.2" stroke="#e0a09d" stroke-width="1.6" stroke-linecap="round"/></g>`;
  },

  /* Troop pieces, not a bare number, so a Phalanx wall is visible at a glance
     instead of something to go and read in a panel. */
  partTroops(id, rs, c, owner) {
    if (Rules.hostCount(rs) < 1) return '';
    const kinds = Object.keys(rs.hosts).filter(u => rs.hosts[u] > 0);
    const col = owner !== null ? G.players[owner].colour.hex : '#8b8b96';

    /* Pieces are authored small and scaled up here, so the silhouette detail
       is actually visible. At this size four across would overflow the
       narrower territories, so the row wraps at three and stacks. */
    const SCALE = PIECE_SCALE;
    const PX = 42, PY = 46, PER_ROW = 3;
    const rows = Math.ceil(kinds.length / PER_ROW);
    const py0 = c.y + 38 - (rows - 1) * PY / 2;

    let out = kinds.map((u, i) => {
      const row = Math.floor(i / PER_ROW);
      const inRow = Math.min(PER_ROW, kinds.length - row * PER_ROW);
      const col0 = i % PER_ROW;
      const x = c.x + (col0 - (inRow - 1) / 2) * PX;
      const y = py0 + row * PY;

      const tip = '<b>' + UNITS[u].name + '</b> &middot; ' + UNITS[u].cost + 't<br>'
        + UNITS[u].rule + '<br><i style="color:var(--ink-dim)">' + UNITS[u].flavour + '</i>';
      return `<g class="troop" data-tip="${tip.replace(/"/g, '&quot;')}"
        transform="translate(${x.toFixed(1)},${y.toFixed(1)})">
        <rect x="-20" y="-22" width="40" height="50" fill="transparent"/>
        <g transform="scale(${SCALE})">${MapView.troopShape(u, col)}</g>
        <text class="troop-n" x="0" y="26">${rs.hosts[u]}</text></g>`;
    }).join('');

    const d = MapView.defenceRating(id);
    if (d.dice > 2) {
      const tip = '<b>Rolls ' + d.dice + ' defence dice</b><br>' + d.notes.join(' &middot; ');
      // sits clear of the piece block, whose height now depends on the rows
      const flagY = py0 + (rows - 1) * PY + 34;
      out += `<g class="def-flag" data-tip="${tip}" transform="translate(${c.x + 34},${flagY.toFixed(1)})">
        <rect x="-12" y="-9" width="24" height="17" rx="2" fill="rgba(10,12,18,.9)"
              stroke="#67a89a" stroke-width="1.2"/>
        <text x="0" y="3.5" class="def-n">${d.dice}D</text></g>`;
    }
    return out;
  },

  partChampion(id, c) {
    const champ = G.players.findIndex(p => !p.surrendered && !p.championDead && p.championAt === id);
    if (champ < 0) return '';
    const cp = G.players[champ], cc = cp.colour.hex;
    const perks = cp.perks.length
      ? cp.perks.map(k => {
          const x = CHAMPION_PERKS.find(z => z.id === k);
          return x ? '<b>' + x.name + '</b> — ' + x.text : '';
        }).filter(Boolean).join('<br>')
      : 'No Perks taken yet.';
    const tip = '<b>' + esc(cp.name) + "'s Champion</b><br>Adds +" + Rules.championBonus(champ)
      + ' to the highest die where it stands. Marches ' + Rules.championMarchRange(champ)
      + '. If its stack is wiped with no Warden present it dies <b>permanently</b>.<br><br>' + perks;
    return `<g class="champion-mark" data-tip="${tip.replace(/"/g, '&quot;')}"
      transform="translate(${c.x - 38},${c.y + 4})">
      <circle r="18" fill="none" stroke="${cc}" stroke-opacity=".3" stroke-width="2"/>
      <circle r="14" fill="${cc}" stroke="#f2efe8" stroke-width="2" filter="url(#pieceShadow)"/>
      <g fill="#12141c" stroke="none">
        <path d="M-4.6,-6.9 L-5.1,-10.5 L-2.6,-7.7 L0,-11.7 L2.6,-7.7 L5.1,-10.5 L4.6,-6.9 Z"/>
        <circle cx="0" cy="-4.2" r="4.3"/>
        <path d="M-2,2.2 L-6.6,3.1 L-9,6.2 A10.9,10.9 0 0 0 9,6.2 L6.6,3.1 L2,2.2 L0,5.9 Z"/>
      </g></g>`;
  },

  layerTerritory(id, ctx) {
    const def = REGIONS[id], rs = G.regions[id], owner = rs.owner, c = def.centre;
    const fill = owner !== null ? `url(#fill${owner})` : `url(#wild_${def.domain})`;

    /* State classes. `mine` / `foe` / `open` let the stylesheet distinguish
       whose ground it is without recolouring the fill, and `actionable`
       marks territory the current player can actually do something with. */
    const cls = ['region'];
    if (id === ctx.sel) cls.push('selected');
    if (ctx.targets[id]) cls.push('target');
    if (ctx.marching && !ctx.targets[id] && id !== ctx.sel) cls.push('dim');
    if (owner === ctx.viewer) {
      cls.push('mine');
      if (!ctx.marching && Rules.hostCount(rs) > 1) cls.push('actionable');
    } else if (owner === null) cls.push('open');
    else cls.push('foe');
    if (rs.unrest > 0) cls.push('restive');

    let out = `<g class="${cls.join(' ')}" data-region="${id}">`;
    out += `<use class="fill" href="#tp_${id}" fill="${fill}"></use>`;
    out += `<use class="grain" href="#tp_${id}" fill="url(#landGrain)"></use>`;
    out += MapView.layerRelief(id);

    /* Carved edge: the outline stroked thickly but clipped to its own shape,
       so only the inner half survives and the territory reads as pressed
       into the land rather than laid on top of it. */
    out += `<use class="carve" href="#tp_${id}" fill="none" stroke="#05060a"
      stroke-opacity=".42" stroke-width="9" clip-path="url(#clip_${id})"></use>`;

    /* An inset outline in the owner's colour reads as a carved edge and,
       more usefully, makes whose land it is legible from across the board
       without relying on fill brightness alone. */
    if (owner !== null) {
      out += `<use class="rim" href="#tp_${id}" fill="none"
        stroke="${G.players[owner].colour.hex}" stroke-opacity=".55" stroke-width="2.4"></use>`;
    }

    return out + `</g>`;
  },

  /* Names, pieces, keeps and flags — drawn in a SECOND pass, after every
     territory's ground is down. In one pass a marker sitting near a border
     was painted over by whichever territory happened to be drawn next, which
     is what was swallowing the defence flags on Coldharbour and Bramblewatch.
     Carries the same data-region so clicking a piece still selects its
     territory. */
  layerContent(id, ctx) {
    const def = REGIONS[id], rs = G.regions[id], owner = rs.owner, c = def.centre;
    const cls = ['region-content'];
    if (ctx.marching && !ctx.targets[id] && id !== ctx.sel) cls.push('dim');

    let out = `<g class="${cls.join(' ')}" data-region="${id}">`;
    out += `<g class="glyph" transform="translate(${c.x},${c.y - 26})" fill="rgba(242,239,232,.42)"
      stroke="rgba(242,239,232,.42)" stroke-linecap="round">${MapView.glyph(def.type)}</g>`;
    out += `<text class="region-name" x="${c.x}" y="${c.y + 2}">${esc(def.name)}</text>`;
    out += MapView.partHolding(rs, c, id);
    out += MapView.partUnrest(rs, c);
    out += MapView.partTroops(id, rs, c, owner);
    out += MapView.partChampion(id, c);
    return out + `</g>`;
  },

  /* Move the highlight WITHOUT rebuilding the board.

     Selection is nothing but three classes — see .region.selected / .target /
     .dim in style.css. It used to go through renderMap(), which regenerates
     roughly a megabyte of markup, reparses ~980 nodes and invalidates every
     turbulence filter on the board. That is a full repaint to move a glow, and
     it ran on every single tap. This retoggles the classes already on the
     nodes already there, and touches nothing else.

     Anything that changes what a territory CONTAINS — hosts, holdings, owner —
     still needs a real renderMap(). This is only for what is highlighted. */
  paintSelection() {
    const svg = $('#map');
    if (!svg) return;
    const sel = G.selected;
    const marching = UI.mode === 'march';
    const targets = (marching && sel) ? UI.marchTargets(sel) : {};
    svg.querySelectorAll('.region').forEach(el => {
      const id = el.dataset.region;
      el.classList.toggle('selected', id === sel);
      el.classList.toggle('target', !!targets[id]);
      el.classList.toggle('dim', marching && !targets[id] && id !== sel);
    });
    svg.querySelectorAll('.region-content').forEach(el => {
      const id = el.dataset.region;
      el.classList.toggle('dim', marching && !targets[id] && id !== sel);
    });
  },

  /* renderMap() used to replace the WHOLE svg.innerHTML on every call — every
     tap, every AI action, every turn. Measured on a populated board: ~13-16ms
     of JS alone, ~33-39ms once renderTop/renderHint/etc. are included, and
     that is THIS machine; a phone will be slower. AI.step() calls this every
     280-1300ms via UI.renderSoon() for as long as an AI is acting, on the
     main thread, which is exactly why panning stuttered specifically during
     AI turns — pointermove events queue up behind whatever renderMap() call
     is running and land in a burst once it finishes.

     None of that cost needed to be paid every time. mapDefs/layerVoid/
     layerSea/layerShelf/layerLandmass/layerFrontiers/layerWorldLight and the
     land-tex/coastline overlay depend on nothing but fixed map geometry and
     each player's OWN colour — never on turn state — and carry every
     feTurbulence filter on the board. Rebuilding them via innerHTML forces
     the browser to re-rasterise those filters from scratch regardless of
     whether their source markup changed, because a full innerHTML replace

     bottleneck was throwing the terrain away and asking the browser to

       on, which drops the implicit pointer capture the browser gave it. Even

       an AI turn was fighting a full board rebuild several times a second.

       currently touching — applied to the board rather than to a dialog. */

       rebound — addEventListener on a fresh node is the only kind there is. */

function mix(hex, withHex, amount) {
  const h = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16));
  const [r1, g1, b1] = h(hex), [r2, g2, b2] = h(withHex);
  const c = (a, b) => Math.round(a * amount + b * (1 - amount)).toString(16).padStart(2, '0');

/* One floating tooltip, positioned against the viewport so nothing can clip
   it. Bound once and driven by any element carrying data-tip. */
(function initTips() {
  const el = document.createElement('div');
  el.id = 'tip';
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(el));
  if (document.body) document.body.appendChild(el);

  const show = t => {
    const host = t.closest('[data-tip]');
    if (!host) return;
    el.innerHTML = host.getAttribute('data-tip');
    el.classList.add('on');
    const r = host.getBoundingClientRect();
    const b = el.getBoundingClientRect();
    let x = r.left + r.width / 2 - b.width / 2;
    let y = r.top - b.height - 8;
    if (y < 6) y = r.bottom + 8;                       // flip below when tight at the top
    x = Math.max(6, Math.min(x, window.innerWidth - b.width - 6));
    y = Math.max(6, Math.min(y, window.innerHeight - b.height - 6));
    el.style.left = Math.round(x) + 'px';
    el.style.top = Math.round(y) + 'px';
  };
  const hide = () => el.classList.remove('on');

  document.addEventListener('mouseover', e => {
    if (e.target.closest && e.target.closest('[data-tip]')) show(e.target);
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest && e.target.closest('[data-tip]')) hide();
  });

  /* Touch has no hover, and these bubbles carry the rules — what a unit does,
     where XP comes from, what a Holding is worth. On a touch device a tap
     opens the bubble and the next tap anywhere closes it, so a phone player
     still gets every explanation. The tap that opens a tooltip is NOT
     swallowed: tapping a troop still selects its territory underneath. */
  const touch = matchMedia('(hover: none)').matches;
  if (touch) {
    document.addEventListener('click', e => {
      const host = e.target.closest && e.target.closest('[data-tip]');
      if (host) { show(e.target); } else { hide(); }
    }, true);
    window.addEventListener('scroll', hide, true);
  }
})();

      if (!r.width || !r.height) return null;
      c._rect = { left: r.left, top: r.top, width: r.width, height: r.height };
      return c._rect;
    },

    view() {
      const r = UI.cam.rect();
      if (!r) return null;
      const A = r.width / r.height;
      const w = Math.max(MAP_W, MAP_H * A) / UI.cam.k;
      return { w: w, h: w / A, r: r };
    },

    fillK() {
      const r = UI.cam.rect();
      if (!r) return 2.7;
      const A = r.width / r.height;
      return Math.max(MAP_W, MAP_H * A) / (MAP_H * A);
    },

    clampNow() {
      const c = UI.cam;
      c.k = Math.max(c.MIN, Math.min(c.MAX, c.k));
      const v = c.view();
      if (!v) return null;
      c.cx = v.w >= MAP_W ? MAP_W / 2 : Math.max(v.w / 2, Math.min(MAP_W - v.w / 2, c.cx));
      c.cy = v.h >= MAP_H ? MAP_H / 2 : Math.max(v.h / 2, Math.min(MAP_H - v.h / 2, c.cy));
      return v;
    },

    schedule() {
      const c = UI.cam;
      c.clampNow();
      if (c._raf) return;
      c._raf = requestAnimationFrame(() => { c._raf = 0; c.paint(); });
    },

    paint() {
      const c = UI.cam;
      const svg = $('#map');
      const v = c.clampNow();
      if (!svg || !v) return;
      svg.setAttribute('viewBox',
        (c.cx - v.w / 2).toFixed(2) + ' ' + (c.cy - v.h / 2).toFixed(2) + ' '
        + v.w.toFixed(2) + ' ' + v.h.toFixed(2));
      /* Used to hide .land-tex/.sea-tex above k=1.02 to make the commit paint
         cheaper. Measured: it saved ~1-2ms, and cost real texture on the board
         for as long as a player stayed zoomed in at all — which is most of
         actual play, not the rare exception it was written for, and it read
         as the whole map greying. renderMap()'s own static/dynamic split
         below made the commit paint cheap by a much larger margin than this
         ever did, so the trade is no longer worth making at any zoom. */
      const fit = $('#cam-fit');
      if (fit) fit.hidden = c.k <= c.MIN + 0.01;
      c.warm();
    },

    /* First call only: pick a starting zoom instead of opening on MIN (the
       whole-CANVAS, most-zoomed-out view). The first version of this fit to
       MAP_W/MAP_H — the shared 1340x960 canvas both maps are authored
       against — which is correct for the default map (a compact landmass
       that roughly fills that canvas) and WRONG for Tennessee, a long,
       short shape that only occupies the canvas's middle band. Fitting to
       the canvas left Tennessee small in a sea of dead space above and
       below — the exact "small map" complaint this was meant to fix, just
       moved to the additive map. Fit to the ACTIVE map's own rendered
       content bounds instead, via #coastline's real getBBox() — exact, and
       correct for whatever shape the current map turns out to have, not
       just the one this was tested against last time. Still clamped into
       [MIN, MAX]: an extremely elongated map can hit MAX without fully
       fitting its long axis, same as the original map already requires
       some panning to see beyond a portrait screen's width at its own
       default zoom — that is expected, not a bug, and the camera already
       supports it. */
    _defaultSet: false,
    apply() {
      const c = UI.cam;
      if (!c._defaultSet) {
        c._defaultSet = true;
        const r = c.rect();
        const coast = document.getElementById('coastline');
        if (r && r.width && r.height && coast) {
          const A = r.width / r.height;
          const bb = coast.getBBox();
          /* Fit CONTENT HEIGHT, not "whichever dimension avoids cropping
             either one" — the latter barely zoomed in at all for Tennessee
             (a wide, short shape: its own width is already most of the
             canvas width, so "don't crop width" produced a k of ~1.1, only
             fractionally past the original bug). The already-validated
             default for the original map fills height and accepts that
             width needs panning on a portrait screen — matching that
             principle here, rather than inventing a different one, is what
             actually fixes it. An extremely elongated map can still clamp
             at MAX without fully fitting its long axis; that is the same
             expected tradeoff, not a new problem. */
          const fillK = Math.max(MAP_W, MAP_H * A) / (bb.height * A);
          c.k  = Math.max(c.MIN, Math.min(c.MAX, fillK));
          c.cx = bb.x + bb.width / 2;
          c.cy = bb.y + bb.height / 2;
        }
      }
      c.stale();
      c.paint();
    },

    /* Re-measure the board OFF the critical path.

       getBoundingClientRect on #map forces a synchronous layout of the whole
       ~980-node SVG: 7ms cold here, 26ms straight after a viewBox write, and
       far worse on a phone. begin() used to do exactly that at the instant a
       gesture started, and commit() threw the cache away so the NEXT gesture
       started cold too. That was the stall at the beginning of a pinch.

       The measurement now happens in a frame of its own, after the paint has
       settled, so by the time fingers land the number is already there. */
    /* Never invalidate the cache WHILE a gesture is live.

       render() calls this on every repaint — including ones that have nothing
       to do with the camera, like an AI turn updating the board while the
       player is mid-drag. rect() does not check _live before it measures, so
       nulling the cache here would make the very next pointermove of an
       ONGOING pan hit the same forced-layout cost gesture-start already paid
       once and fixed — except now paid repeatedly, mid-drag, every time
       something else happens to render. That reads as scrolling stuttering
       for no visible reason, because the reason is a background AI move the
       player never asked about. The pane's own box realistically doesn't
       resize mid-gesture anyway; commit() unconditionally invalidates once
       the gesture ends, and warm() picks up any real change from there. */
    stale() { if (!UI.cam._live) UI.cam._rect = null; },
    warm() {
      const c = UI.cam;
      if (c._warmRaf) return;
      c._warmRaf = requestAnimationFrame(() => {
        c._warmRaf = 0;
        if (c._live) return;          /* never re-measure mid-gesture */
        c._rect = null;
        c.rect();
      });
    },

    /* ---- direct (non-gesture) zoom: buttons, wheel ---- */
    zoomAt(factor, clientX, clientY) {
      const c = UI.cam;
      const v = c.view();
      if (!v || !isFinite(factor) || factor <= 0) return;
      const k0 = c.k;
      const k1 = Math.max(c.MIN, Math.min(c.MAX, k0 * factor));
      if (k1 === k0) return;
      const mx = (c.cx - v.w / 2) + ((clientX - v.r.left) / v.r.width)  * v.w;
      const my = (c.cy - v.h / 2) + ((clientY - v.r.top)  / v.r.height) * v.h;
      const sc = k1 / k0;
      c.k  = k1;
      c.cx = mx + (c.cx - mx) / sc;
      c.cy = my + (c.cy - my) / sc;
      c.schedule();
    },

    panBy(dxPx, dyPx) {
      const c = UI.cam;
      const v = c.view();
      if (!v) return;
      const u = v.w / v.r.width;
      c.cx -= dxPx * u;
      c.cy -= dyPx * u;
      c.schedule();
    },

    /* ================= live gesture ================= */

    begin() {
      const c = UI.cam;
      if (c._live) return;
      const svg = $('#map');
      if (!svg) return;
      const r = c.rect();          /* already warm; see warm() above */
      const v = c.clampNow();
      if (!r || !v) return;
      c._base = { x: c.cx - v.w / 2, y: c.cy - v.h / 2, w: v.w, h: v.h, k: c.k };
      c._gs = 1; c._tx = 0; c._ty = 0;
      c._live = true;
      /* Nothing is written to the element here on purpose.

         This used to set will-change and add an is-gesturing class. Both were
         one-off costs paid at the exact moment the gesture started: the first
         promoted the whole board to a fresh GPU layer, and the second hid the
         texture layers, which forced a full repaint. That is why a pinch was
         slow to start and then perfectly smooth once moving — all the work was
         at the front.

         The layer is now promoted permanently in the stylesheet, so it already
         exists, and the texture is left alone because nothing repaints during
         a gesture anyway. begin() is now pure bookkeeping. */
    },

    /* keep the visible window inside the board while dragging, so nothing has
       to snap back on release */
    clampLive() {
      const c = UI.cam;
      if (!c._live) return;
      const r = c._rect, b = c._base;
      const w2 = b.w / c._gs, h2 = b.h / c._gs;
      const x2 = b.x - (c._tx * b.w) / (c._gs * r.width);
      const y2 = b.y - (c._ty * b.h) / (c._gs * r.height);
      const cx2 = w2 >= MAP_W ? (MAP_W - w2) / 2 : Math.max(0, Math.min(MAP_W - w2, x2));
      const cy2 = h2 >= MAP_H ? (MAP_H - h2) / 2 : Math.max(0, Math.min(MAP_H - h2, y2));
      if (cx2 !== x2) c._tx = (b.x - cx2) * c._gs * r.width  / b.w;
      if (cy2 !== y2) c._ty = (b.y - cy2) * c._gs * r.height / b.h;
    },

    gZoom(f, clientX, clientY) {
      const c = UI.cam;
      if (!c._live || !isFinite(f) || f <= 0) return;
      const r = c._rect;
      if (!r) return;
      const kNow = c._base.k * c._gs;
      const kNew = Math.max(c.MIN, Math.min(c.MAX, kNow * f));
      const ff = kNew / kNow;
      if (ff === 1) return;
      const ax = clientX - r.left, ay = clientY - r.top;
      c._tx = ax - (ax - c._tx) * ff;
      c._ty = ay - (ay - c._ty) * ff;
      c._gs *= ff;
      c.clampLive();
      c.pushTransform();
    },

    gPan(dx, dy) {
      const c = UI.cam;
      if (!c._live) return;
      c._tx += dx; c._ty += dy;
      c.clampLive();
      c.pushTransform();
    },

    pushTransform() {
      const c = UI.cam;
      if (c._traf) return;
      c._traf = requestAnimationFrame(() => {
        c._traf = 0;
        const svg = $('#map');
        if (!svg || !c._live) return;
        svg.style.transform =
          'translate(' + c._tx.toFixed(2) + 'px,' + c._ty.toFixed(2) + 'px) '
          + 'scale(' + c._gs.toFixed(5) + ')';
      });
    },

    /* Fold the transform into the camera and repaint sharp, exactly once. */
    commit() {
      const c = UI.cam;
      if (!c._live) return;
      const svg = $('#map');
      const r = c._rect, b = c._base;
      c._live = false;
      if (r && b) {
        const w2 = b.w / c._gs, h2 = b.h / c._gs;
        const x2 = b.x - (c._tx * b.w) / (c._gs * r.width);
        const y2 = b.y - (c._ty * b.h) / (c._gs * r.height);
        c.k  = b.k * c._gs;
        c.cx = x2 + w2 / 2;
        c.cy = y2 + h2 / 2;
      }
      c._gs = 1; c._tx = 0; c._ty = 0; c._base = null;
      if (c._traf) { cancelAnimationFrame(c._traf); c._traf = 0; }
      if (svg) svg.style.transform = '';
      c.paint();                   /* cache survives; warm() refreshes it */

      /* Flush any board rebuild that arrived while the finger was down. The
         gesture is over, so it is safe to replace the nodes now — and the
         board must not be left showing a state the game has already moved
         past (an AI captured a territory mid-drag, say). */
      if (MapView._deferred) { MapView._deferred = false; MapView.renderMap(); }
    },

    reset() {
      const c = UI.cam;
      c.k = 1; c.cx = MAP_W / 2; c.cy = MAP_H / 2;
      c.paint();
    },

    step(f) {
      const c = UI.cam;
      const r = c.rect();
      if (!r) return;
      c.zoomAt(f, r.left + r.width / 2, r.top + r.height / 2);
    },

    pair() {
      const v = [...UI.cam._pts.values()];
      return v.length >= 2 ? [v[0], v[1]] : null;
    },

    seedPinch() {
      const c = UI.cam;
      const p = c.pair();
      if (!p) { c._dist = 0; c._mid = null; return; }
      c._dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
      c._mid  = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
    },

    wire() {
      const wrap = $('#map-wrap');
      if (!wrap || UI.cam._wired) return;
      UI.cam._wired = true;
      const c = UI.cam;

      /* DO NOT capture on pointerdown. A captured pointer retargets the click
         the browser sends on release to the CAPTURING element, so every tap
         landed on #map-wrap instead of the .region underneath and the board
         went dead. Capture is taken only once a gesture has committed. */
      const grab = id => {
        if (c._held != null) return;
        try { wrap.setPointerCapture(id); c._held = id; } catch (err) {}
      };
      const release = () => {
        if (c._held == null) return;
        const id = c._held;
        c._held = null;      /* cleared FIRST: releasing fires
                                lostpointercapture, which must not re-enter */
        try { wrap.releasePointerCapture(id); } catch (err) {}
      };

      wrap.addEventListener('pointerdown', e => {
        /* preventDefault ONLY from the second finger onward.

           It is here to stop iOS Safari running its own pinch recognizer
           alongside ours. But on the FIRST finger it also suppresses the
           compatibility mouse events a touch generates — which is how a tap
           becomes a click, and a click is the only thing that selects a
           territory. touch-action:none already declines browser panning for
           single-finger drags, so the first pointerdown needs nothing here;
           only the pinch does. */
        if (c._pts.size >= 1) e.preventDefault();

        /* SELF-HEALING.

           A phantom pointer can never be detected by "_pts is empty" — that
           is exactly the state an abandoned one prevents from ever
           happening. A gesture ends here on pointerup/pointercancel/
           lostpointercapture; if the OS drops all three for one finger (a
           system gesture stealing the touch, an interrupted capture, the app
           losing focus mid-pinch — none reproducible from a synthetic event
           in this environment), that finger's entry sits in _pts forever,
           because nothing is ever coming to remove it.

           The signal that actually works is TIME. Two fingers of one real
           pinch land within milliseconds of each other, and an ongoing
           gesture keeps refreshing _lastAt on every move. So: a previously
           unseen pointerId landing more than a quarter-second after the
           gesture last made a sound is not finger two of anything — it is a
           new, unrelated touch arriving on top of dead bookkeeping. Left
           alone, that stale entry lets a plain tap get read as half of a
           phantom pinch (ignored — "doesn't register"), or leaves capture
           stuck on #map-wrap so a click meant to dismiss a popover's backdrop
           never reaches it (stuck open — "the whole map gets shaded"). */
        const now = e.timeStamp;
        if (!c._pts.has(e.pointerId) && c._pts.size > 0 && (now - c._lastAt) > 250) {
          if (c._live) c.commit();
          if (c._held != null) { try { wrap.releasePointerCapture(c._held); } catch (err) {} }
          c._pts.clear();
          c._mode = null; c._anchor = null; c._dist = 0; c._mid = null;
          c._moved = false; c._held = null;
        }
        c._lastAt = now;

        c._pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (c._pts.size === 1) {
          c._mode = null;
          c._moved = false;
          c._anchor = { x: e.clientX, y: e.clientY };
        } else if (c._pts.size === 2) {
          /* Seed the baseline the instant the second finger lands. A frame
             late meant the travel in that frame read as an instant jump. */
          c._mode = 'pinch';
          c._moved = true;
          c.begin();
          c.seedPinch();
          grab(e.pointerId);
        }
      }, { passive: false });      /* explicit: preventDefault must not be ignored */

      wrap.addEventListener('pointermove', e => {
        if (!c._pts.has(e.pointerId)) return;
        c._lastAt = e.timeStamp;     /* the gesture is alive; see staleness check above */
        c._pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (c._mode === 'pinch') {
          const p = c.pair();
          if (!p || !c._mid) return;
          const dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
          const mid  = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
          if (c._dist > 0 && dist > 0) {
            /* two fingers pan as well as zoom */
            c.gPan(mid.x - c._mid.x, mid.y - c._mid.y);
            c.gZoom(dist / c._dist, mid.x, mid.y);
          }
          c._dist = dist;
          c._mid  = mid;
          return;
        }

        if (!c._anchor) return;
        const dx = e.clientX - c._anchor.x, dy = e.clientY - c._anchor.y;
        /* Below this the touch is still a tap, not a pan — without SOME
           threshold a finger that merely wobbles while tapping would drag the
           board instead of selecting the territory underneath it. This is
           also most of what reads as "a slight delay before scrolling
           starts": the board is correctly not moving yet, because the game
           cannot tell a drag from a tap until the finger has actually moved.
           5px is close to the smallest gap that still reliably tells the two
           apart — a real tap rarely drifts that far even on a phone. */
        if (c._mode !== 'pan' && Math.hypot(dx, dy) < 5) return;
        if (c._mode !== 'pan') {
          c._mode = 'pan'; c._moved = true;
          c.begin();
          grab(e.pointerId);
        }
        c.gPan(dx, dy);
        c._anchor = { x: e.clientX, y: e.clientY };
      });

      const end = e => {
        if (!c._pts.delete(e.pointerId)) return;

        if (c._pts.size === 1) {
          /* THE LIFT JUMP. The anchor held where the FIRST finger landed, so
             the survivor resumed panning from there and the board leapt.
             Re-seed to where the remaining finger actually is. */
          const rest = [...c._pts.values()][0];
          c._anchor = { x: rest.x, y: rest.y };
          c._mode = 'pan';
          c._dist = 0;
          c._mid = null;
          return;
        }

        if (c._pts.size === 0) {
          release();
          c.commit();              /* the one and only viewBox write */
          c._mode = null;
          c._anchor = null;
          c._dist = 0;
          c._mid = null;
          if (c._moved) { c.swallow = true; setTimeout(() => { c.swallow = false; }, 0); }
          c._moved = false;
        }
      };
      wrap.addEventListener('pointerup', end);
      wrap.addEventListener('pointercancel', end);

      /* lostpointercapture must NOT end the gesture. This was mine, added in
         an earlier pass on the reasoning that losing capture means the OS took
         the touch away. It does not — and routing it into end() is what made
         a drag die after exactly one move while the thumb was still down:

           1. A touch lands on a .region path. On touch, the browser IMPLICITLY
              captures the pointer to the element that was hit.
           2. The first pointermove crosses the threshold and pans once.
           3. Any render — an AI turn fires one every 280-1300ms — replaces the
              territory groups, so the node holding that implicit capture is
              detached from the document.
           4. Detaching a node that holds capture fires lostpointercapture.
           5. end() ran, deleted the pointer from _pts, and every subsequent
              pointermove hit the `!_pts.has(id)` guard and was discarded.

         The finger never lifted. Nothing was cancelled. We simply stopped
         listening, which is why moving slower or faster made no difference —
         speed was never the variable. Losing capture only means events go back
         to normal hit-testing and bubble to this same handler, so the correct
         response is to forget our capture bookkeeping and carry on. */
      wrap.addEventListener('lostpointercapture', e => {
        if (c._held === e.pointerId) c._held = null;
      });

      wrap.addEventListener('wheel', e => {
        e.preventDefault();
        const f = e.ctrlKey ? Math.exp(-e.deltaY * 0.01)
                            : (e.deltaY < 0 ? 1.12 : 1 / 1.12);
        c.zoomAt(f, e.clientX, e.clientY);
      }, { passive: false });

      /* iOS Safari runs its own pinch on the PAGE and touch-action does not
         stop it, so two fingers zoomed the document as well as the board. */
      ['gesturestart', 'gesturechange', 'gestureend'].forEach(t =>
        wrap.addEventListener(t, ev => ev.preventDefault(), { passive: false }));
      wrap.addEventListener('touchmove', ev => {
        if (ev.touches && ev.touches.length > 1) ev.preventDefault();
      }, { passive: false });
      wrap.addEventListener('dblclick', ev => ev.preventDefault());

      const on = (id, fn) => {
        const b = $(id);
        if (b) b.addEventListener('click', ev => { ev.stopPropagation(); fn(); });
      };
      on('#cam-in',  () => c.step(1.35));
      on('#cam-out', () => c.step(1 / 1.35));
      on('#cam-fit', () => c.reset());

      /* If the viewport changes size WHILE a gesture is live, end the gesture
         instead of continuing to trust stale geometry.

         _rect is captured once at begin() and deliberately never re-measured
         during a live gesture — that caching is what made pinch/pan smooth.
         But it means the transform math runs against a box that can silently
         stop matching reality: the commonest real-world trigger is a mobile
         browser's address bar collapsing AS THE USER SCROLLS, which resizes
         the viewport mid-touch. stale() already refuses to touch _rect while
         live (on purpose, see its own comment), so a plain resize handler
         does nothing useful mid-gesture — the cached box just keeps being
         used, at the wrong size, until the finger lifts. committing here
         ends the gesture cleanly on the CORRECT geometry it started with,
         and the next gesture measures fresh. visualViewport is the more
         reliable signal for this specific case on mobile; window resize is
         the fallback for everything else (rotation, browser chrome, etc). */
      const onViewportChange = () => {
        /* Treat this exactly like every finger just lifted — because for the
           gesture's purposes, it did: nothing is coming to move it further.
           commit() alone only ends the CAMERA side (geometry, _live); it
           does not know about pointer bookkeeping, since normally end()
           already deleted the pointer before ever calling commit(). Calling
           commit() here without ALSO doing what end()'s empty-_pts branch
           does left _pts holding a phantom entry — which then silently
           corrupted the NEXT gesture: a real two-finger pinch paired the
           stale entry with only one real finger instead of the two that
           actually landed, so zooming did nothing. */
        if (c._live) {
          release();
          c.commit();
          c._pts.clear();
          c._mode = null; c._anchor = null; c._dist = 0; c._mid = null;
          c._moved = false;
        }
        c.stale();
        c.paint();
      };
      addEventListener('resize', onViewportChange);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', onViewportChange);
      }
    }
  },

  marchTargets(from) {
    const pi = UI.actingIndex();
    const rs = G.regions[from];
    if (rs.owner !== pi) return {};
    const all = Rules.reachable(pi, from, rs.hosts);
    // an attack is only legal into a directly adjacent enemy region
    const out = {};
    const canAssault = Rules.assaultsLeft(pi) > 0;
    for (const id in all) {
      const o = G.regions[id].owner;
      if (o !== null && o !== pi) {
        // attacks must be into directly adjacent ground, and you have an allowance
        if (!REGIONS[from].neighbours.includes(id) || !canAssault) continue;
      }
      out[id] = all[id];
    }
    return out;
  },

  clickRegion(id, ev) {
    if (UI.cam.swallow) return;          /* this click is the tail of a pan */
    if (G.phase === 'gameover' || G.pendingBoon) return;
    /* A finished battle nobody is showing must never block the board. If we
       reach here with one pending, clear it rather than swallowing the click. */
    if (G.pendingCombat) {
      if (G.pendingCombat.finished && !UI.modalOpen()) Combat.dismiss();
      else return;
    }
    const pi = UI.actingIndex();

    if (UI.mode === 'march' && G.selected) {
      const targets = UI.marchTargets(G.selected);
      if (targets[id]) { UI.openSend(G.selected, id); return; }
      if (id === G.selected) { UI.mode = 'idle'; UI.render(); return; }
    }
    UI.mode = 'idle';
    G.selected = (G.selected === id) ? null : id;
    /* Selecting changes what is HIGHLIGHTED, not what is on the board, so this
       must not go through UI.render(). That rebuilt ~1MB of SVG and recomputed
       every turbulence filter to move a glow — on every tap. */
    UI.paintSelection();
    UI.renderHint();
    if (G.selected) UI.openRegion(G.selected, ev ? { x: ev.clientX, y: ev.clientY } : null);
    else UI.pv.close();
  },

  /* ================= popover content ================= */

  /* Every action with the sentence explaining why it cannot run. This is the
     old renderActions() gating, unchanged — only where it is drawn moved. The
     reasons matter more than they did: a phone has no hover, so the `title`
     that used to carry them was invisible on the primary target. */
  actionModel(id) {
    const pi = UI.actingIndex();
    const rs = G.regions[id];
    const mine = rs.owner === pi;
    const isReaction = G.phase === 'reaction';
    const canAct = isReaction ? !G.reactionActionTaken : Rules.actionsLeft(pi) > 0;
    const build = mine ? Rules.canBuild(pi, id) : { ok: false };
    const mon = Rules.canMonument(pi);

    const noActions = isReaction
      ? 'Your Reaction is spent. End it and play passes on.'
      : 'No actions left this Turn. End your Turn to collect Tribute and start again.';

    const whyMarch = !mine ? REGIONS[id].name + ' is not yours to march from.'
      : Rules.hostCount(rs) <= 1
        ? REGIONS[id].name + ' holds a single host and must keep it — no region is ever left empty.'
      : !canAct ? noActions : '';
    const whyRaise = !mine ? 'You do not hold ' + REGIONS[id].name + '.'
      : !canAct ? noActions : '';
    const whyBuild = !build.ok ? (build.why || 'Nothing can be built here.')
      : !canAct ? noActions : '';
    const whyMon = !mon.ok ? (mon.why || 'No Monument can be raised right now.')
      : !canAct ? noActions : '';
    const whyHold = !isReaction
      ? 'Banking is a Reaction only. On your own Turn, act as often as you can afford, then end it.'
      : (G.reactionActionTaken ? noActions : '');

    return [
      { id: 'march', label: UI.mode === 'march' ? 'Cancel march' : 'March / Attack',
        why: whyMarch,
        run: () => { UI.mode = UI.mode === 'march' ? 'idle' : 'march';
                     UI.paintSelection(); UI.renderHint(); } },
      { id: 'raise', label: 'Raise host', why: whyRaise, run: () => UI.openRaise(id) },
      { id: 'build', label: build.ok ? 'Build (' + build.cost + ')' : 'Build Holding',
        why: whyBuild, run: () => UI.confirmBuild(pi, id, build) },
      { id: 'monument', label: 'Monument', why: whyMon, run: () => UI.openMonument(pi) },
      { id: 'hold', label: 'Hold / bank', why: whyHold, run: () => UI.spendAction(true) },
      { id: 'endturn', label: isReaction ? 'End Reaction' : 'End Turn', why: '',
        primary: true, run: () => UI.endTurn() }
    ];
  },

  /* The reference half of a region: what the map cannot draw. Troop types and
     counts are already on the board as silhouettes with numbers, and defence
     dice already fly a verdigris flag at 3+, so none of that is repeated here.
     What is genuinely missing from the board is income, ground and what raises. */
  regionInfo(id) {
    const rs = G.regions[id], def = REGIONS[id], t = REGION_TYPES[def.type];
    const owner = rs.owner === null ? 'Unclaimed' : G.players[rs.owner].name;
    const col = rs.owner === null ? 'var(--ink-dim)' : G.players[rs.owner].colour.hex;
    const d = UI.defenceRating(id);
    const held = Rules.hostCount(rs);
    return '<div class="pv-row"><span class="k">Holder</span>'
         + '<span class="v" style="color:' + col + '">' + esc(owner) + '</span></div>'
      + '<div class="pv-row"><span class="k">Ground</span><span class="v">'
         + esc(t.name) + ' · ' + esc(DOMAINS[def.domain].name) + '</span></div>'
      + '<div class="pv-row"><span class="k">Income</span><span class="v">' + t.income
         + (rs.holding ? ' <b>+' + HOLDING_INCOME[rs.holding - 1] + '</b> from a tier '
              + rs.holding + ' Holding' : '')
         + '</span></div>'
      + (held ? '<div class="pv-row"><span class="k">Defends</span><span class="v">' + d.dice
           + ' dice' + (d.notes.length ? ' — ' + esc(d.notes.join(', ')) : '')
           + '</span></div>' : '')
      + '<div class="pv-row"><span class="k">Raises</span><span class="v">'
         + esc(UI.raisableAt(id).join(', ') || 'nothing on-type — off-type costs double')
         + '</span></div>'
      + (rs.unrest > 0 ? '<p class="pv-note blood">Restive — newly conquered. Produces no Income '
           + 'and cannot be developed until you hold it through one of your Turns.</p>' : '')
      + '<p class="pv-note">' + esc(t.note) + '</p>';
  },

  /* Tap a region you hold and you get the six actions. Tap one you do not and
     you get what is worth knowing about it and nothing to press, because there
     is nothing there you could do. */
  /* Tap a region you hold and the six actions arrive as a STRIP floating over
     the board — not a sheet under it. The map stays visible and stays live:
     tapping another territory switches to it rather than dismissing first.

     The reference detail (ground, income, what raises here) is behind the "i".
     It is worth a tap when you want it and not worth half the screen. */
  openRegion(id, at) {
    const pi = UI.actingIndex();
    const rs = G.regions[id], def = REGIONS[id];
    const mine = rs.owner === pi;
    const playable = mine && G.phase !== 'gameover' && !AI.isAI(pi) && !UI.modalOpen();

    if (!playable) {
      UI.pv.open({ kind: 'region', ctx: id, variant: 'anchor', at: at,
        title: esc(def.name), aria: def.name, body: UI.regionInfo(id) });
      return;
    }

    const acts = UI.actionModel(id);
    const left = G.phase === 'reaction'
      ? (G.reactionActionTaken ? 0 : 1) : Rules.actionsLeft(pi);
    const start = Math.max(0, acts.findIndex(a => !a.why));

    const icons = acts.map((a, i) =>
      '<button class="as-ico' + (a.why ? ' is-off' : '') + '" type="button" data-i="' + i + '"'
      + ' aria-label="' + esc(a.label) + (a.why ? ' — unavailable' : '') + '">'
      + Icons.svg(a.id, 22, 'currentColor') + '</button>').join('');

    UI.pv.open({
      kind: 'region', ctx: id, variant: 'strip', aria: def.name + ' actions',
      body:
        /* The info button used to hold a row of its own, which cost the strip
           44px — a fifth of its height for one control. It sits in the footer
           beside cancel and confirm now, and the header is one line of text. */
        '<div class="st-top"><span class="st-where">' + esc(def.name)
      + '  <em class="' + (left ? '' : 'spent') + '">' + left + ' left</em></span></div>'
      + '<div class="st-icons">' + icons + '</div>'
      + '<input type="range" class="as-range" min="0" max="' + (acts.length - 1) + '"'
      + ' step="1" value="' + start + '" aria-label="Choose an action">'
      + '<div class="st-foot">'
      + '  <button class="st-x" type="button" aria-label="Cancel">×</button>'
      + '  <span class="st-read"><b class="as-name"></b><i class="as-why"></i></span>'
      + '  <button class="st-i" type="button" aria-label="About this region">i</button>'
      + '  <button class="st-ok" type="button" aria-label="Confirm">✓</button>'
      + '</div>'
      + '<div class="st-info" hidden>' + UI.regionInfo(id) + '</div>',
      wire: card => {
        const range = card.querySelector('.as-range');
        const name  = card.querySelector('.as-name');
        const why   = card.querySelector('.as-why');
        const ok    = card.querySelector('.st-ok');
        const ics   = [...card.querySelectorAll('.as-ico')];
        const info  = card.querySelector('.st-info');
        let committed = false;

        /* text nodes and classes only — never innerHTML on this subtree */
        const show = i => {
          const a = acts[i];
          ics.forEach((b, j) => b.classList.toggle('on', j === i));
          name.textContent = a.label;
          why.textContent  = a.why || UI.actionBlurb(a.id);
          why.classList.toggle('blocked', !!a.why);
          ok.classList.toggle('is-off', !!a.why);
          ok.setAttribute('aria-label', a.why ? a.label + ' — unavailable' : 'Confirm ' + a.label);
        };
        const select = i => {
          i = Math.max(0, Math.min(acts.length - 1, i));
          if (+range.value !== i) range.value = i;
          show(i);
        };

        range.addEventListener('input', () => show(+range.value));
        ics.forEach(b => b.addEventListener('click', () => select(+b.dataset.i)));
        card.querySelector('.st-x').addEventListener('click', UI.pv.close);
        card.querySelector('.st-i').addEventListener('click', e => {
          info.hidden = !info.hidden;
          e.currentTarget.classList.toggle('on', !info.hidden);
        });

        ok.addEventListener('click', () => {
          const a = acts[+range.value];
          /* A refusal must NOT close or repaint: the answer to "why not" is
             destroyed by the very render that would replace the control. */
          if (a.why) { UI.fx.refuse(ok, a.why); return; }
          if (committed) return;          /* rule 1f: one tap, one action */
          committed = true;
          UI.pv.close();
          a.run();
        });

        select(start);
      }
    });
  },

  /* One line on what each action does, shown under the slider when the action
     is available. The refusal reason takes this slot when it is not. */
  actionBlurb(id) {
    return {
      march:    'Move hosts across your own ground, or attack anything touching this region.',
      raise:    'Buy hosts here. On-type units cost list price, off-type cost double.',
      build:    'Raise or upgrade a Holding: more income every Round, and a defence die at tier 2.',
      monument: 'Turn hoarded Tribute into Renown XP. Once per Round.',
      hold:     'Bank your Reaction without spending it.',
      endturn:  'Collect Tribute and pass play on.'
    }[id] || '';
  },

  /* Building is the one action whose price is not obvious from the board, so
     it shows the bill before it spends anything. */
  confirmBuild(pi, id, build) {
    const tier = (G.regions[id].holding || 0) + 1;
    const p = G.players[pi];
    UI.pv.open({
      kind: 'build', ctx: id, variant: 'sheet',
      title: 'Raise a tier ' + tier + ' Holding',
      sub: esc(REGIONS[id].name),
      aria: 'Confirm Holding',
      body: '<div class="pv-row"><span class="k">Cost</span><span class="v">'
          + esc(UI.costTitle(build)) + '</span></div>'
        + '<div class="pv-row"><span class="k">Tribute</span><span class="v">'
          + p.tribute + ' &rarr; ' + (p.tribute - build.cost) + '</span></div>'
        + '<div class="pv-row"><span class="k">Income</span><span class="v">+'
          + HOLDING_INCOME[tier - 1] + ' each Round'
          + (tier >= 2 ? ', +1 defence die' : '') + '</span></div>'
        + '<div class="pv-foot">'
        + '<button class="ghost" type="button" data-x="no">Not yet</button>'
        + '<button class="primary" type="button" data-x="yes">Build it</button></div>',
      wire: card => {
        card.querySelector('[data-x="no"]').addEventListener('click', UI.pv.close);
        card.querySelector('[data-x="yes"]').addEventListener('click',
          UI.pv.commit(() => { Rules.buildHolding(pi, id); UI.afterRegionAction(id); }));
      }
    });
  },

  /* The player chip. Everything the "you" panel carried, plus the Domain
     legend that used to live in the phase strip, plus Surrender — which belongs
     with the rest of your own standing rather than loose beside the map. */
  openPlayer(i) {
    const p = G.players[i];
    const patron = Rules.patronOf(p);
    const s = Rules.scoreFor(i);
    const next = p.level < MAX_LEVEL ? XP_THRESHOLDS[p.level] : null;
    const yours = i === UI.actingIndex() && !AI.isAI(i) && G.phase !== 'gameover';

    const domains = Object.keys(DOMAINS).map(dk => {
      const done = Rules.domainComplete(i, dk);
      return '<span class="dm' + (done ? ' done' : '') + '">'
           + '<i style="background:' + DOMAINS[dk].tint + '"></i>' + esc(DOMAINS[dk].name)
           + (done ? ' ✦' : '') + '</span>';
    }).join('');

    const chips = p.boons.map(b => {
      const bd = patron.boons.find(x => x.id === b);
      return bd ? '<span class="boon-chip" data-tip="<b>' + esc(bd.name) + '</b><br>'
                + esc(bd.text) + '">' + esc(bd.name) + '</span>' : '';
    }).join('') + p.perks.map(k => {
      const pk = CHAMPION_PERKS.find(x => x.id === k);
      return pk ? '<span class="boon-chip perk" data-tip="<b>' + esc(pk.name)
                + '</b> — Champion Perk<br>' + esc(pk.text) + '">' + esc(pk.name)
                + '</span>' : '';
    }).join('');

    UI.pv.open({
      kind: 'player', ctx: i, variant: 'drop',
      title: '<span class="dot" style="background:' + p.colour.hex + '"></span> ' + esc(p.name),
      sub: AI.isAI(i) ? esc(AI.personality(i).name) : '',
      aria: p.name,
      body:
        '<p class="pv-note">' + esc(patron.name) + ' ' + esc(patron.epithet) + ' — '
          + esc(patron.passive) + '</p>'
      + '<div class="pv-row"><span class="k">Tribute</span><span class="v">' + p.tribute
          + ' <small>+' + (Rules.incomeFor(i) - Rules.upkeepFor(i)) + ' a Round</small></span></div>'
      + '<div class="pv-row"><span class="k">Renown</span><span class="v">' + p.level
          + ' <small>' + esc(tierFor(p.level)) + '</small></span></div>'
      + '<div class="pv-row"><span class="k">Progress</span><span class="v">'
          + (next ? p.xp + ' / ' + next + ' XP' : 'Apotheosis reached') + '</span></div>'
      + '<div class="pv-row"><span class="k">Score</span><span class="v">' + s.total + ' vp</span></div>'
      + '<div class="pv-sec">Domains</div><div class="domains">' + domains + '</div>'
      + (chips ? '<div class="pv-sec">Claimed this match</div><div class="boonlist">'
          + chips + '</div>' : '')
      + (p.fallen ? '<p class="pv-note blood">Champion fallen.</p>' : '')
      + (yours && Rules.canSurrender(i)
          ? '<div class="pv-foot"><button class="danger" type="button" data-x="surr">Surrender</button></div>'
          : ''),
      wire: card => {
        const b = card.querySelector('[data-x="surr"]');
        if (b) b.addEventListener('click', UI.pv.commit(() => UI.confirmSurrender(i)));
      }
    });
  },

  /* "10 tier 2 base − 2 Farmland − 2 Ilthara = 6" */
  costTitle(build) {
    if (build.free) return 'Free — Masons, once per Round.';
    if (!build.parts) return `${build.cost} Tribute.`;
    return build.parts.map((p, i) =>
      (i === 0 ? `${p.amount} ${p.label}` : `${p.amount < 0 ? '−' : '+'} ${Math.abs(p.amount)} ${p.label}`)
    ).join(' ') + ` = ${build.cost} Tribute`;
  },

  /* What building here would actually DO, worked out before you commit —
     income now versus after, and the defensive die a tier-2 wall adds. */
  buildPreview(pi, id) {
    const build = Rules.canBuild(pi, id);
    if (!build.ok) return '';
    const rs = G.regions[id];
    const before = Rules.incomeFor(pi);
    const beforeDice = UI.defenceRating(id).dice;

    rs.holding += 1;                       // model it, then put it straight back
    const after = Rules.incomeFor(pi);
    const afterDice = UI.defenceRating(id).dice;
    const newTier = rs.holding;
    rs.holding -= 1;

    const dIncome = after - before;
    const dDice = afterDice - beforeDice;
    return `${UI.costBreakdown(build)}
      <div class="build-preview">
        <div class="bp-head">If you build tier ${newTier}</div>
        <div class="bp-row"><span>Your income</span>
          <b>${before} → ${after}</b><em>${dIncome >= 0 ? '+' : ''}${dIncome} per Round</em></div>
        <div class="bp-row"><span>Defence here</span>
          <b>${beforeDice} → ${afterDice} dice</b><em>${dDice ? `+${dDice} die` : 'no change until tier 2'}</em></div>
        <div class="bp-row"><span>Score</span>
          <b>+${rs.holding === 0 ? VP.holding : 0} vp</b><em>${rs.holding === 0 ? 'first Holding here' : 'already scoring'}</em></div>
      </div>`;
  },

  costBreakdown(build) {
    if (!build.ok) return '';
    if (build.free) return `<div class="costcalc">Free — <b>Masons</b>, once per Round.</div>`;
    const bits = build.parts.map((p, i) =>
      i === 0 ? `${p.amount} <span style="opacity:.75">${esc(p.label)}</span>`
              : `<span class="minus">${p.amount < 0 ? '−' : '+'}${Math.abs(p.amount)} ${esc(p.label)}</span>`
    ).join(' ');
    return `<div class="costcalc">${bits} = <b>${build.cost} Tribute</b></div>`;
  },

  /* ================= chronicle ================= */

  /* Was a panel pinned under everything else and read maybe twice a match.
     As a dropdown it costs nothing when you are not reading it, and when you
     are, it gets the whole screen instead of a nine-rem strip. */
  openChronicle() {
    const rows = G.log.slice(0, 80).map(e => {
      const col = (e.player !== null && e.player !== undefined)
        ? G.players[e.player].colour.hex : 'transparent';
      return '<div class="log-entry k-' + e.kind + '">'
           + '<span class="bar" style="background:' + col + '"></span>'
           + '<span>' + esc(e.text) + '</span></div>';
    }).join('');
    UI.pv.open({
      kind: 'chronicle', variant: 'drop',
      title: 'Chronicle', aria: 'Chronicle',
      sub: 'Round ' + G.round + ' of ' + ROUND_LIMIT,
      body: rows || '<p class="pv-note">Nothing has happened yet.</p>'
    });
  },

  /* ================= how to play ================= */

  /* The hamburger. Rules, every host with its symbol beside its name, region
     types and scoring — plus the two controls that used to sit in the top bar
     as their own buttons. The troop key was a separate panel that repeated
     these same names without the rules; one surface now carries both, so the
     silhouette you are looking at on the board and the sentence explaining it
     are in the same place. */
  openMenu() {
    const patrons = Object.keys(PATRONS).map(pid => {
      const pt = PATRONS[pid];
      const eliteNames = pt.elites.map(u => esc(UNITS[u].name)).join(', ');
      const boonList = pt.boons.map(b => '<b>' + esc(b.name) + '</b> ' + esc(b.text)).join('<br>');
      return '<div class="ref-item">'
        + '<b>' + esc(pt.name) + ' <i>' + esc(pt.epithet) + '</i></b>'
        + '<span>' + esc(pt.domain) + ' — ' + esc(pt.passive) + '<br>'
        + '<i style="color:var(--ink-dim)">' + esc(pt.flavour) + '</i><br>'
        + esc(pt.plays) + '<br>'
        + '<b class="ref-raises">Elites</b> ' + eliteNames
        + '</span>'
        + '<p class="pv-note">' + boonList + '</p>'
        + '</div>';
    }).join('');

    const units = Object.keys(UNITS).map(u => {
      const U = UNITS[u];
      const owner = U.patron ? PATRONS[U.patron].name : null;
      return '<div class="ref-item has-ico">'
        + '<svg class="ref-ico" viewBox="-9 -10 18 20" width="17" height="19" aria-hidden="true">'
        + UI.troopShape(u, '#c98f47') + '</svg>'
        + '<b>' + esc(U.name) + ' <i>' + U.cost + 't</i>'
        + (owner ? ' <em class="ref-only">' + esc(owner) + ' only</em>' : '') + '</b>'
        + '<span>' + esc(U.rule) + '</span></div>';
    }).join('');

    /* Derived from UNITS.raisedAt, NOT from REGION_TYPES.raises — that list is
       an AI hint and omits every patron unit (see the note in data.js). */
    const anywhere = Object.keys(UNITS).filter(u => UNITS[u].raisedAt.includes('*'));
    const regions = Object.keys(REGION_TYPES).map(t => {
      const here = Object.keys(UNITS).filter(u => UNITS[u].raisedAt.includes(t));
      const named = here.map(u => esc(UNITS[u].name)
        + (UNITS[u].patron ? ' <em class="ref-only">' + esc(PATRONS[UNITS[u].patron].name)
             + '</em>' : ''));
      return '<div class="ref-item has-ico">'
        + '<svg class="ref-ico" viewBox="-9 -8 18 16" width="17" height="15" aria-hidden="true"'
        + ' fill="#c98f47" stroke="#c98f47" stroke-linecap="round">' + UI.glyph(t) + '</svg>'
        + '<b>' + esc(REGION_TYPES[t].name) + ' <i>'
        + REGION_TYPES[t].income + ' income</i></b><span>'
        + esc(REGION_TYPES[t].note)
        + '<br><b class="ref-raises">Raises</b> '
        + (named.length ? named.join(', ') : '<span class="ref-none">nothing on-type</span>')
        + '</span></div>';
    }).join('');

    const spd = UI.speedCtl;
    UI.pv.open({
      kind: 'menu', variant: 'drop',
      title: 'How this works', aria: 'How to play',
      body:
        '<div class="pv-foot top">'
        + '<button class="ghost" type="button" data-x="tut">Walkthrough</button>'
        + (spd ? '<button class="ghost" type="button" data-x="spd">Speed: '
            + esc(spd.name()) + '</button>' : '')
        + '</div>'
      + '<p class="pv-note">Attacker rolls up to 3 dice, defender up to 2. Highest against '
        + 'highest — <b>ties go to the defender</b>. Tribute arrives every Turn and never '
        + 'caps. Renown is earned by playing, and losing battles still earns it — or it can '
        + 'be bought outright with a Monument.</p>'
      + '<div class="pv-sec">Patrons</div><div class="ref-grid">' + patrons + '</div>'
      + '<div class="pv-sec">Hosts</div><div class="ref-grid">' + units + '</div>'
      + '<div class="pv-sec">Regions</div>'
      + '<p class="pv-note">Every region also raises ' + anywhere.map(u => esc(UNITS[u].name)).join(', ') + ', wherever you hold ground.</p>'
      + '<div class="ref-grid">' + regions + '</div>'
      + '<div class="pv-sec">Scoring</div><div class="ref-grid">'
      + '<div class="ref-item"><b>Complete Domain <i>' + VP.domain + ' vp</i></b>'
        + '<span>Every region in a Domain, held at the end. Doubles Holding income too.</span></div>'
      + '<div class="ref-item"><b>Holding <i>' + VP.holding + ' vp</i></b>'
        + '<span>Each standing Holding.</span></div>'
      + '<div class="ref-item"><b>Renown level <i>' + VP.renownLevel + ' vp</i></b>'
        + '<span>Per level reached.</span></div>'
      + '<div class="ref-item"><b>Rival Throne <i>' + VP.rivalThrone + ' vp</i></b>'
        + '<span>Each enemy seat you still hold.</span></div>'
      + '</div>',
      wire: card => {
        const t = card.querySelector('[data-x="tut"]');
        if (t) t.addEventListener('click', UI.pv.commit(() => UI.openTutorial(0)));
        const b = card.querySelector('[data-x="spd"]');
        /* Updates its own label in place rather than rebuilding the sheet —
           a repaint here would scroll the reader back to the top. */
        if (b) b.addEventListener('click', () => { b.textContent = 'Speed: ' + UI.speedCtl.cycle(); });
      }
    });
  },

  /* ================= hint bar ================= */

  renderHint() {
    const bar = $('#hintbar');
    if (!bar) return;
    if (G.phase === 'gameover') {
