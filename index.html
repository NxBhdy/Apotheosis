<script>
/* ===== js/data.js ===== */
/* ============================================================
   APOTHEOSIS — static game data
   Map, region types, units, patrons, boons, progression curves.
   Plain script (no modules) so index.html opens from file://
   ============================================================ */

/* ---------- deterministic PRNG so the map is always the same ---------- */

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- region types ---------- */

/* NOTE on `raises`: this is an AI HINT, not the rule. ai.js only ever tests
   `raises.length > 0` — "does this ground unlock anything at all". The
   authoritative list of what can be raised where is UNITS[u].raisedAt, and
   these arrays omit every patron unit (stormrider at a Port, caravaneer at a
   Farmland or Port, gatewarden at a Forge). Do not read the contents of this
   for anything the player sees; derive from UNITS.raisedAt instead. */
const REGION_TYPES = {
  farmland: {
    name: 'Farmland', income: 1, glyph: 'farmland',
    note: 'Holdings cost 2 less here.',
    raises: ['outrider']
  },
  mine: {
    name: 'Mine', income: 2, glyph: 'mine',
    note: 'The only source of Siege.',
    raises: ['siege']
  },
  forge: {
    name: 'Forge', income: 1, glyph: 'forge',
    note: 'Raises heavy infantry.',
    raises: ['phalanx', 'warden']
  },
  port: {
    name: 'Port', income: 1, glyph: 'port',
    note: 'March to any other Port on the map.',
    raises: ['outrider']
  },
  shrine: {
    name: 'Shrine', income: 2, glyph: 'shrine',
    note: 'No Holdings. Pays 3 XP every Turn you hold it.',
    raises: ['zealot'], noHolding: true
  },
  waste: {
    name: 'Waste', income: 0, glyph: 'waste',
    note: 'Produces nothing. Cheap to cross.',
    raises: [], noHolding: true
  },
  throne: {
    name: 'Throne', income: 3, glyph: 'throne',
    note: 'Counts as a tier-1 Holding. Lose it and you are Fallen.',
    raises: []
  }
};

/* ---------- units ----------
   `raisedAt` lists region types where the unit is on-type. Off-type
   raising is allowed anywhere you control, at double cost — the
   escape hatch so nobody can lock a whole strategy off the board.    */

const UNITS = {
  levy: {
    id: 'levy', name: 'Levy', cost: 2, raisedAt: ['*'],
    get rule() { return LEVY_RULES[LEVY_MODE]; },
    flavour: 'Farmhands with spears. Individually worthless.'
  },
  zealot: {
    id: 'zealot', name: 'Zealots', cost: 3, raisedAt: ['shrine'],
    rule: 'Add +1 to your highest die per 3 Renown levels.',
    flavour: 'They believe. That turns out to matter.'
  },
  /* SHIELDWALL — candidate reworks, NOT yet implemented. Parked deliberately
     until the fixed-combat numbers were in; see the notes below before
     picking one.
       a) Only works while the Phalanx is supporting other hosts — a lone
          Phalanx absorbs nothing, so it is a formation unit rather than an
          invincible single piece. Closest to the bug's original intent.
       b) Grants +1 to the defender's highest die instead of negating a
          casualty. Weaker and smoother, but returns Phalanx to being a dice
          modifier, which is the thing that measured as near-inert.
     Current behaviour: absorbs exactly one casualty per battle. */
  phalanx: {
    id: 'phalanx', name: 'Phalanx', cost: 5, raisedAt: ['forge'],
    rule: 'Shieldwall — absorbs the first casualty your side would take in a battle.',
    flavour: 'A wall that eats cavalry.'
  },
  outrider: {
    id: 'outrider', name: 'Outriders', cost: 4, raisedAt: ['port', 'farmland'],
    rule: 'Marches two regions. Poor in a straight fight.',
    flavour: 'Fast, light, and gone before you answer.'
  },
  siege: {
    id: 'siege', name: 'Siege', cost: 8, raisedAt: ['mine'],
    rule: 'Negates the defending Holding entirely, and razes a tier each exchange you win.',
    flavour: 'Slow, expensive, and the only answer to walls.'
  },
  warden: {
    id: 'warden', name: 'Warden', cost: 6, raisedAt: ['forge'],
    rule: 'Your Champion cannot be lost while a Warden survives here.',
    flavour: 'Sworn to the body, not the cause.'
  },

  /* patron elites — unlocked by Renown, only for their patron */
  stormrider: {
    id: 'stormrider', name: 'Stormriders', cost: 6, raisedAt: ['port'],
    patron: 'vashtar', unlockLevel: 4,
    rule: 'Shock — the first exchange they join inflicts one extra casualty.',
    flavour: 'They come in with the weather.'
  },
  thunderguard: {
    id: 'thunderguard', name: 'Thunderguard', cost: 9, raisedAt: ['forge'],
    patron: 'vashtar', unlockLevel: 8,
    rule: 'Sunder — enemy Shieldwall and Holding defences do not apply against them.',
    flavour: 'The sound arrives after the damage.'
  },
  caravaneer: {
    id: 'caravaneer', name: 'Caravaneers', cost: 4, raisedAt: ['farmland', 'port'],
    patron: 'ilthara', unlockLevel: 4,
    rule: 'Generates 1 Income each Round it survives.',
    flavour: 'An army that pays for itself is a rare thing.'
  },
  gatewarden: {
    id: 'gatewarden', name: 'Gatewardens', cost: 6, raisedAt: ['forge'],
    patron: 'ilthara', unlockLevel: 8,
    rule: 'Nothing else here can be lost while a Gatewarden stands. Siege cannot raze this Holding.',
    flavour: 'The gate is the weapon.'
  }
};

const CORE_UNITS = ['levy', 'zealot', 'phalanx', 'outrider', 'siege', 'warden'];

/* ---------- patrons ---------- */

const PATRONS = {
  vashtar: {
    id: 'vashtar',
    name: 'Vashtar',
    epithet: 'the Storm-Crown',
    domain: 'Storm · War',
    flavour: 'He has never once waited for the weather to clear.',
    passive: 'Your hosts may march and attack in the same Turn.',
    elites: ['stormrider', 'thunderguard'],
    plays: 'Early aggression. Wants Ports and cheap hosts.',
    boons: [
      { id: 'warpath',   name: 'Warpath',        text: 'Your first attack each Round inflicts one extra casualty.' },
      { id: 'enmasse',   name: 'Levy en Masse',  text: 'Levy cost nothing in your Throne region.' },
      { id: 'swiftruin', name: 'Swift Ruin',     text: 'Outriders march three regions.' },
      { id: 'secondwind',name: 'Second Wind',    text: 'After winning a battle, gain a free Levy there.' },
      { id: 'stormseye', name: 'Siegebreaker',    text: "Your attacks ignore the defender's Holding defence die." },
      { id: 'reave',     name: 'Reave',          text: 'Gain 2 Tribute whenever you capture a region.' },
      { id: 'fury',      name: 'Fury',           text: 'Zealots count double toward their Renown scaling.' },
      { id: 'levies',    name: 'Called Levies',  text: 'Every host costs 1 less to raise, anywhere.' }
    ]
  },
  ilthara: {
    id: 'ilthara',
    name: 'Ilthara',
    epithet: 'of the Gilded Hearth',
    domain: 'Hearth · Trade',
    flavour: 'She has never lost a war she could instead purchase.',
    passive: 'Holdings cost 2 less, and every Holding you own generates +1 Income.',
    elites: ['caravaneer', 'gatewarden'],
    plays: 'Turtle economy. Wants one compact Domain developed to the hilt.',
    boons: [
      { id: 'coffers',   name: 'Deep Coffers',   text: '+1 Income per Holding each Round.' },
      { id: 'masons',    name: 'Masons',         text: 'Upgrade one Holding free, once per Round.' },
      { id: 'highroads', name: 'High Roads',     text: 'Every region you hold generates +1 Income.' },
      { id: 'granary',   name: 'Granary',        text: 'Levy cost nothing in Farmland you control.' },
      { id: 'fortified', name: 'Fortified',      text: '+1 defence die in any region with a tier-2 Holding or better.' },
      { id: 'tithe',     name: 'Tithe',          text: 'Gain 2 XP each Turn for every Shrine or Throne you hold.' },
      { id: 'unbroken',  name: 'Unbroken Walls', text: 'Your Holdings can never be destroyed below tier 1.' },
      { id: 'caravan',   name: 'Caravan Rights', text: 'Outriders generate 1 Income each Round.' }
    ]
  }
};

/* ---------- the Champion ----------
   Your Champion is you: a piece you command directly, not a passive marker.
   It marches with a stack, fights alongside it, and grows through Perks
   chosen at level-up. It dies PERMANENTLY — there is no coming back — which
   is what makes moving it a real decision every single turn.               */

const CHAMPION = {
  baseBonus: 1,          // added to your highest die where the Champion stands
  marchRange: 1
};

const CHAMPION_PERKS = [
  { id: 'duelist',   name: 'Duelist',       text: 'Your Champion adds +2 to your highest die instead of +1.' },
  { id: 'vanguard',  name: 'Vanguard',      text: 'The stack your Champion leads rolls one extra attack die.' },
  { id: 'bulwark',   name: 'Bulwark',       text: 'The stack your Champion leads rolls one extra defence die.' },
  { id: 'swift',     name: 'Swift',         text: 'Your Champion marches two regions instead of one.' },
  { id: 'inspiring', name: 'Inspiring',     text: 'Hosts cost 1 less to raise where your Champion stands.' },
  { id: 'relentless',name: 'Relentless',    text: 'Battles your Champion leads ignore the first casualty you take.' },
  { id: 'reaver',    name: 'Reaver',        text: 'Capturing a region with your Champion grants 4 Tribute.' },
  { id: 'warlord',   name: 'Warlord',       text: 'Your Champion grants an extra action on your Turn.' },
  { id: 'undying',   name: 'Undying',       text: 'Once per match, your Champion survives a blow that would kill it.' },
  { id: 'standard',  name: 'Standard-Bearer',text: 'Gain 3 extra XP for every battle your Champion wins.' }
];

/* ---------- Renown tier unlocks ----------
   Concrete capabilities at named thresholds, so a level is a thing you can
   point at rather than a number that quietly went up.                      */

const TIER_UNLOCKS = {
  2:  { text: '+1 action each Turn',            actions: 1 },
  4:  { text: 'Tier-3 Holdings · first patron elite' },
  6:  { text: '+1 action each Turn',            actions: 1 },
  8:  { text: 'Second patron elite · hosts march +1 region', marchBonus: 1 },
  10: { text: '+1 action each Turn · Apotheosis', actions: 1 }
};

const BASE_ACTIONS = 4;

/* ---------- progression ---------- */

/* Cumulative XP per level. Tuned against automated playthroughs so a
   full 8-Round match lands a typical warlord around Renown 5–7, with
   8–10 reserved for someone genuinely running away with it. */
const XP_THRESHOLDS = [0, 30, 72, 128, 198, 282, 382, 500, 638, 798];
const MAX_LEVEL = 10;

const RENOWN_TIERS = [
  { from: 1,  to: 1,  name: 'Unblooded' },
  { from: 2,  to: 3,  name: 'Named' },
  { from: 4,  to: 5,  name: 'Renowned' },
  { from: 6,  to: 7,  name: 'Feared' },
  { from: 8,  to: 9,  name: 'Mythic' },
  { from: 10, to: 10, name: 'Apotheosis' }
];

function tierFor(level) {
  return (RENOWN_TIERS.find(t => level >= t.from && level <= t.to) || RENOWN_TIERS[0]).name;
}

/* Sprawl tax: a large empire earns XP more slowly than a compact one.
   This is the primary brake on a runaway leader. */
function xpRate(regionsHeld) {
  return 20 / (20 + regionsHeld);
}

const XP_AWARDS = {
  hostDestroyed: 2,   // per enemy host you destroy
  hostLost:      1,   // per host of yours destroyed — losing still climbs
  /* Development XP sits deliberately high. Fighting generates XP from every
     exchange, so without this an aggressive warlord simply out-levels a
     builder and wins on volume of levels rather than on strategy. */
  holding:       [7, 10, 13],
  domain:        24,
  shrineTurn:    3,   // per Turn a Shrine is held
  captureFoe:    4,   // taking ground off a rival
  captureFree:   2,   // claiming unheld ground
  throne:        25
};

/* ---------- economy ---------- */

const HOLDING_COST   = [6, 10, 14];
const HOLDING_INCOME = [2, 3, 4];
const OFF_TYPE_MULT  = 2;

const VP = { domain: 5, holding: 2, renownLevel: 1, rivalThrone: 4 };

/* ---------- players ---------- */

const PLAYER_COLOURS = [
  { id: 'crimson', name: 'Crimson', hex: '#c0504a' },
  { id: 'azure',   name: 'Azure',   hex: '#4a7fc0' },
  { id: 'jade',    name: 'Jade',    hex: '#3f9e78' },
  { id: 'violet',  name: 'Violet',  hex: '#8a6bc0' }
];

const STARTING_TRIBUTE = 12;
const STARTING_HOSTS   = { levy: 4, phalanx: 1 };

/* Full territorial income lands once per Round, at the start of your own
   Turn. Reactions pay a flat trickle instead — enough that resources visibly
   grow on every turn you take, without four players' worth of income
   arriving every Round and drowning the cost of everything. */
const REACTION_TRICKLE = 2;

/* Hosts you may field free of upkeep, on top of one per region held.
   Everything beyond costs 1 Tribute per Round. */
const UPKEEP_FREE = 3;

/* MONUMENTS — the Tribute sink the economy was missing.
   Once per Round you may pour Tribute into monuments to your own deeds and
   convert it into Renown XP. Without this, a developed empire hits a ceiling:
   Holdings maxed, army capped by upkeep, and every further Tribute simply
   dead. It is also how economic play reaches high Renown without having to
   win battles for it. */
const MONUMENT_MIN  = 10;
let   MONUMENT_RATE = 2;    // Tribute per 1 XP — `let` so it can be A/B tested

/* Assaults a warlord may press per Round.

   Without this the Turn/Reaction structure is lopsided: the attacker gets a
   whole turn to act while every defender gets a single Reaction action to
   answer with. Seven assaults against one reaction is why aggression
   dominated every test match. Economy stays uncapped — only violence is
   rationed, which is also what stops a blitz from ending the game early. */
/* Assaults per Round. 0 means unlimited, which is the default — the only
   real limit is needing enough hosts to garrison both the ground you leave
   and the ground you take. A cap made turns feel rationed and matches drag,
   so it lives in Settings for players who want the slower game. */
const ASSAULT_LIMIT_DEFAULT = 0;
/* skipReactions removes every mini-turn between real Turns outright — an
   experiment a player can opt into, not a balance recommendation. It makes

/* Hand-placed approximation of Tennessee's real outline: a nearly straight
   south border, a meandering west border along the Mississippi, an
   irregular north border, and a wavy, mountainous east border with a
   northeastward spur. roughenClosed (see map.js) adds the same fractal
   texture the default map's coastline uses, so the two maps read as one
   family, but the macro-shape here is fixed rather than derived from the
   seeds — it has to be, since it is standing in for a real place. */
const TN_BORDER_PTS = [
  { x:  141.9, y: 670.1 }, { x:  371.8, y: 655.9 }, { x:  616.1, y: 659.4 },
  { x:  830.2, y: 663.0 }, { x: 1032.9, y: 652.3 }, { x: 1234.0, y: 554.6 },
  { x: 1190.9, y: 483.6 }, { x: 1262.8, y: 430.3 }, { x: 1205.3, y: 377.0 },
  { x: 1147.8, y: 336.1 }, { x:  932.3, y: 293.5 }, { x:  688.0, y: 311.3 },
  { x:  486.8, y: 289.9 }, { x:  300.0, y: 311.3 }, { x:  213.7, y: 332.6 },
  { x:  177.8, y: 389.4 }, { x:  149.1, y: 448.0 }, { x:   91.6, y: 510.2 },
  { x:  106.0, y: 563.5 }, { x:   77.2, y: 620.3 }
];

function tnContinentPath() {
  /* 4 levels at amp 13 is the default map's fantasy-coastline treatment,
     just at half amplitude — right for the fold fix in
     [[project_tennessee_map]], but it was never reconsidered for a state
     with no coast at all. 4 levels quadruples the point count (20 -> 320)
     and the high-frequency component from the later, small-amplitude
     levels is what actually reads as "jagged coastline" rather than a
     surveyed political border. Fewer levels, gentler amplitude: hand-drawn
     character without the crinkle. */
  let pts = roughenClosed(TN_BORDER_PTS, 2, 9, 0.55, 0x544e5a);
  pts = pts.map(p => ({
    x: Math.max(6, Math.min(MAP_W - 6, p.x)),
    y: Math.max(6, Math.min(MAP_H - 6, p.y))
  }));
  return smoothClosedPath(pts);
}

const TN_REGIONS = buildMap(TN_REGION_DEFS);
const TN_CONTINENT = tnContinentPath();
const TN_THRONES = thronesOf(TN_REGION_DEFS);

/* ===== js/maps.js ===== */
/* ============================================================
   APOTHEOSIS — map registry

   Ties a display name to each compiled map's REGION_DEFS/DOMAINS/REGIONS/
   CONTINENT/THRONES, and swaps the live globals (declared `let` in
   map.js) over to whichever one the player picks at setup. Everything
   downstream — state.js, render-map.js, ui.js, ai.js, combat.js — reads
   those same five names at call time, never at load time, so nothing
   else needs to know a second map exists; activateMap() just has to run
   before Rules.newGame() and before the first UI.render().
   ============================================================ */

const MAPS = {
  default: {
    name: 'Original',
    blurb: 'Four homelands and a contested middle — the original board.',
    defs: REGION_DEFS, domains: DOMAINS, regions: REGIONS,
    continent: CONTINENT, thrones: THRONES
  },
  tennessee: {
    name: 'Tennessee',
    blurb: 'Nashville, Knoxville, Memphis and Chattanooga — twenty-four regions, no neutral ground.',
    defs: TN_REGION_DEFS, domains: TN_DOMAINS, regions: TN_REGIONS,
    continent: TN_CONTINENT, thrones: TN_THRONES
  }
};

let ACTIVE_MAP = 'default';

function activateMap(id) {
  const m = MAPS[id] || MAPS.default;
  ACTIVE_MAP = MAPS[id] ? id : 'default';
  REGION_DEFS = m.defs;
  DOMAINS = m.domains;
  REGIONS = m.regions;
  CONTINENT = m.continent;
  THRONES = m.thrones;
}

;
/* ===== js/state.js ===== */
/* ============================================================
   APOTHEOSIS — game state and rules
   ============================================================ */

let G = null;

const Rules = {

  /* ---------------- setup ---------------- */

  newGame(configs) {
    const regions = {};
    for (const id in REGIONS) {
      regions[id] = { owner: null, hosts: {}, holding: 0, unrest: 0 };
    }

    const players = configs.map((cfg, i) => ({
      index: i,
      name: cfg.name,
      colour: PLAYER_COLOURS[i],
      patronId: cfg.patron,
      tribute: STARTING_TRIBUTE,
      xp: 0,
      level: 1,
      boons: [],
      perks: [],                 // Champion Perks, the other half of each level choice
      championAt: THRONES[i],
      championDead: false,       // permanent — a fallen Champion never returns
      undyingUsed: false,
      fallen: false,
      surrendered: false,
      firstAttackDone: false,
      masonUsed: false,
      assaults: 0,
      freeLevyUsed: false,
      monumentUsed: false,
      xpThisMatch: 0
    }));

    // each player starts on their Throne with a small garrison
    players.forEach((p, i) => {
      const t = THRONES[i];
      regions[t].owner = i;
      regions[t].holding = 1;                 // a Throne is always tier 1
      regions[t].hosts = { ...STARTING_HOSTS };
    });

    G = {
      players,
      regions,
      round: 1,
      turnIndex: 0,
      phase: 'turn',
      reactionQueue: [],
      reactionIndex: 0,
      reactionActionTaken: false,
      actionsUsed: 0,
      fortifyUsed: false,
      log: [],
      logSeq: 0,
      pendingBoon: null,
      pendingCombat: null,
      pendingCasualty: null,
      selected: null,
      winner: null,
      finalScores: null
    };

    Rules.log(`Round 1 begins. ${players[0].name} holds the first Turn.`, 'round');
    Rules.grantRoundIncome(0);
    return G;
  },

  /* ---------------- queries ---------------- */

  active() { return G.players[G.phase === 'reaction' ? G.reactionQueue[G.reactionIndex] : G.turnIndex]; },
  turnPlayer() { return G.players[G.turnIndex]; },
  patronOf(p) { return PATRONS[p.patronId]; },
  hasBoon(p, id) { return p.boons.includes(id); },
  hasPerk(p, id) { return !p.championDead && p.perks.includes(id); },

  /* Champion queries — all of them respect permadeath, so a dead Champion
     silently stops contributing anything rather than needing checks at
     every call site. */
  championAt(pi, regionId) {
    const p = G.players[pi];
    return !p.championDead && p.championAt === regionId;
  },

  championBonus(pi) {
    const p = G.players[pi];
    if (p.championDead) return 0;
    let b = CHAMPION.baseBonus;
    if (Rules.hasPerk(p, 'duelist')) b += 1;
    return b;
  },

  championMarchRange(pi) {
    return CHAMPION.marchRange + (Rules.hasPerk(G.players[pi], 'swift') ? 1 : 0);
  },

  /* actions available on your Turn, from Renown tier unlocks and Perks */
  actionsFor(pi) {
    const p = G.players[pi];
    let n = BASE_ACTIONS;
    for (const lvl in TIER_UNLOCKS) {
      if (p.level >= +lvl && TIER_UNLOCKS[lvl].actions) n += TIER_UNLOCKS[lvl].actions;
    }
    if (Rules.hasPerk(p, 'warlord')) n += 1;
    return n;
  },

  /* Actions remaining on the current Turn. Renown buys more of these, which
     is what makes a level immediately visible on the board. */
  actionsLeft(pi) {
    return Math.max(0, Rules.actionsFor(pi) - (G.actionsUsed || 0));
  },

  spendAction() { G.actionsUsed = (G.actionsUsed || 0) + 1; },

  marchBonusFor(pi) {
    const p = G.players[pi];
    let n = 0;
    for (const lvl in TIER_UNLOCKS) {
      if (p.level >= +lvl && TIER_UNLOCKS[lvl].marchBonus) n += TIER_UNLOCKS[lvl].marchBonus;
    }
    return n;
  },

  killChampion(pi, where) {
    const p = G.players[pi];
    if (p.championDead) return;
    if (Rules.hasPerk(p, 'undying') && !p.undyingUsed) {
      p.undyingUsed = true;
      Rules.log(`${p.name}'s Champion should have fallen at ${REGIONS[where].name} — Undying holds.`, 'champion', pi);
      return;
    }
    p.championDead = true;
    p.championAt = null;
    /* Its own kind, not 'champion'. That kind also carries "the Champion rides
       to X", which fires on every Champion move — one vocabulary for both meant
       a routine march and a permanent death were indistinguishable to anything
       reading the log. */
    Rules.log(`${p.name}'s Champion falls at ${REGIONS[where].name}. There is no coming back.`, 'championfall', pi);
  },
  isOut(p) { return p.surrendered; },

  regionsOf(pi) {
    return Object.keys(G.regions).filter(id => G.regions[id].owner === pi);
  },

  hostCount(rs) {
    return Object.values(rs.hosts || {}).reduce((a, b) => a + b, 0);
  },

  countUnit(rs, unitId) { return (rs.hosts && rs.hosts[unitId]) || 0; },

  totalHosts(pi) {
    return Rules.regionsOf(pi).reduce((a, id) => a + Rules.hostCount(G.regions[id]), 0);
  },

  completeDomains(pi) {
    const out = [];
    for (const dk in DOMAINS) {
      const ids = REGION_DEFS.filter(d => d.domain === dk).map(d => d.id);
      if (ids.every(id => G.regions[id].owner === pi)) out.push(dk);
    }
    return out;
  },

  domainComplete(pi, domainKey) {
    return REGION_DEFS.filter(d => d.domain === domainKey)
      .every(d => G.regions[d.id].owner === pi);
  },

  assaultsLeft(pi) {
    if (!SETTINGS.assaultLimit) return Infinity;
    return Math.max(0, SETTINGS.assaultLimit - G.players[pi].assaults);
  },

  throneOf(pi) { return THRONES[pi]; },

  holdsOwnThrone(pi) { return G.regions[THRONES[pi]].owner === pi; },

  rivalThronesHeld(pi) {
    return THRONES.filter((t, i) => i !== pi && G.regions[t].owner === pi).length;
  },

  activePlayers() { return G.players.filter(p => !p.surrendered); },

  /* ---------------- economy ---------------- */

  /* What a Holding at this region actually pays its owner — the tier value,
     doubled for a completed Domain, plus the income Boons. Restive ground pays
     nobody, so it returns 0 there.

     Extracted so the "+N" drawn on the board and the treasury total are the
     same calculation. A tier 2 pays 3, 4, 6, 7 or 8 depending on the owner;
     any second copy of that arithmetic would drift. `completed` is optional
     and only passed by incomeFor, which already has it for the whole sweep. */
  holdingIncome(pi, id, completed) {
    const rs = G.regions[id];
    if (rs.holding < 1 || rs.unrest > 0) return 0;
    const p = G.players[pi];
    const dom = REGIONS[id].domain;
    const done = completed ? completed.includes(dom) : Rules.domainComplete(pi, dom);
    let h = HOLDING_INCOME[rs.holding - 1];
    if (done) h *= 2;
    if (Rules.hasBoon(p, 'coffers')) h += 1;
    if (Rules.patronOf(p).id === 'ilthara') h += 1;
    return h;
  },

  incomeFor(pi) {
    const p = G.players[pi];
    if (p.surrendered) return 0;
    let total = 0;
    const completed = Rules.completeDomains(pi);

    for (const id of Rules.regionsOf(pi)) {
      const rs = G.regions[id];
      const def = REGIONS[id];
      if (rs.unrest > 0) continue;        // conquered ground pays nobody yet
      total += REGION_TYPES[def.type].income;

      total += Rules.holdingIncome(pi, id, completed);
      // units that pay their own way
      if (Rules.hasBoon(p, 'highroads')) total += 1;
      total += Rules.countUnit(rs, 'caravaneer');
      if (Rules.hasBoon(p, 'caravan')) total += Rules.countUnit(rs, 'outrider');
    }
    return total;
  },

  /* Upkeep. Hosts beyond what your territory can sustain cost Tribute every
     Round. This is the brake on the doomstack: a warlord who conquers half
     the map and fields thirty hosts spends most of their income keeping them
     fed, while a compact defender pays almost nothing. It is also the sink
     the economy was missing — Tribute now has somewhere to go. */
  upkeepFor(pi) {
    const free = UPKEEP_FREE + Rules.regionsOf(pi).length;
    let hosts = Rules.totalHosts(pi);
    if (LEVY_MODE === 'upkeep') {
      hosts -= Rules.regionsOf(pi).reduce((a, id) => a + Rules.countUnit(G.regions[id], 'levy'), 0);
    }
    return Math.max(0, hosts - free);
  },

  /* full territorial income, less upkeep, at the start of your Turn */
  grantRoundIncome(pi) {
    const p = G.players[pi];
    if (p.surrendered) return 0;
    const inc = Rules.incomeFor(pi);
    const keep = Rules.upkeepFor(pi);
    p.tribute += inc - keep;
    if (keep > 0) Rules.log(`${p.name} pays ${keep} Tribute in upkeep.`, 'upkeep', pi);

    // armies you cannot feed melt away
    let guard = 0;
    while (p.tribute < 0 && guard++ < 40) {
      const held = Rules.regionsOf(pi)
        .filter(id => Rules.hostCount(G.regions[id]) > 0)
        .sort((a, b) => Rules.hostCount(G.regions[b]) - Rules.hostCount(G.regions[a]));
      if (!held.length) { p.tribute = 0; break; }
      const rs = G.regions[held[0]];
      const cheapest = Object.keys(rs.hosts).filter(u => rs.hosts[u] > 0)
        .sort((a, b) => UNITS[a].cost - UNITS[b].cost)[0];
      rs.hosts[cheapest] -= 1;
      if (rs.hosts[cheapest] <= 0) delete rs.hosts[cheapest];
      p.tribute += 1;
      Rules.log(`${UNITS[cheapest].name} desert at ${REGIONS[held[0]].name} — unpaid.`, 'desert', pi);
    }
    return inc - keep;
  },

  /* the small per-Reaction tick, so every turn you take moves your treasury */
  grantReactionTrickle() {
    for (const i of G.reactionQueue) {
      const p = G.players[i];
      if (!p.surrendered) p.tribute += REACTION_TRICKLE;
    }
  },

  /* ---------------- experience ---------------- */

  awardXP(pi, amount, reason) {
    const p = G.players[pi];
    if (p.surrendered || amount <= 0) return;
    const scaled = Math.max(1, Math.round(amount * xpRate(Rules.regionsOf(pi).length)));
    p.xp += scaled;
    p.xpThisMatch += scaled;
    if (reason) Rules.log(`${p.name} +${scaled} XP — ${reason}.`, 'xp', pi);
    Rules.checkLevel(pi);
  },

  checkLevel(pi) {
    const p = G.players[pi];
    while (p.level < MAX_LEVEL && p.xp >= XP_THRESHOLDS[p.level]) {
      p.level += 1;
      Rules.log(`${p.name} reaches Renown ${p.level} — ${tierFor(p.level)}.`, 'level', pi);
      Rules.offerBoons(pi);
      if (p.level === 10) Rules.log(`${p.name} has achieved Apotheosis.`, 'apotheosis', pi);
    }
  },

  /* Every level offers TWO Blessings for your empire and TWO Perks for your
     Champion — and you take exactly one. Investing in your hero therefore
     costs you army power and vice versa, which both slows Blessing stacking
     and turns each level into a genuine fork rather than a free reward. */
  offerBoons(pi) {
    const p = G.players[pi];
    const take2 = (pool, offset) => {
      if (!pool.length) return [];
      const out = [];
      for (let i = 0; i < Math.min(2, pool.length); i++) out.push(pool[(offset + i) % pool.length]);
      return out.filter((c, i, a) => a.indexOf(c) === i);
    };

    const blessPool = Rules.patronOf(p).boons.filter(b => !p.boons.includes(b.id));
    const perkPool = p.championDead ? [] : CHAMPION_PERKS.filter(k => !p.perks.includes(k.id));

    const blessings = take2(blessPool, (p.level * 2) % Math.max(1, blessPool.length));
    const perks = take2(perkPool, (p.level * 3) % Math.max(1, perkPool.length));
    if (!blessings.length && !perks.length) return;

    G.pendingBoon = { player: pi, blessings, perks };
  },

  takeBoon(id) {
    const { player } = G.pendingBoon;
    const p = G.players[player];
    const blessing = Rules.patronOf(p).boons.find(x => x.id === id);
    const perk = CHAMPION_PERKS.find(x => x.id === id);

    if (blessing && !perk) {
      p.boons.push(id);
      Rules.log(`${p.name} receives the Blessing of ${blessing.name}.`, 'boon', player);
    } else if (perk) {
      p.perks.push(id);
      Rules.log(`${p.name}'s Champion learns ${perk.name}.`, 'perk', player);
    }
    G.pendingBoon = null;
    Rules.checkLevel(player);          // a level-up may have been queued behind this one
  },

  /* ---------------- raising hosts ---------------- */

  availableUnits(pi) {
    const p = G.players[pi];
    const patron = Rules.patronOf(p);
    const list = [...CORE_UNITS];
    for (const e of patron.elites) {
      if (p.level >= UNITS[e].unlockLevel) list.push(e);
    }
    return list;
  },

  /* `skipFree` asks for the price ignoring the once-per-Turn free-Levy Boons —
     the raise dialog uses it to price the 2nd+ Levy in the same batch, since
     only the first one actually lands free. */
  raiseCost(pi, regionId, unitId, skipFree) {
    const p = G.players[pi];
    const u = UNITS[unitId];
    const def = REGIONS[regionId];
    const rs = G.regions[regionId];
    const onType = u.raisedAt.includes('*') || u.raisedAt.includes(def.type);

    /* Free-Levy Boons are limited to ONE per Turn. Without the cap a zero-cost
       unit could be clicked without limit, which let a player stack an
       unbounded army in their Throne for nothing. */
    let cost = u.cost;
    let freeUsed = false;
    if (!skipFree && unitId === 'levy' && !p.freeLevyUsed) {
      if ((Rules.hasBoon(p, 'enmasse') && def.type === 'throne') ||
          (Rules.hasBoon(p, 'granary') && def.type === 'farmland')) {
        cost = 0;
        freeUsed = true;
      }
    }
    if (!onType) cost *= OFF_TYPE_MULT;
    /* Cost reductions never reach zero. Only the two explicit free-Levy
       Blessings do that, and they are capped at one per turn. Inspiring used
       Math.max(0, ...) which turned a 1-cost Levy free and let a player raise
       an unbounded army wherever the Champion stood. */
    if (Rules.hasBoon(p, 'levies')) cost = Math.max(1, cost - 1);
    if (Rules.hasPerk(p, 'inspiring') && Rules.championAt(pi, regionId)) cost = Math.max(1, cost - 1);
    return { cost, onType, freeUsed, needsHolding: !onType && rs.holding < 1 };
  },

  canRaise(pi, regionId, unitId) {
    const rs = G.regions[regionId];
    if (rs.owner !== pi) return { ok: false, why: 'You do not hold this region.' };
    if (!Rules.availableUnits(pi).includes(unitId)) return { ok: false, why: 'Not yet unlocked.' };
    const { cost, onType, freeUsed, needsHolding } = Rules.raiseCost(pi, regionId, unitId);
    if (needsHolding) return { ok: false, why: 'Off-type raising needs a Holding here.' };
    if (G.players[pi].tribute < cost) return { ok: false, why: `Needs ${cost} Tribute.` };
    return { ok: true, cost, onType, freeUsed };
  },

  raiseHost(pi, regionId, unitId) {
    const check = Rules.canRaise(pi, regionId, unitId);
    if (!check.ok) return check;
    const p = G.players[pi];
    const rs = G.regions[regionId];
    p.tribute -= check.cost;
    if (check.freeUsed) p.freeLevyUsed = true;
    rs.hosts[unitId] = (rs.hosts[unitId] || 0) + 1;
    Rules.log(
      `${p.name} raises ${UNITS[unitId].name} at ${REGIONS[regionId].name}` +
      (check.onType ? '' : ' (off-type, double cost)') + `.`,
      'raise', pi
    );
    return { ok: true };
  },

  /* ---------------- monuments ----------------
     Convert hoarded Tribute into Renown XP, once per Round. This is the sink
     the economy lacked: without it a developed empire hits a ceiling where
     its Holdings are maxed and upkeep caps its army, and every further
     Tribute is simply dead. It is also how economic play reaches high Renown
     without winning battles for it. */

  canMonument(pi) {
    const p = G.players[pi];
    if (p.monumentUsed) return { ok: false, why: 'One Monument per Round.' };
    if (p.tribute < MONUMENT_MIN) return { ok: false, why: `Needs ${MONUMENT_MIN} Tribute.` };
    return { ok: true, max: p.tribute };
  },

  monumentXP(amount) { return Math.floor(amount / MONUMENT_RATE); },

  raiseMonument(pi, amount) {
    const chk = Rules.canMonument(pi);
    if (!chk.ok) return chk;
    const p = G.players[pi];
    amount = Math.max(MONUMENT_MIN, Math.min(Math.floor(amount), p.tribute));
    const xp = Rules.monumentXP(amount);
    p.tribute -= amount;
    p.monumentUsed = true;
    Rules.log(`${p.name} raises monuments worth ${amount} Tribute.`, 'monument', pi);
    Rules.awardXP(pi, xp, 'monuments to your own deeds');
    return { ok: true, xp };
  },

  /* ---------------- holdings ---------------- */

  /* Returns the cost AND its arithmetic, so the UI can show why one Holding
     costs 6 and another costs 14 instead of leaving it a mystery. */
  holdingCostParts(pi, regionId) {
    const p = G.players[pi];
    const rs = G.regions[regionId];
    const def = REGIONS[regionId];
    if (rs.holding >= 3) return null;
    const base = HOLDING_COST[rs.holding];
    const parts = [{ label: `tier ${rs.holding + 1} base`, amount: base }];
    if (def.type === 'farmland') parts.push({ label: 'Farmland', amount: -2 });
    if (Rules.patronOf(p).id === 'ilthara') parts.push({ label: 'Ilthara', amount: -2 });
    const cost = Math.max(1, parts.reduce((a, b) => a + b.amount, 0));
    return { cost, parts, base };
  },

  holdingCost(pi, regionId) {
    const parts = Rules.holdingCostParts(pi, regionId);
    return parts ? parts.cost : null;
  },

  canBuild(pi, regionId) {
    const rs = G.regions[regionId];
    const def = REGIONS[regionId];
    if (rs.owner !== pi) return { ok: false, why: 'You do not hold this region.' };
    if (rs.unrest > 0) return { ok: false, why: 'Still restive — pacify it first.' };
    if (REGION_TYPES[def.type].noHolding) return { ok: false, why: `No Holdings on ${REGION_TYPES[def.type].name}.` };
    if (rs.holding >= 3) return { ok: false, why: 'Already at tier 3.' };
    const cp = Rules.holdingCostParts(pi, regionId);
    const free = Rules.hasBoon(G.players[pi], 'masons') && !G.players[pi].masonUsed;
    if (!free && G.players[pi].tribute < cp.cost) return { ok: false, why: `Needs ${cp.cost} Tribute.` };
    return { ok: true, cost: free ? 0 : cp.cost, parts: cp.parts, free };
  },

  buildHolding(pi, regionId) {
    const check = Rules.canBuild(pi, regionId);
    if (!check.ok) return check;
    const p = G.players[pi];
    const rs = G.regions[regionId];
    if (check.free) p.masonUsed = true; else p.tribute -= check.cost;
    rs.holding += 1;
    Rules.log(`${p.name} raises a tier-${rs.holding} Holding at ${REGIONS[regionId].name}.`, 'build', pi);
    Rules.awardXP(pi, XP_AWARDS.holding[rs.holding - 1], `Holding at ${REGIONS[regionId].name}`);
    return { ok: true };
  },

  /* ---------------- movement ---------------- */

  marchRange(pi, unitId) {
    const p = G.players[pi];
    const bonus = Rules.marchBonusFor(pi);
    if (unitId === 'outrider') return (Rules.hasBoon(p, 'swiftruin') ? 3 : 2) + bonus;
    if (unitId === 'stormrider') return 2 + bonus;
    return 1 + bonus;
  },

  /* Regions reachable from `from` for a given stack, with the path taken.

     You may cross your own territory and unclaimed ground, as far as the
     slowest unit in the stack allows, plus Port-to-Port by sea. Enemy ground
     cannot be crossed at all — to get past a rival's territory you must take
     it. (An earlier build let you pay a toll for passage; it was shelved
     because the conditions were so narrow the mechanic never actually fired
     in play.) */
  reachable(pi, from, stack) {
    const ranges = Object.keys(stack).map(u => Rules.marchRange(pi, u));
    const range = ranges.length ? Math.min(...ranges) : 1;
    const out = {};

    /* Repositioning inside your own territory is unlimited in DISTANCE but
       allowed only ONCE per turn, exactly like fortifying in RISK. Letting it
       happen freely meant a player could raise Siege at their one Mine and
       then teleport it anywhere, which made specialist ground pointless. */
    const canFortify = G.phase !== 'turn' || !G.fortifyUsed;
    const ownReach = new Set([from]);
    const queue = canFortify ? [[from, []]] : [];
    while (queue.length) {
      const [at, path] = queue.shift();
      for (const n of REGIONS[at].neighbours) {
        if (ownReach.has(n)) continue;
        if (G.regions[n].owner !== pi) continue;
        const p2 = path.concat([n]);
        ownReach.add(n);
        out[n] = p2;
        queue.push([n, p2]);
      }
    }

    /* Beyond your border you advance only as far as the slowest unit in the
       stack allows — which is what keeps Outriders worth their cost. */
    const step = (at, depth, path) => {
      for (const n of REGIONS[at].neighbours) {
        if (ownReach.has(n)) continue;
        const owner = G.regions[n].owner;
        // your own ground is reached only via the fortify pass above, so a
        // spent fortify genuinely locks repositioning for the rest of the turn
        if (owner === pi) continue;
        const p2 = path.concat([n]);
        if (!out[n] || out[n].length > p2.length) out[n] = p2;
        if (owner === null && depth + 1 < range) step(n, depth + 1, p2);
      }
    };
    for (const own of ownReach) step(own, 0, out[own] || []);

    delete out[from];
    return out;
  },

  moveStack(from, to, stack) {
    const a = G.regions[from], b = G.regions[to];
    for (const u in stack) {
      a.hosts[u] -= stack[u];
      if (a.hosts[u] <= 0) delete a.hosts[u];
      b.hosts[u] = (b.hosts[u] || 0) + stack[u];
    }
  },

  march(pi, from, to, stack, opts) {
    const p = G.players[pi];
    if (G.regions[from].owner !== pi) return { ok: false, why: 'Not your region.' };
    /* Only enforced when hosts are actually being sent — a Champion moving
       alone leaves the garrison exactly as it was, empty or not, and must
       never be trapped by a rule about troops it isn't taking anywhere. */
    if (stackSize(stack) > 0) {
      const remaining = Rules.hostCount(G.regions[from]) - stackSize(stack);
      if (remaining < 1) return { ok: false, why: 'You must leave at least one host behind.' };
    }

    const paths = Rules.reachable(pi, from, stack);
    const path = paths[to];
    if (!path) return { ok: false, why: 'Out of march range.' };

    const dest = G.regions[to];
    if (dest.owner !== null && dest.owner !== pi) {
      return { ok: false, why: 'That is an enemy region — attack it instead.' };
    }
    if (dest.owner === pi && G.phase === 'turn') G.fortifyUsed = true;
    Rules.moveStack(from, to, stack);
    if (dest.owner === null) Rules.captureRegion(pi, to);
    /* The Champion only moves when you say so, and only as far as it can
       march — it is a piece you command, not a flag that drifts along behind
       whichever stack happened to leave. */
    if (opts && opts.champion && Rules.championAt(pi, from)) {
      p.championAt = to;
      Rules.log(`${p.name}'s Champion rides to ${REGIONS[to].name}.`, 'champion', pi);
    }
    Rules.log(`${p.name} marches to ${REGIONS[to].name}.`, 'march', pi);
    return { ok: true };
  },

  /* ---------------- capture, fall, surrender ---------------- */

  captureRegion(pi, regionId) {
    const rs = G.regions[regionId];
    const prev = rs.owner;
    const def = REGIONS[regionId];
    rs.owner = pi;
    const p = G.players[pi];

    if (Rules.hasBoon(p, 'reave')) p.tribute += 2;

    /* Unrest — the brake on runaway conquest. Ground taken off a rival produces
       no Income and cannot be developed until you have held it through one
       of your own Turns. Taking five regions in a Round now costs you a Round
       of their income, so a blitz has to be worth more than it earns. */
    if (prev !== null && prev !== pi) rs.unrest = 1;

    Rules.awardXP(pi, prev === null ? XP_AWARDS.captureFree : XP_AWARDS.captureFoe,
      `${REGIONS[regionId].name} taken`);

    if (def.type === 'throne' && prev !== null && prev !== pi) {
      Rules.awardXP(pi, XP_AWARDS.throne, `the Throne of ${REGIONS[regionId].name}`);
      const victim = G.players[prev];
      victim.fallen = true;
      Rules.log(`${victim.name} is Fallen — ${REGIONS[regionId].name} has changed hands.`, 'fallen', prev);
    }

    // domain completion
    for (const dk in DOMAINS) {
      if (REGION_DEFS.some(d => d.id === regionId && d.domain === dk) &&
          Rules.domainComplete(pi, dk)) {
        Rules.awardXP(pi, XP_AWARDS.domain, `the Domain of ${DOMAINS[dk].name}`);
        Rules.log(`${p.name} completes the Domain of ${DOMAINS[dk].name}.`, 'domain', pi);
      }
    }
    if (prev !== null) Rules.checkFallenState(prev);
  },

  /* Fallen = your Throne is gone. You keep your regions, income, Renown and
     Boons, and taking any Throne on the map restores you. Losing your LAST
     region is different: there is no way back from nothing, so rather than
     leave a player who cannot act, the surrender resolves automatically and
     the spoils are divided as normal. */
  checkFallenState(pi) {
    const p = G.players[pi];
    if (p.surrendered) return;
    p.fallen = !THRONES.some(t => G.regions[t].owner === pi);
    if (Rules.regionsOf(pi).length === 0 && Rules.totalHosts(pi) === 0) {
      Rules.log(`${p.name} holds nothing and no longer fields a host.`, 'fallen', pi);
      Rules.surrender(pi);
    }
  },

  canSurrender(pi) {
    const p = G.players[pi];
    if (p.surrendered) return false;
    if (G.round < 3) return false;
    return p.fallen || Rules.regionsOf(pi).length <= 2;
  },

  surrender(pi) {
    const p = G.players[pi];
    p.surrendered = true;
    const active = G.players.filter(q => !q.surrendered);
    Rules.log(`${p.name} surrenders.`, 'surrender', pi);

    // regions pass to bordering active players — most adjacent hosts wins
    for (const id of Rules.regionsOf(pi)) {
      const scores = {};
      for (const n of REGIONS[id].neighbours) {
        const o = G.regions[n].owner;
        if (o !== null && o !== pi && !G.players[o].surrendered) {
          scores[o] = (scores[o] || 0) + Rules.hostCount(G.regions[n]);
        }
      }
      const claimants = Object.keys(scores);
      if (claimants.length) {
        const winner = +claimants.sort((a, b) => scores[b] - scores[a])[0];
        G.regions[id].owner = winner;
        G.regions[id].hosts = {};
        Rules.log(`${REGIONS[id].name} passes to ${G.players[winner].name}.`, 'spoils', winner);
      } else {
        G.regions[id].owner = null;
        G.regions[id].hosts = {};
      }
    }

    // banked Tribute splits evenly among the survivors
    if (active.length && p.tribute > 0) {
      const share = Math.floor(p.tribute / active.length);
      if (share > 0) {
        active.forEach(q => { q.tribute += share; });
        Rules.log(`${p.tribute} banked Tribute is divided — ${share} each.`, 'spoils');
      }
    }
    p.tribute = 0;
    Rules.checkVictory();
  },

  /* ---------------- scoring ---------------- */

  scoreFor(pi) {
    const p = G.players[pi];
    if (p.surrendered) return { total: 0, domains: 0, holdings: 0, level: 0, thrones: 0 };
    const domains = Rules.completeDomains(pi).length;
    const holdings = Rules.regionsOf(pi)
      .reduce((a, id) => a + (G.regions[id].holding > 0 ? 1 : 0), 0);
    const thrones = Rules.rivalThronesHeld(pi);
    const total = domains * VP.domain + holdings * VP.holding +
                  p.level * VP.renownLevel + thrones * VP.rivalThrone;
    return { total, domains, holdings, level: p.level, thrones };
  },

  checkVictory() {
    const active = G.players.filter(p => !p.surrendered);
    if (active.length === 1) {
      G.phase = 'gameover';
      G.winner = active[0].index;
      G.finalScores = G.players.map((p, i) => ({ player: i, ...Rules.scoreFor(i) }));
      Rules.log(`${active[0].name} stands alone.`, 'victory', active[0].index);
      return true;
    }
    if (G.round > ROUND_LIMIT) {
      G.phase = 'gameover';
      G.finalScores = G.players.map((p, i) => ({ player: i, ...Rules.scoreFor(i) }));
      const best = [...G.finalScores].sort((a, b) => b.total - a.total)[0];
      G.winner = best.player;
      Rules.log(`The Round limit is reached. ${G.players[best.player].name} scores ${best.total}.`, 'victory', best.player);
      return true;
    }
    return false;
  },

  /* ---------------- turn flow ---------------- */

  endTurn() {
    // ground held through one of your own Turns is pacified
    for (const id of Rules.regionsOf(G.turnIndex)) {
      if (G.regions[id].unrest > 0) G.regions[id].unrest -= 1;
    }

    // shrines pay every holder at the close of each Turn
    for (const q of G.players) {
      if (q.surrendered) continue;
      let tithe = 0;
      for (const id of Rules.regionsOf(q.index)) {
        const t = REGIONS[id].type;
        if (t === 'shrine') Rules.awardXP(q.index, XP_AWARDS.shrineTurn, `the shrine at ${REGIONS[id].name}`);
        if (Rules.hasBoon(q, 'tithe') && (t === 'shrine' || t === 'throne')) tithe += 2;
      }
      if (tithe) Rules.awardXP(q.index, tithe, 'Tithe');
    }

    if (SETTINGS.skipReactions) return Rules.nextTurn();

    G.reactionQueue = G.players
      .map((q, i) => i)
      .filter(i => i !== G.turnIndex && !G.players[i].surrendered);
    G.reactionIndex = 0;
    G.reactionActionTaken = false;

    if (G.reactionQueue.length === 0) return Rules.nextTurn();
    G.phase = 'reaction';
    Rules.grantReactionTrickle();
  },

  endReaction() {
    G.reactionIndex += 1;
    G.reactionActionTaken = false;
    if (G.reactionIndex >= G.reactionQueue.length) Rules.nextTurn();
  },

  nextTurn() {
    G.phase = 'turn';
    let guard = 0;
    do {
      G.turnIndex += 1;
      if (G.turnIndex >= G.players.length) {
        G.turnIndex = 0;
        G.round += 1;
        G.players.forEach(p => { p.firstAttackDone = false; p.masonUsed = false; });
        Rules.log(`— Round ${G.round} —`, 'round');
        if (Rules.checkVictory()) return;
      }
      guard++;
    } while (G.players[G.turnIndex].surrendered && guard < 20);

    Rules.turnPlayer().firstAttackDone = false;
    Rules.turnPlayer().assaults = 0;           // your allowance refreshes on your Turn
    Rules.turnPlayer().freeLevyUsed = false;
    Rules.turnPlayer().monumentUsed = false;
    G.actionsUsed = 0;
    G.fortifyUsed = false;
    const inc = Rules.grantRoundIncome(G.turnIndex);
    Rules.log(`${Rules.turnPlayer().name} takes the Turn — ${inc} Tribute collected.`, 'turn', G.turnIndex);
    Rules.checkVictory();
  },

  /* ---------------- log ---------------- */

  /* `seq` is a monotonic stamp, not a display field. The log is unshifted and
     capped at 140, so length is useless as a watermark — the UI needs a number
     it can compare against to find entries it has not announced yet. The engine
     still knows nothing about the UI; it just numbers its own events. */
  log(text, kind = 'info', player = null) {
    G.log.unshift({ text, kind, player, round: G.round, seq: ++G.logSeq });
    if (G.log.length > 140) G.log.pop();
  }
};

/* ============================================================
   APOTHEOSIS — combat
   Attacker 3 dice, defender 2, ties to the defender.
   Composition bends the odds; the losing player picks the dead.
   ============================================================ */

/* Dice run through a swappable source so evaluation can be made repeatable.
   In the game this is just Math.random. In the arena it is a seeded stream,
   which lets a candidate AI and the incumbent play the SAME dice from the
   same positions — without that, comparing two AIs means reading noise: a
   3-4% strength difference is invisible under unpaired variance until you
   have run about ten times as many games. */
let RNG = Math.random;
function setRNG(fn) { RNG = fn || Math.random; }

function d6() { return 1 + Math.floor(RNG() * 6); }

function stackSize(s) { return Object.values(s || {}).reduce((a, b) => a + b, 0); }

const Combat = {

  /* ---------------- setup ---------------- */

  begin(pi, from, target, stack, opts) {
    const defender = G.regions[target].owner;
    G.players[pi].assaults += 1;
    // lift the committed force out of the source region for the duration
    for (const u in stack) {
      G.regions[from].hosts[u] -= stack[u];
      if (G.regions[from].hosts[u] <= 0) delete G.regions[from].hosts[u];
    }
    G.pendingCombat = {
      attacker: pi,
      defender,
      from, target,
      force: { ...stack },
      championLeads: !!(opts && opts.champion) && Rules.championAt(pi, from),
      attackerHadWarden: (stack.warden || 0) > 0,
      defenderHadWarden: Rules.countUnit(G.regions[target], 'warden') > 0,
      lastRoll: null,
      atkLost: 0, defLost: 0,
      queue: [],
      finished: false,
      captured: false
    };
    Rules.log(
      `${G.players[pi].name} attacks ${REGIONS[target].name} with ` +
      `${stackSize(stack)} host${stackSize(stack) === 1 ? '' : 's'}.`,
      'attack', pi
    );
    return G.pendingCombat;
  },

  /* ---------------- dice ---------------- */

  diceContributors(stack) {
    let n = 0;
    for (const u in stack) if (u !== 'siege') n += stack[u];
    return n;
  },

  attackProfile(c) {
    const p = G.players[c.attacker];
    const f = c.force;
    const notes = [];

    let dice = Math.min(3, Combat.diceContributors(f));
    if (LEVY_MODE === 'dice') {
      const lb = Math.floor((f.levy || 0) / 3);
      if (lb) { dice += lb; notes.push(`+${lb} Levy mass`); }
    }

    let bonus = 0;
    if (LEVY_MODE === 'bonus') {
      const lb = Math.min(2, Math.floor((f.levy || 0) / 4));
      if (lb) { bonus += lb; notes.push(`+${lb} Levy mass`); }
    }
    if (f.zealot) {
      let z = Math.floor(p.level / 3);
      if (Rules.hasBoon(p, 'fury')) z *= 2;
      if (z) { bonus += z; notes.push(`+${z} Zealots`); }
    }
    if (c.championLeads) {
      const ch = Rules.championBonus(c.attacker);
      if (ch) { bonus += ch; notes.push(`+${ch} Champion`); }
      if (Rules.hasPerk(p, 'vanguard')) { dice += 1; notes.push('+1 Vanguard'); }
    }
    return { dice: Math.max(1, dice), bonus: Math.min(bonus, MAX_DIE_BONUS), notes };
  },

  defenceProfile(c) {
    const rs = G.regions[c.target];
    const p = c.defender === null ? null : G.players[c.defender];
    const notes = [];

    let dice = Math.min(2, Combat.diceContributors(rs.hosts));
    if (Rules.countUnit(rs, 'phalanx') > 0) notes.push('Shieldwall');
    if (Rules.countUnit(rs, 'gatewarden') > 0) notes.push('Gatewardens hold');

    /* A developed Holding is a wall, not just an income line. Siege exists
       precisely to answer that — bring one and the walls stop counting. */
    if (rs.holding >= 2) {
      const atk = G.players[c.attacker];
      if (c.force.siege) notes.push('Holding breached by Siege');
      else if (Rules.hasBoon(atk, 'stormseye')) notes.push('Holding ignored by Siegebreaker');
      else { dice += 1; notes.push(`+1 tier-${rs.holding} Holding`); }
    }

    if (p && Rules.hasBoon(p, 'fortified') && rs.holding >= 2) { dice += 1; notes.push('+1 Fortified'); }
    if (c.force.thunderguard) notes.push('Sundered by Thunderguard');

    let bonus = 0;
    if (LEVY_MODE === 'bonus') {
      const lb = Math.min(2, Math.floor(Rules.countUnit(rs, 'levy') / 4));
      if (lb) { bonus += lb; notes.push(`+${lb} Levy mass`); }
    }
    if (p) {
      if (Rules.countUnit(rs, 'zealot') > 0) {
        let z = Math.floor(p.level / 3);
        if (Rules.hasBoon(p, 'fury')) z *= 2;
        if (z) { bonus += z; notes.push(`+${z} Zealots`); }
      }
      if (Rules.championAt(c.defender, c.target)) {
        const ch = Rules.championBonus(c.defender);
        if (ch) { bonus += ch; notes.push(`+${ch} Champion`); }
        if (Rules.hasPerk(p, 'bulwark')) { dice += 1; notes.push('+1 Bulwark'); }
      }
    }
    return { dice: Math.max(1, dice), bonus: Math.min(bonus, MAX_DIE_BONUS), notes };
  },

  /* ---------------- one exchange ---------------- */

  exchange() {
    const c = G.pendingCombat;
    if (!c || c.finished || c.queue.length) return;

    const ap = Combat.attackProfile(c);
    const dp = Combat.defenceProfile(c);

    const atk = Array.from({ length: ap.dice }, d6).sort((a, b) => b - a);
    const def = Array.from({ length: dp.dice }, d6).sort((a, b) => b - a);

    // the flat bonus applies to the single highest die on each side
    const atkAdj = atk.slice(); if (atkAdj.length) atkAdj[0] += ap.bonus;
    const defAdj = def.slice(); if (defAdj.length) defAdj[0] += dp.bonus;

    const pairs = [];
    let atkLoss = 0, defLoss = 0;
    for (let i = 0; i < Math.min(atkAdj.length, defAdj.length); i++) {
      const win = atkAdj[i] > defAdj[i];        // ties go to the defender
      pairs.push({ a: atkAdj[i], d: defAdj[i], attackerWins: win });
      if (win) defLoss++; else atkLoss++;
    }

    const p = G.players[c.attacker];
    // Storm's Eye spares one casualty per battle, not per exchange — per
    // exchange it could cancel the only loss and the fight never ended.
    if (c.championLeads && Rules.hasPerk(p, 'relentless') && atkLoss > 0 && !c.relentlessUsed) {
      atkLoss -= 1;
      c.relentlessUsed = true;
    }

    /* Every exchange must cost somebody something. Without this an unlucky
       combination of modifiers produces a scoreless round and the battle
       loops forever with no way for either side to resolve it. */
    /* Casualty effects. These replace the old dice modifiers, which were
       nearly inert: combat only compares min(attacker, defender) dice, so a
       bonus die past the defender's count was simply discarded. Adding and
       negating CASUALTIES always lands. */
    const drs = G.regions[c.target];
    const sundered = !!c.force.thunderguard;          // ignores walls and shieldwalls alike

    // Warpath: the first attack of a Round bites deeper
    if (Rules.hasBoon(p, 'warpath') && !p.firstAttackDone && !c.warpathUsed) {
      c.warpathUsed = true;
      if (defLoss > 0 || atkLoss === 0) { defLoss += 1; ap.notes.push('Warpath'); }
    }

    // Shock: Stormriders hit harder the moment they arrive
    if (c.force.stormrider && !c.shockUsed) {
      c.shockUsed = true;
      if (defLoss > 0 || atkLoss === 0) defLoss += 1;
    }

    /* Shieldwall absorbs ONE casualty per BATTLE, not per exchange.
       Per exchange it made a lone Phalanx invulnerable: a defender rolling a
       single die produces exactly one pair, so every hit the attacker landed
       was negated and the wall could never be broken. */
    if (!sundered && Rules.countUnit(drs, 'phalanx') > 0 && defLoss > 0 && !c.defShieldUsed) {
      defLoss -= 1;
      c.defShieldUsed = true;
      dp.notes.push('Shieldwall absorbs a hit');
    }
    if ((c.force.phalanx || 0) > 0 && atkLoss > 0 && !c.atkShieldUsed) {
      atkLoss -= 1;
      c.atkShieldUsed = true;
      ap.notes.push('Shieldwall absorbs a hit');
    }

    /* NEVER invent a casualty for a side that won its pairs. This line used to
       fire whenever Shieldwall zeroed the defender's loss, handing the hit to
       the ATTACKER instead — so rolling 7 against 6 cost you a unit and the
       defender nothing. It now only guards the degenerate case where no dice
       were compared at all. */
    if (atkLoss === 0 && defLoss === 0 && pairs.length === 0) atkLoss = 1;

    p.firstAttackDone = true;
    c.lastRoll = { atk, def, atkAdj, defAdj, pairs, ap, dp, atkLoss, defLoss };

    // Siege guts the Holding on any exchange the attacker wins
    // Gatewardens forbid the razing entirely
    if (defLoss > 0 && c.force.siege && Rules.countUnit(G.regions[c.target], 'gatewarden') === 0) {
      const rs = G.regions[c.target];
      const floorTier = (c.defender !== null && Rules.hasBoon(G.players[c.defender], 'unbroken')) ||
                        REGIONS[c.target].type === 'throne' ? 1 : 0;

    atkLoss = Math.min(atkLoss, stackSize(c.force));
    defLoss = Math.min(defLoss, Rules.hostCount(G.regions[c.target]));

  currentCasualtyJob() {

    if (!c || !c.queue.length) return null;

      ...job,
      pool: job.side === 'attacker' ? c.force : G.regions[c.target].hosts

  },

      if (c.defender !== null) Rules.awardXP(c.defender, removed * XP_AWARDS.hostDestroyed, 'hosts destroyed');

      c.defLost += removed;
      Rules.awardXP(c.attacker, removed * XP_AWARDS.hostDestroyed, 'hosts destroyed');
      if (c.defender !== null) Rules.awardXP(c.defender, removed * XP_AWARDS.hostLost, 'hosts lost');

  },

  /* ---------------- resolution ---------------- */

  afterExchange() {
    const c = G.pendingCombat;
    if (!c || c.queue.length) return;

       c.force once the survivors have moved into the captured region, so a
       second pass through here saw atkLeft === 0, decided the assault had
       been wiped out, and ran the repulse branch — which killed the Champion
       that had just won the fight. */
    if (c.finished) return;

    const atkLeft = stackSize(c.force);

          Rules.log(`${ap.name}'s Warden dies covering the Champion's retreat.`, 'warden', c.attacker);
          ap.championAt = c.from;                    // falls back to the ground it came from

  captureAndFinish() {

       in its place and buys the escape; without one, the Champion is gone for
       the rest of the match. */

      const lp = G.players[loser];
      if (c.defenderHadWarden) {
        Rules.log(`${lp.name}'s Warden dies covering the Champion's escape.`, 'warden', loser);
        const refuge = Rules.regionsOf(loser).filter(id => id !== target);
        lp.championAt = refuge.includes(THRONES[loser]) ? THRONES[loser] : (refuge[0] || null);

      rs.hosts.levy = (rs.hosts.levy || 0) + 1;
      Rules.log(`Second Wind raises a Levy at ${REGIONS[target].name}.`, 'boon', c.attacker);
    }
    // a Champion that led the assault advances into the ground it took

        ap.tribute += 4;
        Rules.log(`Reaver — ${ap.name} strips ${REGIONS[target].name} for 4 Tribute.`, 'perk', c.attacker);

  withdraw() {
    const c = G.pendingCombat;
    if (!c || c.finished) return;
    Rules.log(`${G.players[c.attacker].name} withdraws from ${REGIONS[c.target].name}.`, 'withdraw', c.attacker);
    c.finished = true;

  /* return any surviving attackers to the region they came from */
  settle() {

      if (c.force[u] > 0) {
        G.regions[c.from].hosts[u] = (G.regions[c.from].hosts[u] || 0) + c.force[u];
      }
    }
    c.force = {};
    Rules.checkVictory();

  dismiss() {

  }

/* ============================================================
   APOTHEOSIS — AI opponents

   Three personalities that want genuinely different things, so a
   match has more than one kind of pressure in it. Every decision is
   a score comparison, never a dice roll, so an AI's behaviour is
   readable: if it took your Shrine it was because the Shrine scored
   highest, and you can learn to predict that.
   ============================================================ */

const AI = {

  seats: {},        // playerIndex -> personality key ('' or absent = human)
  busy: false,
  delay: 750,       // ms between visible AI actions

  PERSONALITIES: {
    warmonger: {
      name: 'Warmonger',
      blurb: 'Attacks early and often. Builds little, and would rather take your Forge than raise one.',
      patron: 'vashtar',
      attack: 1.5, build: 0.7, raise: 1.2, risk: 0.9, reserve: 3,
      units: ['zealot', 'outrider', 'stormrider', 'thunderguard', 'levy'],
      championWeight: 1.45,
      perks: ['vanguard', 'duelist', 'relentless', 'reaver', 'swift', 'warlord', 'undying', 'standard'],
      boons: ['warpath', 'stormseye', 'secondwind', 'levies', 'enmasse', 'reave', 'swiftruin', 'fury']
    },
    magnate: {
      name: 'Magnate',
      blurb: 'Develops relentlessly and fortifies everything. Slow to start, brutal if left alone.',
      patron: 'ilthara',
      attack: 1.0, build: 1.5, raise: 1.2, risk: 1.05, reserve: 3,
      units: ['phalanx', 'gatewarden', 'caravaneer', 'warden', 'levy'],
      championWeight: 0.6,
      perks: ['bulwark', 'inspiring', 'undying', 'warlord', 'standard', 'duelist', 'swift', 'vanguard'],
      boons: ['coffers', 'highroads', 'masons', 'fortified', 'unbroken', 'granary', 'tithe', 'caravan']
    },
    opportunist: {
      name: 'Opportunist',
      blurb: 'Takes whatever is cheapest to take. Punishes anyone who leaves a border thin.',
      patron: 'vashtar',
      attack: 1.1, build: 1.05, raise: 1.1, risk: 1.1, reserve: 3,
      units: ['outrider', 'phalanx', 'siege', 'zealot', 'levy'],
      championWeight: 1.0,
      perks: ['warlord', 'reaver', 'swift', 'vanguard', 'undying', 'duelist', 'bulwark', 'standard'],
      boons: ['reave', 'secondwind', 'coffers', 'fortified', 'swiftruin', 'masons', 'warpath', 'tithe']
    }
  },

  isAI(pi) { return pi !== null && pi !== undefined && !!AI.seats[pi]; },
  anyAI() { return Object.keys(AI.seats).length > 0; },
  personality(pi) { return AI.PERSONALITIES[AI.seats[pi]] || AI.PERSONALITIES.opportunist; },
  label(pi) { return AI.isAI(pi) ? AI.personality(pi).name : 'Human'; },

  /* Watch mode: an AI attacking a human plays out on screen so you can
     see the dice. AI-versus-AI resolves silently into the chronicle. */
  shouldWatch(c) {
    return c && AI.isAI(c.attacker) && c.defender !== null && !AI.isAI(c.defender);
  },

  /* ================= scheduler ================= */

  kick() {
    if (AI.busy || !G || G.phase === 'gameover') return;

    // anything waiting on a human stops the machine
    if (G.pendingBoon && !AI.isAI(G.pendingBoon.player)) return;
    const c = G.pendingCombat;
    if (c && !AI.isAI(c.attacker)) return;
    if (c && c.finished && AI.shouldWatch(c)) return;   // human is reading the result

    const needed =
      (G.pendingBoon && AI.isAI(G.pendingBoon.player)) ||
      (c && AI.isAI(c.attacker)) ||
      AI.isAI(UI.actingIndex());
    if (!needed) return;

    AI.busy = true;
    setTimeout(AI.step, AI.delay);
  },

  step() {

    if (!G || G.phase === 'gameover') { UI.render(); return; }
    try {
      if (G.pendingBoon && AI.isAI(G.pendingBoon.player)) AI.chooseBoon();
      else if (G.pendingCombat && AI.isAI(G.pendingCombat.attacker)) AI.combatStep();
      else if (AI.isAI(UI.actingIndex())) AI.turnStep();
    } catch (e) {
      console.error('AI failure, ending turn:', e);
      if (G.pendingCombat) { Combat.withdraw(); Combat.dismiss(); }
      if (G.phase !== 'gameover') UI.endTurn();
    }
    UI.renderSoon();

  },

  /* ================= evaluation helpers ================= */

  regionWorth(id) {
    const base = { shrine: 9, mine: 7, forge: 6, port: 5, farmland: 4, throne: 16, waste: -1 };
    return (base[REGIONS[id].type] || 3) + G.regions[id].holding * 2;
  },

  defenceOf(id, force) {
    const rs = G.regions[id];
    let d = Rules.hostCount(rs)
      + Rules.countUnit(rs, 'phalanx') * 1.2
      + Rules.countUnit(rs, 'gatewarden') * 1.0;
    if (rs.holding >= 2 && !(force && force.siege)) d += 1.5;   // walls, unless you brought Siege
    return d;
  },

  /* how close pi is to completing the domain containing `id` */
  domainProgress(pi, id) {
    const dk = REGIONS[id].domain;
    const ids = REGION_DEFS.filter(d => d.domain === dk).map(d => d.id);
    const held = ids.filter(x => G.regions[x].owner === pi).length;
    return { held, total: ids.length, completesWith: held + 1 === ids.length };
  },

  /* is this region of mine exposed to a rival next turn? */
  threatTo(pi, id) {
    let worst = 0;
    for (const n of REGIONS[id].neighbours) {
      const o = G.regions[n].owner;
      if (o !== null && o !== pi) worst = Math.max(worst, Rules.hostCount(G.regions[n]));
    }
    return worst;
  },

  /* How much is worth attacking from this region of mine? Zero means it is
     an interior region with nothing to hit, which makes it a place to take
     hosts FROM rather than leave them sitting in. */
  frontierValue(pi, id) {
    let best = 0;
    for (const n of REGIONS[id].neighbours) {
      const o = G.regions[n].owner;
      if (o !== null && o !== pi) best = Math.max(best, AI.regionWorth(n));
    }
    return best;
  },


  /* ================= valuation, in victory points — PARKED, NOT IN USE
     Kept because the reasoning is sound and the diagnosis behind it holds.
     Wiring it in wholesale made the AI markedly worse (see CLAUDE.md).
     =================

     Every option the AI weighs is converted into the same currency: how many
     VP it is expected to be worth by the end of the match. That sounds
     obvious, but the previous evaluation scored a region by an invented
     "worth" (a Shrine was 9, a Mine 7) which had no relationship to how the
     game is actually won. The consequence was measurable: the aggressive
     personality spent 0% of its turns building, because a Holding and an
     attack were priced in different units and the attack always looked
     bigger. It attacked at a 0.82 trade ratio — losing more hosts than it
     killed — and could not tell that this was bad.

     Scoring in VP makes the comparison honest: a Holding is worth VP.holding
     plus the income it throws off, an attack is worth the ground's VP minus
     the hosts it will cost, and the AI can now decline a bad fight in favour
     of a good build. */

  /* What one Tribute is worth in VP, via the game's own Monument rate:
     MONUMENT_RATE tribute buys 1 XP, and a level (1 VP) costs the gap
     between two thresholds. Deliberately derived rather than invented. */
  tributeToVP(pi) {
    const lvl = Math.min(MAX_LEVEL - 1, G.players[pi].level);
    const gap = Math.max(20, XP_THRESHOLDS[lvl] - XP_THRESHOLDS[lvl - 1]);
    return VP.renownLevel / (gap * MONUMENT_RATE);
  },

  roundsLeft() { return Math.max(1, ROUND_LIMIT - G.round + 1); },

  /* A host is not VP, but it is what buys ground. Valued as a fraction of the
     VP an average capture yields, decaying as the match ends and there is no
     longer time to spend it. */
  hostVP(pi) {
    return 0.30 * Math.min(1, AI.roundsLeft() / 3);
  },

  /* What holding this ground is worth, in VP. */
  regionVP(pi, id) {
    const def = REGIONS[id], rs = G.regions[id];
    const prog = AI.domainProgress(pi, id);
    let v = 0;

    /* Domains are the biggest single prize on the board. A region that
       completes one is worth the whole VP.domain; one that merely advances a
       domain is worth its share, weighted by how far along that domain is. */
    v += prog.completesWith
      ? VP.domain
      : (VP.domain / prog.total) * (0.4 + 0.6 * (prog.held / prog.total));

    if (def.type === 'throne' && rs.owner !== null && rs.owner !== pi) v += VP.rivalThrone;
    if (rs.holding > 0) v += VP.holding * rs.holding * 0.5;      // walls you capture intact
    else if (!REGION_TYPES[def.type].noHolding) v += VP.holding * 0.95; // you will build here

    // income for the rest of the match, converted at the Monument rate
    const inc = REGION_TYPES[def.type].income + (rs.holding ? HOLDING_INCOME[rs.holding - 1] : 0);
    v += inc * AI.roundsLeft() * AI.tributeToVP(pi);

    // ground that unlocks a unit type you cannot otherwise field
    const raises = REGION_TYPES[def.type].raises || [];
    if (raises.length && !Rules.regionsOf(pi).some(r => REGIONS[r].type === def.type)) v += 0.9;
    if (def.type === 'shrine') v += XP_AWARDS.shrineTurn * AI.roundsLeft() * (VP.renownLevel / 60);

    return v;
  },

  /* Expected hosts lost taking a defended region, in VP. Attacker rolls three
     dice to the defender's two, so parity is already favourable; below about
     0.8 of the defender's strength the trade turns against you, which is
     exactly where the aggressive personality used to live. */
  assaultCostVP(pi, avail, def) {
    const edge = avail / Math.max(0.5, def);
    const expectedLoss = def * (edge >= 1.4 ? 0.55 : edge >= 1.0 ? 0.85 : 1.35);
    return expectedLoss * AI.hostVP(pi);
  },

  /* ================= action selection ================= */

  bestAction(pi) {
    const p = G.players[pi];
    const P = AI.personality(pi);
    const mine = Rules.regionsOf(pi);
    if (!mine.length) return null;
    const options = [];

    /* --- attacks and expansion marches --- */
    for (const src of mine) {
      const avail = Rules.hostCount(G.regions[src]) - 1;
      if (avail < 1) continue;
      const targets = UI.marchTargets(src);
      for (const to in targets) {
        const rs = G.regions[to];
        if (rs.owner === pi) continue;                     // handled as reinforcement below

        let score = AI.regionWorth(to) + (prog.completesWith ? 26 : prog.held * 3);
        let send;

        if (rs.owner === null) {
          // Unclaimed ground is a race everyone should run. Weighting this by
          // aggression meant the builders lost the opening land grab and then
          // had nothing to build on for the rest of the match.
          score = (score + 12) * (0.9 + P.attack * 0.25);
          send = Math.min(2, avail);
          const exposure = AI.threatTo(pi, src);
          if (exposure > avail - send) score -= 3;
        } else {
          send = avail;                                     // commit everything spare
          const force = AI.pickStack(G.regions[src].hosts, send);
          const def = AI.defenceOf(to, force);
          // the attacker rolls three dice to the defender's two, so rough
          // parity is already a favourable trade — demanding a big surplus
          // was why these opponents never fought at all
          if (avail < def * 0.85 * P.risk) continue;
          score = (score + 10 + (avail - def) * 2.2) * P.attack;
          if (REGIONS[to].type === 'throne') score += 20;
          if (rs.holding > 0) score += rs.holding * 2;
        }

        const stack = AI.pickStack(G.regions[src].hosts, send);
        if (!Object.keys(stack).length) continue;
        options.push({ kind: 'move', src, to, stack, score, hostile: rs.owner !== null });

    /* --- gather: drain interior regions toward the fighting --- */
    for (const src of mine) {
      const avail = Rules.hostCount(G.regions[src]) - 1;
      if (avail < 1) continue;
      if (AI.frontierValue(pi, src) > 0) continue;          // already on a border, leave it
      for (const to of REGIONS[src].neighbours) {
        if (G.regions[to].owner !== pi) continue;
        const fv = AI.frontierValue(pi, to);
        if (fv <= 0) continue;                              // only ever move toward a front
        const stack = AI.pickStack(G.regions[src].hosts, avail);
        if (!Object.keys(stack).length) continue;
        options.push({
          kind: 'move', src, to, hostile: false, stack,
          score: (fv * 0.55 + avail * 1.1) * P.attack
        });

    /* --- build --- */
    const freeLandLeft = mine.some(id =>
      REGIONS[id].neighbours.some(n => G.regions[n].owner === null));
    for (const id of mine) {
      const chk = Rules.canBuild(pi, id);
      if (!chk.ok) continue;
      const prog = AI.domainProgress(pi, id);
      let score = (AI.regionWorth(id) * 0.9 + prog.held * 2.5) * P.build - chk.cost * 0.3;
      if (REGIONS[id].type === 'farmland') score += 2;
      // never pour Tribute into ground that is about to change hands
      const gap = AI.threatTo(pi, id) - Rules.hostCount(G.regions[id]);
      if (gap > 0) score -= gap * 5 + 6;
      if (freeLandLeft) score *= 0.45;      // claim the map first, develop it second
      options.push({ kind: 'build', id, score });
    }

       This is what finally stops the builder finishing on a pile of unspent
       Tribute. Once Holdings are maxed and upkeep caps the army, legend is

       The score used to cap at 38 (8 + min(30, ...)), which sounded like a
       lot until measurement showed 'raise' routinely scoring 40-57 late
       game — Monument could not win even a routine troop purchase, let
       alone a good one, no matter the hoard size. Worse, raise only spends
       one unit's cost per action while income arrives in a lump every
       Round, so the trickle never caught up: a Magnate was seen sitting on

          // an army you cannot feed deserts, so stop short of that line

         fielding fifty hosts it starved into desertion. */

      if (upkeep > income * 0.5) score -= (upkeep - income * 0.5) * 9;
          options.push({ kind: 'raise', id, unit: u, score });
          break;                                            // one candidate unit per region
        }
      }
    }

    /* --- reinforce a threatened region from a safe one --- */
    for (const src of mine) {
      const avail = Rules.hostCount(G.regions[src]) - 1;
      if (avail < 1 || AI.threatTo(pi, src) > 0) continue;
      for (const to of REGIONS[src].neighbours) {
        if (G.regions[to].owner !== pi) continue;
        const gap = AI.threatTo(pi, to) - Rules.hostCount(G.regions[to]);
        if (gap <= 0) continue;
        const stack = AI.pickStack(G.regions[src].hosts, Math.min(avail, gap + 1));
        if (!Object.keys(stack).length) continue;
        options.push({ kind: 'move', src, to, hostile: false, stack, score: gap * 2.4 });
      }
    }

    if (!options.length) return null;
    options.sort((a, b) => b.score - a.score);
    return options[0].score > 2 ? options[0] : null;
  },

  /* take the most expendable hosts first, but never send Siege alone */
  pickStack(hosts, max) {
    const order = Object.keys(hosts).filter(u => hosts[u] > 0)
      .sort((a, b) => UNITS[b].cost - UNITS[a].cost);   // best troops lead the assault
    const stack = {}; let n = 0;
    for (const u of order) {
      const take = Math.min(hosts[u], max - n);
      if (take > 0) { stack[u] = take; n += take; }
      if (n >= max) break;
