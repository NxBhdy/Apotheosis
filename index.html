/* ===== js/ai.js ===== */
/* ============================================================
   APOTHEOSIS — AI opponents

   Three personalities that want genuinely different things, so a
   match has more than one kind of pressure in it. Every decision is
   a score comparison, never a dice roll, so an AI's behaviour is
   readable: if it took your Shrine it was because the Shrine scored
   highest, and you can learn to predict that.
   ============================================================ */

const AI = {

  seats: {},        // playerIndex -> personality key ('' or absent = human)
  busy: false,
  delay: 750,       // ms between visible AI actions

  PERSONALITIES: {
    warmonger: {
      name: 'Warmonger',
      blurb: 'Attacks early and often. Builds little, and would rather take your Forge than raise one.',
      patron: 'vashtar',
      attack: 1.5, build: 0.7, raise: 1.2, risk: 0.9, reserve: 3,
      units: ['zealot', 'outrider', 'stormrider', 'thunderguard', 'levy'],
      championWeight: 1.45,
      perks: ['vanguard', 'duelist', 'relentless', 'reaver', 'swift', 'warlord', 'undying', 'standard'],
      boons: ['warpath', 'stormseye', 'secondwind', 'levies', 'enmasse', 'reave', 'swiftruin', 'fury']
    },
    magnate: {
      name: 'Magnate',
      blurb: 'Develops relentlessly and fortifies everything. Slow to start, brutal if left alone.',
      patron: 'ilthara',
      attack: 1.0, build: 1.5, raise: 1.2, risk: 1.05, reserve: 3,
      units: ['phalanx', 'gatewarden', 'caravaneer', 'warden', 'levy'],
      championWeight: 0.6,
      perks: ['bulwark', 'inspiring', 'undying', 'warlord', 'standard', 'duelist', 'swift', 'vanguard'],
      boons: ['coffers', 'highroads', 'masons', 'fortified', 'unbroken', 'granary', 'tithe', 'caravan']
    },
    opportunist: {
      name: 'Opportunist',
      blurb: 'Takes whatever is cheapest to take. Punishes anyone who leaves a border thin.',
      patron: 'vashtar',
      attack: 1.1, build: 1.05, raise: 1.1, risk: 1.1, reserve: 3,
      units: ['outrider', 'phalanx', 'siege', 'zealot', 'levy'],
      championWeight: 1.0,
      perks: ['warlord', 'reaver', 'swift', 'vanguard', 'undying', 'duelist', 'bulwark', 'standard'],
      boons: ['reave', 'secondwind', 'coffers', 'fortified', 'swiftruin', 'masons', 'warpath', 'tithe']
    }
  },

  isAI(pi) { return pi !== null && pi !== undefined && !!AI.seats[pi]; },
  anyAI() { return Object.keys(AI.seats).length > 0; },
  personality(pi) { return AI.PERSONALITIES[AI.seats[pi]] || AI.PERSONALITIES.opportunist; },
  label(pi) { return AI.isAI(pi) ? AI.personality(pi).name : 'Human'; },

  /* Watch mode: an AI attacking a human plays out on screen so you can
     see the dice. AI-versus-AI resolves silently into the chronicle. */
  shouldWatch(c) {
    return c && AI.isAI(c.attacker) && c.defender !== null && !AI.isAI(c.defender);
  },

  /* ================= scheduler ================= */

  kick() {
    if (AI.busy || !G || G.phase === 'gameover') return;

    // anything waiting on a human stops the machine
    if (G.pendingBoon && !AI.isAI(G.pendingBoon.player)) return;
    const c = G.pendingCombat;
    if (c && !AI.isAI(c.attacker)) return;
    if (c && c.finished && AI.shouldWatch(c)) return;   // human is reading the result

    const needed =
      (G.pendingBoon && AI.isAI(G.pendingBoon.player)) ||
      (c && AI.isAI(c.attacker)) ||
      AI.isAI(UI.actingIndex());
    if (!needed) return;

    AI.busy = true;
    setTimeout(AI.step, AI.delay);
  },

  step() {
    AI.busy = false;
    if (!G || G.phase === 'gameover') { UI.render(); return; }
    try {
      if (G.pendingBoon && AI.isAI(G.pendingBoon.player)) AI.chooseBoon();
      else if (G.pendingCombat && AI.isAI(G.pendingCombat.attacker)) AI.combatStep();
      else if (AI.isAI(UI.actingIndex())) AI.turnStep();
    } catch (e) {
      console.error('AI failure, ending turn:', e);
      if (G.pendingCombat) { Combat.withdraw(); Combat.dismiss(); }
      if (G.phase !== 'gameover') UI.endTurn();
    }
    UI.render();
    AI.kick();
  },

  /* ================= evaluation helpers ================= */

  regionWorth(id) {
    const base = { shrine: 9, mine: 7, forge: 6, port: 5, farmland: 4, throne: 16, waste: -1 };
    return (base[REGIONS[id].type] || 3) + G.regions[id].holding * 2;
  },

  defenceOf(id, force) {
    const rs = G.regions[id];
    let d = Rules.hostCount(rs)
      + Rules.countUnit(rs, 'phalanx') * 1.2
      + Rules.countUnit(rs, 'gatewarden') * 1.0;
    if (rs.holding >= 2 && !(force && force.siege)) d += 1.5;   // walls, unless you brought Siege
    return d;
  },

  /* how close pi is to completing the domain containing `id` */
  domainProgress(pi, id) {
    const dk = REGIONS[id].domain;
    const ids = REGION_DEFS.filter(d => d.domain === dk).map(d => d.id);
    const held = ids.filter(x => G.regions[x].owner === pi).length;
    return { held, total: ids.length, completesWith: held + 1 === ids.length };
  },

  /* is this region of mine exposed to a rival next turn? */
  threatTo(pi, id) {
    let worst = 0;
    for (const n of REGIONS[id].neighbours) {
      const o = G.regions[n].owner;
      if (o !== null && o !== pi) worst = Math.max(worst, Rules.hostCount(G.regions[n]));
    }
    return worst;
  },

  /* How much is worth attacking from this region of mine? Zero means it is
     an interior region with nothing to hit, which makes it a place to take
     hosts FROM rather than leave them sitting in. */
  frontierValue(pi, id) {
    let best = 0;
    for (const n of REGIONS[id].neighbours) {
      const o = G.regions[n].owner;
      if (o !== null && o !== pi) best = Math.max(best, AI.regionWorth(n));
    }
    return best;
  },

  /* ================= action selection ================= */

  bestAction(pi) {
    const p = G.players[pi];
    const P = AI.personality(pi);
    const mine = Rules.regionsOf(pi);
    if (!mine.length) return null;
    const options = [];

    /* --- attacks and expansion marches --- */
    for (const src of mine) {
      const avail = Rules.hostCount(G.regions[src]) - 1;
      if (avail < 1) continue;
      const targets = UI.marchTargets(src);
      for (const to in targets) {
        const rs = G.regions[to];
        if (rs.owner === pi) continue;                     // handled as reinforcement below
        const prog = AI.domainProgress(pi, to);
        let score = AI.regionWorth(to) + (prog.completesWith ? 26 : prog.held * 3);
        let send;

        if (rs.owner === null) {
          // Unclaimed ground is a race everyone should run. Weighting this by
          // aggression meant the builders lost the opening land grab and then
          // had nothing to build on for the rest of the match.
          score = (score + 12) * (0.9 + P.attack * 0.25);
          send = Math.min(2, avail);
          const exposure = AI.threatTo(pi, src);
          if (exposure > avail - send) score -= 3;
        } else {
          send = avail;                                     // commit everything spare
          const force = AI.pickStack(G.regions[src].hosts, send);
          const def = AI.defenceOf(to, force);
          // the attacker rolls three dice to the defender's two, so rough
          // parity is already a favourable trade — demanding a big surplus
          // was why these opponents never fought at all
          if (avail < def * 0.85 * P.risk) continue;
          score = (score + 10 + (avail - def) * 2.2) * P.attack;
          if (REGIONS[to].type === 'throne') score += 20;
          if (rs.holding > 0) score += rs.holding * 2;
        }

        const stack = AI.pickStack(G.regions[src].hosts, send);
        if (!Object.keys(stack).length) continue;
        options.push({ kind: 'move', src, to, stack, score, hostile: rs.owner !== null });
      }
    }

    /* --- gather: drain interior regions toward the fighting --- */
    for (const src of mine) {
      const avail = Rules.hostCount(G.regions[src]) - 1;
      if (avail < 1) continue;
      if (AI.frontierValue(pi, src) > 0) continue;          // already on a border, leave it
      for (const to of REGIONS[src].neighbours) {
        if (G.regions[to].owner !== pi) continue;
        const fv = AI.frontierValue(pi, to);
        if (fv <= 0) continue;                              // only ever move toward a front
        const stack = AI.pickStack(G.regions[src].hosts, avail);
        if (!Object.keys(stack).length) continue;
        options.push({
          kind: 'move', src, to, hostile: false, stack,
          score: (fv * 0.55 + avail * 1.1) * P.attack
        });
      }
    }

    /* --- build --- */
    const freeLandLeft = mine.some(id =>
      REGIONS[id].neighbours.some(n => G.regions[n].owner === null));
    for (const id of mine) {
      const chk = Rules.canBuild(pi, id);
      if (!chk.ok) continue;
      const prog = AI.domainProgress(pi, id);
      let score = (AI.regionWorth(id) * 0.9 + prog.held * 2.5) * P.build - chk.cost * 0.3;
      if (REGIONS[id].type === 'farmland') score += 2;
      // never pour Tribute into ground that is about to change hands
      const gap = AI.threatTo(pi, id) - Rules.hostCount(G.regions[id]);
      if (gap > 0) score -= gap * 5 + 6;
      if (freeLandLeft) score *= 0.45;      // claim the map first, develop it second
      options.push({ kind: 'build', id, score });
    }

    /* --- monuments: convert a dead treasury into Renown ---
       This is what finally stops the builder finishing on a pile of unspent
       Tribute. Once Holdings are maxed and upkeep caps the army, legend is
       the only thing left worth buying. */
    {
      const mon = Rules.canMonument(pi);
      if (mon.ok) {
        const idle = p.tribute - P.reserve - 12;
        if (idle >= MONUMENT_MIN) {
          options.push({ kind: 'monument', amount: p.tribute - P.reserve,
                         score: 8 + Math.min(30, idle * 0.5) });
        }
      }
    }

    /* --- raise hosts ---
       An idle treasury is a wasted one. Sitting on Tribute was the single
       biggest flaw in the builder's play: it finished matches rich and
       undefended, which made it no threat to anybody. The surplus term below
       scales hard so that a hoard converts itself into an army. */
    if (p.tribute > P.reserve) {
      var surplus = p.tribute - P.reserve;
      for (const id of mine) {
        const threat = AI.threatTo(pi, id);
        const garrison = Rules.hostCount(G.regions[id]);
        const front = AI.frontierValue(pi, id);
        for (const u of AI.preferredUnits(pi, id)) {
          const chk = Rules.canRaise(pi, id, u);
          if (!chk.ok || !chk.onType) continue;             // AI never pays the off-type penalty
          let score = 5 * P.raise + Math.min(22, surplus * 0.5);
          if (threat > garrison) score += (threat - garrison) * 6.5;   // a breach is the emergency
          if (front > 0) score += front * 0.45;             // massing where there is something to hit
          if (REGIONS[id].type === 'throne') score += 1.5;
          score -= chk.cost * 0.25;
          // an army you cannot feed deserts, so stop short of that line
          /* Never buy an army you cannot feed. This penalty SCALES — a flat one
         was simply swamped by the surplus term, and the builder ended up
         fielding fifty hosts it starved into desertion. */
      const upkeep = Rules.upkeepFor(pi), income = Rules.incomeFor(pi);
      if (upkeep > income * 0.5) score -= (upkeep - income * 0.5) * 9;
          options.push({ kind: 'raise', id, unit: u, score });
          break;                                            // one candidate unit per region
        }
      }
    }

    /* --- reinforce a threatened region from a safe one --- */
    for (const src of mine) {
      const avail = Rules.hostCount(G.regions[src]) - 1;
      if (avail < 1 || AI.threatTo(pi, src) > 0) continue;
      for (const to of REGIONS[src].neighbours) {
        if (G.regions[to].owner !== pi) continue;
        const gap = AI.threatTo(pi, to) - Rules.hostCount(G.regions[to]);
        if (gap <= 0) continue;
        const stack = AI.pickStack(G.regions[src].hosts, Math.min(avail, gap + 1));
        if (!Object.keys(stack).length) continue;
        options.push({ kind: 'move', src, to, hostile: false, stack, score: gap * 2.4 });
      }
    }

    if (!options.length) return null;
    options.sort((a, b) => b.score - a.score);
    return options[0].score > 2 ? options[0] : null;
  },

  /* take the most expendable hosts first, but never send Siege alone */
  pickStack(hosts, max) {
    const order = Object.keys(hosts).filter(u => hosts[u] > 0)
      .sort((a, b) => UNITS[b].cost - UNITS[a].cost);   // best troops lead the assault
    const stack = {}; let n = 0;
    for (const u of order) {
      const take = Math.min(hosts[u], max - n);
      if (take > 0) { stack[u] = take; n += take; }
      if (n >= max) break;
    }
    if (Object.keys(stack).length === 1 && stack.siege) return {};   // siege needs an escort
    return stack;
  },

  preferredUnits(pi, id) {
    const P = AI.personality(pi);
    const avail = Rules.availableUnits(pi);
    return P.units.filter(u => avail.includes(u)).concat(['levy']);
  },

  /* ================= turns ================= */

  turnStep() {
    const pi = UI.actingIndex();
    const p = G.players[pi];

    if (AI.shouldSurrender(pi)) { Rules.surrender(pi); if (G.phase !== 'gameover') UI.endTurn(); return; }

    const isReaction = G.phase === 'reaction';
    if (isReaction && G.reactionActionTaken) { UI.endTurn(); return; }

    if (!isReaction && Rules.actionsLeft(pi) <= 0) { UI.endTurn(); return; }

    const act = AI.bestAction(pi);
    if (!act) { UI.endTurn(); return; }

    if (act.kind === 'build') Rules.buildHolding(pi, act.id);
    else if (act.kind === 'monument') Rules.raiseMonument(pi, act.amount);
    else if (act.kind === 'raise') Rules.raiseHost(pi, act.id, act.unit);
    else if (act.kind === 'move') {
      if (!Object.keys(act.stack).length) { UI.endTurn(); return; }
      /* Bring the Champion when the fight is worth it and losing it is
         unlikely — it dies for good, so the AI only commits it to attacks it
         expects to win, and always to the defence of its own Throne. */
      const bringChampion = AI.wantsChampion(pi, act);
      if (act.hostile) {
        if (!isReaction) Rules.spendAction();
        Combat.begin(pi, act.src, act.to, act.stack, { champion: bringChampion });
        if (AI.shouldWatch(G.pendingCombat)) UI.openCombat();
        return;                                  // combat drives the next steps
      }
      Rules.march(pi, act.src, act.to, act.stack, { champion: bringChampion });
    }

    if (!isReaction && act.kind !== 'move') Rules.spendAction();
    else if (!isReaction && act.kind === 'move') Rules.spendAction();

    if (isReaction) { G.reactionActionTaken = true; UI.endTurn(); return; }
    if (Rules.actionsLeft(pi) <= 0) UI.endTurn();
  },

  /* Committing the Champion is the one irreversible decision in the game, so
     the bar is deliberately high. Early simulations had the aggressive
     temperaments losing their Champion in 85% of matches — they were pouring
     Perks into a piece they then threw away, which is exactly the trap a new
     player falls into. */
  wantsChampion(pi, act) {
    const p = G.players[pi];
    if (p.championDead || !Rules.championAt(pi, act.src)) return false;
    const P = AI.personality(pi);
    const perkStake = p.perks.length;                    // more invested, more cautious

    if (!act.hostile) {
      // ride along only into safe ground you already own or are simply claiming
      return AI.threatTo(pi, act.to) === 0;
    }
    const force = Object.values(act.stack).reduce((a, b) => a + b, 0);
    const def = AI.defenceOf(act.to, act.stack);
    const bar = (2.4 + perkStake * 0.25) / Math.max(0.8, P.championWeight);
    return def > 0 && force >= def * bar;
  },

  shouldSurrender(pi) {
    if (!Rules.canSurrender(pi)) return false;
    const p = G.players[pi];
    return p.fallen && Rules.regionsOf(pi).length <= 1 && Rules.totalHosts(pi) <= 2;
  },

  /* ================= combat ================= */

  combatStep() {
    const c = G.pendingCombat;
    AI.autoCasualties();
    if (!G.pendingCombat) return;

    if (c.finished) {
      if (AI.shouldWatch(c)) { UI.openCombat(); return; }   // wait for the human to dismiss
      Combat.dismiss();
      const p = G.players[UI.actingIndex()];
      if (G.phase === 'reaction') { G.reactionActionTaken = true; UI.endTurn(); }
      else if ((p._acted || 0) >= 7) { p._acted = 0; UI.endTurn(); }
      return;
    }

    const P = AI.personality(c.attacker);
    const mine = stackSize(c.force);
    const theirs = Rules.hostCount(G.regions[c.target]);

    // press on while the odds hold; a Warmonger holds on longer than a Magnate
    if (mine > 0 && theirs > 0 && mine < theirs * (0.75 * P.risk) && mine < 4) {
      Combat.withdraw();
    } else {
      Combat.exchange();
      AI.autoCasualties();
    }
    if (AI.shouldWatch(c)) UI.openCombat();
  },

  autoCasualties() {
    let job;
    while ((job = Combat.currentCasualtyJob())) {
      const order = Object.keys(job.pool).filter(u => job.pool[u] > 0)
        .sort((a, b) => UNITS[a].cost - UNITS[b].cost);
      const give = {}; let left = job.losses;
      for (const u of order) {
        const take = Math.min(left, job.pool[u]);
        if (take > 0) { give[u] = take; left -= take; }
        if (left <= 0) break;
      }
      Combat.applyCasualties(give);
    }
  },

  /* ================= blessings ================= */

  /* The level-up fork. Aggressive temperaments invest in the Champion,
     builders in their empire — but nobody feeds a dead Champion. */
  chooseBoon() {
    const pb = G.pendingBoon;
    const p = G.players[pb.player];
    const P = AI.personality(pb.player);
    const rank = (list, prefs) => list.map(b => ({
      b, s: prefs.indexOf(b.id) >= 0 ? prefs.length - prefs.indexOf(b.id) : 0
    })).sort((x, y) => y.s - x.s)[0];

    const bestBless = pb.blessings.length ? rank(pb.blessings, P.boons) : null;
    const bestPerk = (!p.championDead && pb.perks.length) ? rank(pb.perks, P.perks || []) : null;

    let pick;
    if (!bestPerk) pick = bestBless && bestBless.b;
    else if (!bestBless) pick = bestPerk.b;
    else {
      // championWeight above 1 means this temperament would rather build the hero
      const perkScore = (bestPerk.s + 1) * P.championWeight;
      const blessScore = bestBless.s + 1;
      pick = perkScore > blessScore ? bestPerk.b : bestBless.b;
    }
    Rules.takeBoon((pick || pb.blessings[0] || pb.perks[0]).id);
  }
};

/* ============================================================

   Everything that draws the map lives here, one function per layer, so
   adding a piece type or a visual state does not mean editing a single
   enormous function. The rest of the interface — panels, dialogs and
   interaction — stays in ui.js.

   This module reads game state and never writes it.
   ============================================================ */

/* How much larger map pieces are drawn than they are authored. Symbols are
   designed in a compact -9..9 box; this is the single knob that controls how
   big they land on the board, and partTroops derives its spacing from it. */
const PIECE_SCALE = 2.25;

const MapView = {

  glyph(type) {
    const paths = {
      throne:   `<path d="M-8,4 L-8,-3 L-3.5,0.5 L0,-5.5 L3.5,0.5 L8,-3 L8,4 Z"/><rect x="-8" y="5" width="16" height="2"/>`,
      forge:    `<path d="M-7.5,-3 h15 v2.5 h-4.5 l-1.2,3.5 h-3.6 l-1.2,-3.5 h-4.5 z"/><rect x="-4.5" y="4.5" width="9" height="2.2"/>`,
      mine:     `<path d="M-8,5.5 L-2.5,-5 L0.5,0 L3,-3 L8,5.5 Z"/>`,
      port:     `<path d="M-8,0 q4,-4.2 8,0 t8,0" fill="none" stroke-width="2"/><path d="M-8,5 q4,-4.2 8,0 t8,0" fill="none" stroke-width="2"/>`,
      shrine:   `<rect x="-8" y="-5.5" width="16" height="2.4"/><rect x="-5.5" y="-3" width="2.4" height="7"/><rect x="-1.2" y="-3" width="2.4" height="7"/><rect x="3.1" y="-3" width="2.4" height="7"/><rect x="-8" y="4.2" width="16" height="2.4"/>`,
      farmland: `<path d="M-5,6 v-8 M0,6 v-10 M5,6 v-8" fill="none" stroke-width="1.8"/><circle cx="-5" cy="-3" r="1.8"/><circle cx="0" cy="-5" r="1.8"/><circle cx="5" cy="-3" r="1.8"/>`,
      waste:    `<path d="M-6,-5 L-2.5,0 L-5.5,5" fill="none" stroke-width="1.7"/><path d="M2,-5.5 L5.5,-0.5 L2.5,5" fill="none" stroke-width="1.7"/>`
    };
    return paths[type] || '';
  },

  /* ---------------- troop symbols ----------------

     Assembled by rendering four competing systems side by side at 92px, 42px
     and 24px, in a same-colour crowd, and LOOKING at them — see
     `tools/symbol-lab.js`. Reasoning about SVG path data does not work; the
     horse silhouette that reads perfectly well in source rendered as an
     unreadable blob, and that was only visible once it was on screen.

     Winners per unit rather than one system wholesale:
       levy, phalanx, warden, thunderguard, caravaneer  - held from the
         hand-built set, which beat the candidates on these.
       outrider, stormrider  - the Dramatic Silhouette horse. The only
         outrider of the four that reads as an animal instead of a wedge.
       zealot   - Dramatic Silhouette's flame; broader, with a defined inner
         core, where the previous one narrowed into a leaf.
       siege    - Modern Heraldic's trebuchet; frame, arm and counterweight
         all separate at 24px.
       gatewarden - Dramatic Silhouette's portcullis, which keeps its
         crenellations where a plain grid turned to mush.

     Grammar: every unit is one bold closed shape read by silhouette, detail
     cut back in #0d0f16 rather than added as thin strokes. Elites echo their
     base unit and carry a pale accent no core unit uses, so "this is elite"
     is legible without knowing the roster.

     Authored in a -8..8 box, scaled by PIECE_SCALE on the board. */
  troopShape(unitId, colour) {
    const D = '#0d0f16';      // cut-back detail
    const L = '#f0ece2';      // elite accent

    const HORSE = `<path d="M-4.1,6.0 L-3.1,2.4 C-5.3,1.5 -6.3,-0.6 -5.4,-2.4 L-3.0,-3.4
                            C-2.2,-5.2 -0.6,-6.0 0.9,-5.9 L2.0,-7.0 L2.9,-5.0
                            C4.9,-3.4 5.6,-0.6 4.9,2.2 L3.9,6.0 Z"/>
                   <path d="M2.6,-4.2 C4.0,-2.0 4.2,0.8 3.6,3.4" fill="none"
                         stroke="${D}" stroke-width="1.1" stroke-linecap="round"/>
                   <circle cx="0" cy="-3.6" r=".85" fill="${D}" stroke="none"/>
                   <circle cx="-4.5" cy="-1.5" r=".6" fill="${D}" stroke="none"/>`;

    const body = {
      // three spears abreast — cheap troops, and there are always a lot of them
      levy: `<path d="M-4.7,-6.2 L-2.9,-1.7 L-6.5,-1.7 Z M0,-7.8 L2,-2.7 L-2,-2.7 Z
                      M4.7,-6.2 L6.5,-1.7 L2.9,-1.7 Z"/>
             <rect x="-5.4" y="-1.7" width="1.5" height="8.8" rx=".4"/>
             <rect x="-0.75" y="-2.7" width="1.5" height="9.8" rx=".4"/>
             <rect x="3.9" y="-1.7" width="1.5" height="8.8" rx=".4"/>`,

      // a flame with a defined core — belief, and it grows with your Renown
      zealot: `<path d="M0,-7.6 Q3.4,-3.6 2.2,-0.8 Q4.9,-2.0 4.5,1.2 Q4.1,5.8 0,7.0
                        Q-4.1,5.8 -4.5,1.2 Q-4.9,-2.0 -2.2,-0.8 Q-3.4,-3.6 0,-7.6 Z"/>
               <path d="M0,-1.4 Q2.0,1.2 1.2,3.2 Q0.6,4.7 0,5.2 Q-0.6,4.7 -1.2,3.2
                        Q-2.0,1.2 0,-1.4 Z" fill="${D}" stroke="none"/>`,

      // three tower shields locked together — a wall, not a soldier
      phalanx: `<path d="M-7.5,-5.4 h4.7 v6.7 q0,3.5 -2.35,5.3 Q-7.5,4.8 -7.5,1.3 Z"/>
                <path d="M-2.35,-6.4 h4.7 v7.7 q0,3.7 -2.35,5.5 Q-2.35,5.2 -2.35,1.3 Z"/>
                <path d="M2.8,-5.4 h4.7 v6.7 q0,3.5 -2.35,5.3 Q2.8,4.8 2.8,1.3 Z"/>`,

      // a horse, and it actually reads as one
      outrider: HORSE,

      // counterweight trebuchet — frame, arm and weight all separate at 24px
      siege: `<rect x="-5.0" y="3.6" width="10.0" height="2.4" rx=".6"/>
              <path d="M-3.8,3.8 L0,-2.8 L3.8,3.8 Z"/>
              <path d="M-1.4,3.8 L0,0.6 L1.4,3.8 Z" fill="${D}"/>
              <path d="M-6.2,1.2 L4.0,-5.8 L5.4,-3.8 L-4.8,3.2 Z"/>
              <circle cx="4.2" cy="-4.8" r="1.4"/>`,

      // closed great helm — the bodyguard, faceless and armoured
      warden: `<path d="M0,-8 Q5.9,-8 5.9,-1.6 L5.9,3 Q5.9,6.9 0,8.1
                        Q-5.9,6.9 -5.9,3 L-5.9,-1.6 Q-5.9,-8 0,-8 Z"/>
               <rect x="-5.9" y="-2.1" width="11.8" height="2.3" fill="${D}"/>
               <rect x="-0.95" y="0.7" width="1.9" height="6.6" rx=".5" fill="${D}"/>`,

      // the Outrider's horse, carrying the storm
      stormrider: `${HORSE}
                   <path d="M-4.4,-8.2 L-7.4,-2.4 L-5.0,-2.4 L-7.2,2.8 L-2.2,-3.8
                            L-4.6,-3.8 L-2.6,-8.2 Z"
                         fill="${L}" stroke="${D}" stroke-width=".7"/>`,

      // a Phalanx shield, sundered — it is the thing that breaks shieldwalls
      thunderguard: `<path d="M-6.2,-6.6 h12.4 v7.2 q0,4.1 -6.2,6.6 Q-6.2,4.7 -6.2,0.6 Z"/>
                     <path d="M1.9,-5.6 L-2.8,0.5 L0.5,0.5 L-3.4,6.6" fill="none"
                           stroke="${D}" stroke-width="2.4" stroke-linecap="round"
                           stroke-linejoin="round"/>
                     <path d="M1.9,-5.6 L-2.8,0.5 L0.5,0.5 L-3.4,6.6" fill="none"
                           stroke="${L}" stroke-width="1" stroke-linecap="round"
                           stroke-linejoin="round"/>`,

      // covered wagon — the only unit that makes money instead of spending it
      caravaneer: `<path d="M-6.7,2 L-6.7,-1.5 Q-6.7,-6.1 0,-6.1 Q6.7,-6.1 6.7,-1.5 L6.7,2 Z"/>
                   <rect x="-7.3" y="2" width="14.6" height="2.1" rx=".5"/>
                   <circle cx="-4.1" cy="5.7" r="2.4"/><circle cx="4.1" cy="5.7" r="2.4"/>
                   <circle cx="-4.1" cy="5.7" r=".9" fill="${D}"/>
                   <circle cx="4.1" cy="5.7" r=".9" fill="${D}"/>
                   <path d="M-3.5,-5.5 V2 M0,-6.1 V2 M3.5,-5.5 V2" stroke="${D}" stroke-width="1"/>
                   <path d="M-6.7,-1.5 h13.4" stroke="${L}" stroke-width="1"/>`,

      // crenellated gate with the portcullis down — nothing behind it is lost
      gatewarden: `<path d="M-5.2,-5.2 h2.2 v1.4 h1.9 v-1.4 h2.2 v1.4 h1.9 v-1.4 h2.2 v3.6 h-10.4 Z"/>
                   <rect x="-5.0" y="-1.9" width="10" height="7.3" rx=".4"/>
                   <path d="M-2.9,5.4 V0.8 Q-2.9,-1.4 0,-1.4 Q2.9,-1.4 2.9,0.8 V5.4 Z"
                         fill="${D}" stroke="none"/>
                   <g stroke="none">
                     <rect x="-2.15" y="0.2" width="1.0" height="5.2"/>
                     <rect x="-0.5" y="-0.9" width="1.0" height="6.3"/>
                     <rect x="1.15" y="0.2" width="1.0" height="5.2"/>
                     <rect x="-2.9" y="1.3" width="5.8" height="1.0"/>
                     <rect x="-2.9" y="3.5" width="5.8" height="1.0"/>
                   </g>
                   <path d="M0,0.7 L0.44,1.96 L1.7,2.4 L0.44,2.84 L0,4.1 L-0.44,2.84
                            L-1.7,2.4 L-0.44,1.96 Z" fill="${L}" stroke="none"/>`
    }[unitId] || `<circle r="4"/>`;

    return `<g filter="url(#pieceShadow)">
      <circle r="8.5" fill="rgba(8,10,16,.86)" stroke="${colour}" stroke-opacity=".55" stroke-width="1"/>
      <g fill="${colour}" stroke="${D}" stroke-width=".85" stroke-linejoin="round">${body}</g>
    </g>`;
  },

  /* A keep that grows with its tier: watchtower, walled keep, then a
     fortress with corner towers and a banner. Drawn as single crenellated
     outlines rather than stacked rectangles, with darker openings cut back
     in so the silhouette reads as masonry at map scale. */
  holdingShape(tier) {
    const gold = '#c98f47', dark = '#0d0f16', shade = '#8c6330';
    const s = `stroke="${dark}" stroke-width="1.2" stroke-linejoin="round"`;

    if (tier === 1) {
      return `<path d="M-5.5,9 L-5.5,-8 h2.4 v-2.6 h2.2 v2.6 h1.8 v-2.6 h2.2 v2.6 h2.4 L7.5,9 Z"
                    fill="${gold}" ${s}/>
              <path d="M-1.2,9 L-1.2,3.2 Q-1.2,1.4 0.6,1.4 Q2.4,1.4 2.4,3.2 L2.4,9 Z" fill="${dark}"/>
              <rect x="-3.4" y="-4.6" width="2.4" height="3" fill="${dark}"/>`;
    }

    if (tier === 2) {
      return `<path d="M-13,9 L-13,0 h2.2 v-2.2 h2.2 v2.2 h3 v-9.4 h2.2 v-2.6 h2 v2.6 h1.6 v-2.6 h2 v2.6 h2.2 v9.4
                       h3 v-2.2 h2.2 v2.2 h2.2 L13,9 Z" fill="${gold}" ${s}/>
              <path d="M-2.2,9 L-2.2,3 Q-2.2,1 0,1 Q2.2,1 2.2,3 L2.2,9 Z" fill="${dark}"/>
              <rect x="-1.4" y="-6.6" width="2.8" height="3.2" fill="${dark}"/>
              <path d="M-13,3.4 H13" stroke="${shade}" stroke-width="1"/>`;
    }

    return `<path d="M-15,9 L-15,-3 h2.4 v-2.4 h2.4 v2.4 h2.6 v-7.6 h2.2 v-2.6 h2 v2.6 h1.8 v-2.6 h2 v2.6 h2.2 v7.6
                     h2.6 v-2.4 h2.4 v2.4 h2.4 L15,9 Z" fill="${gold}" ${s}/>
            <path d="M-2.4,9 L-2.4,2.4 Q-2.4,0.2 0,0.2 Q2.4,0.2 2.4,2.4 L2.4,9 Z" fill="${dark}"/>
            <rect x="-1.4" y="-8.4" width="2.8" height="3.2" fill="${dark}"/>
            <rect x="-12.4" y="0.6" width="2.2" height="2.8" fill="${dark}"/>
            <rect x="10.2" y="0.6" width="2.2" height="2.8" fill="${dark}"/>
            <path d="M-15,1 H15" stroke="${shade}" stroke-width="1"/>
            <path d="M0,-13.6 V-21 L9,-18.4 L0,-15.8" fill="${gold}" ${s}/>`;
  },

  /* What this territory actually rolls on defence, and why — so the player
     can read a Phalanx wall off the map instead of hunting through text. */
  defenceRating(id) {
    const rs = G.regions[id];
    const notes = [];
    let dice = Math.min(2, Object.keys(rs.hosts).reduce((a, u) => a + (u === 'siege' ? 0 : rs.hosts[u]), 0));
    if (Rules.countUnit(rs, 'phalanx') > 0) { dice += 1; notes.push('Phalanx'); }
    if (Rules.countUnit(rs, 'gatewarden') > 0) { dice += 1; notes.push('Gatewardens'); }
    if (rs.holding >= 2) { dice += 1; notes.push(`tier-${rs.holding} Holding`); }
    const owner = rs.owner;
    if (owner !== null) {
      const p = G.players[owner];
      if (Rules.hasBoon(p, 'fortified') && rs.holding >= 2) { dice += 1; notes.push('Fortified'); }
      if (Rules.championAt(owner, id)) {
        notes.push('Champion');
        if (Rules.hasPerk(p, 'bulwark')) { dice += 1; notes.push('Bulwark'); }
      }
    }
    return { dice: Math.max(1, dice), notes };
  },

  /* Painted once and referenced by every territory. Building the gradients
     as defs rather than per-shape keeps the SVG small even though every
     territory is layered three deep. */
  mapDefs() {
    const owners = G.players.map((p, i) => `
      <radialGradient id="fill${i}" cx="42%" cy="34%" r="78%">
        <stop offset="0%"  stop-color="${mix(p.colour.hex, '#12141c', 0.62)}"/>
        <stop offset="62%" stop-color="${mix(p.colour.hex, '#12141c', 0.44)}"/>
        <stop offset="100%" stop-color="${mix(p.colour.hex, '#0c0e15', 0.30)}"/>
      </radialGradient>`).join('');

    const domains = Object.keys(DOMAINS).map(k => `
      <radialGradient id="wild_${k}" cx="42%" cy="34%" r="78%">
        <stop offset="0%"  stop-color="${mix(DOMAINS[k].tint, '#0f1119', 0.26)}"/>
        <stop offset="100%" stop-color="${mix(DOMAINS[k].tint, '#0a0c12', 0.13)}"/>
      </radialGradient>`).join('');

    /* Every territory outline is a long fractal path. Defining each one once
       here and referencing it with <use> keeps the rendered SVG small — the
       same outline is drawn five times per territory (landmass, frontier,
       fill, grain, rim) and inlining it each time pushed the document past
       390KB on every redraw. */
    const shapes = Object.keys(REGIONS)
      .map(id => `<path id="tp_${id}" d="${REGIONS[id].d}"/>`).join('');

    /* One clip per territory so relief and the carved inner edge can be
       painted freely and trimmed to the coastline. */
    const coast = `<path id="coastline" d="${CONTINENT}"/>
      <clipPath id="clip_coast"><use href="#coastline"/></clipPath>`;

    const clips = Object.keys(REGIONS)
      .map(id => `<clipPath id="clip_${id}"><use href="#tp_${id}"/></clipPath>`).join('')
      + `<clipPath id="clip_land">`
      + Object.keys(REGIONS).map(id => `<use href="#tp_${id}"/>`).join('')
      + `</clipPath>`;

    return `<defs>
      ${shapes}${coast}${clips}${owners}${domains}
      <radialGradient id="sea" cx="50%" cy="45%" r="72%">
        <stop offset="0%"   stop-color="#2f6b93"/>
        <stop offset="60%"  stop-color="#285e83"/>
        <stop offset="100%" stop-color="#1e4b6b"/>
      </radialGradient>
      <filter id="landShadow" x="-12%" y="-12%" width="124%" height="124%">
        <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#05060a" flood-opacity=".75"/>
      </filter>
      <filter id="pieceShadow" x="-60%" y="-60%" width="220%" height="220%">
        <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#05060a" flood-opacity=".9"/>
      </filter>
      <filter id="selGlow" x="-25%" y="-25%" width="150%" height="150%">
        <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#c98f47" flood-opacity=".85"/>
      </filter>
      <!-- One light source for the entire landmass. Lighting each territory
           separately made every cell look individually lit, like tiles;
           a single gradient across the whole continent gives the map one
           coherent sun and reads as terrain. -->
      <linearGradient id="worldLight" x1="0%" y1="0%" x2="72%" y2="100%">
        <stop offset="0%"   stop-color="#ffffff" stop-opacity=".16"/>
        <stop offset="42%"  stop-color="#ffffff" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity=".34"/>
      </linearGradient>
      <filter id="shelfBlur" x="-15%" y="-15%" width="130%" height="130%">
        <feGaussianBlur stdDeviation="3.5"/>
      </filter>
      <filter id="tgtGlow" x="-25%" y="-25%" width="150%" height="150%">
        <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#67a89a" flood-opacity=".8"/>
      </filter>

      <!-- Texture. Fractal noise rendered once into a tile and repeated as a
           pattern: land gets a coarse stone grain, sea a slower swell. Both
           sit at low opacity so they add tooth without muddying the colour. -->
      <filter id="grainStone" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="5" seed="7" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
        <feComponentTransfer><feFuncA type="linear" slope="1.5" intercept="-.12"/></feComponentTransfer>
      </filter>
      <!-- Land texture proper: fractal noise driven through diffuse lighting
           so it produces real highlights and shadow rather than flat speckle.
           This is what makes the ground look like ground. -->
      <filter id="landRelief" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="5"
                      seed="11" result="bump"/>
        <feDiffuseLighting in="bump" lighting-color="#fdf6e6" surfaceScale="3.2"
                           diffuseConstant="1" result="lit">
          <feDistantLight azimuth="308" elevation="52"/>
        </feDiffuseLighting>
      </filter>
      <filter id="grainFibre" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.014 0.24" numOctaves="3" seed="41" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
      <filter id="grainSwell" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.022 0.05" numOctaves="3" seed="19" result="n"/>
        <feColorMatrix in="n" type="saturate" values="0"/>
      </filter>
      <pattern id="landGrain" width="220" height="220" patternUnits="userSpaceOnUse">
        <rect width="220" height="220" filter="url(#grainStone)" opacity=".30"/>
      </pattern>
      <pattern id="landFibre" width="${MAP_W}" height="${MAP_H}" patternUnits="userSpaceOnUse">
        <rect width="${MAP_W}" height="${MAP_H}" filter="url(#grainFibre)" opacity=".13"/>
      </pattern>
      <pattern id="seaGrain" width="${MAP_W}" height="${MAP_H}" patternUnits="userSpaceOnUse">
        <rect width="${MAP_W}" height="${MAP_H}" filter="url(#grainSwell)" opacity=".09"/>
      </pattern>
    </defs>`;
  },


  /* ---------------- terrain relief ----------------

     Scattered motifs drawn inside each territory so the land reads as
     terrain rather than a coloured shape: peaks in a Mine, furrows in
     Farmland, swell off a Port, cracks across a Waste. Positions are found
     by rejection sampling inside the territory outline, seeded from the
     region id, so they are identical on every load and never wander outside
     their own borders. Generated once and cached — the terrain never
     changes, only who owns it. */

  _relief: {},

  pointInPolygon(pt, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const a = poly[i], b = poly[j];
      if ((a.y > pt.y) !== (b.y > pt.y) &&
          pt.x < ((b.x - a.x) * (pt.y - a.y)) / (b.y - a.y) + a.x) inside = !inside;
    }
    return inside;
  },

  reliefMotif(type, r) {
    const a = (0.7 + r() * 0.6);                    // per-motif size jitter
    switch (type) {
      case 'mine':                                   // rock peaks
        return `<path d="M${-7 * a},${4 * a} L${-1.5 * a},${-5 * a} L${1 * a},${-1 * a}
                         L${3 * a},${-3.5 * a} L${7 * a},${4 * a} Z"/>`;
      case 'forge':                                  // slag heaps and a spark
        return `<path d="M${-6 * a},${3 * a} Q0,${-4 * a} ${6 * a},${3 * a} Z"/>`;
      case 'farmland':                               // ploughed furrows
        return `<path d="M${-7 * a},0 Q0,${-3 * a} ${7 * a},0" fill="none" stroke-width="1.5"/>
                <path d="M${-7 * a},${3.5 * a} Q0,${0.5 * a} ${7 * a},${3.5 * a}" fill="none" stroke-width="1.5"/>`;
      case 'port':                                   // swell
        return `<path d="M${-7 * a},0 q${3.5 * a},${-3 * a} ${7 * a},0 t${7 * a},0"
                      fill="none" stroke-width="1.6"/>`;
      case 'shrine':                                 // standing stones
        return `<rect x="${-5 * a}" y="${-4 * a}" width="${2 * a}" height="${8 * a}" rx="${0.6 * a}"/>
                <rect x="${-1 * a}" y="${-5.5 * a}" width="${2 * a}" height="${9.5 * a}" rx="${0.6 * a}"/>
                <rect x="${3 * a}" y="${-4 * a}" width="${2 * a}" height="${8 * a}" rx="${0.6 * a}"/>`;
      case 'waste':                                  // fissures
        return `<path d="M${-6 * a},${-4 * a} L${-2 * a},${0} L${-4 * a},${4 * a}"
                      fill="none" stroke-width="1.4"/>
                <path d="M${2 * a},${-4.5 * a} L${5 * a},${0.5 * a} L${2.5 * a},${4 * a}"
                      fill="none" stroke-width="1.4"/>`;
      case 'throne':                                 // city blocks
        return `<rect x="${-6 * a}" y="${-2 * a}" width="${4 * a}" height="${4 * a}"/>
                <rect x="${-0.5 * a}" y="${-4 * a}" width="${3 * a}" height="${6 * a}"/>
                <rect x="${4 * a}" y="${-1.5 * a}" width="${3 * a}" height="${3.5 * a}"/>`;
      default:
        return '';
    }
  },

  layerRelief(id) {
    if (MapView._relief[id] !== undefined) return MapView._relief[id];

    const R = REGIONS[id];
    const poly = R.poly;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const p of poly) {
      if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
    }

    const rand = mulberry32(hash32('relief:' + id));
    const want = { mine: 7, forge: 6, farmland: 7, port: 6, shrine: 4, waste: 7, throne: 5 }[R.type] || 0;
    const marks = [];
    let guard = 0;

    while (marks.length < want && guard++ < 400) {
      const pt = { x: minX + rand() * (maxX - minX), y: minY + rand() * (maxY - minY) };
      if (!MapView.pointInPolygon(pt, poly)) continue;
      // keep clear of the label and the piece rows in the middle of the cell
      if (Math.abs(pt.x - R.centre.x) < 62 && Math.abs(pt.y - R.centre.y) < 46) continue;
      if (marks.some(m => Math.hypot(m.x - pt.x, m.y - pt.y) < 42)) continue;
      marks.push(pt);
    }

    const body = marks.map(m => {
      const rot = (rand() * 16 - 8).toFixed(1);
      return `<g transform="translate(${m.x.toFixed(1)},${m.y.toFixed(1)}) rotate(${rot})">`
        + MapView.reliefMotif(R.type, rand) + `</g>`;
    }).join('');

    const out = body
      ? `<g class="relief" fill="#f2efe8" stroke="#f2efe8" stroke-linecap="round"
           stroke-linejoin="round" clip-path="url(#clip_${id})">${body}</g>`
      : '';
    MapView._relief[id] = out;
    return out;
  },

  /* ---------------- layers ----------------
     Each returns a string; renderMap stacks them in paint order. A new visual
     element is now a new small function rather than another twenty lines in
     the middle of an existing one. */

  /* The territory outline, as an SVG path. Borders are fractal curves shared
     between neighbours (see map.js), not straight polygon edges. */
  path(id) {
    return REGIONS[id].d;
  },

  layerSea() {
    return `<rect x="0" y="0" width="${MAP_W}" height="${MAP_H}" fill="url(#sea)"/>`
         + `<rect x="0" y="0" width="${MAP_W}" height="${MAP_H}" fill="url(#seaGrain)"/>`;
  },

  /* The whole continent as one silhouette so it casts a single shadow.
     Shadowing each territory separately made the board read as scattered
     tiles rather than land. */
  /* A pale shelf where the land meets the sea — the halo sits under the
     territories so only the sliver outside each coastline shows. */
  /* Shallows read off the COASTLINE now, not off every cell — hanging a
     halo on each territory outlined the internal borders too and made the
     whole thing look like tiles floating side by side. */
  /* Bathymetry. Concentric bands stroked along the coastline itself, so the
     water shelves away from the land in the land's own shape rather than in
     a circle. Shallow and bright at the shore, deep and cold further out. */
  layerShelf() {
    const bands = [
      { w: 210, c: '#245878', o: .45 },
      { w: 156, c: '#2a6288', o: .50 },
      { w: 110, c: '#316d95', o: .55 },
      { w: 72,  c: '#3a7ba5', o: .60 },
      { w: 42,  c: '#478db8', o: .66 },
      { w: 18,  c: '#59a3cc', o: .72 }
    ];
    return `<g filter="url(#shelfBlur)" pointer-events="none">`
      + bands.map(b => `<use href="#coastline" fill="none" stroke="${b.c}"
          stroke-opacity="${b.o}" stroke-width="${b.w}"/>`).join('')
      + `</g>`;
  },

  /* Drawn last so it falls across every territory equally. Clipped to the
     union of the land, so the sea keeps its own gradient. */
  layerWorldLight() {
    return `<rect class="world-light" x="0" y="0" width="${MAP_W}" height="${MAP_H}"
      fill="url(#worldLight)"/>`;
  },

  /* The dark bed the continent sits on, and the source of its single drop
     shadow. It MUST be clipped to the coastline: these are the raw Voronoi
     cells, which tile the entire canvas, so unclipped this laid a black sheet
     over the whole sea. Sampling the rendered pixels showed #0d0d16 — the
     landmass fill — everywhere the water should have been. */
  layerLandmass() {
    return `<g filter="url(#landShadow)" clip-path="url(#clip_coast)">`
      + Object.keys(REGIONS).map(id => `<use href="#tp_${id}" fill="#0e1017"/>`).join('')
      + `</g>`;
  },

  /* Domain frontiers. Each domain's territories are stroked heavily here,
     underneath the fills — the fills then cover the inner half of every
     stroke, so interior borders vanish and only the domain's outer edge
     survives. One pass, no edge topology to compute. */
  layerFrontiers() {
    let out = '';
    for (const dk in DOMAINS) {
      const cells = REGION_DEFS.filter(d => d.domain === dk)
        .map(d => `<use href="#tp_${d.id}"/>`).join('');
      out += `<g class="domain-edge" fill="none" stroke="${DOMAINS[dk].tint}"
        stroke-opacity=".38" stroke-width="7" stroke-linejoin="round">${cells}</g>`;
    }
    return out;
  },

  partHolding(rs, c) {
    if (rs.holding < 1) return '';
    const tip = '<b>Holding, tier ' + rs.holding + '</b><br>Pays +' + HOLDING_INCOME[rs.holding - 1]
      + ' Tribute each Round'
      + (rs.holding >= 2 ? ', and adds a defence die unless the attacker brings Siege' : '')
      + (rs.holding < 3 ? '. Upgradeable to tier ' + (rs.holding + 1) + '.' : '. Fully developed.');
    return `<g class="holding-mark" data-tip="${tip.replace(/"/g, '&quot;')}"
      transform="translate(${c.x + 30},${c.y - 14})">
      <rect x="-13" y="-13" width="26" height="26" fill="transparent"/>
      ${MapView.holdingShape(rs.holding)}</g>`;
  },

  partUnrest(rs, c) {
    if (!(rs.unrest > 0)) return '';
    const tip = '<b>Restive</b><br>Freshly conquered. Pays no Tribute and cannot be developed '
      + 'until you have held it through one of your own Turns.';
    return `<g class="unrest-mark" data-tip="${tip}" transform="translate(${c.x - 22},${c.y + 12})">
      <circle r="7" fill="rgba(10,12,18,.85)" stroke="#b0534f" stroke-width="1.4"/>
      <path d="M0,-3.6 V1.2 M0,3 V4.2" stroke="#e0a09d" stroke-width="1.6" stroke-linecap="round"/></g>`;
  },

  /* Troop pieces, not a bare number, so a Phalanx wall is visible at a glance
     instead of something to go and read in a panel. */
  partTroops(id, rs, c, owner) {
    if (Rules.hostCount(rs) < 1) return '';
    const kinds = Object.keys(rs.hosts).filter(u => rs.hosts[u] > 0);
    const col = owner !== null ? G.players[owner].colour.hex : '#8b8b96';

    /* Pieces are authored small and scaled up here, so the silhouette detail
       is actually visible. At this size four across would overflow the
       narrower territories, so the row wraps at three and stacks. */
    const SCALE = PIECE_SCALE;
    const PX = 42, PY = 46, PER_ROW = 3;
    const rows = Math.ceil(kinds.length / PER_ROW);
    const py0 = c.y + 38 - (rows - 1) * PY / 2;

    let out = kinds.map((u, i) => {
      const row = Math.floor(i / PER_ROW);
      const inRow = Math.min(PER_ROW, kinds.length - row * PER_ROW);
      const col0 = i % PER_ROW;
      const x = c.x + (col0 - (inRow - 1) / 2) * PX;
      const y = py0 + row * PY;

      const tip = '<b>' + UNITS[u].name + '</b> &middot; ' + UNITS[u].cost + 't<br>'
        + UNITS[u].rule + '<br><i style="color:var(--ink-dim)">' + UNITS[u].flavour + '</i>';
      return `<g class="troop" data-tip="${tip.replace(/"/g, '&quot;')}"
        transform="translate(${x.toFixed(1)},${y.toFixed(1)})">
        <rect x="-20" y="-22" width="40" height="50" fill="transparent"/>
        <g transform="scale(${SCALE})">${MapView.troopShape(u, col)}</g>
        <text class="troop-n" x="0" y="26">${rs.hosts[u]}</text></g>`;
    }).join('');

    const d = MapView.defenceRating(id);
    if (d.dice > 2) {
      const tip = '<b>Rolls ' + d.dice + ' defence dice</b><br>' + d.notes.join(' &middot; ');
      // sits clear of the piece block, whose height now depends on the rows
      const flagY = py0 + (rows - 1) * PY + 34;
      out += `<g class="def-flag" data-tip="${tip}" transform="translate(${c.x + 34},${flagY.toFixed(1)})">
        <rect x="-12" y="-9" width="24" height="17" rx="2" fill="rgba(10,12,18,.9)"
              stroke="#67a89a" stroke-width="1.2"/>
        <text x="0" y="3.5" class="def-n">${d.dice}D</text></g>`;
    }
    return out;
  },

  partChampion(id, c) {
    const champ = G.players.findIndex(p => !p.surrendered && !p.championDead && p.championAt === id);
    if (champ < 0) return '';
    const cp = G.players[champ], cc = cp.colour.hex;
    const perks = cp.perks.length
      ? cp.perks.map(k => {
          const x = CHAMPION_PERKS.find(z => z.id === k);
          return x ? '<b>' + x.name + '</b> — ' + x.text : '';
        }).filter(Boolean).join('<br>')
      : 'No Perks taken yet.';
    const tip = '<b>' + esc(cp.name) + "'s Champion</b><br>Adds +" + Rules.championBonus(champ)
      + ' to the highest die where it stands. Marches ' + Rules.championMarchRange(champ)
      + '. If its stack is wiped with no Warden present it dies <b>permanently</b>.<br><br>' + perks;
    return `<g class="champion-mark" data-tip="${tip.replace(/"/g, '&quot;')}"
      transform="translate(${c.x - 38},${c.y + 4})">
      <circle r="18" fill="none" stroke="${cc}" stroke-opacity=".3" stroke-width="2"/>
      <circle r="14" fill="${cc}" stroke="#f2efe8" stroke-width="2" filter="url(#pieceShadow)"/>
      <g fill="#12141c" stroke="none">
        <path d="M-4.6,-6.9 L-5.1,-10.5 L-2.6,-7.7 L0,-11.7 L2.6,-7.7 L5.1,-10.5 L4.6,-6.9 Z"/>
        <circle cx="0" cy="-4.2" r="4.3"/>
        <path d="M-2,2.2 L-6.6,3.1 L-9,6.2 A10.9,10.9 0 0 0 9,6.2 L6.6,3.1 L2,2.2 L0,5.9 Z"/>
      </g></g>`;
  },

  layerTerritory(id, ctx) {
    const def = REGIONS[id], rs = G.regions[id], owner = rs.owner, c = def.centre;
    const fill = owner !== null ? `url(#fill${owner})` : `url(#wild_${def.domain})`;

    /* State classes. `mine` / `foe` / `open` let the stylesheet distinguish
       whose ground it is without recolouring the fill, and `actionable`
       marks territory the current player can actually do something with. */
    const cls = ['region'];
    if (id === ctx.sel) cls.push('selected');
    if (ctx.targets[id]) cls.push('target');
    if (ctx.marching && !ctx.targets[id] && id !== ctx.sel) cls.push('dim');
    if (owner === ctx.viewer) {
      cls.push('mine');
      if (!ctx.marching && Rules.hostCount(rs) > 1) cls.push('actionable');
    } else if (owner === null) cls.push('open');
    else cls.push('foe');
    if (rs.unrest > 0) cls.push('restive');

    let out = `<g class="${cls.join(' ')}" data-region="${id}">`;
    out += `<use class="fill" href="#tp_${id}" fill="${fill}"></use>`;
    out += `<use class="grain" href="#tp_${id}" fill="url(#landGrain)"></use>`;
    out += MapView.layerRelief(id);

    /* Carved edge: the outline stroked thickly but clipped to its own shape,
       so only the inner half survives and the territory reads as pressed
       into the land rather than laid on top of it. */
    out += `<use class="carve" href="#tp_${id}" fill="none" stroke="#05060a"
      stroke-opacity=".42" stroke-width="9" clip-path="url(#clip_${id})"></use>`;

    /* An inset outline in the owner's colour reads as a carved edge and,
       more usefully, makes whose land it is legible from across the board
       without relying on fill brightness alone. */
    if (owner !== null) {
      out += `<use class="rim" href="#tp_${id}" fill="none"
        stroke="${G.players[owner].colour.hex}" stroke-opacity=".55" stroke-width="2.4"></use>`;
    }

    return out + `</g>`;
  },

  /* Names, pieces, keeps and flags — drawn in a SECOND pass, after every
     territory's ground is down. In one pass a marker sitting near a border
     was painted over by whichever territory happened to be drawn next, which
     is what was swallowing the defence flags on Coldharbour and Bramblewatch.
     Carries the same data-region so clicking a piece still selects its
     territory. */
  layerContent(id, ctx) {
    const def = REGIONS[id], rs = G.regions[id], owner = rs.owner, c = def.centre;
    const cls = ['region-content'];
    if (ctx.marching && !ctx.targets[id] && id !== ctx.sel) cls.push('dim');

    let out = `<g class="${cls.join(' ')}" data-region="${id}">`;
    out += `<g class="glyph" transform="translate(${c.x},${c.y - 26})" fill="rgba(242,239,232,.42)"
      stroke="rgba(242,239,232,.42)" stroke-linecap="round">${MapView.glyph(def.type)}</g>`;
    out += `<text class="region-name" x="${c.x}" y="${c.y + 2}">${esc(def.name)}</text>`;
    out += MapView.partHolding(rs, c);
    out += MapView.partUnrest(rs, c);
    out += MapView.partTroops(id, rs, c, owner);
    out += MapView.partChampion(id, c);
    return out + `</g>`;
  },

  renderMap() {
    const svg = $('#map');
    const ctx = {
      sel: G.selected,
      viewer: UI.actingIndex(),
      marching: UI.mode === 'march',
      targets: (UI.mode === 'march' && G.selected) ? UI.marchTargets(G.selected) : {}
    };

    let out = MapView.mapDefs() + MapView.layerSea() + MapView.layerShelf()
            + MapView.layerLandmass();

    /* Territories are drawn full-size and trimmed to the coastline, so the
       ones on the rim end in bays and headlands instead of a ruler-straight
       map edge. Adjacency is unaffected — it comes from the seeds. */
    out += `<g clip-path="url(#clip_coast)">`;
    out += MapView.layerFrontiers();
    for (const id in REGIONS) out += MapView.layerTerritory(id, ctx);
    out += MapView.layerWorldLight();
    /* Two texture passes over the land: lit relief for physical tooth, then
       a directional fibre for a paper-like grain. Both trimmed to the coast. */
    out += `<rect class="land-tex" x="0" y="0" width="${MAP_W}" height="${MAP_H}"
              filter="url(#landRelief)" opacity=".30"
              style="mix-blend-mode:overlay" pointer-events="none"/>`;
    out += `<use class="land-tex" href="#coastline" fill="url(#landFibre)"
              style="mix-blend-mode:overlay" pointer-events="none"/>`;
    out += `</g>`;

    // the shoreline itself, drawn over everything so it reads as an edge
    out += `<use href="#coastline" fill="none" stroke="#070910" stroke-opacity=".85"
              stroke-width="2.6" pointer-events="none"/>`;

    // second pass: every territory's markers, above all terrain
    for (const id in REGIONS) out += MapView.layerContent(id, ctx);

    svg.innerHTML = out;
    svg.querySelectorAll('.region, .region-content').forEach(el => {
      el.addEventListener('click', () => UI.clickRegion(el.dataset.region));
    });
  },

  troopChip(unitId, colour) {
    return `<svg class="troop-chip" viewBox="-9 -10 18 20" width="13" height="15">
      ${MapView.troopShape(unitId, colour || '#c98f47')}</svg>`;
  },
};

/* ============================================================
   APOTHEOSIS — rendering and interaction

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function mix(hex, withHex, amount) {
  const h = x => [1, 3, 5].map(i => parseInt(x.slice(i, i + 2), 16));
  const [r1, g1, b1] = h(hex), [r2, g2, b2] = h(withHex);
  const c = (a, b) => Math.round(a * amount + b * (1 - amount)).toString(16).padStart(2, '0');
  return `#${c(r1, r2)}${c(g1, g2)}${c(b1, b2)}`;
}

/* One floating tooltip, positioned against the viewport so nothing can clip
   it. Bound once and driven by any element carrying data-tip. */
(function initTips() {
  const el = document.createElement('div');
  el.id = 'tip';
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(el));
  if (document.body) document.body.appendChild(el);

  const show = t => {
    const host = t.closest('[data-tip]');
    if (!host) return;
    el.innerHTML = host.getAttribute('data-tip');
    el.classList.add('on');
    const r = host.getBoundingClientRect();
    const b = el.getBoundingClientRect();
    let x = r.left + r.width / 2 - b.width / 2;
    let y = r.top - b.height - 8;
    if (y < 6) y = r.bottom + 8;                       // flip below when tight at the top
    x = Math.max(6, Math.min(x, window.innerWidth - b.width - 6));
    y = Math.max(6, Math.min(y, window.innerHeight - b.height - 6));
    el.style.left = Math.round(x) + 'px';
    el.style.top = Math.round(y) + 'px';
  };
  const hide = () => el.classList.remove('on');

  document.addEventListener('mouseover', e => {
    if (e.target.closest && e.target.closest('[data-tip]')) show(e.target);
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest && e.target.closest('[data-tip]')) hide();
  });

  /* Touch has no hover, and these bubbles carry the rules — what a unit does,
     where XP comes from, what a Holding is worth. On a touch device a tap
     opens the bubble and the next tap anywhere closes it, so a phone player
     still gets every explanation. The tap that opens a tooltip is NOT
     swallowed: tapping a troop still selects its territory underneath. */
  const touch = matchMedia('(hover: none)').matches;
  if (touch) {
    document.addEventListener('click', e => {
      const host = e.target.closest && e.target.closest('[data-tip]');
      if (host) { show(e.target); } else { hide(); }
    }, true);
    window.addEventListener('scroll', hide, true);
  }
})();

const UI = {
  mode: 'idle',          // 'idle' | 'march'

  /* ---------------- phone bottom sheet ----------------
     On a narrow screen the side panel docks to the bottom and only its handle
     shows. Selecting a territory slides it up, because that is the moment you
     need the actions; committing an action or ending the turn drops it again
     so the board is never obscured while you are reading it. */

  phone() { return matchMedia('(max-width: 900px)').matches; },

  sheet(open) {
    const el = $('#side');
    if (!el) return;
    if (!UI.phone()) { el.classList.remove('open'); return; }
    el.classList.toggle('open', !!open);
  },

  initSheet() {
    const h = $('#sheet-handle');
    if (h && !h.dataset.bound) {
      h.dataset.bound = '1';
      h.addEventListener('click', () => UI.sheet(!$('#side').classList.contains('open')));
    }
  },

  /* the handle doubles as a status line, so a collapsed sheet still tells you
     whose turn it is and how many actions are left */
  renderSheetLabel() {
    const h = $('#sheet-handle');
    if (!h) return;
    const p = UI.acting();
    const lbl = h.querySelector('.lbl');
    if (!lbl || !p) return;
    if (G.phase === 'gameover') { lbl.textContent = 'Game over'; return; }
    const left = Rules.actionsLeft(p.index);
    lbl.innerHTML = `<b style="color:${p.colour.hex}">${esc(p.name)}</b>`
      + (G.phase === 'reaction' ? ' · reaction'
         : ` · ${left} action${left === 1 ? '' : 's'}`)
      + ` · ${p.tribute}t`;
  },

  /* the board is drawn by MapView (js/render-map.js); these keep the old
     call sites working */
  renderMap()                  { MapView.renderMap(); },
  troopShape(u, c)             { return MapView.troopShape(u, c); },
  troopChip(u, c)              { return MapView.troopChip(u, c); },
  holdingShape(t)              { return MapView.holdingShape(t); },
  glyph(t)                     { return MapView.glyph(t); },
  defenceRating(id)            { return MapView.defenceRating(id); },

  privacy: true,
  passPending: null,

  /* ================= main render ================= */

  render() {
    if (!G) return;
    UI.renderTop();
    UI.renderMap();
    UI.renderYou();
    UI.renderSelection();
    UI.renderActions();
    UI.renderKey();
    UI.renderLog();
    UI.renderPhaseStrip();
    UI.renderHint();
    UI.initSheet();
    UI.renderSheetLabel();
    UI.checkOverlays();
  },

  actingIndex() {
    if (!G) return 0;
    if (G.phase === 'reaction') return G.reactionQueue[G.reactionIndex];
    return G.turnIndex;
  },
  acting() { return G.players[UI.actingIndex()]; },

  /* ================= top bar ================= */

  /* On a phone the full bar wrapped onto four rows and ate 179px — 22% of the
     screen before the board got any. The compact form keeps only what you
     cannot infer from elsewhere: the round, and each rival's colour and score.
     Names, levels, treasuries and AI tags all live in the sheet or a tap. */
  renderTop() {
    const compact = UI.phone();

    $('#tb-round').textContent = compact
      ? `R${G.round}/${ROUND_LIMIT}`
      : `Round ${G.round} of ${ROUND_LIMIT} · Turn ${G.turnIndex + 1}`;

    $('#tb-players').innerHTML = G.players.map((p, i) => {
      const cls = ['tb-p'];
      if (i === UI.actingIndex() && G.phase !== 'gameover') cls.push('active');
      if (p.surrendered) cls.push('out');
      const s = Rules.scoreFor(i);

      if (compact) {
        const tip = `<b>${esc(p.name)}</b>${AI.isAI(i) ? ' — ' + esc(AI.personality(i).name) : ''}`
          + `<br>Renown ${p.level} · ${p.tribute} Tribute · ${s.total} VP`;
        return `<div class="${cls.join(' ')}" data-tip="${tip}">
          <span class="dot" style="background:${p.colour.hex}"></span>
          <span class="st">${s.total}</span>
        </div>`;
      }

      const tag = AI.isAI(i)
        ? `<span class="ai-tag" title="${esc(AI.personality(i).blurb)}">${esc(AI.personality(i).name)}</span>`
        : '';
      return `<div class="${cls.join(' ')}">
        <span class="dot" style="background:${p.colour.hex}"></span>
        <span>${esc(p.name)}</span>${tag}
        <span class="st">L${p.level} · ${p.tribute}t · ${s.total}vp</span>
      </div>`;
    }).join('');
  },

  /* ================= map ================= */

  marchTargets(from) {
    const pi = UI.actingIndex();
    const rs = G.regions[from];
    if (rs.owner !== pi) return {};
    const all = Rules.reachable(pi, from, rs.hosts);
    // an attack is only legal into a directly adjacent enemy region
    const out = {};
    const canAssault = Rules.assaultsLeft(pi) > 0;
    for (const id in all) {
      const o = G.regions[id].owner;
      if (o !== null && o !== pi) {
        // attacks must be into directly adjacent ground, and you have an allowance
        if (!REGIONS[from].neighbours.includes(id) || !canAssault) continue;
      }
      out[id] = all[id];
    }
    return out;
  },

  clickRegion(id) {
    if (G.phase === 'gameover' || G.pendingBoon) return;
    /* A finished battle nobody is showing must never block the board. If we
       reach here with one pending, clear it rather than swallowing the click. */
    if (G.pendingCombat) {
      if (G.pendingCombat.finished && !UI.modalOpen()) Combat.dismiss();
      else return;
    }
    const pi = UI.actingIndex();

    if (UI.mode === 'march' && G.selected) {
      const targets = UI.marchTargets(G.selected);
      if (targets[id]) { UI.openSend(G.selected, id); return; }
      if (id === G.selected) { UI.mode = 'idle'; UI.render(); return; }
    }

    G.selected = (G.selected === id) ? null : id;
    UI.render();
    UI.sheet(!!G.selected);
  },

  /* ================= sidebar ================= */

  renderYou() {
